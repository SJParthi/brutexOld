[project]
name = "brutex"
version = "0.2.0a0"
description = "Extreme drill-down brute-force backtesting engine for Indian spot indexes (NIFTY / BANKNIFTY / SENSEX)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "SJParthi" },
]

# Track 1 base dependencies. The Dhan adapter (Phase 2) will add `dhanhq`
# as an optional extra. The legacy a broker SDK dependency was dropped on
# 2026-05-15 as part of the the broker → Dhan migration (see docs/MIGRATION.md).
#
# DEC-P0-012 (PR #34, 2026-05-17 "always latest"): upper bounds widened to
# include the latest stable major published on PyPI as of branch date. New
# bounds are next-major-after-latest so Renovate (added in renovate.json)
# can auto-bump within the range without pyproject churn. Verified safe via
# full pytest+ruff+mypy+pyright run; majors that broke (none yet) would be
# pinned back to the old upper bound with rationale.
dependencies = [
    "pydantic>=2.7,<3.0",
    "structlog>=24.1,<26.0",  # was <25.0; PyPI latest 25.5.0 (DEC-P0-012)
    "lmdb>=1.5,<3.0",
]

[project.optional-dependencies]
# P2 data lake — Parquet writer + DuckDB catalog. Heavier deps kept
# behind an extra so P1 users and unit-test runners don't need them.
# pytz is a transitive dep of duckdb's timezone subsystem on Linux —
# without it, duckdb queries that touch tz-aware timestamps fail with
# "InvalidInputException: Required module 'pytz' failed to import".
# Discovered + fixed in DEC-P0-004 recovery PR after CI test job failed.
data = [
    "polars>=1.0,<2.0",
    "duckdb>=1.0,<2.0",
    "pyarrow>=16,<25",   # was <19; PyPI latest 24.0.0 (DEC-P0-012)
    "pytz>=2024.1",
]
dev = [
    "pytest>=8.0,<10.0",            # was <9.0; PyPI latest 9.0.3 (DEC-P0-012)
    "pytest-cov>=5.0,<8.0",         # was <6.0; PyPI latest 7.1.0 (DEC-P0-012)
    "pytest-benchmark>=4.0,<6.0",   # was <5.0; PyPI latest 5.2.3 (DEC-P0-012)
    "hypothesis>=6.100,<7.0",
    "numpy>=1.26,<3.0",             # DEC-P0-020 (PR #42): throughput canary uses numpy.bitwise_and; required by tests/bench/test_throughput_canary.py
    "ruff>=0.15,<1.0",
    "mypy>=1.10,<3.0",              # was <2.0; PyPI latest 2.1.0 (DEC-P0-012)
    "pyright>=1.1.360,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "safety>=3.2,<4.0",
    "mutmut>=2.5,<4.0",             # was <3.0; PyPI latest 3.5.0 (DEC-P0-012)
    "interrogate>=1.7,<2.0",
    "pip-licenses>=5.0,<6.0",
]

[project.scripts]
brutex = "brutex.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brutex*"]
exclude = ["tests*"]

# ────────────────────────────────────────────────────────────────────────
# Tooling config — every gate required by REQUIREMENTS.md §17 is wired here
# ────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["brutex", "tests"]
# Red-team fixtures intentionally contain planted bugs. Excluded
# from the global ruff scan; verified individually by tests/redteam/
# subprocess invocations.
extend-exclude = ["tests/redteam/fixtures/*.stripped.py", "tests/redteam/fixtures/planted_*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "PT",   # pytest style
    "RET",  # return statements
    "SIM",  # simplification
    "TID",  # tidy imports
    "ERA",  # eradicate commented-out code
    "PL",   # pylint subset
    "RUF",  # ruff-specific
    "S",    # bandit-lite (security)
    "T20",  # no-print (REQUIREMENTS.md §4 CLAUDE.md rule: structlog only)
]
ignore = [
    # Intentional architectural patterns
    "PLR0913", # many args — acceptable in adapter boundaries
    "PLR0911", # too many return statements — common in dispatchers/CLIs
    "PLR0912", # too many branches — common in dispatchers/CLIs
    "PLR0915", # too many statements — common in dispatchers/CLIs
    "PLC0415", # lazy imports are deliberate (P2 optional extras, test fakes)
    "PLE0604", # dynamic __all__ — math facade builds it programmatically
    # Docstring / comment stylistic
    "RUF001", # ambiguous unicode — box-drawing chars in docstrings are intentional
    "RUF002", # same, in docstring separators
    "RUF003", # same, in comment separators
    "RUF043", # regex-match against Exception class — stylistic
    "E501",   # line-too-long — handled by formatter; surviving lines are URLs/docstrings
    # Naming / legacy
    "N818",   # exception class naming — BruteXError base, legacy shim names retained
    # NOTE (DEC-P0-001 2026-05-17): S-rules S104, S105, S108, S110, S311
    # UN-IGNORED from this global list and re-narrowed to per-line noqa with
    # rationale at each remaining site (4 sites total: 2 × S104 in
    # brutex/config/ports.py, 1 × S105 in brutex/notifications/telegram.py,
    # 1 × S311 in brutex/orchestrator/retry.py). Per Golden Rule #12 honest
    # standards: blanket-ignoring security rules at project level hid the
    # justifications. Per-line noqa makes each exception auditable.
]

[tool.ruff.lint.per-file-ignores]
# Tests: allow assert, magic numbers, test tokens, broad pytest.raises,
# blind Exception, print, security placeholders, and the pytest-style
# pure-function naming pitfall for fixture factories.
"tests/**" = [
    "S101", "PLR2004", "S105", "S106",
    "B017",  # blind except — used for frozen-dataclass assertion
    "PT011", # broad pytest.raises — intentional in catch-all tests
    "S110",  # try-except-pass in test cleanup
    "T201",  # print — allowed in smoke tests for visibility
    "PLE0604", # invalid __all__ object (hypothesis strategies)
    "SIM113", # pytest fixtures look like enumerate use
    "SIM103", # bool-from-if — clearer in tests
    # DEC-P0-001 (2026-05-17): S-rules removed from project-wide ignore now
    # surface in tests/ too. The test-specific exemptions below cover the 35
    # legitimate test patterns that were silently ignored before.
    "S104",  # tests bind 0.0.0.0 for LAN-discovery integration tests
    "S108",  # tests reference /tmp paths in fixtures
    "S311",  # tests use random for synthetic data generation (not crypto)
    "S603",  # subprocess calls in redteam harness (planted-bug fixture runners)
    "S607",  # partial-path subprocess calls in redteam harness
    # DEC-P0-001 (2026-05-17): pre-existing test-only patterns. tests/ uses
    # parametrize tuple syntax (PT006), TestClass naming convention (N801),
    # explanatory comments that ruff sees as commented-out code (ERA001),
    # math-notation variable names like `l` (E741), zip without strict (B905),
    # combinable isinstance (SIM101), complex pytest assert (PT018), and
    # uppercase imports (N812) — all idiomatic in test code.
    "PT006",  # pytest parametrize tuple syntax
    "N801",   # TestClass / TestCase naming
    "ERA001", # explanatory test comments flagged as commented-out code
    "E741",   # math-notation variable names in test fixtures
    "B905",   # zip without strict — fine in test data shaping
    "SIM101", # combinable isinstance — clearer split form in test assertions
    "PT018",  # complex pytest.assert — sometimes intentional for clarity
    "N812",   # uppercase-imported alias in test fixtures
]
# CLI uses print() deliberately — it's a CLI, stdout is the interface.
"brutex/cli.py" = ["T201"]
# Proof / smoke scripts — intentionally print to stdout and touch
# private ._conn on the stores to show the underlying DuckDB guarantees.
"scripts/**" = ["T201", "SLF001", "PLR2004", "S101", "PLR0915"]
# Placeholder shims need to mirror an eventual external module surface.
"brutex/math/__init__.py" = ["A005"]  # shadows stdlib 'math' — deliberate re-export point

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
# DEC-P0-004 Agent 5 HIGH fix: pyright [tool.pyright] exclude already
# covers redteam planted-bug fixtures; mypy needs the same exclusion or
# strict mode will trip on the intentional bugs on every PR.
exclude = [
    "tests/redteam/fixtures/.*\\.stripped\\.py",
    "tests/redteam/fixtures/planted_.*\\.py",
]

[[tool.mypy.overrides]]
module = [
    "lmdb", "lmdb.*",
    "duckdb", "duckdb.*",
    "polars", "polars.*",
    "pyarrow", "pyarrow.*",
    "fastapi", "fastapi.*",
    "uvicorn", "uvicorn.*",
    "fno_math_py", "fno_math_py.*",
    "dhanhq", "dhanhq.*",  # Track 1 Dhan adapter (Phase 2 dependency)
]
ignore_missing_imports = true

# Dashboard uses FastAPI decorators which are untyped — the file wraps
# them internally and re-exports typed helpers, so untyped-decorator
# checks here are noise.
[[tool.mypy.overrides]]
module = ["brutex.dashboard.app"]
disallow_untyped_decorators = false

[tool.pyright]
pythonVersion = "3.12"
# DEC-P0-001 (2026-05-17): bumped from "standard" to "strict" per Golden Rule
# #12 honest standards. Stylistic divergences from mypy are narrowed to the
# specific report-codes below (everything else fires as a real error).
typeCheckingMode = "strict"
# Redteam planted-bug fixtures excluded (they're INTENTIONALLY broken to verify
# gates fire; tests/redteam/test_*.py imports them via subprocess only).
exclude = ["tests/redteam/fixtures/*.stripped.py", "tests/redteam/fixtures/planted_*.py", "**/__pycache__"]
# Stylistic divergences silenced so the two checkers don't bikeshed:
reportPrivateUsage = "warning"          # DEC-P0-017 (PR #39): narrowed from "none" to "warning". Per-site `# pyright: ignore[reportPrivateUsage]` at 8 brutex/* friend-access sites + file-top `# pyright: reportPrivateUsage=none` at 2 whitebox test files. Future private-access bugs in production code now surface as warnings.
reportConstantRedefinition = "none"     # brutex.math facade rebinds __all__ symbols
reportUnusedFunction = "none"           # FastAPI route handlers are nominally unused
reportUntypedFunctionDecorator = "none" # FastAPI decorators lack generic types
reportUnsupportedDunderAll = "none"     # math facade builds __all__ programmatically
# Unknown-type noise inherited from deliberately lazy imports (polars,
# duckdb, fastapi, lmdb, fno_math_py). mypy's [[overrides]] list already
# ignores missing imports for these; pyright sees the members as Unknown
# which is informational, not a real type safety issue:
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnnecessaryIsInstance = "none"
# Missing imports — pyright may run against a different venv than
# the one with the brokerapi/fno_math_py/lmdb installed. mypy's
# [[overrides]] table handles this properly; pyright gets the
# blanket silence here:
reportMissingImports = "none"
reportMissingTypeStubs = "none"
# Strict-mode additions silenced for now (DEC-P0-001): these fire on
# legitimate patterns in test fixtures, math facade, and lazy-import paths.
# Re-enable selectively when each pattern has a dedicated narrow fix.
reportMissingParameterType = "none"     # test fixtures often use untyped lambdas
reportMissingTypeArgument = "none"      # dict[str, Any] usages in JSON paths
reportUnnecessaryComparison = "none"    # invariant-asserting if-not-None branches
# Additional strict-mode silences added in DEC-P0-002 (2026-05-17) for
# legitimate AI-code patterns that strict mode flags but are correct:
reportImplicitOverride = "none"         # subclass methods that override w/o decorator (common in pydantic/test fakes)
reportUnusedCallResult = "none"         # fire-and-forget calls (logging.info(), side-effect setters)
reportImplicitStringConcatenation = "none"  # multi-line string literals in docstrings
reportUnusedExpression = "none"         # bare expressions in test fixtures (hypothesis strategies)
# NOTE (DEC-P0-002 / 7-agent review 2026-05-17): the first draft of this
# section ALSO demoted reportCallIssue, reportArgumentType,
# reportAttributeAccessIssue, and reportGeneralTypeIssues to "warning" —
# Agent 1 (Explore) hostile review caught this as a CRITICAL over-silencing
# that effectively reverts strict mode to standard for signature checking
# and type safety. Those 4 demotions are REMOVED. If CI's pyright job
# fails on those checks, fix the underlying type errors rather than
# silence the gate. mypy --strict is the primary type gate (already
# enforced); pyright provides a second opinion.
# Two prior entries also removed as redundant duplicates of lines above:
# reportMissingTypeStubs (already silenced), reportUnknownLambdaType
# (already silenced).

# DEC-P0-010 (PR #32): partial re-promotion of per-test pyright overrides.
# 4 of 6 categories REMOVED (now back at strict-mode error): reportCallIssue,
# reportGeneralTypeIssues, reportUntypedClassDecorator, reportOperatorIssue.
# Fixed via: _seed_lake Sequence[float], Generator fixture return types, dict
# Any annotations on rollup data, isinstance Decimal exponent guard, generic
# TypeVar on register_strategy + ClassVar META + __init__ on _DecoStrat,
# targeted pyright:ignore on one decorator with Protocol-detection-limitation.
#
# DEC-P0-013 (PR #35, 2026-05-17): the final 2 per-test downgrades
# (reportArgumentType + reportAttributeAccessIssue) have been REMOVED. The 73
# errors that motivated the deferral in PR #32 were incidentally cleaned up
# by the FNO test rewrite in PR #33 (DEC-P0-011): the bulk lived in
# tests/integration/test_instrument_store.py FNO option-chain fixtures that
# the rewrite either replaced with IDX-only fixtures or marked
# `@pytest.mark.skip` for Track 2. Net result: full pyright strict mode now
# applies project-wide (brutex/ + tests/) without per-environment overrides.
# `pyright brutex tests` reports 0 errors, 0 warnings, 0 informations.
# Closes DEC-P0-005 P1 follow-up #6b ahead of the original 3-day estimate.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-W", "error",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "bench: performance benchmark tests (require pytest-benchmark)",
    "property: hypothesis property tests",
    "golden: golden-master tests against recorded fixtures",
    "network: requires outbound network (skipped by default)",
]
filterwarnings = [
    "error",
    # Third-party DeprecationWarnings we don't control — keep them as
    # warnings so `-W error` still catches *our* regressions but lets
    # upstream churn (hypothesis, pytest-benchmark, lmdb, polars) slide.
    "default::DeprecationWarning:hypothesis.*",
    "default::DeprecationWarning:_pytest.*",
    "default::DeprecationWarning:pytest_benchmark.*",
    "default::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["brutex"]
branch = true
parallel = true
omit = [
    # CLI layer — exercised manually via dry-run smoke tests; full
    # automated coverage comes in a follow-up PR alongside a CLI
    # snapshot-test harness.
    "brutex/cli.py",
    # Dashboard FastAPI app — requires fastapi+uvicorn at runtime;
    # the DashboardState model is fully covered by unit tests.
    "brutex/dashboard/app.py",
    # P2 data lake heavy deps — require polars / duckdb / pyarrow
    # installed via `pip install -e .[data]`. Unit-test-only runs
    # don't pull these in; coverage for these modules is tracked
    # separately in the data-lake test suite.
    "brutex/data/catalog.py",
    "brutex/data/parquet_writer.py",
    "brutex/data/sink.py",
    "brutex/data/instrument_store.py",
    # L3 feed layer — ReplayFeed transitively needs polars/pyarrow
    # via Catalog.get_bars. The pure pieces (FeedEvent dataclass,
    # errors, resampler) stay in scope and are already at 100%.
    "brutex/feed/replay.py",
    # P3 strategy engine runtime — StrategyRunner needs a real
    # ReplayFeed and ComboSweep / ComboCache need lmdb. The pure
    # pieces (types, protocol, registry, combo, errors) stay in
    # scope and are already at 100%.
    "brutex/strategies/runner.py",
    "brutex/strategies/sweep.py",
    # P4 execution simulator driver \u2014 BacktestDriver needs a real
    # ReplayFeed (polars/duckdb) to exercise. The simulator, cost
    # model, and dataclass types are all in scope and already at
    # or near 100%.
    "brutex/execution/driver.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# P1 baseline — heavy-dep modules excluded in [run].omit, so this
# applies only to the pure-Python tested core. Progressively raised
# to 100% as the remaining branches get dedicated tests.
#
# Per Golden Rule #12 (100% Always Standards, 2026-05-16): all NEW
# modules must ship at 100% line + 100% branch coverage. Legacy
# modules converge to 100% over time. The 90% gate below applies
# to the full package; per-module gates enforce 100% on new code
# via the precise CI invocation in .github/workflows/ci.yml:
#
#   pytest --cov=brutex --cov-branch --cov-fail-under=90 \
#          --cov-report=term-missing -- ...
#
# AND a second pass for new strict modules:
#
#   pytest --cov=brutex.costs --cov-branch --cov-fail-under=100 \
#          tests/unit/test_costs_*.py
#
# As each module hits 100%, it's added to the strict pass list.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
