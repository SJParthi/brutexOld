[project]
name = "brutex"
version = "0.1.0a0"
description = "Extreme drill-down brute-force backtesting engine for Indian F&O indices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "SJParthi" },
]

# P1a dependencies only — minimal surface so the tree is auditable.
# Larger dependencies (polars, duckdb, ray, numba) come in later phases.
dependencies = [
    "growwapi>=1.5.0,<2.0.0",
    "pydantic>=2.7,<3.0",
    "structlog>=24.1,<25.0",
    "lmdb>=1.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-benchmark>=4.0,<5.0",
    "hypothesis>=6.100,<7.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pyright>=1.1.360,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
]

[project.scripts]
brutex = "brutex.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brutex*"]
exclude = ["tests*"]

# ────────────────────────────────────────────────────────────────────────
# Tooling config — every gate required by REQUIREMENTS.md §17 is wired here
# ────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["brutex", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "PT",   # pytest style
    "RET",  # return statements
    "SIM",  # simplification
    "TID",  # tidy imports
    "ERA",  # eradicate commented-out code
    "PL",   # pylint subset
    "RUF",  # ruff-specific
    "S",    # bandit-lite (security)
    "T20",  # no-print (REQUIREMENTS.md §4 CLAUDE.md rule: structlog only)
]
ignore = [
    "PLR0913", # many args — acceptable in adapter boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]  # allow assert + magic numbers + test tokens in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["growwapi", "growwapi.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-W", "error",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "bench: performance benchmark tests (require pytest-benchmark)",
    "property: hypothesis property tests",
    "golden: golden-master tests against recorded fixtures",
    "network: requires outbound network (skipped by default)",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["brutex"]
branch = true
parallel = true
omit = []

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
