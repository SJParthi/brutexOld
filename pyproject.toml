[project]
name = "brutex"
version = "0.2.0a0"
description = "Extreme drill-down brute-force backtesting engine for Indian spot indexes (NIFTY / BANKNIFTY / SENSEX)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "SJParthi" },
]

# Track 1 base dependencies. BruteX is Dhan-only (DEC-DHAN-FINALIZE-001,
# 2026-06-01): the Dhan adapter speaks plain REST over the injected urllib
# transport — no vendor SDK dependency, no TOTP dep.
#
# DEC-P0-012 (PR #34, 2026-05-17 "always latest"): upper bounds widened to
# include the latest stable major published on PyPI as of branch date. New
# bounds are next-major-after-latest so Renovate (added in renovate.json)
# can auto-bump within the range without pyproject churn. Verified safe via
# full pytest+ruff+mypy+pyright run; majors that broke (none yet) would be
# pinned back to the old upper bound with rationale.
dependencies = [
    "pydantic>=2.7,<3.0",
    "structlog>=24.1,<27.0",  # was <25.0; PyPI latest 25.5.0 (DEC-P0-012)
    "lmdb>=1.5,<3.0",
    "fastbloom-rs>=0.5,<1.0",  # DEC-P0-047: PyO3-backed Rust Bloom for the L1 4-tier dedup
    # DEC-SWEEP-REALTIME-GUARANTEE-001 (MIGRATION.md #549): wheel-free BLAKE3 for
    # the sweep assurance layer (engine/sweep_audit hash-chain + engine/sweep_cache
    # combo digest). Prebuilt manylinux wheels — no local Rust build, unlike the
    # fno_math kernel — so these modules run + test without the compiled wheel.
    "blake3>=0.4,<2.0",
    # CORE runtime dep (DEC-RUN-NUMPY-CORE-001): brutex.metrics.{cascade,spa,
    # monte_carlo,lockbox} import numpy UNCONDITIONALLY at module top, and that
    # chain is on the `brutex` CLI/engine import path (cli -> engine.sweep_report
    # -> ranking -> metrics.cascade). Was [dev]-only, so a clean `make run`
    # (installs .[data,ui], not [dev]) crashed with ModuleNotFoundError: numpy.
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
# P2 data lake — Parquet writer + DuckDB catalog. Heavier deps kept
# behind an extra so P1 users and unit-test runners don't need them.
# pytz is a transitive dep of duckdb's timezone subsystem on Linux —
# without it, duckdb queries that touch tz-aware timestamps fail with
# "InvalidInputException: Required module 'pytz' failed to import".
# Discovered + fixed in DEC-P0-004 recovery PR after CI test job failed.
data = [
    "polars>=1.0,<2.0",
    "duckdb>=1.0,<2.0",
    "pyarrow>=16,<25",   # was <19; PyPI latest 24.0.0 (DEC-P0-012)
    "pytz>=2024.1",
]
# DEC-CLONE-RUN-001 (2026-05-28): dashboard runtime deps. The dashboard
# imports FastAPI lazily so unit tests don't need it; this extra makes
# `pip install -e ".[ui]"` (or `make run`) launch the server. uvicorn's
# `standard` extra pulls websockets so the /ws live-update socket works
# (a polling fallback covers environments without it).
ui = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
]
# DEC-DASHBOARD-BROWSER-TRUTH-001 (2026-07-07): the headless-browser dashboard
# truth suite (tests/browser/) drives the REAL templates + static JS in a real
# Chromium via Playwright. Kept behind an OPTIONAL extra so the main test job
# and unit-test runners never install it; ONLY the dedicated CI `browser` job
# (and an operator opting in via BRUTEX_BROWSER_TESTS=1) installs this extra.
browser = [
    "playwright>=1.55,<2.0",
]
# DEC-STAGE3-OPTIMIZE-EXTRA-001 (ADR-0007 condition 9, Stage-3 slice 1): the
# BIPOP-CMA-ES refinement optimizer (pycma — PyPI name `cma`, numpy-only).
# EXACT pin, deliberately violating the DEC-P0-012 "always latest" range
# convention: optimizer version bumps silently change search trajectories,
# and the refinement-run identity is blake3(... ‖ pycma/numpy versions), so
# a bump invalidates every cached refinement run. Bumping is a deliberate,
# decision-ID'd act; Renovate auto-bumps are carved out in renovate.json
# (mirrors the python-data-lake lock-step precedent). Optuna is NOT adopted
# (ADR-0007 condition 1 — the TPE outer layer selects nothing).
optimize = [
    "cma==4.4.4",
]
# DEC-DHAN-GROWW-REMIGRATE-001 (ADR-0009, 2026-06-12): the `groww` optional
# extra is RE-ADDED for the Dhan → Groww re-migration, superseding the
# DEC-DHAN-FINALIZE-001 removal. `growwapi` is the vendor SDK (verified present
# on PyPI, 1.5.0 series per ADR-0001 §6); `pyotp` generates the TOTP code for
# the unattended auth flow (docs/groww/api-reference/01-introduction.md §"TOTP
# Flow"). Kept behind an OPTIONAL extra so unit-test runners and the still-live
# Dhan path do not require it; `bootstrap.sh` deliberately does NOT install it
# (guarded by tests/unit/test_vendor_doc_consistency.py).
groww = [
    "growwapi>=1.0,<2.0",
    "pyotp>=2.9,<3.0",
]
# DEC-TOKEN-BROKER-AWS-001 (2026-07-01): the SHARED AWS token broker — BruteX READS
# the Groww creds (api_key + TOTP secret) AND the daily minted access token from AWS
# Systems Manager Parameter Store (region ap-south-1); a dedicated Lambda is the only
# writer/minter (BruteX is read-only). The SSM reads need boto3, kept behind an
# OPTIONAL extra — exactly like `groww` — so a purely-LOCAL run (the default, with
# `BRUTEX_TOKEN_BROKER_READONLY` unset) and unit-test runners never install it;
# `bootstrap.sh` deliberately does NOT install it. The real boto3 client build is
# `# pragma: no cover`; a pure-Python `FakeAwsClient` drives the broker to 100%
# coverage with no install and no network.
token-broker = [
    "boto3>=1.34,<2.0",
]
dev = [
    "pytest>=8.0,<10.0",            # was <9.0; PyPI latest 9.0.3 (DEC-P0-012)
    "pytest-cov>=5.0,<8.0",         # was <6.0; PyPI latest 7.1.0 (DEC-P0-012)
    "pytest-benchmark>=4.0,<6.0",   # was <5.0; PyPI latest 5.2.3 (DEC-P0-012)
    "hypothesis>=6.100,<7.0",
    # numpy moved to core `dependencies` (DEC-RUN-NUMPY-CORE-001) — it is a
    # runtime import of brutex.metrics, not a dev-only tool; dev inherits it
    # via the always-installed core deps. (Was here per DEC-P0-020, PR #42.)
    "ruff>=0.15,<1.0",
    "mypy>=1.10,<3.0",              # was <2.0; PyPI latest 2.1.0 (DEC-P0-012)
    "pyright>=1.1.360,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "safety>=3.2,<4.0",
    "mutmut>=2.5,<4.0",             # was <3.0; PyPI latest 3.5.0 (DEC-P0-012)
    "interrogate>=1.7,<2.0",
    "pip-licenses>=5.0,<6.0",
    # DEC-DASHBOARD-CI-UNMASK-001 (2026-06-01): the FastAPI dashboard HTTP
    # suite uses Starlette's TestClient, which imports `httpx2` (the modern
    # Starlette HTTP backend) and is guarded by `pytest.importorskip("httpx")`.
    # Both must be installed for the dashboard tests to actually RUN (not skip)
    # on CI — paired with installing the `[ui]` extra in the CI test job.
    "httpx>=0.27,<1.0",
    "httpx2>=2.0,<3.0",
]

[project.scripts]
brutex = "brutex.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brutex*"]
exclude = ["tests*"]

# DEC-DASHBOARD-LIVE-FINALE: ship the v29 dashboard template
# (brutex/dashboard/templates/v29.html) inside the installed wheel so
# `_load_v29_template()` can read it from package-relative path.
[tool.setuptools.package-data]
"brutex.dashboard" = ["templates/*.html"]

# ────────────────────────────────────────────────────────────────────────
# Tooling config — every gate required by REQUIREMENTS.md §17 is wired here
# ────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["brutex", "tests"]
# Red-team fixtures intentionally contain planted bugs. Excluded
# from the global ruff scan; verified individually by tests/redteam/
# subprocess invocations.
extend-exclude = ["tests/redteam/fixtures/*.stripped.py", "tests/redteam/fixtures/planted_*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "PT",   # pytest style
    "RET",  # return statements
    "SIM",  # simplification
    "TID",  # tidy imports
    "ERA",  # eradicate commented-out code
    "PL",   # pylint subset
    "RUF",  # ruff-specific
    "S",    # bandit-lite (security)
    "T20",  # no-print (REQUIREMENTS.md §4 CLAUDE.md rule: structlog only)
]
ignore = [
    # Intentional architectural patterns
    "PLR0913", # many args — acceptable in adapter boundaries
    "PLR0911", # too many return statements — common in dispatchers/CLIs
    "PLR0912", # too many branches — common in dispatchers/CLIs
    "PLR0915", # too many statements — common in dispatchers/CLIs
    "PLC0415", # lazy imports are deliberate (P2 optional extras, test fakes)
    "PLE0604", # dynamic __all__ — math facade builds it programmatically
    # Docstring / comment stylistic
    "RUF001", # ambiguous unicode — box-drawing chars in docstrings are intentional
    "RUF002", # same, in docstring separators
    "RUF003", # same, in comment separators
    "RUF043", # regex-match against Exception class — stylistic
    "E501",   # line-too-long — handled by formatter; surviving lines are URLs/docstrings
    # Naming / legacy
    "N818",   # exception class naming — BruteXError base, legacy shim names retained
    # NOTE (DEC-P0-001 2026-05-17): S-rules S104, S105, S108, S110, S311
    # UN-IGNORED from this global list and re-narrowed to per-line noqa with
    # rationale at each remaining site (4 sites total: 2 × S104 in
    # brutex/config/ports.py, 1 × S105 in brutex/notifications/telegram.py,
    # 1 × S311 in brutex/orchestrator/retry.py). Per Golden Rule #12 honest
    # standards: blanket-ignoring security rules at project level hid the
    # justifications. Per-line noqa makes each exception auditable.
]

[tool.ruff.lint.per-file-ignores]
# Tests: allow assert, magic numbers, test tokens, broad pytest.raises,
# blind Exception, print, security placeholders, and the pytest-style
# pure-function naming pitfall for fixture factories.
"tests/**" = [
    "S101", "PLR2004", "S105", "S106",
    "B017",  # blind except — used for frozen-dataclass assertion
    "PT011", # broad pytest.raises — intentional in catch-all tests
    "S110",  # try-except-pass in test cleanup
    "T201",  # print — allowed in smoke tests for visibility
    "PLE0604", # invalid __all__ object (hypothesis strategies)
    "SIM113", # pytest fixtures look like enumerate use
    "SIM103", # bool-from-if — clearer in tests
    # DEC-P0-001 (2026-05-17): S-rules removed from project-wide ignore now
    # surface in tests/ too. The test-specific exemptions below cover the 35
    # legitimate test patterns that were silently ignored before.
    "S104",  # tests bind 0.0.0.0 for LAN-discovery integration tests
    "S108",  # tests reference /tmp paths in fixtures
    "S311",  # tests use random for synthetic data generation (not crypto)
    "S603",  # subprocess calls in redteam harness (planted-bug fixture runners)
    "S607",  # partial-path subprocess calls in redteam harness
    # DEC-P0-001 (2026-05-17): pre-existing test-only patterns. tests/ uses
    # parametrize tuple syntax (PT006), TestClass naming convention (N801),
    # explanatory comments that ruff sees as commented-out code (ERA001),
    # math-notation variable names like `l` (E741), zip without strict (B905),
    # combinable isinstance (SIM101), complex pytest assert (PT018), and
    # uppercase imports (N812) — all idiomatic in test code.
    "PT006",  # pytest parametrize tuple syntax
    "N801",   # TestClass / TestCase naming
    "ERA001", # explanatory test comments flagged as commented-out code
    "E741",   # math-notation variable names in test fixtures
    "B905",   # zip without strict — fine in test data shaping
    "SIM101", # combinable isinstance — clearer split form in test assertions
    "PT018",  # complex pytest.assert — sometimes intentional for clarity
    "N812",   # uppercase-imported alias in test fixtures
]
# CLI uses print() deliberately — it's a CLI, stdout is the interface.
"brutex/cli.py" = ["T201"]
# Doctor CLI (DEC-DOCTOR-001) — same pattern as cli.py; print is the
# health-check report's intended output sink.
"brutex/doctor.py" = ["T201"]
# Proof / smoke scripts — intentionally print to stdout and touch
# private ._conn on the stores to show the underlying DuckDB guarantees.
"scripts/**" = ["T201", "SLF001", "PLR2004", "S101", "PLR0915"]
# Placeholder shims need to mirror an eventual external module surface.
"brutex/math/__init__.py" = ["A005"]  # shadows stdlib 'math' — deliberate re-export point
# AWS token-minter Lambda (DEC-TOKEN-MINTER-CENTRAL-001, deploy/aws_token_minter/):
# a self-contained infra handler outside the brutex package. The boto3 SSM /
# CloudWatch client API mandates PascalCase keyword arguments (N803), and the two
# env-var-NAME string constants (GROWW_TOTP_SECRET_PARAM / GROWW_TOKEN_PARAM) trip
# the hardcoded-password heuristic (S105) — both are false positives forced by the
# AWS SDK contract, not real violations.
"deploy/aws_token_minter/**" = ["N803", "S105"]
# The minter's tests mirror the same boto3 PascalCase fake-client kwargs (N803).
"tests/deploy/**" = ["N803"]
# Rust-kernel type stubs (rust/fno-math/python/fno_math/__init__.pyi): the stub
# parameter names deliberately MIRROR the Rust struct field names (`open`/`high`/
# `low`/`close` — an OHLC column set), so `open` shadowing the builtin (A002) is a
# forced, intentional mirror, not a violation. CI's lint job scopes `ruff check
# brutex tests` and never reaches this path today; the ignore is PREEMPTIVE so a
# future scope widening or a newer local ruff (0.15.20 flags stub params) can
# never turn the inherited stub name into a surprise red (DEC-TOKEN-STALE-PAUSE-001
# review follow-up).
"**/*.pyi" = ["A002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
# DEC-MUTATION-GATE-RANKING-002 (discovered pre-existing defect): the two PyO3
# kernels ship their type stubs IN-REPO (rust/{fno-math,trading-core}/python/
# */{py.typed,__init__.pyi}). The project venv resolves them via the maturin
# .pth, but the pre-commit mypy hook runs in an ISOLATED env without the
# wheels, so any staged brutex file whose import graph reaches a kernel call
# site (e.g. strategies/combo.py -> fno_math.blake3_hash) failed the hook with
# `no-any-return` on files the commit never touched. mypy_path lets BOTH envs
# resolve the same in-repo stubs (mypy has no CLI flag for this — config only).
mypy_path = ["rust/fno-math/python", "rust/trading-core/python"]
# DEC-P0-004 Agent 5 HIGH fix: pyright [tool.pyright] exclude already
# covers redteam planted-bug fixtures; mypy needs the same exclusion or
# strict mode will trip on the intentional bugs on every PR.
exclude = [
    "tests/redteam/fixtures/.*\\.stripped\\.py",
    "tests/redteam/fixtures/planted_.*\\.py",
]

[[tool.mypy.overrides]]
module = [
    "lmdb", "lmdb.*",
    "duckdb", "duckdb.*",
    "polars", "polars.*",
    "pyarrow", "pyarrow.*",
    "fastapi", "fastapi.*",
    "uvicorn", "uvicorn.*",
    "fno_math_py", "fno_math_py.*",
    "trading_core", "trading_core.*",  # DEC-SHARED-CORE-001 #441: PyO3 shared 52-vocab core — no Python stubs published (mirrors fno_math_py / fastbloom_rs)
    "structlog", "structlog.*",  # DEC-P0-038: structlog runtime dep — type stubs not yet packaged
    "fastbloom_rs", "fastbloom_rs.*",  # DEC-P0-047: PyO3-backed Rust Bloom — no Python stubs published
    "boto3", "boto3.*",  # DEC-TOKEN-BROKER-AWS-001: OPTIONAL `token-broker` extra — real client build is `# pragma: no cover`
    "botocore", "botocore.*",  # DEC-TOKEN-BROKER-AWS-001: boto3's transitive dep — same optional extra
    # DEC-MYPY-GROWWAPI-STUBS-001: the growwapi SDK ships NO py.typed marker, so an env
    # WITH it installed errors `import-untyped` while an env WITHOUT it needs
    # `import-not-found` silenced — a per-module override covers BOTH envs at once,
    # replacing the inline `# type: ignore[import-not-found]` comments that
    # `warn_unused_ignores` flipped into `unused-ignore` errors the moment the SDK was
    # present (auth.py / reauth.py). pyotp DOES ship py.typed (types used normally when
    # installed); it is listed only so the isolated pre-commit hook env — which lacks
    # the runtime deps — resolves its lazy import without an env-specific ignore.
    "growwapi", "growwapi.*",
    "pyotp", "pyotp.*",
    # DEC-P0-055 (PR-N+2): `fno_math` removed — wheel now ships bundled
    # `__init__.pyi` + `py.typed` via maturin's mixed Python+Rust layout.
]
ignore_missing_imports = true

# DEC-MUTATION-GATE-RANKING-002 follow-on: mypy_path (above) makes the in-repo
# kernel shims resolvable for the isolated pre-commit hook env — but it also
# PROMOTES them from the installed-package tier (diagnostics never reported)
# to first-party source (diagnostics reported), which is env-dependent: CI's
# wheel-install + mypy_path combination tripped `unused-ignore` inside
# rust/trading-core/python/trading_core/__init__.py while the local .pth
# resolution stayed silent. follow_imports=silent keeps the shims' types
# AVAILABLE (the hook fix) while suppressing diagnostics INSIDE them in every
# env — the same reporting behaviour they had before mypy_path existed.
[[tool.mypy.overrides]]
module = ["trading_core", "trading_core.*", "fno_math", "fno_math.*"]
follow_imports = "silent"

# Dashboard uses FastAPI decorators which are untyped — the file wraps
# them internally and re-exports typed helpers, so untyped-decorator
# checks here are noise.
[[tool.mypy.overrides]]
module = ["brutex.dashboard.app"]
disallow_untyped_decorators = false

[tool.pyright]
pythonVersion = "3.12"
# DEC-MOVERS-OPTIONS-PCR-001 gate-determinism fix: pin the repo venv so a bare
# `pyright brutex tests` (no shell activation) resolves the SAME interpreter
# the gates are defined against. Without this, pyright falls back to the
# system `python3` on PATH, sees hypothesis/numpy/etc. as Unknown, and the
# ignored-untyped-decorator fallback resurfaces every `@st.composite`
# strategy's ORIGINAL signature — 37 phantom "Argument missing for parameter
# 'draw'" errors that vanish the moment the venv is on PATH (verified A/B on
# this exact tree: activated → 0 errors, bare → 37). When `.venv` does not
# exist (CI installs into the setup-python interpreter), pyright prints ONE
# console note and falls back to the default PATH search — verified exit 0,
# so CI resolution is byte-unchanged.
venvPath = "."
venv = ".venv"
# DEC-P0-001 (2026-05-17): bumped from "standard" to "strict" per Golden Rule
# #12 honest standards. Stylistic divergences from mypy are narrowed to the
# specific report-codes below (everything else fires as a real error).
typeCheckingMode = "strict"
# Redteam planted-bug fixtures excluded (they're INTENTIONALLY broken to verify
# gates fire; tests/redteam/test_*.py imports them via subprocess only).
exclude = ["tests/redteam/fixtures/*.stripped.py", "tests/redteam/fixtures/planted_*.py", "**/__pycache__"]
# Stylistic divergences silenced so the two checkers don't bikeshed:
reportPrivateUsage = "warning"          # DEC-P0-017 (PR #39): narrowed from "none" to "warning". Per-site `# pyright: ignore[reportPrivateUsage]` at 8 brutex/* friend-access sites + file-top `# pyright: reportPrivateUsage=none` at 2 whitebox test files. Future private-access bugs in production code now surface as warnings.
reportConstantRedefinition = "none"     # brutex.math facade rebinds __all__ symbols
reportUnusedFunction = "none"           # FastAPI route handlers are nominally unused
reportUntypedFunctionDecorator = "none" # FastAPI decorators lack generic types
reportUnsupportedDunderAll = "none"     # math facade builds __all__ programmatically
# Unknown-type noise inherited from deliberately lazy imports (polars,
# duckdb, fastapi, lmdb, fno_math_py). mypy's [[overrides]] list already
# ignores missing imports for these; pyright sees the members as Unknown
# which is informational, not a real type safety issue:
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnnecessaryIsInstance = "none"
# Missing imports — pyright may run against a different venv than
# the one with the brokerapi/fno_math_py/lmdb installed. mypy's
# [[overrides]] table handles this properly; pyright gets the
# blanket silence here:
reportMissingImports = "none"
reportMissingTypeStubs = "none"
# Strict-mode additions silenced for now (DEC-P0-001): these fire on
# legitimate patterns in test fixtures, math facade, and lazy-import paths.
# Re-enable selectively when each pattern has a dedicated narrow fix.
reportMissingParameterType = "none"     # test fixtures often use untyped lambdas
reportMissingTypeArgument = "none"      # dict[str, Any] usages in JSON paths
reportUnnecessaryComparison = "none"    # invariant-asserting if-not-None branches
# Additional strict-mode silences added in DEC-P0-002 (2026-05-17) for
# legitimate AI-code patterns that strict mode flags but are correct:
reportImplicitOverride = "none"         # subclass methods that override w/o decorator (common in pydantic/test fakes)
reportUnusedCallResult = "none"         # fire-and-forget calls (logging.info(), side-effect setters)
reportImplicitStringConcatenation = "none"  # multi-line string literals in docstrings
reportUnusedExpression = "none"         # bare expressions in test fixtures (hypothesis strategies)
# NOTE (DEC-P0-002 / 7-agent review 2026-05-17): the first draft of this
# section ALSO demoted reportCallIssue, reportArgumentType,
# reportAttributeAccessIssue, and reportGeneralTypeIssues to "warning" —
# Agent 1 (Explore) hostile review caught this as a CRITICAL over-silencing
# that effectively reverts strict mode to standard for signature checking
# and type safety. Those 4 demotions are REMOVED. If CI's pyright job
# fails on those checks, fix the underlying type errors rather than
# silence the gate. mypy --strict is the primary type gate (already
# enforced); pyright provides a second opinion.
# Two prior entries also removed as redundant duplicates of lines above:
# reportMissingTypeStubs (already silenced), reportUnknownLambdaType
# (already silenced).

# DEC-P0-010 (PR #32): partial re-promotion of per-test pyright overrides.
# 4 of 6 categories REMOVED (now back at strict-mode error): reportCallIssue,
# reportGeneralTypeIssues, reportUntypedClassDecorator, reportOperatorIssue.
# Fixed via: _seed_lake Sequence[float], Generator fixture return types, dict
# Any annotations on rollup data, isinstance Decimal exponent guard, generic
# TypeVar on register_strategy + ClassVar META + __init__ on _DecoStrat,
# targeted pyright:ignore on one decorator with Protocol-detection-limitation.
#
# DEC-P0-013 (PR #35, 2026-05-17): the final 2 per-test downgrades
# (reportArgumentType + reportAttributeAccessIssue) have been REMOVED. The 73
# errors that motivated the deferral in PR #32 were incidentally cleaned up
# by the FNO test rewrite in PR #33 (DEC-P0-011): the bulk lived in
# tests/integration/test_instrument_store.py FNO option-chain fixtures that
# the rewrite either replaced with IDX-only fixtures or marked
# `@pytest.mark.skip` for Track 2. Net result: full pyright strict mode now
# applies project-wide (brutex/ + tests/) without per-environment overrides.
# `pyright brutex tests` reports 0 errors, 0 warnings, 0 informations.
# Closes DEC-P0-005 P1 follow-up #6b ahead of the original 3-day estimate.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-W", "error",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "bench: performance benchmark tests (require pytest-benchmark)",
    "property: hypothesis property tests",
    "golden: golden-master tests against recorded fixtures",
    "network: requires outbound network (skipped by default)",
    "smoke: opt-in smoke tests that hit external services (gated by env var)",
    "stress: sustained-load stress tests (DEC-STRESS-001); run nightly via .github/workflows/stress-nightly.yml — NOT in default unit test run",
    "chaos: randomized-schedule + crash/restart + concurrent-reader chaos tests (DEC-CHAOS-RACE-001); run on every PR via the chaos-race CI job — NOT in default unit test run",
    "browser: headless-browser dashboard truth tests (Playwright + Chromium, DEC-DASHBOARD-BROWSER-TRUTH-001); opt-in via BRUTEX_BROWSER_TESTS=1 — run by the dedicated CI browser job, NOT the main test job",
]
filterwarnings = [
    "error",
    # Third-party DeprecationWarnings we don't control — keep them as
    # warnings so `-W error` still catches *our* regressions but lets
    # upstream churn (hypothesis, pytest-benchmark, lmdb, polars) slide.
    "default::DeprecationWarning:hypothesis.*",
    "default::DeprecationWarning:_pytest.*",
    "default::DeprecationWarning:pytest_benchmark.*",
    "default::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["brutex"]
branch = true
parallel = true
# The omit list is now EMPTY and the key is removed (DEC-COV-CLI-HARNESS-001,
# 2026-06-12): brutex/cli.py + brutex/__main__.py — the last two omitted
# modules — were backfilled to 100.00% line+branch (tests/unit/test_cli_run.py
# / test_cli_retry_storm.py / test_cli_backfill.py plus the existing
# tests/integration CLI suites), so the fail_under=100 floor below covers the
# WHOLE package. Prior un-omit history (DEC-DASHBOARD-OMIT-AUDIT-001,
# DEC-COVERAGE-DRIVER-001, DEC-COVERAGE-CATALOG-001,
# DEC-COVERAGE-INSTRUMENT-STORE-001) lives in docs/MIGRATION.md.

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# P1 baseline — heavy-dep modules excluded in [run].omit, so this
# applies only to the pure-Python tested core. Progressively raised
# to 100% as the remaining branches get dedicated tests.
#
# Per Golden Rule #12 (100% Always Standards, 2026-05-16): all NEW
# modules must ship at 100% line + 100% branch coverage. Legacy
# modules converge to 100% over time. The 90% gate below applies
# to the full package; per-module gates enforce 100% on new code
# via the precise CI invocation in .github/workflows/ci.yml:
#
#   pytest --cov=brutex --cov-branch --cov-fail-under=90 \
#          --cov-report=term-missing -- ...
#
# AND a second pass for new strict modules:
#
#   pytest --cov=brutex.costs --cov-branch --cov-fail-under=100 \
#          tests/unit/test_costs_*.py
#
# As each module hits 100%, it's added to the strict pass list.
# RATCHETED 90 -> 99 (DEC-COV-SMALL-GAPS-001) -> 100
# (DEC-COV-APP-BACKFILL-001, 2026-06-12): dashboard/app.py was the last
# sub-100 module; after its 46-test backfill the measured aggregate is
# exactly 100.00% on the un-omitted surface. Only the CLI layer omit
# remains (DEC-COV-001) and must arrive at 100% when it lands.
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    # Bare `...` STUB BODIES only (Protocol/overload stubs), ANCHORED.
    # The previous unanchored "\\.\\.\\." matched ANY line containing an
    # ellipsis — including `-> tuple[X, ...]:` return annotations on def
    # lines, and coverage excludes the ENTIRE BODY of a function whose def
    # line matches. 78 files carry `...]` in annotations, so whole tested
    # functions (e.g. ResultsStore.top_k, expiry_codes_for_flag) were
    # silently OUTSIDE the measured surface while reporting "100.00%"
    # (DEC-COVERAGE-ELLIPSIS-UNMASK-001 — found by the slice-2 gate showing
    # 14 statements for a 32-statement module).
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
