# BruteX — Safety net (weekly)
#
# Deep Rust safety checks for rust/fno-math/. These are too slow for
# per-PR CI (10-100x slowdown) but catch bugs that regular tests miss:
#
# 1. cargo-careful — extra debug checking that panics on integer
#    overflow, strict aliasing violations, etc.
# 2. AddressSanitizer — use-after-free, buffer overflow, double free
# 3. ThreadSanitizer — data races, lock-order inversions
#
# Mirrors tickvault/.github/workflows/safety.yml.

name: Safety net

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: safety-${{ github.ref }}
  cancel-in-progress: false

env:
  NIGHTLY: "nightly-2026-03-15"

jobs:
  cargo-careful:
    name: cargo-careful test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust/fno-math
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fno-math -> target
      - name: Install cargo-careful
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-careful
      - name: Run cargo-careful test
        env:
          TV_SKIP_PERF_ASSERTIONS: "1"
        run: cargo +${{ env.NIGHTLY }} careful test --test-threads=1
      - name: Open issue on failure
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `cargo-careful: failure on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,safety,careful',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `cargo-careful failed on ${context.sha}. See [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['bug', 'safety', 'careful', 'critical'],
            });

  address-sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rust/fno-math
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fno-math -> target
      - name: cargo test with ASan
        env:
          RUSTFLAGS: "-Z sanitizer=address"
          RUSTDOCFLAGS: "-Z sanitizer=address"
          TV_SKIP_PERF_ASSERTIONS: "1"
        run: |
          cargo +${{ env.NIGHTLY }} test \
            --target x86_64-unknown-linux-gnu \
            -Z build-std \
            -- --test-threads=1
      - name: Open issue on failure
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `ASan: failure on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,safety,asan',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `AddressSanitizer failed on ${context.sha}. See [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['bug', 'safety', 'asan', 'critical'],
            });

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rust/fno-math
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fno-math -> target
      - name: cargo test with TSan
        env:
          RUSTFLAGS: "-Z sanitizer=thread"
          RUSTDOCFLAGS: "-Z sanitizer=thread"
          TV_SKIP_PERF_ASSERTIONS: "1"
        run: |
          cargo +${{ env.NIGHTLY }} test \
            --target x86_64-unknown-linux-gnu \
            -Z build-std \
            -- --test-threads=1
      - name: Open issue on failure
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `TSan: failure on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,safety,tsan',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `ThreadSanitizer failed on ${context.sha}. See [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['bug', 'safety', 'tsan', 'critical'],
            });
