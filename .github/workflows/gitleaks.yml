# BruteX — gitleaks secrets scan
#
# Two modes:
# - pull_request / push to main: diff-bounded scan of just the new commits
#   (fast gate on every change);
# - weekly schedule + manual dispatch: FULL-history scan across all branches
#   (--all --full-history), catching anything the diff gates ever missed.
#
# Install path: `go install` from the Go module proxy, which checksum-verifies
# the source against the public Go checksum database (sum.golang.org) — no
# unverified binary download. Config: .gitleaks.toml (extends the default
# ruleset; allowlists cover ONLY the false positives confirmed by the
# 2026-07-06 full-history secrets audit — 0 true secrets found).
#
# --redact is always on, so a real hit never prints its value into CI logs
# or the uploaded report.

name: Gitleaks secrets scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "15 5 * * 1" # Monday 05:15 UTC — alongside security-audit.yml (05:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: v8.24.3

jobs:
  gitleaks:
    name: gitleaks secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history — needed for both diff ranges and the scheduled full scan

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install gitleaks (checksum-verified via the Go module proxy)
        run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          GITLEAKS="$(go env GOPATH)/bin/gitleaks"

          # Default: full history, every branch (schedule / workflow_dispatch).
          LOG_OPTS="--all --full-history"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Diff-bounded: only the PR's own commits.
            LOG_OPTS="--no-merges origin/${BASE_REF}..HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            # Diff-bounded: only the pushed commits. A new branch / forced
            # push reports an all-zero or unknown 'before' — fall back to
            # scanning the full history of the pushed ref.
            if [ -n "$BEFORE_SHA" ] \
              && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              LOG_OPTS="${BEFORE_SHA}..${GITHUB_SHA}"
            fi
          fi

          echo "gitleaks git . --log-opts=\"${LOG_OPTS}\""
          "$GITLEAKS" git . \
            --config .gitleaks.toml \
            --log-opts="$LOG_OPTS" \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload redacted report
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 30
