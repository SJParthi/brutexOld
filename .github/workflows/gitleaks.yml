# BruteX — gitleaks secrets scan (scheduled deep scan only)
#
# ONE mode (DEC-CI-SCANNER-DEDUPE-001): weekly schedule + manual dispatch —
# a FULL-history scan across all branches (--all --full-history), catching
# anything the diff gates ever missed. The per-PR / per-push diff-bounded
# secret scan is NOT run here any more: it was an exact double of ci.yml's
# REQUIRED `secrets` job ("Secret scan (gitleaks)"), which remains the
# per-change gate on every PR / push / merge_group.
#
# Install path: `go install` from the Go module proxy, which checksum-verifies
# the source against the public Go checksum database (sum.golang.org) — no
# unverified binary download. Config: .gitleaks.toml (extends the default
# ruleset; allowlists cover ONLY the false positives confirmed by the
# 2026-07-06 full-history secrets audit — 0 true secrets found).
#
# --redact is always on, so a real hit never prints its value into CI logs
# or the uploaded report.

name: Gitleaks secrets scan

on:
  schedule:
    - cron: "15 5 * * 1" # Monday 05:15 UTC — alongside security-audit.yml (05:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: v8.24.3

jobs:
  gitleaks:
    name: gitleaks secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # full history — needed for both diff ranges and the scheduled full scan

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      - name: Install gitleaks (checksum-verified via the Go module proxy)
        run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"

      - name: Scan
        run: |
          set -euo pipefail
          GITLEAKS="$(go env GOPATH)/bin/gitleaks"

          # Full history, every branch — the only mode this workflow runs
          # (schedule / workflow_dispatch; per-change diff scanning lives in
          # ci.yml's required `secrets` job — DEC-CI-SCANNER-DEDUPE-001).
          LOG_OPTS="--all --full-history"

          echo "gitleaks git . --log-opts=\"${LOG_OPTS}\""
          "$GITLEAKS" git . \
            --config .gitleaks.toml \
            --log-opts="$LOG_OPTS" \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload redacted report
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 30
