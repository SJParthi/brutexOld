# BruteX — Rust fuzz smoke (bounded libFuzzer tier)
#
# Security-audit fuzz workstream, 2026-07-06. Builds EVERY cargo-fuzz target in
# both harness crates (rust/trading-core/fuzz + rust/fno-math/fuzz) and runs
# each for a short, bounded window. Purpose:
#
# 1. The fuzz harnesses can never silently rot again: the trading-core
#    fuzz_evaluator target sat UN-COMPILABLE after the u64→u128 vocabulary
#    widening (DEC-VOCAB-U128-CODEGEN-001) + the IndicatorSnapshot growth,
#    because no workflow built the fuzz crates. The BUILD step here is the
#    drift gate.
# 2. A cheap crash/panic net on the hot kernels (evaluator, pivots/fib,
#    BOS/CHoCH state machine, StrategySpec JSON/hex parsing, metadata,
#    Black-76 Greeks) — a found crash/panic FAILS the job.
#
# HONEST TIER (Golden Rule #10): ~30 s per target is a SMOKE, not a coverage
# campaign — it regression-tests the harnesses + seeds and catches shallow
# panics; it does not claim deep state-space exploration. New-coverage plateaus
# are NON-blocking by design (no -runs floor); only a crash/panic/timeout/OOM
# is red.

name: Rust fuzz smoke

on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-fuzz-smoke.yml"
  schedule:
    - cron: "30 5 * * 1" # Monday 05:30 UTC — weekly drift net even without PRs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-fuzz-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned nightly (cargo-fuzz needs nightly for -Z sanitizer flags). Same
  # pin discipline as safety.yml; bump deliberately, never `nightly` floating.
  NIGHTLY: "nightly-2026-03-15"
  # Bounded smoke: per-target wall clock (seconds) + libFuzzer memory cap.
  FUZZ_SECONDS: "30"
  FUZZ_RSS_MB: "2048"
  # Build/run the fuzz binaries for the GNU host triple EXPLICITLY. cargo-fuzz
  # derives its default `--target` from `current_platform::CURRENT_PLATFORM` —
  # the triple cargo-fuzz ITSELF was compiled for — NOT the running host. CI
  # installs cargo-fuzz via taiki-e/install-action's cargo-binstall fallback,
  # which fetches the prebuilt *musl* binary, so the default target became
  # x86_64-unknown-linux-musl. musl links crt-static, which is incompatible
  # with the address sanitizer ("sanitizer is incompatible with statically
  # linked libc") and fails the build before any target compiles. Pinning the
  # GNU host triple restores the dynamic-libc + ASan build the runner supports.
  FUZZ_TARGET: "x86_64-unknown-linux-gnu"

jobs:
  fuzz-smoke:
    name: cargo-fuzz smoke (${{ matrix.crate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: trading-core
            path: rust/trading-core
          - crate: fno-math
            path: rust/fno-math
          - crate: brutex-feed
            path: rust/brutex-feed
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install nightly Rust (sanitizer support)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
          # Explicit GNU host triple (see FUZZ_TARGET note above): guarantees
          # its rust-std is present for the sanitizer build.
          targets: ${{ env.FUZZ_TARGET }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            ${{ matrix.path }}/fuzz -> target
          key: fuzz-smoke-${{ matrix.crate }}

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-fuzz

      # The drift gate: a fuzz target that no longer matches the parent
      # crate's API fails HERE (this exact rot shipped once — see
      # rust/trading-core/fuzz/README.md).
      - name: Build all fuzz targets
        run: cargo +${{ env.NIGHTLY }} fuzz build --target ${{ env.FUZZ_TARGET }}

      - name: Run each target (bounded smoke)
        run: |
          set -euo pipefail
          targets="$(cargo +${{ env.NIGHTLY }} fuzz list)"
          echo "targets: ${targets}"
          for t in ${targets}; do
            echo "::group::fuzz ${t} (${FUZZ_SECONDS}s)"
            # Seed the live corpus from the checked-in regression seeds, if any
            # (fuzz/corpus/ is gitignored cargo-fuzz scratch; fuzz/seeds/ is
            # the tracked regression set — e.g. the two fuzz_greeks finds).
            mkdir -p "fuzz/corpus/${t}"
            if [ -d "fuzz/seeds/${t}" ]; then
              cp "fuzz/seeds/${t}"/* "fuzz/corpus/${t}/" || true
            fi
            # A crash/panic/sanitizer report/timeout/OOM exits non-zero → red.
            cargo +${{ env.NIGHTLY }} fuzz run "${t}" --target "${FUZZ_TARGET}" -- \
              -max_total_time="${FUZZ_SECONDS}" \
              -timeout=10 \
              -rss_limit_mb="${FUZZ_RSS_MB}" \
              -print_final_stats=1
            echo "::endgroup::"
          done

      - name: Upload crash artifacts (on failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.crate }}
          path: ${{ matrix.path }}/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
