# doctor-daily.yml — the 07:30 IST daily `brutex doctor` cron
# (DEC-DOCTOR-DAILY-CRON-001, MIGRATION.md #1525). Closes the
# STANDARDS_100PCT.md §11 P2 row "Wire .github/workflows/doctor-daily.yml
# 07:30 IST cron" (DEC-DOCTOR-001 #209 built the CLI; this wires the cron).
#
# HONEST ENVELOPE (Golden Rule #10) — what a green run PROVES / does NOT:
#   PROVES : the `brutex doctor` CLI boots on a clean runner (full import
#            chain incl. both PyO3 wheels); BOTH wheel-freshness handshakes
#            PASS against the in-repo EXPECTED_BUILD.json fingerprints and
#            BOTH wheel source-digest handshakes PASS against the repo crate
#            trees (DEC-RUST-SOURCE-DIGEST-TWIN-001 #1258 /
#            DEC-DOCTOR-DAILY-CHECKSET-9-001 — SUPERSEDED-IN-PART by
#            DEC-BRUTEX-LAKE-BOX-WHEEL-001: the check set is reclassified
#            9 → 11 with the two OPTIONAL brutex_lake wheel stages asserted
#            deterministic WARN — the wheel is deliberately never installed
#            in this hermetic env); the
#            doctor's skip-with-reason machinery abstained honestly on every
#            check needing the operator envelope (ASSERTED below — a
#            fabricated PASS on a hosted runner goes red, never fake-green;
#            a hollowed-out wheel check (SKIP/WARN) also goes red, never
#            quietly green).
#   NOT    : production lake / audit-chain / vendor / AWS health. The
#            production-envelope doctor is verify-m4pro.yml (daily 12:00 UTC
#            = 17:30 IST on the operator's M4 Pro, real lake) — this
#            workflow is its always-on morning complement, NOT a duplicate
#            claim. `brutex doctor --live` (sandbox-blind) NEVER runs here.
#
# TRIGGERS: cron + dispatch + push-of-owned-paths only. NO pull_request —
# a scheduled observability contract must never gate PRs or join ci-ok.
# "Alert if missed" (detecting a cron GitHub silently skipped) is a NAMED
# NON-GOAL — see MIGRATION.md #1525.

name: doctor-daily

on:
  schedule:
    # 02:00 UTC = 07:30 IST (IST is fixed UTC+05:30, no DST — exact
    # year-round). The STANDARDS §8 SLA / DEC-OBS-008 morning slot. Daily
    # (not workdays-only): strictly covers the SLA, weekend runs are
    # hermetic + cheap + idempotent.
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Smoke the cron path immediately when the workflow or the doctor
    # itself changes (nightly-sibling convention: mutation/stress/redteam).
    paths:
      - ".github/workflows/doctor-daily.yml"
      - "brutex/doctor.py"

permissions:
  contents: read
  issues: write # file/update/close the single doctor-daily tracking issue

concurrency:
  # Never cancel an in-flight run (nightly convention). With this false,
  # a CANCELLED conclusion can only mean job-timeout-kill or manual
  # cancel. Both alert steps below treat cancelled() like failure() but
  # STEP-SCOPE it to the doctor/assert outcomes: a kill/cancel landing
  # BEFORE the doctor+assert are green alerts (their outcomes read
  # 'cancelled'/'skipped', != success), while a manual cancel of the
  # summary/upload tail AFTER a green doctor+assert does NOT raise a
  # false 'doctor is RED' (a superseded QUEUED run never starts, so it
  # never alerts). Per-ref group: a branch dispatch never blocks the
  # main cron. The repo-global ISSUE lifecycle is additionally ref-gated
  # to main below, so every issue-touching run serializes in the ONE
  # main group.
  group: doctor-daily-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  doctor:
    name: brutex doctor (hosted, envelope-honest)
    runs-on: ubuntu-24.04
    # Cold run ~12-15 min (two cargo wheel builds dominate); 30 = ~2x. A
    # JOB-timeout kill reports CANCELLED -> the alert steps still fire
    # whenever the kill lands before the doctor+assert are green (their
    # outcomes then read 'cancelled'/'skipped', != success — the
    # DEC-MUTATION-ALERT-CANCELLED-001 class, live-probed run
    # 28748795864). A STEP-timeout kill reports step FAILURE -> also fires.
    timeout-minutes: 30
    steps:
      - name: Checkout
        # DEC-CI-FORK-PR-HARDEN-001 convention (pre-merge-gate.yml /
        # auto-merge.yml): never persist the job's issues:write GITHUB_TOKEN
        # into .git/config — the later steps execute a broad third-party
        # build surface (PyPI build backends via `pip install -e`, every
        # cargo dependency's build.rs/proc-macro via the two wheel builds)
        # and nothing here needs git credentials after checkout.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install BruteX (minimum CLI-boot set)
        # ci.yml run-smoke precedent: [data]+[ui] is the proven minimum to
        # boot brutex.cli ([data] carries the polars the doctor imports).
        run: pip install -e ".[data,ui]"

      - name: Install Rust toolchain (for the PyO3 wheels)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install fno_math Rust extension
        # brutex.cli transitively imports fno_math — the doctor cannot boot
        # without it. 3-attempt retry loop verbatim from ci.yml.
        run: |
          n=0
          until pip install ./rust/fno-math; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install ./rust/fno-math failed after 3 attempts" >&2
              exit 1
            fi
            echo "pip install ./rust/fno-math failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done
      - name: Install brutex_identity Rust extension (DEC-RUST-RUNID-STORES-001)
        # The run-identity + store kernel: a HARD import of
        # brutex/strategies/combo.py, brutex/engine/snapshot_hash.py,
        # brutex/engine/results_store.py and brutex/data/window_ledger_store.py
        # (the fno_math posture — the retired Python computation bodies have no
        # oracle to degrade to). Belt-and-suspenders crates.io flake guard (see
        # the fno-math step).
        run: |
          n=0
          until pip install ./rust/brutex-identity; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install ./rust/brutex-identity failed after 3 attempts" >&2
              exit 1
            fi
            echo "pip install ./rust/brutex-identity failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Install trading_core Rust extension
        # brutex.cli -> brutex.vocabulary -> trading_core.
        run: |
          n=0
          until pip install ./rust/trading-core; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install ./rust/trading-core failed after 3 attempts" >&2
              exit 1
            fi
            echo "pip install ./rust/trading-core failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Run brutex doctor (hermetic CI envelope — NEVER --live)
        # Hermetic paths make the expected-SKIP set deterministic regardless
        # of runner-image residue: empty audit dir, absent runtime file,
        # nonexistent lake root. BRUTEX_SKIP_WHEEL_FRESHNESS is deliberately
        # NOT set. Step-level timeout kills a wedged check sharply (step
        # timeout = step FAILURE, alertable). pipefail: GitHub's default
        # `bash -e` lacks it — without it `tee` masks the doctor's exit 1.
        # The id feeds the step-scoped alert guards below.
        id: doctor
        timeout-minutes: 5
        shell: bash
        env:
          BRUTEX_LAKE_ROOT: ${{ runner.temp }}/ci-doctor/lake
        run: |
          set -o pipefail
          CI_DOCTOR_HOME="${RUNNER_TEMP}/ci-doctor"
          mkdir -p "${CI_DOCTOR_HOME}/audit"
          brutex doctor \
            --audit-dir "${CI_DOCTOR_HOME}/audit" \
            --runtime-file "${CI_DOCTOR_HOME}/runtime.json" \
            | tee doctor-report.txt

      - name: Assert envelope honesty (5x SKIP-with-reason, 4x wheel PASS, 2x lake WARN)
        # Exit 0 from the doctor is necessary but NOT sufficient: (a) an
        # envelope check reading PASS against the hermetic empty envelope is
        # a fabricated verdict -> red ("CI must never claim operator-envelope
        # health it cannot see"); (b) a wheel-freshness WARN/SKIP means the
        # run proved nothing (in CI the wheel was built from THIS commit, so
        # a mismatch = stale EXPECTED_BUILD.json = repo defect) -> red, never
        # quietly green; (c) a MISSING check name OR a changed check COUNT
        # means the doctor check set changed -> red, forcing a conscious
        # reclassification here (the count pin makes the contract TWO-sided:
        # an ADDED future check that fabricates PASS or quietly SKIPs against
        # the hermetic envelope must be classified here, never sail through).
        # Report line shape: "<glyph> <name padded> <status> <detail>", so
        # awk $2 = check name, $3 = status (never match on the glyphs — the
        # WARN glyph carries a variation selector). The shape itself is
        # pinned repo-side by tests/unit/test_doctor.py's format-contract
        # test, so a DoctorReport.format() reshape reds its own PR.
        # The id feeds the step-scoped alert guards below.
        id: assert
        shell: bash
        run: |
          assert_status() {
            name="$1"; want="$2"
            got="$(awk -v n="$name" '$2 == n { print $3 }' doctor-report.txt)"
            if [ "$got" != "$want" ]; then
              echo "::error::doctor check '$name' expected $want in the hermetic CI envelope, got '${got:-MISSING}' — envelope-honesty contract broken (a MISSING name means the doctor check set changed: reclassify it here consciously)"
              exit 1
            fi
          }
          assert_status audit_chain SKIP
          assert_status runtime_file SKIP
          assert_status audit_replay SKIP
          assert_status derived_freshness SKIP
          assert_status lake_uniqueness SKIP
          assert_status wheel_freshness PASS
          assert_status wheel_freshness_fno_math PASS
          # The two wheel SOURCE-DIGEST handshakes (installed __source_digest__
          # vs the Python-twin recompute over the repo crate tree —
          # DEC-RUST-SOURCE-DIGEST-TWIN-001 #1258) PASS deterministically here:
          # both wheels are built in-job from THIS checkout's crate trees, the
          # editable install puts rust/<crate>/Cargo.toml next to the brutex
          # package (the SKIP arm is a wheel-only install with NO crate tree —
          # never this job), and BRUTEX_SKIP_WHEEL_FRESHNESS is never set. A
          # WARN/SKIP would mean the run proved nothing (stale framing twin =
          # repo defect) -> red, same law as the freshness pair
          # (DEC-DOCTOR-DAILY-CHECKSET-9-001; live-proof run 28834010234).
          assert_status wheel_source_digest PASS
          assert_status wheel_source_digest_fno_math PASS
          # The two OPTIONAL brutex_lake wheel stages (DEC-BRUTEX-LAKE-BOX-
          # WHEEL-001, superseding-in-part DEC-DOCTOR-DAILY-CHECKSET-9-001's
          # 9-check set): the brutex-lake wheel is OPTIONAL and deliberately
          # ABSENT in this hermetic env — it is never installed above, and
          # building it in-cron would risk the 30-min job timeout on a cold
          # ~24-min-CPU polars source build — so the EXPECTED status is WARN
          # and the WARN is itself the asserted, proved behavior: the
          # absent-wheel arm of BOTH lake stages is exercised nightly. The
          # step comment's clause (b) ("a wheel-freshness WARN/SKIP means
          # the run proved nothing -> red") stays true for the four
          # REQUIRED-wheel checks above; for the optional lake wheel this
          # deterministic-WARN assert is the two-sided contract instead — a
          # PASS here would mean someone installed the wheel in-cron WITHOUT
          # reclassifying these two lines (red), and a SKIP would mean the
          # BRUTEX_SKIP_WHEEL_FRESHNESS escape leaked into the cron (red).
          # A future in-cron wheel install must consciously flip these two
          # lines to PASS (and eat the build cost).
          assert_status wheel_freshness_brutex_lake WARN
          assert_status wheel_source_digest_brutex_lake WARN
          # Two-sided check-set pin: the 11 names above red a REMOVED/RENAMED
          # check; this exact-count pin reds an ADDED one. Check rows live
          # strictly between the two ==== rules, so the OVERALL line (whose
          # $3 is also PASS/FAIL) is never miscounted.
          n="$(awk '/^=+$/ { rules++; next } rules == 1 { count++ } END { print count + 0 }' doctor-report.txt)"
          if [ "$n" -ne 11 ]; then
            echo "::error::expected exactly 11 doctor check rows, got $n — the doctor check set changed: classify the new/removed check in this step consciously"
            exit 1
          fi
          echo "envelope-honesty contract holds: 5 SKIP-with-reason + 4 PASS + 2 WARN (optional lake wheel absent), exactly 11 checks"

      - name: Publish run summary (envelope-honest)
        if: always()
        shell: bash
        run: |
          {
            echo "## brutex doctor — daily 07:30 IST health check"
            echo ""
            echo "**CI envelope:** hosted runner — no production lake, no audit chain,"
            echo "no vendor network, no AWS. Envelope checks self-SKIP with a reason and"
            echo "are contract-asserted to stay SKIP — never fake-green. Production-"
            echo "envelope doctor: \`verify-m4pro.yml\` (daily 12:00 UTC, M4 Pro, real lake)."
            echo ""
            # -s (non-empty), NOT -f: `tee` creates doctor-report.txt at
            # pipeline start while the doctor prints its whole report once
            # at process end, so a timeout-kill/cancel mid-doctor (the
            # DEC-MUTATION-ALERT-CANCELLED-001 class) leaves the file
            # EXISTING but EMPTY — an empty code fence would masquerade as
            # doctor output.
            if [ -s doctor-report.txt ]; then
              echo '```'
              cat doctor-report.txt
              echo '```'
            else
              echo "_doctor output unavailable — setup/bootstrap failure or a timeout-kill before any output; see the run log._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload doctor report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: doctor-report
          path: doctor-report.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Telegram alert on red (best-effort — NEVER fails the job)
        # No Telegram secret is provisioned in this repo's Actions today (the
        # only CI secret anywhere is GITHUB_TOKEN) — this step MUST degrade
        # gracefully: unset secrets => notice + exit 0. Secrets are
        # env-mapped because `secrets.*` is not usable in a step `if:`.
        # Secret names mirror the app env vars (BRUTEX_TELEGRAM_*, already
        # gitleaks-allowlisted by name; docs/runbooks/telegram-setup.md).
        # Plain-text sendMessage (no parse_mode — MarkdownV2 escaping stays
        # an app-side concern). Every exit path is 0; the GitHub issue below
        # is the PRIMARY channel — itself best-effort (its filer try/catch
        # degrades an API/permission failure to a warning, retried on the
        # next red run), never a guarantee (Golden Rule #10).
        # STEP-SCOPED guard (BOTH arms): bare `failure()` is JOB-scoped — a
        # transient post-doctor infra failure (summary write / artifact
        # upload) on a GREEN doctor day would alert 'doctor is RED' over an
        # all-green report (Golden Rule #1) — and a bare `cancelled()` is
        # job-scoped the same way: a manual cancel seconds AFTER a green
        # doctor+assert (during the summary/upload tail) is not a doctor
        # verdict either. Both arms therefore key on the doctor/assert
        # outcomes: the alert fires only when the doctor or its
        # envelope-honesty assert did not SUCCEED — which also covers a
        # setup/bootstrap failure (the doctor step is then SKIPPED, i.e.
        # != success) and a timeout-kill/cancel mid-doctor (outcome
        # 'cancelled', != success).
        # MAIN-REF-GATED like the issue steps below: a red branch
        # workflow_dispatch (the natural debug move while main is red) must
        # never ping the operator with a message indistinguishable from the
        # main daily alarm.
        if: ((failure() || cancelled()) && (steps.doctor.outcome != 'success' || steps.assert.outcome != 'success')) && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.BRUTEX_TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BRUTEX_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::notice::Telegram secrets unset — skipping Telegram alert (the GitHub issue is the primary channel)"
            exit 0
          fi
          text="doctor-daily RED: brutex doctor failed or was cancelled (e.g. timeout-killed) on ${GITHUB_SHA}. ${RUN_URL}"
          curl -fsS --max-time 15 \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}" \
            >/dev/null \
            || echo "::warning::Telegram send failed (non-fatal — the GitHub issue is the primary channel)"

      - name: File or update the single doctor-daily tracking issue
        # DEC-MUTATION-ALERT-CANCELLED-001: cancelled() is in the guard
        # because a job killed by its own timeout-minutes reports CANCELLED,
        # not FAILED (live-probed run 28748795864); a kill mid-doctor leaves
        # steps.doctor.outcome = 'cancelled' != 'success', so the step-scoped
        # guard still fires. Dedupe is STRONGER than
        # mutation.yml's per-SHA title: a daily red on a moving main would
        # mint one issue per day — the title here is STABLE (no sha), so all
        # red days fold into ONE open tracking issue via createComment.
        # try/catch so a denied issues:write degrades to a warning, never a
        # masking second failure — which also means the issue is a PRIMARY
        # (best-effort, per-red-run retried) channel, NOT a guaranteed one.
        # REF-GATED to main: the tracking issue is repo-global state keyed
        # by a STABLE title, but the concurrency group serializes only
        # per-ref — an ungated branch workflow_dispatch red could race the
        # find-then-create against a main red (two same-titled 'critical'
        # issues) or pollute the main alarm with a branch SHA. Gating on
        # main means every issue-touching run sits in the ONE
        # doctor-daily-refs/heads/main group (cancel-in-progress: false),
        # so the find-then-create is genuinely serialized.
        # STEP-SCOPED like the Telegram guard above (BOTH arms — failure()
        # AND cancelled()): the 'brutex doctor is RED' issue must never be
        # filed/extended by a post-doctor infra flake (summary/upload) OR a
        # manual cancel of the tail steps on a green doctor day — that would
        # open a 'critical' alarm whose own body shows an all-green table,
        # and on a recovery day would post 'Still red' while skipping the
        # closer.
        if: ((failure() || cancelled()) && (steps.doctor.outcome != 'success' || steps.assert.outcome != 'success')) && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'doctor-daily: brutex doctor is RED';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let table = '(doctor output unavailable — the failure was in setup/bootstrap or a timeout-kill; see the run log)';
            try {
              // `tee` creates the report at pipeline start while the doctor
              // prints everything once at process end, so a timeout-kill
              // mid-doctor leaves the file EXISTING but EMPTY — treat a
              // whitespace-only report as unavailable, never an empty fence.
              const raw = require('fs').readFileSync('doctor-report.txt', 'utf8');
              if (raw.trim()) { table = raw.slice(0, 6000); }
            } catch (e) { /* no report file exists */ }
            const line = `Red on \`${context.sha}\` (${context.eventName}) — [run](${runUrl}).\n\n\`\`\`\n${table}\n\`\`\``;
            try {
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'bug,doctor',
              });
              const open = existing.data.find((i) => i.title === title);
              if (open) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: open.number,
                  body: `Still red: ${line}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: [
                    `The daily 07:30 IST \`brutex doctor\` cron (DEC-DOCTOR-DAILY-CRON-001) is red.`,
                    '',
                    line,
                    '',
                    '### Honest CI envelope (Golden Rule #10)',
                    'Hosted runner: NO production lake, NO audit chain, NO Groww/NSE network, NO AWS.',
                    'Envelope checks self-SKIP with a reason and are contract-asserted to stay SKIP.',
                    'A red here means a CI-provable defect — wheel freshness vs EXPECTED_BUILD.json,',
                    'CLI boot/import chain, an envelope-contract violation, or a timeout-kill — NOT a',
                    'production-lake verdict (that is verify-m4pro.yml, daily 12:00 UTC on the M4 Pro).',
                    '',
                    'This is the single tracking issue — subsequent red days append comments here;',
                    'a green day auto-closes it.',
                  ].join('\n'),
                  labels: ['bug', 'doctor', 'critical'],
                });
              }
            } catch (e) {
              core.warning(`doctor-daily alert issue could not be filed/updated: ${e.message}`);
            }

      - name: Close the tracking issue on recovery
        # Golden Rule #1: a recovered doctor must not leave a stale open
        # 'critical' alarm. Green closes with a recovery comment; the next
        # red opens a fresh thread (one issue per red EPISODE).
        # REF-GATED to main: a GREEN branch workflow_dispatch (the natural
        # debug move while main is red) must never post a false
        # 'Recovered: green on <feature-sha>' and close the live main
        # alarm while main is still red.
        # HONEST edge: on a green-doctor day whose summary/upload step
        # flakes, success() is false so this closer skips — the open issue
        # is neither falsely extended (the filer is step-scoped) nor
        # closed; the next fully-green run closes it.
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'doctor-daily: brutex doctor is RED';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'bug,doctor',
              });
              const open = existing.data.find((i) => i.title === title);
              if (!open) return;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Recovered: green on \`${context.sha}\` — [run](${runUrl}). Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                state: 'closed',
                state_reason: 'completed',
              });
            } catch (e) {
              core.warning(`doctor-daily recovery close failed (non-fatal): ${e.message}`);
            }
