permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Cargo network resilience — the ci.yml convention.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PYTHONHASHSEED: "0"
  HYPOTHESIS_PROFILE: "ci"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  sweep-ops-rust-parity:
    name: brutex-sweep-ops build + sweep-ops parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: cargo fmt --check
        working-directory: rust/brutex-sweep-ops
        run: cargo fmt --check

      - name: cargo clippy -D warnings (--locked, both feature arms)
        working-directory: rust/brutex-sweep-ops
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --features python -- -D warnings

      - name: cargo test (the per-law unit matrices, --locked)
        working-directory: rust/brutex-sweep-ops
        run: cargo test --release --locked

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install brutex (dev extras) + the brutex-sweep-ops wheel
        # Belt-and-suspenders crates.io flake guard on the maturin build
        # (the cargo download point) — the ci.yml retry idiom, POSIX sh.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data,dev]"
          pip install maturin
          n=0
          until pip install ./rust/brutex-sweep-ops; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "pip install ./rust/brutex-sweep-ops failed after 3 attempts" >&2
              exit 1
            fi
            echo "pip install ./rust/brutex-sweep-ops failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Install the fno_math + trading_core engine wheels
        # Every suite in this lane imports brutex.engine, whose __init__
        # eagerly imports combo_mask (`import fno_math`, combo_mask.py:110)
        # and stage1a (`import fno_math` + `import trading_core`,
        # stage1a.py:78/80) — HARD wheel imports, so the lane installs both
        # exactly like ci.yml's test job does (the lake-rust-parity
        # trading_core-step precedent; wheels are compiler-version
        # independent); brutex-identity joins them because results_store.py
        # hard-imports its kernel (DEC-RUST-RUNID-STORES-001), and
        # brutex-refine because the flag-ON stem suites construct
        # `stage3_enable=True` grids whose SweepGridConfig.__post_init__
        # normalizes on the Mode-A grid via require_refine_rust() — a HARD
        # brutex_refine import (DEC-RUST-STAGE3-REFINE-001; the Python
        # optimizer math is deleted), exactly like ci.yml's test job; and
        # brutex-feed because feed materialization now HARD-requires the
        # brutex_feed wheel (DEC-FEED-RUST-MATERIALIZE-002 — an absent wheel
        # is a typed FeedError, no Python oracle to fall back to). Same
        # crates.io flake-retry idiom as above.
        run: |
          for crate in ./rust/fno-math ./rust/trading-core ./rust/brutex-core ./rust/brutex-identity ./rust/brutex-refine ./rust/brutex-feed; do
            n=0
            until pip install "$crate"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "pip install $crate failed after 3 attempts" >&2
                exit 1
              fi
              echo "pip install $crate failed (attempt $n) — retrying in 10s" >&2
              sleep 10
            done
          done

      - name: Install the brutex-lake wheel + align polars to its crate pin
        # DEC-RUST-LAKE-WAVED-001 W-6a MERGE COLLISION: main's Wave-D endgame
        # DELETED the reconcile Python cores, so the flag-ON leg's
        # tests/integration/test_sweep_pull_concurrency.py (the #1785 sweep-vs-pull
        # lock-composition EXTRA GATE) — which drives a real cmd_sweep_all →
        # load_sweep_slice → reconcile_catalog_from_lake → reconcile_file_via_rust
        # — now HARD-requires the brutex_lake crate (brutex/data/lake_rust_waved.py
        # _require_crate: import + API handshake + a runtime polars-version lockstep
        # guard). The lane must therefore build+install the crate AND align the
        # installed polars wheel to the crate's pin, exactly like
        # .github/workflows/lake-rust-parity.yml / ci.yml's test job do. The
        # existing @stable toolchain satisfies the brutex-lake rustc floor (>= 1.97);
        # maturin/pip is already installed above. Same crates.io/git flake-retry
        # idiom as the fno_math/trading_core step (CARGO_NET_GIT_FETCH_WITH_CLI is
        # set in the lane env for the pinned polars git rev).
        run: |
          n=0
          until pip install ./rust/brutex-lake; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "pip install ./rust/brutex-lake failed after 3 attempts" >&2
              exit 1
            fi
            echo "pip install ./rust/brutex-lake failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done
          pin="$(python -c 'import brutex_lake; print(brutex_lake.pinned_polars_version())')"
          echo "aligning installed polars to the brutex-lake crate pin: $pin"
          pip install "polars==${pin}"

      - name: Facade matrix + real-wheel parity suite
        # With the wheel installed the parity suite cannot module-skip —
        # -rs surfaces any skip reason in the log as belt-and-suspenders.
        run: |
          pytest -rs -q \
            tests/unit/test_engine_sweep_ops_rust.py \
            tests/integration/test_sweep_ops_rust_parity.py

      - name: Flag-ON verbatim legs (the UNMODIFIED routed-module stem suites)
        # sweep_singleflight + the pull-concurrency entry are slice 4's
        # lock-composition EXTRA GATE — the G6/G10 battery + the #1785
        # sweep-vs-pull concurrency regression must pass UNMODIFIED with the
        # flag ON (flock/OFD semantics stay Python; the routing must be
        # invisible). The verify/apriori/diffcheck entries are slice 5's
        # EXTRA GATE — the recount battery, the apriori parity golden and
        # the R45 diffcheck AST-pin suite must pass UNMODIFIED with the
        # flag ON (diffcheck itself is an honest N/A — untouched). The
        # run_core/orchestrator entries are slice 6's legs — the #1712
        # unkillable-core battery must pass UNMODIFIED with the flag ON
        # (only the D-9 stride / R45 budget / grid-count folds route).
        run: |
          BRUTEX_SWEEP_OPS_RUST=1 pytest -rs -q \
            tests/unit/test_engine_run_layout.py \
            tests/unit/test_engine_sweep_identity.py \
            tests/unit/test_engine_sweep_stall_policy.py \
            tests/unit/test_engine_sweep_progress.py \
            tests/unit/test_engine_sweep_sla_guard.py \
            tests/unit/test_engine_sweep_mem_budget.py \
            tests/unit/test_engine_sweep_preflight.py \
            tests/unit/test_engine_sweep_liveness.py \
            tests/unit/test_engine_sweep_audit.py \
            tests/unit/test_observability_stage_stamp.py \
            tests/unit/test_observability_chain_map.py \
            tests/unit/test_observability_run_tripwires.py \
            tests/unit/test_engine_sweep_exit_status.py \
            tests/unit/test_engine_sweep_quarantine.py \
            tests/unit/test_engine_sweep_checkpoint.py \
            tests/unit/test_engine_sweep_detach.py \
            tests/unit/test_engine_sweep_heal.py \
            tests/unit/test_engine_sweep_scheduler.py \
            tests/unit/test_engine_sweep_singleflight.py \
            tests/integration/test_sweep_pull_concurrency.py \
            tests/unit/test_engine_sweep_verify.py \
            tests/unit/test_engine_sweep_apriori.py \
            tests/unit/test_engine_sweep_diffcheck.py \
            tests/golden/test_engine_sweep_apriori_parity.py \
            tests/unit/test_engine_sweep_run_core.py \
            tests/unit/test_engine_sweep_orchestrator.py
