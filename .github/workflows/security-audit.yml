# BruteX — Security audit (weekly)
#
# Runs supply-chain + CVE scanners on both Python and Rust dep trees:
#
# Python side (already covered by ci.yml pip-audit every push, but the
# weekly schedule catches newly disclosed CVEs in long-lived deps):
# - pip-audit --strict
# - safety check (secondary scanner — different DB than pip-audit)
#
# Rust side (mirrors tickvault/.github/workflows/security-audit.yml):
# - cargo-audit — CVE scan + yanked-crate detection
# - cargo-deny — license + source + ban rules

name: Security audit

on:
  schedule:
    - cron: "0 5 * * 1"  # Monday 05:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "rust/fno-math/Cargo.toml"
      - "rust/fno-math/Cargo.lock"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.93.1"

jobs:
  python-supply-chain:
    name: Python supply chain (pip-audit + safety)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install scanners + project
        run: |
          pip install -e "." "pip-audit>=2.7" "safety>=3.2"
      - name: pip-audit
        run: pip-audit --strict
      - name: safety check
        # safety has its own DB; run in text mode and tolerate exit 64
        # (deprecated API warning) but fail on real findings.
        run: safety check --full-report --ignore 64 || exit 1

  rust-cargo-audit:
    name: Rust cargo-audit (CVE + yanked)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust/fno-math
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust/fno-math -> target
      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: Check for yanked crates
        run: cargo audit --deny yanked

  rust-cargo-deny:
    name: Rust cargo-deny (supply chain)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust/fno-math
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust/fno-math -> target
      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check advisories bans sources licenses

  # Aggregate issue creation for schedule runs
  notify-on-failure:
    name: Open issue on failure
    runs-on: ubuntu-24.04
    needs: [python-supply-chain, rust-cargo-audit, rust-cargo-deny]
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = `security-audit: failure on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,supply-chain',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Security audit detected a failure on ${context.sha}. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['security', 'supply-chain', 'critical'],
            });
