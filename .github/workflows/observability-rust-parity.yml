# observability-rust-parity.yml — the brutex-observability crate build +
# flag-ON parity lane.
#
# DEC-RUST-OBSERVABILITY-001 (ADR-0020 lane; the lake-rust-parity.yml
# posture). The observability decision-law seams are DEFAULT-OFF behind
# BRUTEX_OBSERVABILITY_RUST and the main CI test job deliberately never
# installs the crate (the facade degrades loudly to the Python oracle when it
# is absent; the stem-matched facade suite is 100% line+branch WHEEL-FREE via
# fake/bomb crates), so this dedicated lane is where the crate has teeth:
#
#   1. cargo fmt / clippy -D warnings / test — BOTH feature sets (the pure
#      default set links zero libpython; `--features python` compiles the
#      PyO3 surface), every invocation --locked against the committed
#      Cargo.lock.
#   2. maturin wheel build + install beside the repo's Python deps (plus the
#      fno-math / trading-core wheels the stage_stamp consumer suite needs
#      transitively via brutex.engine).
#   3. The wheel-PRESENT flag-unset arm: the facade battery + the ON-arm
#      integration file — the wheel-gated hypothesis differentials per law
#      (A/B/C hostile-float domains, D1 all-64, D2 truth table) run at
#      remaining=0 (post-burn-in steady state — no oracle cushioning), and
#      the OFF-arm inertness pins prove flag-unset stays byte-identical even
#      with the wheel installed.
#   4. The flag-ON twin: the SAME two suites plus the four consumer-module
#      suites (loop_watchdog / watchdog / sla / stage_stamp) re-run VERBATIM
#      under BRUTEX_OBSERVABILITY_RUST=1 with the real crate installed. Any
#      test failing ONLY under the flag is a perturbation finding —
#      fix-or-refuse, never a test edit. Honesty: that step proves
#      NON-PERTURBATION (a fully-degrading crate ≡ flag-OFF is itself a pass
#      for that property); crate-genuinely-served teeth live in the
#      integration file's oracle-BOMB engagement spies + the differentials.
#
# NOT a required gate (the lake-rust-parity precedent): it gates the FUTURE
# default-ON flip, not every PR — a red run here blocks re-engaging the
# flag, never an unrelated merge. The future default-ON flip DEC must either
# make this lane required or cite a fresh green run of it as a stated
# precondition. Path-triggered on the crate + the facade + the four seamed
# modules + the two suites + itself, plus workflow_dispatch.
#
# COST HONESTY: the crate is polars-free and tiny — a cold run compiles only
# the pyo3 graph (minutes, not the lake lane's polars graph); the cargo
# cache keyed on the manifest + lockfile content hash makes warm runs cheap.

name: observability-rust-parity

on:
  push:
    branches:
      - main
      - "claude/**"
      - "feat/**"
      - "fix/**"
    paths:
      - "rust/brutex-observability/**"
      - "brutex/observability/observability_rust.py"
      - "brutex/observability/loop_watchdog.py"
      - "brutex/observability/watchdog.py"
      - "brutex/observability/sla.py"
      - "brutex/observability/stage_stamp.py"
      - "tests/unit/test_observability_rust.py"
      - "tests/integration/test_observability_rust_parity.py"
      - ".github/workflows/observability-rust-parity.yml"
  pull_request:
    paths:
      - "rust/brutex-observability/**"
      - "brutex/observability/observability_rust.py"
      - "brutex/observability/loop_watchdog.py"
      - "brutex/observability/watchdog.py"
      - "brutex/observability/sla.py"
      - "brutex/observability/stage_stamp.py"
      - "tests/unit/test_observability_rust.py"
      - "tests/integration/test_observability_rust_parity.py"
      - ".github/workflows/observability-rust-parity.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # == ci.yml's RUST_VERSION — the crate's rust-version floor (1.93.1); no
  # dir-scoped toolchain override exists for this polars-free crate.
  RUST_VERSION: "1.93.1"
  # Cargo network resilience — the ci.yml convention.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PYTHONHASHSEED: "0"
  HYPOTHESIS_PROFILE: "ci"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  observability-rust-parity:
    name: brutex-observability build + flag-ON parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain (1.93.1 — the crate floor)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt,clippy

      - name: Cache cargo (keyed on the manifest + lockfile content)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/brutex-observability -> target
          key: obs-${{ hashFiles('rust/brutex-observability/Cargo.toml', 'rust/brutex-observability/Cargo.lock') }}

      - name: cargo fmt --check
        working-directory: rust/brutex-observability
        run: cargo fmt --check

      # --locked on every cargo invocation: the committed Cargo.lock is the
      # dependency pin — lock drift must fail LOUD, never re-resolve in place.
      - name: cargo clippy -D warnings (default features, --locked)
        working-directory: rust/brutex-observability
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo clippy -D warnings (--features python, --locked)
        working-directory: rust/brutex-observability
        run: cargo clippy --all-targets --locked --features python -- -D warnings

      - name: cargo test (default features, --locked)
        working-directory: rust/brutex-observability
        run: cargo test --release --locked

      - name: cargo test (--features python, --locked)
        working-directory: rust/brutex-observability
        run: cargo test --release --locked --features python

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install brutex (data,dev,ui extras) + the sibling engine wheels
        # [ui] because the loop_watchdog consumer suite drives the FastAPI
        # lifespan wiring; fno-math + trading-core because the stage_stamp
        # consumer suite imports brutex.engine.* (whose __init__ hard-imports
        # both wheels); brutex-identity because results_store.py hard-imports
        # its kernel (DEC-RUST-RUNID-STORES-001). Belt-and-suspenders
        # crates.io flake guard on every wheel build — the ci.yml retry
        # idiom, POSIX sh.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data,dev,ui]"
          pip install maturin
          for crate in ./rust/fno-math ./rust/trading-core ./rust/brutex-identity ./rust/brutex-observability; do
            n=0
            until pip install "$crate"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "pip install $crate failed after 3 attempts" >&2
                exit 1
              fi
              echo "pip install $crate failed (attempt $n) — retrying in 10s" >&2
              sleep 10
            done
          done

      - name: Facade battery + differentials (wheel present, flag unset)
        # The wheel-gated hypothesis differentials + the ON-arm integration
        # file engage via their own fixtures/importorskip; the wheel-free
        # battery's OFF-arm pins simultaneously prove flag-unset inertness
        # WITH the wheel installed. -rs surfaces any skip reason loudly.
        run: |
          pytest -rs -q \
            tests/unit/test_observability_rust.py \
            tests/integration/test_observability_rust_parity.py

      - name: Flag-ON twin (facade suites + the four consumer-module suites)
        env:
          BRUTEX_OBSERVABILITY_RUST: "1"
        run: |
          pytest -rs -q \
            tests/unit/test_observability_rust.py \
            tests/integration/test_observability_rust_parity.py \
            tests/unit/test_observability_loop_watchdog.py \
            tests/unit/test_observability_watchdog.py \
            tests/unit/test_observability_sla.py \
            tests/unit/test_observability_stage_stamp.py
