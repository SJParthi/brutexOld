# soak-selfhosted.yml — The REAL multi-hour soak on the self-hosted M4-Pro runner.
#
# WHY (DEC-SOAK-REAL-TIER-001, MIGRATION.md entry #1512)
# ------------------------------------------------------
# The nightly `stress-nightly.yml` runs on GitHub-hosted `ubuntu-24.04` with a
# FIXED 60-minute job timeout — which STRUCTURALLY forbids a real multi-hour
# soak from ever completing (a 10M-event dispatch linearly extrapolates to
# ~16.7 h and self-kills at 60 min, ~1/17th done; see the honest #208 rewrite).
# This workflow is the tier where a genuine hours-long soak actually RUNS: on
# the operator's registered self-hosted Apple M4-Pro (CLAUDE.md §8), with a job
# timeout DERIVED from the requested duration so it can never outrun its own
# clock. It drives `tests/stress/test_soak_sustained.py::test_soak_sustained`
# (the `soak` marker) for the full `STRESS_DURATION_S`, feeding each time window
# to the pure `brutex.observability.soak_drift.SoakDriftMonitor` (RSS ceiling /
# fd growth / p99 latency drift). The failure signal is AUTOMATIC (CLAUDE.md §11):
# the driver WIRES the monitor's on_breach to `SweepAlerter.soak_drift`, so the
# INSTANT a MONOTONE RSS-ceiling / fd-growth rule edges into breach a CRITICAL
# Telegram alert fires in real time (trigger-independent; a silent no-op when
# Telegram is disabled). The end-of-run HARD gate is the DETERMINISTIC oracles —
# an RSS-ceiling / fd-growth / audit-chain breach fails the pytest run so the
# "open issue on failure" step files a tracked issue. `soak.p99_drift` is
# OBSERVE-ONLY (a sub-second window's p99 is fsync/GC/scheduler-jitter-bound, so
# asserting on it false-fails ~15% of runs and pushing each oscillating
# up-crossing would storm the operator) — it fires NEITHER the real-time alert
# NOR the CI gate, visible only via structlog + the brutex_soak_p99_ratio gauge
# (DEC-SOAK-REAL-TIER-001).
#
# DERIVED TIMING VIA THE `plan` JOB (SOAK-R6-1 / OH6-1 fix)
# ---------------------------------------------------------
# GitHub Actions expressions have NO arithmetic operators (the supported set is
# exactly `( ) [ ] . ! < <= > >= == != && ||`), so an in-expression `+ 30` /
# `* 60` is INVALID — a workflow using one fails startup validation and NO job
# (including the failure watchdog) ever runs.
# The derivation therefore happens in SHELL arithmetic inside a tiny `plan`
# job, whose validated numeric outputs feed the soak job's `timeout-minutes`
# (`fromJSON()` of a precomputed needs-output IS a valid expression) and
# `STRESS_DURATION_S`. The claim "timeout DERIVED from the requested duration"
# stands — only the computation site moved from an (impossible) expression to
# the plan job's shell.
#
# RUNNER + TRIGGER PRECEDENT (verify-m4pro.yml / bench-m4pro.yml)
# --------------------------------------------------------------
# `runs-on: [self-hosted, macos, m4pro]`, NO `pull_request` trigger — a runner
# that is offline (the Mac asleep) would otherwise hang a PR's mergeable state.
# It runs on a weekly cron + manual dispatch, where a perpetually-queued run is
# harmless. A queue-age watchdog for an unregistered runner is a named follow-up
# in ADR-0017 (NOT built here).
#
# HONEST ENVELOPE (Golden Rule #10)
# ---------------------------------
# This is NOT a claim that a 24h run happens in PR CI. The PR/ubuntu tiers verify
# the drift LOGIC (100% line+branch on synthetic series) + a FEW-SECOND real
# driver run; only THIS scheduled self-hosted job runs the multi-hour wall-clock,
# and only for the `soak_minutes` you dispatch. The default weekly cron soaks for
# 6 h (`soak_minutes` default 360). ru_maxrss on macOS is a PEAK not a slope, so
# the RSS rule is an absolute ceiling backstop, not a growth gate (see
# process_probe.py). A garbage `soak_minutes` dispatch fails the `plan` job
# (operator-watched — a dispatch is interactive) and the soak job is SKIPPED;
# the issue watchdog covers the SOAK job's failure/cancellation, which is the
# unattended (cron) risk the watchdog exists for.

name: Real soak (self-hosted M4-Pro)

on:
  schedule:
    # Weekly Sunday 02:00 UTC = 07:30 IST — the PRIMARY real soak run.
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "Soak wall-clock minutes (job timeout is this + 30)"
        required: false
        default: "360"

permissions:
  contents: read
  issues: write

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Cargo network resilience (CI-only flake hardening) — see ci.yml. Pure
  # download-retry; changes nothing about what is built or run.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  plan:
    name: Derive soak timing (shell arithmetic)
    # GHA expressions cannot add or multiply (see header), so the duration
    # derivation runs here in POSIX shell. Cheap GitHub-hosted job — it must
    # never queue behind an asleep self-hosted Mac.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      timeout_minutes: ${{ steps.derive.outputs.timeout_minutes }}
      duration_s: ${{ steps.derive.outputs.duration_s }}
    steps:
      - name: Validate soak_minutes and derive timeout + duration
        id: derive
        # Same env-indirection + strict digits-only fence as stress-nightly's
        # stress_events guard (COMMON pattern): the input is DATA not code, an
        # underscore-grouped value is normalised, anything non-numeric is
        # REFUSED (never error-suppressed into shell arithmetic).
        env:
          SOAK_MINUTES: ${{ github.event.inputs.soak_minutes || '360' }}
        run: |
          m=${SOAK_MINUTES//_/}
          case "$m" in
            ''|*[!0-9]*)
              echo "::error::soak_minutes='$SOAK_MINUTES' is not a non-negative integer." >&2
              exit 1
              ;;
          esac
          echo "timeout_minutes=$((m + 30))" >> "$GITHUB_OUTPUT"
          echo "duration_s=$((m * 60))" >> "$GITHUB_OUTPUT"
          echo "Soak plan: soak_minutes=$m timeout_minutes=$((m + 30)) duration_s=$((m * 60))"

  soak:
    name: Real multi-hour soak (drift-gated)
    needs: plan
    # Gated to the registered self-hosted M4-Pro. If no runner with this label
    # set is online the job sits "queued" indefinitely — harmless (no PR to
    # block). Same precedent as verify-m4pro.yml / bench-m4pro.yml.
    runs-on: [self-hosted, macos, m4pro]
    # SELF-KILL FIX (DEC-SOAK-REAL-TIER-001): the job timeout is DERIVED from the
    # requested duration (+30 min for install/teardown), NOT a fixed 60 — computed
    # by the `plan` job (GHA expressions have no arithmetic; fromJSON of a
    # precomputed needs-output is valid). A scheduled run reads the '360'
    # default → 390. This is the structural fix for the #208 trap where a soak
    # could never fit its own fixed-60 timeout.
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout_minutes) }}

    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show runner identity (real hardware proof)
        # Never interpolate the dispatch input into the script text: pass it via
        # env and reference the shell variable, so a value with shell
        # metacharacters is DATA not code (same pattern as stress-nightly.yml's
        # stress_events). The plan-job outputs are already digits-validated.
        env:
          SOAK_MINUTES: ${{ github.event.inputs.soak_minutes || '360' }}
        run: |
          echo "Runner: $(uname -a)"
          echo "Soak minutes: $SOAK_MINUTES"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev,data]"

      - name: Install Rust toolchain (for fno_math wheel)
        uses: dtolnay/rust-toolchain@stable

      - name: Install fno_math Rust extension
        # Belt-and-suspenders crates.io flake guard (reused from stress-nightly.yml).
        run: |
          n=0
          until pip install ./rust/fno-math; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install ./rust/fno-math failed after 3 attempts" >&2
              exit 1
            fi
            echo "pip install ./rust/fno-math failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Install trading_core Rust extension (DEC-SHARED-CORE-001 #441)
        # The engine stress tests import trading_core; mirror the main CI + the
        # stress-nightly install so the `soak` selection collects.
        run: |
          n=0
          until pip install ./rust/trading-core; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install ./rust/trading-core failed after 3 attempts" >&2
              exit 1
            fi
            echo "pip install ./rust/trading-core failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Run soak (drift-gated)
        # G2 belt-and-suspenders: the SAME derived bound is ALSO applied as a
        # per-step timeout, so even if the job-level expression silently
        # no-op'd the run still cannot outrun `soak_minutes + 30`.
        # --basetemp pins pytest's temp root to the JOB-scoped $RUNNER_TEMP
        # (SOAK-R6-2 / SEC6-1): on this persistent macOS runner the default
        # basetemp lives under TMPDIR (`/var/folders/.../T/`, NOT `/tmp`), so a
        # `/tmp/pytest-*` artifact glob matched NOTHING — and an unset-TMPDIR
        # daemon config would instead have matched OTHER local pytest runs'
        # temp trees and uploaded them to a PUBLIC-repo artifact. RUNNER_TEMP
        # is job-scoped and cleaned between runs — both hazards closed.
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout_minutes) }}
        env:
          # DYNAMIC duration knob: minutes → seconds for STRESS_DURATION_S
          # (derived by the plan job — GHA expressions have no `* 60`), which
          # test_soak_sustained honours. `-m 'stress or soak'` selects the short
          # nightly driver AND the full sustained soak.
          STRESS_DURATION_S: ${{ needs.plan.outputs.duration_s }}
        run: |
          echo "Soaking for STRESS_DURATION_S=$STRESS_DURATION_S seconds"
          pytest tests/stress -m 'stress or soak' --tb=short --basetemp "$RUNNER_TEMP/soak-tmp"

      - name: Upload soak drift artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-drift-logs
          path: ${{ runner.temp }}/soak-tmp/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Open issue on failure
        # A soak failure (a drift breach OR a timeout-kill) must never be
        # eyeball-only (CLAUDE.md §11 AUTOMATED). Unlike stress-nightly's
        # schedule-only gate, this fires on BOTH schedule AND a manual dispatch,
        # so a manually-launched soak's failure is also tracked. Dedup-by-title
        # (COMMON, reused from safety.yml / stress-nightly.yml).
        # AL-SOAK-1: `|| cancelled()` because a job killed by its own
        # job-level timeout-minutes reports CANCELLED, not FAILED, so a bare
        # `failure()` step SKIPS — the exact DEC-MUTATION-ALERT-CANCELLED-001
        # (mutation.yml) pathology. A hung/over-running soak is precisely what
        # this issue-open watchdog exists to catch, so it must cover CANCELLED.
        if: failure() || cancelled()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `soak-selfhosted: failure on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,soak',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Real soak failed on ${context.sha} (RSS/fd/chain drift breach or timeout-kill). See [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). Any MONOTONE RSS/fd drift breach ALSO fired a CRITICAL Telegram soak_drift alert in real time (a timeout-kill did not); soak.p99_drift is observe-only (structlog + the brutex_soak_p99_ratio gauge) — it fires no Telegram alert and never opens this issue.`,
              labels: ['bug', 'soak', 'critical'],
            });
