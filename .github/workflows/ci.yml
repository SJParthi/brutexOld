# BruteX CI/CD — the complete quality gate pipeline.
#
# This workflow implements every gate from REQUIREMENTS.md §17 (CG-01
# through CG-20). Any failing gate blocks merge. Sub-jobs run in
# parallel where possible so the total wall clock is dominated by
# the slowest job (usually pytest or cargo check).
#
# Gates implemented:
#   CG-01  100% line + branch coverage (pytest-cov + --cov-fail-under=100)
#   CG-03  type checking (mypy --strict + pyright)
#   CG-04  lint (ruff check + ruff format --check)
#   CG-05  security (bandit + pip-audit)
#   CG-09  audit chain integrity (brutex audit verify, on integration tests)
#   CG-14  import graph (import-linter — wired once ingest lands)
#   CG-15  docstring coverage (interrogate)
#   CG-18  integrity gate coverage (unit tests per gate)
#   CG-19  review gate (branch protection; not in this file, set on GitHub)
#   CG-20  license compliance (pip-licenses)
#
# Plus BruteX-specific gates:
#   - Rust crate build + test + clippy + fmt (for rust/fno-math/)
#   - Tickvault drift check (schedule-only in drift-check.yml)
#   - Conventional commit format check
#   - Secret-scanning via gitleaks
#   - Banned patterns (no print, no TODO in production, no env.sh files)
#
# Caching strategy:
#   - Python deps cached by pyproject.toml hash via actions/cache
#   - Rust deps cached by Cargo.lock hash via Swatinem/rust-cache
#   - uv recommended but not required — works with pip
#
# Parallelism model:
#   - lint / type / test / rust-check / docs run in parallel
#   - final "ci-ok" job depends on ALL of them; merge gate is ci-ok
#
# Triggered on: push to main, every PR against main, and manual
#   dispatch. Feature-branch commits run ONCE via the pull_request
#   event (NOT also via push) — see DEC-CI-COST-DEDUP-001 below.

name: CI

on:
  # DEC-CI-COST-DEDUP-001: `push` runs ONLY on main. Feature branches
  # (claude/**, feat/**, fix/**) are validated via the `pull_request`
  # event alone. Previously they fired BOTH push AND pull_request, and
  # because the two events land in DIFFERENT `concurrency` groups
  # (refs/heads/<branch> vs refs/pull/<n>/merge) neither cancelled the
  # other — so every PR commit ran the entire matrix TWICE. Running once
  # via pull_request halves Actions minutes with NO loss of gate coverage
  # (auto-merge.yml + pre-merge-gate.yml trigger on the CI `workflow_run`
  # regardless of the originating event; required checks match by context
  # name, which the pull_request run still produces).
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # DEC-MERGE-QUEUE-001 (MIGRATION.md #1784): merge-queue readiness. When a
  # merge queue rules `main`, GitHub dispatches `merge_group` events for the
  # queue's speculative merge commits (refs/heads/gh-readonly-queue/...).
  # EVERY branch-protection required context is produced by THIS workflow
  # (the 21 static job names in branch-protection-drift.yml's expected
  # snapshot + the ci-ok dynamic name below), so without this trigger no
  # required check could ever report on a queue ref and every queued PR
  # would hang until the queue times it out — the classic merge-queue
  # deadlock. Notes: (a) `merge_group` supports NO `paths:` filtering —
  # irrelevant here, this workflow is unfiltered; (b) the PR-only sub-gates
  # (job/step `if: github.event_name == 'pull_request'`) SKIP on
  # merge_group exactly as they already do on push-to-main — ci-ok treats
  # skipped==pass and none of them is a DIRECT required context (they
  # enforced the PR itself on its pull_request run); (c) the concurrency
  # group below keys on github.ref, which is unique per queue entry.
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs for the same branch on new pushes — saves
# CI minutes when the operator pushes multiple commits quickly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Read-only by default; individual jobs escalate if needed.
  contents: read

env:
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.93.1"
  # Cargo network resilience (CI-only flake hardening). crates.io
  # downloads flake intermittently on GitHub-hosted runners — transient
  # `download of <crate> failed / curl [56] Failure receiving data /
  # OpenSSL SSL_read: unexpected eof / Connection reset by peer` — which
  # aborts the maturin wheel build (`pip install ./rust/*`) BEFORE any
  # test runs, flaking the unit/coverage/mutation/golden/property/rust
  # jobs. CARGO_NET_RETRY makes cargo retry each failed download up to 10x
  # (the single most effective fix); GIT_FETCH_WITH_CLI uses the system
  # git for git-source fetches, which respects these retries and is more
  # robust to mid-stream resets than cargo's built-in libgit2 transport.
  # Pure download-retry behaviour — changes NOTHING about what is built or
  # run (CI-only; no app/engine/coverage impact). Workflow-level so every
  # job that builds a Rust wheel inherits it automatically.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Reproducibility (matches REQUIREMENTS.md NFR-DET-001)
  PYTHONHASHSEED: "0"
  # DEC-TEST-APPARATUS-DEBTS-001(b): deterministic hypothesis — loads the
  # `ci` profile registered in tests/conftest.py (derandomize=True,
  # print_blob=True), so property-test example generation is a pure function
  # of each test and any failure reproduces on re-run. (Honest: GHA was
  # already implicitly derandomized by hypothesis's built-in auto-CI profile;
  # this makes the selection explicit + in-repo.) stress-nightly.yml
  # deliberately does NOT set this — the conftest then loads the random
  # default, overriding the auto-load (deliberate exploration off the PR path).
  HYPOTHESIS_PROFILE: "ci"
  PYTHONDONTWRITEBYTECODE: "1"
  # BruteX runtime config
  BRUTEX_SAFETY_FACTOR: "0.6"
  BRUTEX_OHLC_RATE_LIMIT_RPS: "3"
  BRUTEX_AUDIT_CHAIN_ENABLED: "1"
  BRUTEX_REPRODUCIBILITY_STRICT: "1"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # LINT — ruff + ruff format check
  # Fast — should finish in under 15 seconds.
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        # Pin to a recent 0.15 line — 0.5/0.6 don't know the RUF043 /
        # newer ignore codes we rely on in pyproject.
        run: pip install "ruff>=0.15,<1.0"
      - name: ruff check
        run: ruff check brutex tests
      - name: ruff format check
        run: ruff format --check brutex tests

  # ─────────────────────────────────────────────────────────────────
  # ACTIONLINT — lint every workflow YAML (DEC-ACTIONLINT-GATE-001).
  # Catches the class of bug fixed in DEC-DRIFT-YAML-FIX-001: a column-0
  # heredoc / bad ${{ }} expression / invalid glob / unknown action ref
  # that startup-fails a workflow SILENTLY (the drift detector rotted red
  # for that exact reason). Core checks only — shellcheck/pyflakes are a
  # tracked follow-up (DEC-ACTIONLINT-SHELLCHECK-001) so the gate is green
  # on the current tree and starts protecting immediately rather than
  # flooding on pre-existing shell warnings across this 2500-line file.
  # ─────────────────────────────────────────────────────────────────
  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install pinned actionlint
        env:
          AL_VERSION: "1.7.7"
          AL_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o actionlint.tgz
          echo "${AL_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
      - name: Run actionlint (core checks)
        # -shellcheck= / -pyflakes= disable the embedded linters for now to
        # avoid a pre-existing-warning flood; enabling shellcheck-on-workflows
        # is DEC-ACTIONLINT-SHELLCHECK-001 (tracked follow-up). Core syntax /
        # expression / glob / action-ref validation runs and IS the gate.
        run: ./actionlint -color -shellcheck= -pyflakes=

  # ─────────────────────────────────────────────────────────────────
  # TYPE — mypy --strict + pyright
  # ─────────────────────────────────────────────────────────────────
  type:
    name: Type check (mypy + pyright)
    runs-on: ubuntu-24.04
    # DEC-SWEEP-COVERAGE-SHARD-001: consumes the shared prebuilt wheels.
    needs: build-wheels
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        # DEC-PYRIGHT-UNMASK-001: install the [data,ui] runtime extras too, so
        # pyright type-checks brutex/dashboard/ + the data paths against REAL
        # fastapi/pydantic/polars/duckdb types (not Unknown). Previously [dev]-only,
        # which silently masked dashboard type errors (mirror of the #376/#280
        # test-masking finding).
        # DEC-STAGE3-REFINE-001: [optimize] added so mypy/pyright resolve the
        # pinned pycma the same way the venv + unit job do (without it the
        # stage3_refine import errors import-not-found here, a THIRD env-specific
        # code the dual-env ignore can't cover).
        run: |
          pip install -e ".[dev,data,ui,optimize]"
      - name: Download prebuilt Rust wheels (DEC-SWEEP-COVERAGE-SHARD-001)
        # Built ONCE per run by the `build-wheels` job (cache-keyed on the
        # crate sources). `pip install ./rust/<crate>` itself builds a wheel
        # via the same maturin PEP 517 backend and installs it, so
        # installing the shared artifact wheel is equivalent by
        # construction — same crates, same committed Cargo.locks, same
        # backend — minus the repeated per-job cargo build. No gate change.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-wheels
          path: wheelhouse
      - name: Install prebuilt Rust wheels (fno_math + trading_core + brutex_feed + brutex_strategies)
        # EXACTLY the wheel subset this job built from source before
        # the shared build landed — a superset install could flip
        # wheel-gated skip tests, so each job's subset is preserved.
        run: pip install wheelhouse/fno_math-*.whl wheelhouse/trading_core-*.whl wheelhouse/brutex_feed-*.whl wheelhouse/brutex_strategies-*.whl
      - name: mypy --strict
        run: mypy --strict brutex
      - name: pyright
        # Per DEC-P0-014 (PR #36 Agent 3 audit): the prior `pyright brutex`
        # invocation enforced strict mode on source ONLY, leaving `tests/`
        # un-gated despite PR #35's MIGRATION.md entry claiming "full
        # project-wide strict". Expanded to `brutex tests` to match the
        # honest envelope claim.
        run: pyright brutex tests

  # ─────────────────────────────────────────────────────────────────
  # BUILD WHEELS — the ONE maturin wheel build for the whole run
  # (DEC-SWEEP-COVERAGE-SHARD-001). Previously ~10 jobs each rebuilt the
  # same 2-4 crates from source per run (minutes each, crates.io-flake
  # exposed); now this job builds all four ONCE — behind an actions/cache
  # keyed on the crate sources, so an unchanged-Rust push restores the
  # wheels in seconds — and every consumer job downloads + pip-installs
  # them. run-smoke deliberately KEEPS its own from-source build: it
  # proves the operator's `make run` from-source path works, and a
  # prebuilt wheel there would mask exactly the class it exists to catch.
  # ─────────────────────────────────────────────────────────────────
  build-wheels:
    name: Build Rust wheels (shared, cache-keyed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Restore wheelhouse cache (keyed on crate sources)
        id: wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wheelhouse
          key: rust-wheels-v1-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('rust/fno-math/**', 'rust/trading-core/**', 'rust/brutex-feed/**', 'rust/brutex-strategies/**') }}
      - name: Install Rust toolchain (cache miss only)
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build the four maturin wheels (cache miss only)
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          # Belt-and-suspenders crates.io flake guard (the same 3-attempt
          # retry the per-job build steps carried; CARGO_NET_RETRY=10 is
          # workflow-level). `pip wheel` runs the SAME maturin PEP 517
          # build that `pip install ./rust/<crate>` ran per-job before —
          # the artifact wheel is what those jobs built and installed.
          build_with_retry() {
            crate="$1"
            n=0
            until pip wheel --no-deps -w wheelhouse "$crate"; do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then
                echo "pip wheel $crate failed after 3 attempts" >&2
                return 1
              fi
              echo "pip wheel $crate failed (attempt $n) — retrying in 10s" >&2
              sleep 10
            done
          }
          build_with_retry ./rust/fno-math
          build_with_retry ./rust/trading-core
          build_with_retry ./rust/brutex-feed
          build_with_retry ./rust/brutex-strategies
      - name: Verify the wheels import (runs on the cache-hit arm too)
        # A corrupt/stale cache entry must fail HERE, loudly, not in a
        # dozen downstream jobs.
        run: |
          ls -l wheelhouse/
          test "$(find wheelhouse -name '*.whl' | wc -l)" -eq 4
          pip install wheelhouse/fno_math-*.whl wheelhouse/trading_core-*.whl wheelhouse/brutex_feed-*.whl wheelhouse/brutex_strategies-*.whl
          python -c "import fno_math, trading_core, brutex_feed, brutex_strategies; print('all four kernels import OK')"
      - name: Upload wheels artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-wheels
          path: wheelhouse/
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # UNIT TEST SHARDS — the whole-package pytest+coverage pass split
  # across 6 parallel matrix shards (DEC-SWEEP-COVERAGE-SHARD-001; the
  # follow-up the pre-shard `test` job's 180-minute timeout ratchet
  # history named). Each shard runs the SAME invocation the monolithic
  # job ran, restricted to its deterministic file partition
  # (scripts/ci/shard_tests.py — total + disjoint by construction),
  # records branch coverage into its own data file, and uploads it.
  # Shards deliberately do NOT enforce --cov-fail-under (one shard only
  # ever covers its slice of the package): the 100% line+branch
  # enforcement moves UNWEAKENED to the `test` fan-in job, which
  # `coverage combine`s every shard's data FIRST. Zero-skip / zero-dup
  # is mechanically proven at the fan-in — the sum of per-shard
  # collected test counts must equal the full-collection count.
  # ─────────────────────────────────────────────────────────────────
  test-shard:
    name: Unit test shard ${{ matrix.shard }} (coverage data)
    runs-on: ubuntu-24.04
    needs: build-wheels
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      # Keep in sync with the matrix list above; a mismatch cannot skip
      # tests silently — the fan-in's collection-count law catches it.
      SHARD_COUNT: "6"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # DEC-CICD-GATE-HONESTY-001: full history so the auto-discovery
          # coverage gate can diff the PR against origin/main (the merge
          # base) to find the TOUCHED modules. Shallow (depth-1) checkout
          # has no base to diff against.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps (includes [data] + [ui] extras)
        # DEC-P0-001 (2026-05-17): added `[data]` extra so polars + duckdb +
        # pyarrow are installed in CI. Without these, ~6 tests in
        # tests/unit/test_tf_resampler.py and tests/integration/test_data_lake_real.py
        # fail at collection time, suppressing real coverage of the data lake.
        # DEC-DASHBOARD-CI-UNMASK-001 (2026-06-01): added `[ui]` (FastAPI +
        # uvicorn) + httpx/httpx2 (in [dev]) so the 4 dashboard HTTP test files
        # — previously SILENTLY SKIPPED on CI via importorskip("fastapi"/"httpx")
        # — now actually RUN and gate. This closes the masking hole that let a
        # broken dashboard PR auto-merge green.
        # DEC-STAGE3-OPTIMIZE-EXTRA-001: added `[optimize]` (exact-pinned pycma)
        # so the Stage-3 optimizer pin + determinism smoke ACTUALLY RUNS on CI
        # (importorskip would silently skip it otherwise — the same masking
        # class the dashboard unmask closed).
        run: pip install -e ".[dev,data,ui,optimize]"
      - name: Download prebuilt Rust wheels (DEC-SWEEP-COVERAGE-SHARD-001)
        # Built ONCE per run by the `build-wheels` job (cache-keyed on the
        # crate sources). `pip install ./rust/<crate>` itself builds a wheel
        # via the same maturin PEP 517 backend and installs it, so
        # installing the shared artifact wheel is equivalent by
        # construction — same crates, same committed Cargo.locks, same
        # backend — minus the repeated per-job cargo build. No gate change.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-wheels
          path: wheelhouse
      - name: Install prebuilt Rust wheels (fno_math + trading_core + brutex_feed + brutex_strategies)
        # EXACTLY the wheel subset this job built from source before
        # the shared build landed — a superset install could flip
        # wheel-gated skip tests, so each job's subset is preserved.
        run: pip install wheelhouse/fno_math-*.whl wheelhouse/trading_core-*.whl wheelhouse/brutex_feed-*.whl wheelhouse/brutex_strategies-*.whl
      - name: Compute this shard's file list (deterministic partition)
        run: |
          set -euo pipefail
          python scripts/ci/shard_tests.py --self-check --shard-count "$SHARD_COUNT"
          python scripts/ci/shard_tests.py --shard-index "${{ matrix.shard }}" --shard-count "$SHARD_COUNT" > shard-files.txt
          echo "shard ${{ matrix.shard }}: $(wc -l < shard-files.txt) test files"
      - name: Record this shard's collected test count (zero-skip/zero-dup proof, shard half)
        # The SAME counting pipeline as the fan-in's full collection —
        # the two sides must be byte-comparable (collect-only vs
        # collect-only; never runtime-vs-collect, which module-level
        # skips could legitimately skew).
        run: |
          set -euo pipefail
          readarray -t SHARD_FILES < shard-files.txt
          pytest --collect-only -q "${SHARD_FILES[@]}" > collect-out.txt || { tail -50 collect-out.txt; exit 1; }
          grep -cE '^tests/.+::' collect-out.txt > "collected-count-shard${{ matrix.shard }}.txt"
          echo "shard ${{ matrix.shard }} collected: $(cat "collected-count-shard${{ matrix.shard }}.txt") tests"
      - name: pytest with coverage (shard slice — 100% enforced at the fan-in)
        env:
          # One data file per shard (no leading dot — upload-artifact
          # excludes hidden files by default). pyproject's
          # [tool.coverage.run] parallel=true subprocess data is combined
          # into this base file by pytest-cov at session end, exactly as
          # the monolithic job combined into .coverage.
          COVERAGE_FILE: coverage-data-shard${{ matrix.shard }}
        run: |
          # The pre-shard whole-package invocation, restricted to this
          # shard's file list. --cov-fail-under=0 is DELIBERATE and NOT
          # a weakening: a single shard only ever covers its slice of
          # the package, so the 100% line+branch gate is enforced on the
          # COMBINED data in the `test` fan-in job (same --fail-under=100
          # over the same --cov=brutex --cov-branch data — byte-exact).
          # readarray (not xargs): an over-long arg list must hard-fail,
          # never silently split into a second pytest run that would
          # erase the first run's coverage data.
          set -euo pipefail
          readarray -t SHARD_FILES < shard-files.txt
          pytest \
            --cov=brutex \
            --cov-branch \
            --cov-report= \
            --cov-fail-under=0 \
            --ignore=tests/bench \
            "${SHARD_FILES[@]}"
      - name: Upload shard coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            coverage-data-shard${{ matrix.shard }}
            collected-count-shard${{ matrix.shard }}.txt
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # PER-MODULE COVERAGE GATES (static list) — the strict per-module
  # 100% step moved VERBATIM out of the `test` job so it runs in
  # PARALLEL with the coverage shards (DEC-SWEEP-COVERAGE-SHARD-001).
  # Gate content unchanged; the `test` fan-in REQUIRES this job (its
  # explicit upstream-result check), so the required context still
  # reflects these gates.
  # ─────────────────────────────────────────────────────────────────
  per-module-static:
    name: Per-module coverage gates (static list)
    runs-on: ubuntu-24.04
    needs: build-wheels
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # DEC-CICD-GATE-HONESTY-001: full history so the auto-discovery
          # coverage gate can diff the PR against origin/main (the merge
          # base) to find the TOUCHED modules. Shallow (depth-1) checkout
          # has no base to diff against.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps (includes [data] + [ui] extras)
        # DEC-P0-001 (2026-05-17): added `[data]` extra so polars + duckdb +
        # pyarrow are installed in CI. Without these, ~6 tests in
        # tests/unit/test_tf_resampler.py and tests/integration/test_data_lake_real.py
        # fail at collection time, suppressing real coverage of the data lake.
        # DEC-DASHBOARD-CI-UNMASK-001 (2026-06-01): added `[ui]` (FastAPI +
        # uvicorn) + httpx/httpx2 (in [dev]) so the 4 dashboard HTTP test files
        # — previously SILENTLY SKIPPED on CI via importorskip("fastapi"/"httpx")
        # — now actually RUN and gate. This closes the masking hole that let a
        # broken dashboard PR auto-merge green.
        # DEC-STAGE3-OPTIMIZE-EXTRA-001: added `[optimize]` (exact-pinned pycma)
        # so the Stage-3 optimizer pin + determinism smoke ACTUALLY RUNS on CI
        # (importorskip would silently skip it otherwise — the same masking
        # class the dashboard unmask closed).
        run: pip install -e ".[dev,data,ui,optimize]"
      - name: Download prebuilt Rust wheels (DEC-SWEEP-COVERAGE-SHARD-001)
        # Built ONCE per run by the `build-wheels` job (cache-keyed on the
        # crate sources). `pip install ./rust/<crate>` itself builds a wheel
        # via the same maturin PEP 517 backend and installs it, so
        # installing the shared artifact wheel is equivalent by
        # construction — same crates, same committed Cargo.locks, same
        # backend — minus the repeated per-job cargo build. No gate change.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-wheels
          path: wheelhouse
      - name: Install prebuilt Rust wheels (fno_math + trading_core + brutex_feed + brutex_strategies)
        # EXACTLY the wheel subset this job built from source before
        # the shared build landed — a superset install could flip
        # wheel-gated skip tests, so each job's subset is preserved.
        run: pip install wheelhouse/fno_math-*.whl wheelhouse/trading_core-*.whl wheelhouse/brutex_feed-*.whl wheelhouse/brutex_strategies-*.whl
      - name: Strict per-module 100% coverage gate (Golden Rule #12)
        # New modules ship at 100% line + 100% branch from the start.
        # Add modules to this list as they reach 100%. Legacy modules
        # converge over time under the 90% global floor above.
        run: |
          # DEC-L3-REPLAY-ORACLE-001 follow-up: enable `set -x` so the
          # CI log echoes each gate command before running. Lets us
          # identify which specific module's coverage gate fails when
          # the bash `set -e` aborts the step.
          set -x
          # Diagnostic: also write a summary line to GITHUB_STEP_SUMMARY
          # for each gate that runs. STEP_SUMMARY is visible in the
          # public job UI without auth, so a failure is identifiable
          # even when the raw log is gated.
          echo "## Strict per-module 100% coverage gates" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Each line below shows a pytest invocation in execution order. The bash trace (\`set -x\`) is also visible in the raw log." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Trap any failure and surface it in the step summary so we
          # can identify which exact gate aborted the step when the
          # raw log is auth-gated.
          trap 'echo "❌ Last gate failed at: $BASH_COMMAND (exit $?)" >> "$GITHUB_STEP_SUMMARY"' ERR
          # DEC-FUTURES-EXEC-TRANSLATION-001 (MIGRATION.md #1542): the
          # whole-package --cov=brutex.costs gate must also run the
          # futures cost-stack suite — brutex/costs/futures_costs.py is
          # stem-matched by tests/unit/test_futures_costs.py, which the
          # test_costs_*.py glob does NOT collect (the same static-list
          # addition precedent as the pull_jobs gate, PR #1248).
          if compgen -G "tests/unit/test_costs_*.py" > /dev/null; then
            pytest \
              --cov=brutex.costs \
              --cov-branch \
              --cov-report=term-missing \
              --cov-fail-under=100 \
              tests/unit/test_costs_*.py \
              tests/unit/test_futures_costs.py
          else
            echo "(brutex.costs test files not present yet — gate inactive)"
          fi
          # DEC-RESILIENCE-STREAKS-001 (MIGRATION.md #1959): the
          # whole-package --cov=brutex.engine gate must also run the
          # losing-streak resilience suites — brutex/engine/resilience_streaks.py
          # is stem-matched by tests/unit/test_resilience_streaks.py and the new
          # brutex/engine/results_depth_pass.py adoption-backfill + resilience
          # fence branches are covered by tests/unit/test_resilience_sidecar.py
          # + the integration tests/integration/test_resilience_end_to_end.py,
          # none of which the test_engine_*.py glob collects (the same
          # static-list addition precedent as the costs/pull_jobs gates, PRs
          # #1248/#1542, and the brutex.data.catalog integration-test gate).
          if compgen -G "tests/unit/test_engine_*.py" > /dev/null; then
            pytest \
              --cov=brutex.engine \
              --cov-branch \
              --cov-report=term-missing \
              --cov-fail-under=100 \
              tests/unit/test_engine_*.py \
              tests/unit/test_resilience_streaks.py \
