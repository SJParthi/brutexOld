  # ─────────────────────────────────────────────────────────────────
  # TOUCHED-MODULE COVERAGE GATE (auto-discovered) — moved VERBATIM out
  # of the `test` job so it runs in PARALLEL with the coverage shards
  # (DEC-SWEEP-COVERAGE-SHARD-001). Gate content unchanged; the `test`
  # fan-in REQUIRES this job. fetch-depth 0 checkout retained — the
  # discovery diffs the PR against its merge base.
  # ─────────────────────────────────────────────────────────────────
  per-module-touched:
    name: Touched-module coverage gate (auto-discovered)
    runs-on: ubuntu-24.04
    needs: build-wheels
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # DEC-CICD-GATE-HONESTY-001: full history so the auto-discovery
          # coverage gate can diff the PR against origin/main (the merge
          # base) to find the TOUCHED modules. Shallow (depth-1) checkout
          # has no base to diff against.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps (includes [data] + [ui] extras)
        # DEC-P0-001 (2026-05-17): added `[data]` extra so polars + duckdb +
        # pyarrow are installed in CI. Without these, ~6 tests in
        # tests/unit/test_tf_resampler.py and tests/integration/test_data_lake_real.py
        # fail at collection time, suppressing real coverage of the data lake.
        # DEC-DASHBOARD-CI-UNMASK-001 (2026-06-01): added `[ui]` (FastAPI +
        # uvicorn) + httpx/httpx2 (in [dev]) so the 4 dashboard HTTP test files
        # — previously SILENTLY SKIPPED on CI via importorskip("fastapi"/"httpx")
        # — now actually RUN and gate. This closes the masking hole that let a
        # broken dashboard PR auto-merge green.
        # DEC-STAGE3-OPTIMIZE-EXTRA-001: added `[optimize]` (exact-pinned pycma)
        # so the Stage-3 optimizer pin + determinism smoke ACTUALLY RUNS on CI
        # (importorskip would silently skip it otherwise — the same masking
        # class the dashboard unmask closed).
        run: pip install -e ".[dev,data,ui,optimize]"
      - name: Download prebuilt Rust wheels (DEC-SWEEP-COVERAGE-SHARD-001)
        # Built ONCE per run by the `build-wheels` job (cache-keyed on the
        # crate sources). `pip install ./rust/<crate>` itself builds a wheel
        # via the same maturin PEP 517 backend and installs it, so
        # installing the shared artifact wheel is equivalent by
        # construction — same crates, same committed Cargo.locks, same
        # backend — minus the repeated per-job cargo build. No gate change.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-wheels
          path: wheelhouse
      - name: Install prebuilt Rust wheels (fno_math + trading_core + brutex_feed + brutex_strategies)
        # EXACTLY the wheel subset this job built from source before
        # the shared build landed — a superset install could flip
        # wheel-gated skip tests, so each job's subset is preserved.
        run: pip install wheelhouse/fno_math-*.whl wheelhouse/trading_core-*.whl wheelhouse/brutex_feed-*.whl wheelhouse/brutex_strategies-*.whl
      - name: Touched-module 100% coverage gate (auto-discovered, DEC-CICD-GATE-HONESTY-001)
        # COMPLEMENTS (does not replace) the static per-module list above
        # and the whole-package --cov-fail-under=100 floor: AUTO-DISCOVERS
        # the brutex/**/*.py modules this PR TOUCHED (vs the merge base),
        # maps each to its import-VERIFIED test(s), and asserts 100% line +
        # branch per touched file. A NEWLY ADDED module with no dedicated
        # test FAILS honestly (it must ship one); a MODIFIED legacy module
        # with no dedicated test is WARN-skipped (it still rides the static
        # gate + the whole-package floor — no false-fail on a legacy edit).
        # The diff base is the PR's merge base; on a push to main the diff
        # is empty and the gate passes (nothing touched vs itself).
        run: |
          BASE="origin/main"
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          # DEC-MERGE-QUEUE-001: on a merge_group ref, diff against the merge
          # group's OWN base SHA (the exact commit the queue applies the group
          # onto — an ancestor of the checked-out queue ref, so present under
          # fetch-depth 0), not origin/main — precise when main advances while
          # the group builds. Absent on every other event → no-op.
          if [ -n "${{ github.event.merge_group.base_sha }}" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          fi
          python scripts/ci/coverage_gate_discovery.py --base "$BASE"

  # ─────────────────────────────────────────────────────────────────
  # UNIT TESTS + COVERAGE FAN-IN (CG-01: 100% line + branch)
  # The REQUIRED branch-protection context "Unit tests + coverage
  # (100% gate)" — name UNCHANGED (branch-protection-drift.yml expected
  # snapshot). Since DEC-SWEEP-COVERAGE-SHARD-001 the whole-package
  # pytest pass runs in the parallel `test-shard` matrix; THIS job
  # combines the shard coverage data and enforces the SAME gate the
  # monolithic job enforced (--fail-under=100 over --cov=brutex
  # --cov-branch data — byte-exact, config-identical, NOT weakened),
  # plus the fast smoke/red-team/crosswalk gates that stayed here.
  # The pre-shard job's timeout ratchet history (15→25→40→60→75→120→
  # 150→180 minutes — every raise a wall-kill with zero real failures)
  # is retired with the monolith; see git history at the pre-shard
  # revision for the full per-raise evidence. Club P's concurrent
  # 75 -> 95 raise (2026-07-09, PR #1369 run 29051387891 — a 75:17
  # wall-kill with every executed step green; sibling green run
  # 29045280302 measured 74:56) and its MERGE-UNION-to-150 note
  # (2026-07-11, PR #1369 origin/main fold) retire into this same
  # history — recorded here because the monolith block they annotated
  # is gone (same union rule, no gate weakened).
  #
  # FAIL-CLOSED LAW: `if: ${{ !cancelled() }}` + the explicit
  # upstream-result check as the FIRST step. Without it a red shard
  # would SKIP this job via `needs`, and both ci-ok's loop
  # (skipped==pass) and branch protection (a skipped required check
  # satisfies the context) would read green — the exact silent-pass
  # hole the check closes. The four upstream jobs are ALSO in ci-ok's
  # needs for the same reason. `!cancelled()` — NOT `always()` — per
  # the DEC-CI-PROOFBUNDLE-MKDIR-GATE-001 precedent: on a
  # concurrency-cancelled/superseded run the upstream shards read
  # `cancelled`, and an `always()` fan-in would still run and mint a
  # spurious RED required context on the dead head (observed live on
  # run 29644640240) while also resisting the cancellation itself; a
  # cancelled run's fan-in must SKIP (the superseded head reports
  # nothing — branch protection evaluates the new head's run).
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Unit tests + coverage (100% gate)
    runs-on: ubuntu-24.04
    needs:
      - build-wheels
      - test-shard
      - per-module-static
      - per-module-touched
    if: ${{ !cancelled() }}
    timeout-minutes: 45
    steps:
      - name: Verify upstream shard + per-module gate jobs succeeded (fail-closed)
        env:
          WHEELS_RESULT: ${{ needs.build-wheels.result }}
          SHARDS_RESULT: ${{ needs.test-shard.result }}
          STATIC_RESULT: ${{ needs.per-module-static.result }}
          TOUCHED_RESULT: ${{ needs.per-module-touched.result }}
        run: |
          set -euo pipefail
          ok=1
          for pair in \
            "build-wheels:${WHEELS_RESULT}" \
            "test-shard:${SHARDS_RESULT}" \
            "per-module-static:${STATIC_RESULT}" \
            "per-module-touched:${TOUCHED_RESULT}"; do
            job="${pair%%:*}"
            result="${pair##*:}"
            echo "  ${job}: ${result}"
            if [ "$result" != "success" ]; then
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::an upstream shard / per-module gate job did not succeed — failing the required coverage context (fail-closed: skipped==pass must never mask a red shard)"
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # DEC-CICD-GATE-HONESTY-001: full history so the auto-discovery
          # coverage gate can diff the PR against origin/main (the merge
          # base) to find the TOUCHED modules. Shallow (depth-1) checkout
          # has no base to diff against.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps (includes [data] + [ui] extras)
        # DEC-P0-001 (2026-05-17): added `[data]` extra so polars + duckdb +
        # pyarrow are installed in CI. Without these, ~6 tests in
        # tests/unit/test_tf_resampler.py and tests/integration/test_data_lake_real.py
        # fail at collection time, suppressing real coverage of the data lake.
        # DEC-DASHBOARD-CI-UNMASK-001 (2026-06-01): added `[ui]` (FastAPI +
        # uvicorn) + httpx/httpx2 (in [dev]) so the 4 dashboard HTTP test files
        # — previously SILENTLY SKIPPED on CI via importorskip("fastapi"/"httpx")
        # — now actually RUN and gate. This closes the masking hole that let a
        # broken dashboard PR auto-merge green.
        # DEC-STAGE3-OPTIMIZE-EXTRA-001: added `[optimize]` (exact-pinned pycma)
        # so the Stage-3 optimizer pin + determinism smoke ACTUALLY RUNS on CI
        # (importorskip would silently skip it otherwise — the same masking
        # class the dashboard unmask closed).
        run: pip install -e ".[dev,data,ui,optimize]"
      - name: Download prebuilt Rust wheels (DEC-SWEEP-COVERAGE-SHARD-001)
        # Built ONCE per run by the `build-wheels` job (cache-keyed on the
        # crate sources). `pip install ./rust/<crate>` itself builds a wheel
        # via the same maturin PEP 517 backend and installs it, so
        # installing the shared artifact wheel is equivalent by
        # construction — same crates, same committed Cargo.locks, same
        # backend — minus the repeated per-job cargo build. No gate change.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-wheels
          path: wheelhouse
      - name: Install prebuilt Rust wheels (fno_math + trading_core + brutex_feed + brutex_strategies)
        # EXACTLY the wheel subset this job built from source before
        # the shared build landed — a superset install could flip
        # wheel-gated skip tests, so each job's subset is preserved.
        run: pip install wheelhouse/fno_math-*.whl wheelhouse/trading_core-*.whl wheelhouse/brutex_feed-*.whl wheelhouse/brutex_strategies-*.whl
      - name: Download shard coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-shard-*
          path: covdata
          merge-multiple: true
      - name: Zero-skip / zero-dup integrity guard (collection-count law)
        # Proves the shard partition ran EVERY test exactly once: the
        # full collect-only count must equal the sum of the per-shard
        # collect-only counts (identical counting pipeline both sides;
        # the partition is disjoint by construction — shard_tests.py
        # --self-check — so sum-equality proves completeness). This
        # subsumes missing-shard detection: a lost shard's tests would
        # be absent from the sum and fail the equality loudly.
        run: |
          set -euo pipefail
          ls -l covdata/
          pytest --collect-only -q tests/unit tests/integration tests/property --ignore=tests/bench > full-collect.txt || { tail -50 full-collect.txt; exit 1; }
          full=$(grep -cE '^tests/.+::' full-collect.txt)
          shard_sum=0
          for f in covdata/collected-count-shard*.txt; do
            shard_sum=$((shard_sum + $(cat "$f")))
          done
          echo "full collection: ${full} tests; shard sum: ${shard_sum}"
          if [ "$full" -ne "$shard_sum" ]; then
            echo "::error::shard partition integrity FAILED — per-shard collected sum (${shard_sum}) != full collection (${full}). Zero-skip/zero-dup violated; failing the coverage gate."
            exit 1
          fi
      - name: Combine shard coverage + enforce the 100% gate
        run: |
          # Coverage floor at 100 (DEC-COV-APP-BACKFILL-001, 2026-06-12):
          # dashboard/app.py — the last sub-100 module — was backfilled
          # to 100.00% line+branch (46 targeted tests), making EVERY
          # un-omitted module 100.00%.
          # The [tool.coverage.run].omit list is now EMPTY — the key is
          # REMOVED (DEC-COV-CLI-HARNESS-001, 2026-06-12): cli.py and
          # __main__.py, its last two entries, were backfilled to 100.00%
          # line+branch (test_cli_run.py / test_cli_retry_storm.py /
          # test_cli_backfill.py + the integration CLI suites), so this
          # fail_under=100 floor covers the WHOLE brutex package.
          # Ratchet history: 90 -> 99 (DEC-COV-SMALL-GAPS-001) -> 100
          # (DEC-COV-APP-BACKFILL-001); earlier un-omits: execution/driver
          # (DEC-COVERAGE-DRIVER-001), data/catalog (DEC-COVERAGE-CATALOG-001),
          # data/instrument_store (DEC-COVERAGE-INSTRUMENT-STORE-001),
          # the #377 batch.
          # DEC-SWEEP-COVERAGE-SHARD-001: the SAME gate, now enforced on
          # the COMBINED shard data — `coverage report --fail-under=100`
          # over --cov=brutex --cov-branch data computes the same total
          # the monolithic `pytest --cov-fail-under=100` computed
          # (pyproject [tool.coverage.report] fail_under=100 +
          # show_missing apply identically).
          set -euo pipefail
          coverage combine covdata/coverage-data-shard*
          coverage report --fail-under=100
          coverage xml -o coverage.xml
      - name: Smoke + red-team gates (DEC-DASHBOARD-OMIT-AUDIT-001)
        # The 5-agent verification (2026-06-01) found two test classes that
        # never gated merges: tests/smoke (12 pre-push smoke tests, wired into
        # NO workflow) and tests/redteam (32 gate-integrity meta-tests that
        # assert each CI gate actually catches a planted bug — previously
        # nightly-only, not in the `CI OK` aggregate). Wire both into the
        # per-PR `test` job so a smoke break or a gate-detection regression
        # fails the PR at merge time, not just nightly. Both are fast
        # (<5s combined) and the [dev,data,ui] env satisfies their tool
        # guards (ruff / mypy / bandit installed).
        run: pytest -q tests/smoke tests/redteam
      - name: Spec ↔ test crosswalk (Golden Rule #12 req 8)
        run: python scripts/ci/spec_test_crosswalk.py
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # BROWSER TRUTH — headless Chromium dashboard DOM proofs
  # (DEC-DASHBOARD-BROWSER-TRUTH-001)
  # ─────────────────────────────────────────────────────────────────
  browser:
    name: Browser truth (headless Chromium dashboard DOM)
    runs-on: ubuntu-24.04
    # DEC-SWEEP-COVERAGE-SHARD-001: consumes the shared prebuilt wheels.
    needs: build-wheels
    # DEC-DASHBOARD-BROWSER-TRUTH-001: Playwright + Chromium renders the REAL
    # /universe /movers /db /results templates + static JS against
    # fixture-backed build_app apps and asserts the pinned DOM behaviors
    # (db O(page) paging partial, movers gate paint-once/timer-disarm/
    # recovery, XSS escaping, bxFixed2 ROUND_HALF_UP golden, rate-widget
    # flow_state). The suite is opt-in (BRUTEX_BROWSER_TESTS=1) and polices
    # its own zero-flakiness law via tests/browser/_guards.py, enforced in
    # the MAIN test job by tests/unit/test_browser_suite_discipline.py.
    # The 15-minute budget is a PROJECTION to MEASURE on the first run
    # (local suite wall time is seconds; pip + Chromium install dominate —
    # Golden Rule #10). Deliberately NO job-level `if:` — the ci-ok
    # aggregate treats skipped==pass, so a conditional here would be a
    # silent merge-green escape hatch (pinned by the discipline test).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps (includes [browser] Playwright extra)
        # [dev,data,ui] mirror the test job (build_app + fixtures need
        # fastapi/uvicorn/polars/duckdb); [browser] adds ONLY playwright —
        # the main test job never installs it (the suite stays out of the
        # coverage paths by design).
        run: pip install -e ".[dev,data,ui,browser]"
      - name: Download prebuilt Rust wheels (DEC-SWEEP-COVERAGE-SHARD-001)
        # Built ONCE per run by the `build-wheels` job (cache-keyed on the
        # crate sources). `pip install ./rust/<crate>` itself builds a wheel
        # via the same maturin PEP 517 backend and installs it, so
        # installing the shared artifact wheel is equivalent by
        # construction — same crates, same committed Cargo.locks, same
        # backend — minus the repeated per-job cargo build. No gate change.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-wheels
          path: wheelhouse
      - name: Install prebuilt Rust wheels (fno_math + trading_core)
        # EXACTLY the wheel subset this job built from source before
        # the shared build landed — a superset install could flip
        # wheel-gated skip tests, so each job's subset is preserved.
        run: pip install wheelhouse/fno_math-*.whl wheelhouse/trading_core-*.whl
      - name: Resolve Playwright version (Chromium cache key)
        # importlib.metadata — the playwright package exposes NO top-level
        # __version__ attribute (probing it raises AttributeError). The
        # assignment form + emptiness check make a resolution failure fail
        # the STEP loudly: a $(…) substitution inlined into echo would exit 0
        # under bash -e and silently write an EMPTY version, degrading the
        # cache key to a constant (round-1 review finding).
        id: pwver
        run: |
          version="$(python -c 'from importlib.metadata import version; print(version("playwright"))')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        # Keyed on the RESOLVED installed playwright version (not the range
        # pin in pyproject) so a playwright upgrade invalidates the cache
        # exactly when the pinned Chromium build changes.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ steps.pwver.outputs.version }}
      - name: Install Chromium (Playwright-pinned build)
        run: python -m playwright install --with-deps chromium
      - name: Browser truth suite (deliberately cov-free)
        # NO --cov: the DOM layer is a truth gate, not a coverage surface —
        # server-side coverage is owned by the main test job; adding --cov
        # here would double-count brutex modules with no gate value. The
        # discipline test pins this invocation cov-free.
        env:
          BRUTEX_BROWSER_TESTS: "1"
        run: pytest tests/browser -q
      - name: Upload failure artifacts (traces + screenshots + ledgers)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failure-artifacts
          path: test-artifacts/browser/
          retention-days: 7
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────
  # PROPERTY TESTS — hypothesis-driven (CG-12)
  # ─────────────────────────────────────────────────────────────────
  property:
    name: Property tests (hypothesis)
    runs-on: ubuntu-24.04
    # DEC-SWEEP-COVERAGE-SHARD-001: consumes the shared prebuilt wheels.
    needs: build-wheels
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Download prebuilt Rust wheels (DEC-SWEEP-COVERAGE-SHARD-001)
        # Built ONCE per run by the `build-wheels` job (cache-keyed on the
        # crate sources). `pip install ./rust/<crate>` itself builds a wheel
        # via the same maturin PEP 517 backend and installs it, so
        # installing the shared artifact wheel is equivalent by
        # construction — same crates, same committed Cargo.locks, same
        # backend — minus the repeated per-job cargo build. No gate change.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-wheels
          path: wheelhouse
      - name: Install prebuilt Rust wheels (fno_math + trading_core + brutex_strategies)
        # EXACTLY the wheel subset this job built from source before
        # the shared build landed — a superset install could flip
        # wheel-gated skip tests, so each job's subset is preserved.
        run: pip install wheelhouse/fno_math-*.whl wheelhouse/trading_core-*.whl wheelhouse/brutex_strategies-*.whl
      # DEC-FEED-RUST-CORE-001 round-1 review: NO brutex_feed wheel here —
      # this job installs `.[dev]` only (no pyarrow), so the feed parity
      # module (tests/property/test_feed_rust_parity.py) skips on its
      # pyarrow guard regardless; installing the wheel was dead weight. The
      # dual-arm parity gate's execution home is the `test:` job
      # ([dev,data,ui] + the wheel), which runs tests/property in its
      # coverage pass.
      - name: pytest property tests
        run: |
          if [ -d tests/property ]; then
            pytest tests/property -x --hypothesis-show-statistics
          else
            echo "⏸  tests/property does not exist yet — skipping"
          fi
      - name: pytest stress tests (bounded)
        # DEC-GROWW-CATALOG-DRIVER-001: wire tests/stress into CI (bounded N;
        # the real multi-hour soak runs on soak-selfhosted.yml — soak-scale
        # STRESS_EVENTS dispatches are REFUSED by stress-nightly.yml's fence
        # (> 200000), DEC-SOAK-REAL-TIER-001 #1580; BRUTEX_STRESS_YEARS stays
        # the fetch-sustained scale knob).
        run: |
          if [ -d tests/stress ]; then
            # SOAK-1: honor the deliberately-isolated @soak marker — the
            # full-budget soak runs ONLY on soak-selfhosted.yml, NEVER in the
            # per-PR gate (pyproject.toml soak-marker contract + tests/stress/
            # __init__.py). Matches stress-nightly.yml's exclusion.
            pytest tests/stress -m 'not soak' -q
          else
            echo "⏸  tests/stress does not exist yet — skipping"
          fi

  # ─────────────────────────────────────────────────────────────────
  # BENCHMARK GATE — pytest-benchmark O(1) assertions (NFR-PERF-001/002/003)
  #
  # The benchmark tests include empirical ratio assertions (e.g. store
  # lookup at 10k items vs 1k items must be < 3×). They run on every
  # push so a linear-scan regression fails CI, not just shows up in a
  # benchmark report nobody reads.
  # ─────────────────────────────────────────────────────────────────
  bench:
    name: Benchmarks (O(1) NFR gates)
    runs-on: ubuntu-24.04
    # DEC-SWEEP-COVERAGE-SHARD-001: consumes the shared prebuilt wheels.
    needs: build-wheels
    # Budget raised 15 -> 25 (DEC-CI-SWEEP-REHEARSAL-TIMEOUT-001, #1765):
    # a banked observation put the real bench wall-time at ~10.9 min, only
    # ~4.1 min under the old 15-min cap (~27% headroom) — thin enough that a
    # single shared-runner contention spike (like the R38 spike on PR #1462)
    # could auto-cancel it. Budget-for-contention only; the O(1) ratio
    # ceilings in tests/bench/_o1_tiers.py are UNTOUCHED (a real perf
    # regression still fails the ratio gate, Golden Rule #10).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0   # DEC-BENCH-ABS-BASELINE-001: baseline governance diffs vs base
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Bench-baseline structural gate (schema + registry + governance fields)
        # DEC-BENCH-ABS-BASELINE-001. Green on an EMPTY baselines dir (bootstrap
        # state) with a loud notice; a committed baseline that fails schema (incl.
        # tolerance_pct >= 100 — the 2x-must-fail structural cap) blocks merge here.
        # stdlib-only: loads the core via spec_from_file_location, no pip install.
        run: python3 scripts/ci/bench_baseline_gate.py validate --baselines-dir tests/bench/baselines
      - name: Bench-baseline governance gate (no silent re-baseline)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}   # read-only: live run verification via `gh api`
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          python3 scripts/ci/bench_baseline_gate.py govern --base "origin/${BASE_REF}"
      - name: Install deps (dev + data + ui — the lake AND route benches need them)
        # DEC-RESAMPLER-INPUT-GUARD-001 audit finding: `.[dev]` alone made every
        # polars/duckdb bench `importorskip` SILENTLY — the lake-write O(1)
        # gates (test_parquet_write_o1.py, test_db_candle_query_o1.py,
        # test_catalog_reconcile_o1.py, test_write_latency.py, …) NEVER ran in
        # CI, so a linear-scan regression on those hot paths could not fail
        # this job. `[data]` (polars/duckdb/pyarrow) makes them execute.
        # DEC-O1-GUARANTEE-HARDEN-001 review round 1 (the same finding class,
        # one extra over): `[ui]` (fastapi) makes the SIX route-level bench
        # gates execute too (test_db_tables_swr_o1 / test_preopen_export_memo_o1
        # / test_revision_probe_ttl_o1 / test_lake_census_route_o1 /
        # test_ledger_delta_o_page_o1 / test_movers_pcr_o1 — all previously
        # collected-then-SKIPPED on this job via importorskip("fastapi")); the
        # fno_math/trading_core wheels the remaining skips need are built by
        # the steps below, so no bench silently skips for a missing extra
        # (verified locally: the full tests/bench dir with ui deps = 371
        # passed / 11 skipped, every remaining skip the documented
        # BRUTEX_M4PRO_ABS class; the 6 route files ran 3× stable ~30 s).
        run: pip install -e ".[dev,data,ui]"
      - name: Download prebuilt Rust wheels (DEC-SWEEP-COVERAGE-SHARD-001)
        # Built ONCE per run by the `build-wheels` job (cache-keyed on the
        # crate sources). `pip install ./rust/<crate>` itself builds a wheel
        # via the same maturin PEP 517 backend and installs it, so
        # installing the shared artifact wheel is equivalent by
        # construction — same crates, same committed Cargo.locks, same
        # backend — minus the repeated per-job cargo build. No gate change.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-wheels
          path: wheelhouse
      - name: Install prebuilt Rust wheels (fno_math + trading_core + brutex_feed)
        # EXACTLY the wheel subset this job built from source before
        # the shared build landed — a superset install could flip
        # wheel-gated skip tests, so each job's subset is preserved.
        run: pip install wheelhouse/fno_math-*.whl wheelhouse/trading_core-*.whl wheelhouse/brutex_feed-*.whl
      - name: pytest benchmarks
        run: |
          if [ -d tests/bench ]; then
            # -W default:: overrides pyproject.toml's `-W error`
            # filterwarnings for the bench session so third-party
            # deprecation warnings (pytest-benchmark, pkg_resources)
            # on Python 3.12 don't fail the run.
            pytest tests/bench \
              -W default::DeprecationWarning \
              -W default::PendingDeprecationWarning \
              --benchmark-min-rounds=3 \
              --benchmark-disable-gc \
              --benchmark-columns=min,mean,median,stddev,ops \
              --benchmark-json=bench-results.json
          else
            echo "⏸  tests/bench does not exist yet — skipping"
          fi
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-results
          path: bench-results.json
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────
  # GOLDEN TESTS — fixture-based (CG-11)
  # ─────────────────────────────────────────────────────────────────
  golden:
    name: Golden-master tests
    runs-on: ubuntu-24.04
    # DEC-SWEEP-COVERAGE-SHARD-001: consumes the shared prebuilt wheels.
    needs: build-wheels
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps (includes [data] for the resample golden corpora)
        # DEC-PHASE2-CORPORA-001 (#548): corpora #4 (INDIA VIX) + #5
        # (cross-instrument resample) drive brutex.data.tf_resampler, which
        # needs polars (the [data] extra). Without it those two golden modules
        # fail at import (ModuleNotFoundError: polars), mirroring the [data]
        # install the unit-test job already uses.
        run: pip install -e ".[dev,data]"
      - name: Download prebuilt Rust wheels (DEC-SWEEP-COVERAGE-SHARD-001)
        # Built ONCE per run by the `build-wheels` job (cache-keyed on the
        # crate sources). `pip install ./rust/<crate>` itself builds a wheel
        # via the same maturin PEP 517 backend and installs it, so
        # installing the shared artifact wheel is equivalent by
        # construction — same crates, same committed Cargo.locks, same
        # backend — minus the repeated per-job cargo build. No gate change.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rust-wheels
          path: wheelhouse
      - name: Install prebuilt Rust wheels (fno_math + trading_core + brutex_feed + brutex_strategies)
        # EXACTLY the wheel subset this job built from source before
        # the shared build landed — a superset install could flip
        # wheel-gated skip tests, so each job's subset is preserved.
        run: pip install wheelhouse/fno_math-*.whl wheelhouse/trading_core-*.whl wheelhouse/brutex_feed-*.whl wheelhouse/brutex_strategies-*.whl
      - name: pytest golden tests
        # Discovers every tests/golden/*.py oracle by placement.
        run: |
          if [ -d tests/golden ]; then
            pytest tests/golden -x
          else
            echo "⏸  tests/golden does not exist yet — skipping"
          fi

  # ─────────────────────────────────────────────────────────────────
  # SECURITY — bandit + pip-audit (CG-05)
  # ─────────────────────────────────────────────────────────────────
  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Upgrade baseline tooling
        run: |
          python -m pip install --upgrade \
            "pip>=26.0" "setuptools>=78.1.1" "wheel>=0.46.2"
      - name: Install scanners
        run: |
          pip install "bandit>=1.7,<2.0" "pip-audit>=2.7,<3.0"
      - name: bandit (low+ exit threshold per DEC-P0-001)
        run: |
          # DEC-P0-001 (2026-05-17): kept at -l (low+ severity); the prior
          # draft of this PR proposed -ll (medium+) but that is WEAKER than
          # -l (-ll ignores low-severity findings). Bandit semantics:
          # -l reports low+, -ll reports medium+, -lll reports high+.
          # The 4 legitimate low-severity exceptions (S104 × 2 in
          # brutex/config/ports.py, S105 in brutex/notifications/telegram.py,
          # S311 in brutex/orchestrator/retry.py) carry per-line `# nosec`
          # tags so bandit at -l skips them. New S104 sites in brutex/ trip
          # at the ruff layer (S-rules un-ignored at project level per
          # pyproject.toml comment).
          bandit -r brutex -l
      - name: Compile declared deps to requirements.txt
        # pip-audit on a fat venv scans the runner-image baseline and
        # gets noisy with CVEs in dev-transitives we don't control.
        # Instead, resolve brutex's declared pyproject deps into a
        # pinned requirements.txt via pip install --dry-run + pip
        # freeze style, then scan ONLY that file.
        run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --upgrade pip setuptools wheel
          /tmp/audit-venv/bin/pip install -e .
          /tmp/audit-venv/bin/pip freeze --exclude-editable > /tmp/brutex-reqs.txt
          echo "---- Resolved direct+transitive dep set ----"
          cat /tmp/brutex-reqs.txt
      - name: pip-audit (scoped to brutex declared deps)
        # Scans ONLY the transitive closure of `pip install brutex`,
        # not the dev toolchain or the runner image's preinstalled
        # packages. A real CVE in any of our declared deps still
        # fails this gate. Weekly security-audit.yml runs a broader
        # audit against the full venv.
        run: |
          pip-audit --strict --requirement /tmp/brutex-reqs.txt

  # ─────────────────────────────────────────────────────────────────
  # DOCSTRINGS — interrogate (CG-15)
  # ─────────────────────────────────────────────────────────────────
  docs:
    name: Docstring coverage (interrogate)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install interrogate
        run: pip install "interrogate>=1.7"
      - name: Check docstring coverage
        run: |
          # 100% gate. Every public + private function/class/method has
          # a docstring, including dataclass field validators and
          # internal helpers. Bumped from 75% → 100% in PR #5 after
          # adding ~80 missing docstrings across the codebase.
          interrogate brutex \
            --ignore-init-method \
            --ignore-init-module \
            --ignore-private \
            --ignore-magic \
            --ignore-nested-functions \
            --ignore-module \
            --ignore-setters \
            --fail-under=100 \
            -vv

  # ─────────────────────────────────────────────────────────────────
  # LICENSE COMPLIANCE — pip-licenses (CG-20)
  # ─────────────────────────────────────────────────────────────────
  licenses:
    name: License compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps + pip-licenses
        run: |
          pip install -e "." "pip-licenses>=5.0"
      - name: Check licenses
        run: |
          # Use --fail-on to block GPL/AGPL explicitly rather than
          # --allow-only, which mismatches against the many free-text
          # license strings in PyPI metadata (e.g. "Apache Software
          # License", "Mozilla Public License 2.0 (MPL 2.0)").
          pip-licenses --fail-on "GPL;LGPL;AGPL;SSPL;Commons Clause;Proprietary License" \
            --format=plain-vertical \
            --with-urls --with-authors

  # ─────────────────────────────────────────────────────────────────
  # RUST — cargo check + clippy + fmt + test for fno-math
  # ─────────────────────────────────────────────────────────────────
  rust:
