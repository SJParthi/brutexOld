  rust-trading-core:
    name: Rust (trading-core build + clippy + golden bit-identity test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust/trading-core
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt,clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust/trading-core -> target
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings
      # DEC-SHARED-CORE-001 Phase 1: the golden bit-identity proof — the Rust
      # vocab must reproduce every one of the 400 cases in
      # tests/golden/fixtures/vocab_golden_vectors.json bit-for-bit (the same
      # oracle the Python golden test reads). --release runs with overflow-checks.
      - name: cargo test (golden bit-identity vs the Python oracle)
        run: cargo test --release
      # Verify the optional PyO3 binding (Phase-2 scaffold) still compiles. The
      # ubuntu runner's python3 satisfies pyo3's abi3 build config (same as the
      # fno-math job). The wheel itself is NOT built here (that is Phase 2).
      - name: cargo check --features python (PyO3 binding compiles)
        run: cargo check --features python
      # DEC-SHARED-CORE-001 Phase 2a: prove the Python-callable PyO3 binding
      # (trading_core.evaluate_from_raw) is bit-identical to the Python vocab —
      # build the abi3 wheel with maturin, install it, and run the 400-case
      # parity check against the same golden oracle. Isolated here (not the main
      # Python test job) so a wheel-build issue can't destabilise that pipeline.
      - name: Set up Python (binding parity check)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheel + verify the Python binding is bit-identical (Phase 2a)
        # Belt-and-suspenders crates.io flake guard (on top of the
        # workflow-level CARGO_NET_RETRY=10): retry the maturin wheel build
        # (the cargo download point) up to 3 times. POSIX sh; builds the
        # same wheel — no test/coverage change.
        run: |
          pip install maturin
          n=0
          until maturin build --release --out dist; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "maturin build failed after 3 attempts" >&2
              exit 1
            fi
            echo "maturin build failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done
          pip install dist/*.whl
          python ../../scripts/check_vocab_rust_parity.py

