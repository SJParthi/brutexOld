# BruteX CI/CD — the complete quality gate pipeline.
#
# This workflow implements every gate from REQUIREMENTS.md §17 (CG-01
# through CG-20). Any failing gate blocks merge. Sub-jobs run in
# parallel where possible so the total wall clock is dominated by
# the slowest job (usually pytest or cargo check).
#
# Gates implemented:
#   CG-01  100% line + branch coverage (pytest-cov + --cov-fail-under=100)
#   CG-03  type checking (mypy --strict + pyright)
#   CG-04  lint (ruff check + ruff format --check)
#   CG-05  security (bandit + pip-audit)
#   CG-09  audit chain integrity (brutex audit verify, on integration tests)
#   CG-14  import graph (import-linter — wired once ingest lands)
#   CG-15  docstring coverage (interrogate)
#   CG-18  integrity gate coverage (unit tests per gate)
#   CG-19  review gate (branch protection; not in this file, set on GitHub)
#   CG-20  license compliance (pip-licenses)
#
# Plus BruteX-specific gates:
#   - Rust crate build + test + clippy + fmt (for rust/fno-math/)
#   - Tickvault drift check (schedule-only in drift-check.yml)
#   - Conventional commit format check
#   - Secret-scanning via gitleaks
#   - Banned patterns (no print, no TODO in production, no env.sh files)
#
# Caching strategy:
#   - Python deps cached by pyproject.toml hash via actions/cache
#   - Rust deps cached by Cargo.lock hash via Swatinem/rust-cache
#   - uv recommended but not required — works with pip
#
# Parallelism model:
#   - lint / type / test / rust-check / docs run in parallel
#   - final "ci-ok" job depends on ALL of them; merge gate is ci-ok
#
# Triggered on: every push to a branch, every PR against main,
#   and manual dispatch via workflow_dispatch

name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress runs for the same branch on new pushes — saves
# CI minutes when the operator pushes multiple commits quickly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Read-only by default; individual jobs escalate if needed.
  contents: read

env:
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.93.1"
  # Reproducibility (matches REQUIREMENTS.md NFR-DET-001)
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  # BruteX runtime config
  BRUTEX_SAFETY_FACTOR: "0.6"
  BRUTEX_OHLC_RATE_LIMIT_RPS: "3"
  BRUTEX_AUDIT_CHAIN_ENABLED: "1"
  BRUTEX_REPRODUCIBILITY_STRICT: "1"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # LINT — ruff + ruff format check
  # Fast — should finish in under 15 seconds.
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        # Pin to a recent 0.15 line — 0.5/0.6 don't know the RUF043 /
        # newer ignore codes we rely on in pyproject.
        run: pip install "ruff>=0.15,<1.0"
      - name: ruff check
        run: ruff check brutex tests
      - name: ruff format check
        run: ruff format --check brutex tests

  # ─────────────────────────────────────────────────────────────────
  # TYPE — mypy --strict + pyright
  # ─────────────────────────────────────────────────────────────────
  type:
    name: Type check (mypy + pyright)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          pip install -e ".[dev,groww]"
      - name: Install Rust toolchain (for fno_math wheel)
        # DEC-P0-050: required by pyright's strict mode which walks
        # `tests/unit/test_fno_math_bridge.py` and needs the module
        # actually importable.
        uses: dtolnay/rust-toolchain@stable
      - name: Install fno_math Rust extension
        run: pip install ./rust/fno-math
      - name: mypy --strict
        run: mypy --strict brutex
      - name: pyright
        # Per DEC-P0-014 (PR #36 Agent 3 audit): the prior `pyright brutex`
        # invocation enforced strict mode on source ONLY, leaving `tests/`
        # un-gated despite PR #35's MIGRATION.md entry claiming "full
        # project-wide strict". Expanded to `brutex tests` to match the
        # honest envelope claim.
        run: pyright brutex tests

  # ─────────────────────────────────────────────────────────────────
  # UNIT TESTS + coverage gate (CG-01: 100% line + branch)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Unit tests + coverage (100% gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps (includes [data] extras per DEC-P0-001)
        # DEC-P0-001 (2026-05-17): added `[data]` extra so polars + duckdb +
        # pyarrow are installed in CI. Without these, ~6 tests in
        # tests/unit/test_tf_resampler.py and tests/integration/test_data_lake_real.py
        # fail at collection time, suppressing real coverage of the data lake.
        run: pip install -e ".[dev,data,groww]"
      - name: Install Rust toolchain (for fno_math wheel)
        # DEC-P0-050 (PR-K): the fno-math Rust extension is built via
        # maturin (PEP 517) at install time. ubuntu-24.04's pre-installed
        # Rust may be older than the crate's `rust-version = "1.93.1"`
        # floor, so install stable explicitly.
        uses: dtolnay/rust-toolchain@stable
      - name: Install fno_math Rust extension
        # `pip install` triggers maturin (declared in
        # rust/fno-math/pyproject.toml's [build-system] requires) to
        # build the cdylib + install it into the env so the unit tests
        # can `import fno_math`.
        run: pip install ./rust/fno-math
      - name: pytest with coverage gate
        run: |
          # Coverage floor is 90% for P1 — heavy-dep modules (cli,
          # dashboard, data/catalog, data/parquet_writer, data/sink)
          # are excluded in [tool.coverage.run].omit because they need
          # the [data] extras or a running dashboard harness. The
          # target is progressively raised to 100% in follow-up PRs
          # as the remaining coverage gaps get dedicated tests.
          pytest \
            --cov=brutex \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90 \
            --ignore=tests/bench \
            tests/unit tests/integration tests/property
      - name: Strict per-module 100% coverage gate (Golden Rule #12)
        # New modules ship at 100% line + 100% branch from the start.
        # Add modules to this list as they reach 100%. Legacy modules
        # converge over time under the 90% global floor above.
        run: |
          # DEC-L3-REPLAY-ORACLE-001 follow-up: enable `set -x` so the
          # CI log echoes each gate command before running. Lets us
          # identify which specific module's coverage gate fails when
          # the bash `set -e` aborts the step.
          set -x
          # Diagnostic: also write a summary line to GITHUB_STEP_SUMMARY
          # for each gate that runs. STEP_SUMMARY is visible in the
          # public job UI without auth, so a failure is identifiable
          # even when the raw log is gated.
          echo "## Strict per-module 100% coverage gates" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Each line below shows a pytest invocation in execution order. The bash trace (\`set -x\`) is also visible in the raw log." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Trap any failure and surface it in the step summary so we
          # can identify which exact gate aborted the step when the
          # raw log is auth-gated.
          trap 'echo "❌ Last gate failed at: $BASH_COMMAND (exit $?)" >> "$GITHUB_STEP_SUMMARY"' ERR
          if compgen -G "tests/unit/test_costs_*.py" > /dev/null; then
            pytest \
              --cov=brutex.costs \
              --cov-branch \
              --cov-report=term-missing \
              --cov-fail-under=100 \
              tests/unit/test_costs_*.py
          else
            echo "(brutex.costs test files not present yet — gate inactive)"
          fi
          if compgen -G "tests/unit/test_engine_*.py" > /dev/null; then
            pytest \
              --cov=brutex.engine \
              --cov-branch \
              --cov-report=term-missing \
              --cov-fail-under=100 \
              tests/unit/test_engine_*.py
          else
            echo "(brutex.engine test files not present yet — gate inactive)"
          fi
          # DEC-COV-001 (2026-05-24, MIGRATION.md entry #210): ratchet
          # `brutex.doctor` into the strict per-module 100% gate. The
          # module was designed in DEC-DOCTOR-001 (PR #100) with 18 unit
          # tests across 5 classes covering all PASS/FAIL/SKIP paths of
          # both checks, the aggregator, and the CLI exit-code contract
          # — explicitly engineered for 100% line + branch coverage.
          # This is step 1 of the multi-PR ratchet path to lift the
          # global floor from 90% → 100% (per Golden Rule #12 #1+#2).
          if compgen -G "tests/unit/test_doctor.py" > /dev/null; then
            pytest \
              --cov=brutex.doctor \
              --cov-branch \
              --cov-report=term-missing \
              --cov-fail-under=100 \
              tests/unit/test_doctor.py
          else
            echo "(brutex.doctor test file not present yet — gate inactive)"
          fi
          # DEC-COV-001 step 2 (2026-05-24, MIGRATION.md entry #211):
          # ratchet `brutex.universe` into the strict per-module 100%
          # gate. `tests/unit/test_universe.py` has dedicated test
          # classes for UnderlyingSpec (frozen dataclass), the V1
          # indices tuple composition, the REFERENCE_ONLY partition,
          # and the helper predicates (`is_index_underlying`,
          # `is_in_scope`, `classify_underlying_kind`) — comprehensive
          # coverage of every public function + every branch.
          if compgen -G "tests/unit/test_universe.py" > /dev/null; then
            pytest \
              --cov=brutex.universe \
              --cov-branch \
              --cov-report=term-missing \
              --cov-fail-under=100 \
              tests/unit/test_universe.py
          else
            echo "(brutex.universe test file not present yet — gate inactive)"
          fi
          # DEC-COV-001 step 3 — `brutex.models` was tried in initial
          # push but unit-tests + coverage gate failed at 100% (43
          # branches in the module; test_models.py covers most but
          # not all). Deferred to a follow-up PR that writes the
          # missing tests first. See MIGRATION.md entry #212 honest
          # envelope.
          #
          # DEC-VENDOR-PIVOT-001 (2026-05-26): the groww.timeconv +
          # groww.options_constants strict-100% gate blocks that lived
          # here were deleted as part of the Groww wipe. Replacements
          # for Groww adapter modules will land in Phase 1+ PRs.
          # DEC-COV-001 step 4 (2026-05-24, MIGRATION.md entry #213):
          # ratchet `brutex.strategies.types` (110 lines, 3 public
          # classes: Side StrEnum, Signal frozen dataclass with
          # tz-aware/strength validators, StrategyState mutable
          # dataclass with reset). `tests/unit/test_strategies_types.py`
          # (102 lines, ratio 0.93×) has 3 dedicated test classes
          # covering every public symbol + every validator branch.
          if compgen -G "tests/unit/test_strategies_types.py" > /dev/null; then
            pytest \
              --cov=brutex.strategies.types \
              --cov-branch \
              --cov-report=term-missing \
              --cov-fail-under=100 \
              tests/unit/test_strategies_types.py
          else
            echo "(brutex.strategies.types test file not present yet — gate inactive)"
          fi
          # DEC-COV-001 step 5 — `brutex.config.ports` was tried but
          # CI surfaced it below 100% (465 lines, 52 tests not enough
          # for full branch coverage). Deferred to a follow-up PR that
          # first writes the missing tests. Self-verifying ratchet at
          # work — same lesson as `brutex.models` in step 3.
          # DEC-COV-001 step 6 (MIGRATION.md entry #216): ratchet 3
          # exception modules — pure exception hierarchies (no logic,
          # no branches) with dedicated tiny test files written FOR
          # 100% coverage. Total: 3 modules added in 1 PR.
          if compgen -G "tests/unit/test_feed_errors.py" > /dev/null; then
            pytest --cov=brutex.feed.errors --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_feed_errors.py
          else
            echo "(brutex.feed.errors test file not present yet — gate inactive)"
          fi
          if compgen -G "tests/unit/test_execution_errors.py" > /dev/null; then
            pytest --cov=brutex.execution.errors --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_execution_errors.py
          else
            echo "(brutex.execution.errors test file not present yet — gate inactive)"
          fi
          if compgen -G "tests/unit/test_strategies_errors.py" > /dev/null; then
            pytest --cov=brutex.strategies.errors --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_strategies_errors.py
          else
            echo "(brutex.strategies.errors test file not present yet — gate inactive)"
          fi
          # DEC-VENDOR-PIVOT-001 (2026-05-26): groww.constants strict-100%
          # gate deleted with the Groww wipe. The legacy step 8 deferral
          # for groww.types is no longer relevant — the Groww adapter is
          # gone. Equivalent Groww constants gate will land in Phase 1.
          # DEC-COV-001 step 9 (entry #219): brutex.indicators.pivots
          # (41 stmts, 4 branches, 18 tests in test_pivots.py).
          # Pure pivot-level math (PP/R1/R2/R3/S1/S2/S3) with the
          # existing dedicated test file already at 100% line+branch
          # — same self-verifying pattern as steps 4/6/7 (existing
          # comprehensive test file, no new test to guess at).
          if compgen -G "tests/unit/test_pivots.py" > /dev/null; then
            pytest --cov=brutex.indicators.pivots --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_pivots.py
          else
            echo "(brutex.indicators.pivots test file not present yet — gate inactive)"
          fi
          # DEC-COV-001 step 10 (entry #220): brutex.indicators.fib_levels
          # (67 stmts, 4 branches, 31 tests in test_fib_levels.py + 1 skip).
          # Pure Fibonacci retracement math on prior-day OHLC anchors —
          # ratios 0.236/0.382/0.500/0.618/0.786 etc. Existing dedicated
          # test file at 100% line+branch — same self-verifying pattern
          # as step 9 (lift an already-passing module into the strict
          # gate, no new test code).
          if compgen -G "tests/unit/test_fib_levels.py" > /dev/null; then
            pytest --cov=brutex.indicators.fib_levels --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_fib_levels.py
          else
            echo "(brutex.indicators.fib_levels test file not present yet — gate inactive)"
          fi
          # DEC-COV-001 step 11 (entry #221): 3-module batch
          # following step 6's triple-add precedent (3 errors modules).
          # All 3 modules already at 100% line+branch in their existing
          # dedicated test files — no new test code written.
          # 11a · brutex.calendars.nse (91 stmts, 18 branches, 50 tests)
          #       NSE market calendar — trading sessions, Diwali muhurat
          if compgen -G "tests/unit/test_calendar_nse.py" > /dev/null; then
            pytest --cov=brutex.calendars.nse --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_calendar_nse.py
          else
            echo "(brutex.calendars.nse test file not present yet — gate inactive)"
          fi
          # 11b · DEC-VENDOR-PIVOT-001: groww.auth strict-100% gate
          #        deleted with the Groww wipe. Groww auth gate lands in
          #        Phase 1.
          # 11c · brutex.options.expiry_calendar (41 stmts, 6 branches, 47 tests)
          #       Weekly + monthly expiry date computation
          if compgen -G "tests/unit/test_expiry_calendar.py" > /dev/null; then
            pytest --cov=brutex.options.expiry_calendar --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_expiry_calendar.py
          else
            echo "(brutex.options.expiry_calendar test file not present yet — gate inactive)"
          fi
          # DEC-COV-001 step 12 (entry #223): 2-module double-add of the
          # remaining 100% candidates from this session's probe sweep.
          # 12a · brutex.options.lot_size_history (26 stmts, 2 branches, 33 tests)
          #       NSE F&O lot-size history table for Track 2 sizing
          if compgen -G "tests/unit/test_lot_size_history.py" > /dev/null; then
            pytest --cov=brutex.options.lot_size_history --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_lot_size_history.py
          else
            echo "(brutex.options.lot_size_history test file not present yet — gate inactive)"
          fi
          # 12b · brutex.options.strike_grid (14 stmts, 0 branches, 24 tests)
          #       ATM-relative strike grid generator
          if compgen -G "tests/unit/test_strike_grid.py" > /dev/null; then
            pytest --cov=brutex.options.strike_grid --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_strike_grid.py
          else
            echo "(brutex.options.strike_grid test file not present yet — gate inactive)"
          fi
          # DEC-COV-001 step 13 (entry #224): 2-module double-add of
          # SUBSTANTIAL modules from the second-pass probe. Both
          # verified at 100% with existing dedicated test files.
          # 13a · brutex.adapters.protocol (54 stmts, 14 branches, 24 tests)
          #       Adapter protocol — Strategy + signature contracts
          if compgen -G "tests/unit/test_adapter_protocol.py" > /dev/null; then
            pytest --cov=brutex.adapters.protocol --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_adapter_protocol.py
          else
            echo "(brutex.adapters.protocol test file not present yet — gate inactive)"
          fi
          # 13b · brutex.data.partition (79 stmts, 24 branches, 32 tests)
          #       Lake partition path computation (year/month/symbol/tf)
          if compgen -G "tests/unit/test_data_partition.py" > /dev/null; then
            pytest --cov=brutex.data.partition --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_data_partition.py
          else
            echo "(brutex.data.partition test file not present yet — gate inactive)"
          fi
          # DEC-COV-001 step 14 (entry #225): 2-module UNDEFERRAL of
          # deferred-list veterans via surgical-test backfill.
          # 14a · brutex.models (94 stmts, 22 branches, 43 tests)
          #       UNDEFERRED from step 3. Was 98.28% (1 line missing —
          #       BruteXError.__str__ safe_message branch). 2 surgical
          #       tests in TestErrorHierarchy close the gap.
          if compgen -G "tests/unit/test_models.py" > /dev/null; then
            pytest --cov=brutex.models --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_models.py
          else
            echo "(brutex.models test file not present yet — gate inactive)"
          fi
          # 14b · brutex.config.ports (117 stmts, 32 branches, 57 tests)
          #       UNDEFERRED from step 5. Was 94.63% (3 lines + 2 branches:
          #       docker detection, loopback IP, non-EADDRINUSE OSError,
          #       no-LAN-IP url path, assert_port_available happy path).
          #       5 surgical tests across TestDetectEnvironment, TestDetectLanIp,
          #       TestPortConfigUrls, TestPortBinding close the gap.
          if compgen -G "tests/unit/test_config_ports.py" > /dev/null; then
            pytest --cov=brutex.config.ports --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_config_ports.py
          else
            echo "(brutex.config.ports test file not present yet — gate inactive)"
          fi
          # DEC-VENDOR-PIVOT-001: groww.types strict-100% gate deleted
          # with the Groww wipe. Groww types gate lands in Phase 1.
          # DEC-COV-001 step 16 (entry #228): 5-module quintuple-add of
          # safe (broker-agnostic) modules verified at 100% locally
          # after installing fno_math wheel.
          # 16a · brutex.execution.types (90 stmts, 16 branches, 16 tests)
          if compgen -G "tests/unit/test_execution_types.py" > /dev/null; then
            pytest --cov=brutex.execution.types --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_execution_types.py
          else
            echo "(brutex.execution.types test file not present yet — gate inactive)"
          fi
          # 16b · brutex.observability.logging (35 stmts, 6 branches, 17 tests)
          if compgen -G "tests/unit/test_observability_logging.py" > /dev/null; then
            pytest --cov=brutex.observability.logging --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_observability_logging.py
          else
            echo "(brutex.observability.logging test file not present yet — gate inactive)"
          fi
          # 16c · brutex.strategies.registry (28 stmts, 4 branches, 15 tests)
          if compgen -G "tests/unit/test_strategies_registry.py" > /dev/null; then
            pytest --cov=brutex.strategies.registry --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_strategies_registry.py
          else
            echo "(brutex.strategies.registry test file not present yet — gate inactive)"
          fi
          # 16d · brutex.strategies.combo (55 stmts, 38 branches, 34 tests)
          if compgen -G "tests/unit/test_strategies_combo.py" > /dev/null; then
            pytest --cov=brutex.strategies.combo --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_strategies_combo.py
          else
            echo "(brutex.strategies.combo test file not present yet — gate inactive)"
          fi
          # 16e · brutex.vocabulary.conflicts (12 stmts, 4 branches, 65 tests)
          if compgen -G "tests/unit/test_vocabulary.py" > /dev/null; then
            pytest --cov=brutex.vocabulary.conflicts --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_vocabulary.py
          else
            echo "(brutex.vocabulary.conflicts test file not present yet — gate inactive)"
          fi
          # DEC-COV-001 step 17 (entry #232): brutex.notifications.telegram
          # — surgical backfill of 27 missing lines + 7 partial branches.
          # 15 new tests across 4 new classes (TestDefaultTransport,
          # TestNotifierLifecycle, TestNotifierPublishFull, TestWorkerLoopAndDrain)
          # exercise the urllib transport's success+error paths, worker
          # start/stop lifecycle, queue.Full + queue.Empty branches, and
          # drain's edge cases. Module: 210 stmts, 38 branches, 34 tests.
          if compgen -G "tests/unit/test_notifications_telegram.py" > /dev/null; then
            pytest --cov=brutex.notifications.telegram --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_notifications_telegram.py
          else
            echo "(brutex.notifications.telegram test file not present yet — gate inactive)"
          fi
          # DEC-TELEGRAM-WIRING-001 (2026-05-25, MIGRATION entry #238):
          # ratchet brutex.notifications.wiring (the Telegram⇄pipeline
          # seam) into the strict per-module 100% gate. 34 unit tests
          # cover the singleton lifecycle, per-kind mapping,
          # graceful-no-op when Telegram is disabled, and Golden Rule
          # #10 exception-swallowing. Closes 2026-05-25 audit row 16.
          #
          # Strict gate re-enabled after the brutex.notifications.__init__
          # revert (commit pending): the package init no longer
          # re-exports wiring helpers, so pytest-cov's pre-import of
          # brutex.notifications.wiring no longer collides with the
          # test file's import via the orchestrator package init chain
          # (which triggered fastbloom_rs PyO3 abi3-py38 double-init).
          # Callers that need wiring helpers import them directly via
          # `from brutex.notifications.wiring import ...`.
          if compgen -G "tests/unit/test_notifications_wiring.py" > /dev/null; then
            pytest --cov=brutex.notifications.wiring --cov-branch --cov-report=term-missing --cov-fail-under=100 tests/unit/test_notifications_wiring.py
          else
            echo "(brutex.notifications.wiring test file not present yet — gate inactive)"
          fi
          # DEC-SLA-DETECTOR-001 (2026-05-25, MIGRATION entry #239):
