# BruteX — Mutation testing (weekly)
#
# Runs two mutation-testing passes:
#
# 1. Python side: `mutmut` over brutex/ — walks the AST, perturbs one
#    literal / comparison / conditional at a time, and runs the unit
#    suite against each mutant. Any mutant that **survives** a full
#    test run means the tests don't actually cover that logic branch.
#
# 2. Rust side: `cargo-mutants` over rust/fno-math/ — same idea in the
#    Rust crate. Mirrors tickvault's mutation.yml semantics.
#
# Threshold: **zero surviving mutants on critical modules**. Failing
# this gate means tests pass but don't detect a behavior change — a
# direct hit on the NFR-REL-006 never-skip guarantee.
#
# Runs on:
#   - weekly schedule (Monday 04:00 UTC)
#   - manual dispatch via workflow_dispatch
#   - push to main (only when brutex/** or rust/fno-math/** touched)

name: Mutation testing

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "brutex/**"
      - "rust/fno-math/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/mutation.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.93.1"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Python mutation — mutmut over the brutex/ package
  # ─────────────────────────────────────────────────────────────────
  python-mutation:
    name: Python mutation (mutmut)
    runs-on: ubuntu-24.04
    # 120 (was 90): the added Deflated-Sharpe module + the two Rust wheel
    # builds (fno_math, trading_core) need headroom over the orchestrator-only
    # baseline (DEC-MUTATION-GATE-RANKING-001).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        # Pin mutmut to the 2.x line: this workflow drives the mutmut 2.x CLI
        # (`mutmut run --paths-to-mutate … --runner … --simple-output` +
        # `mutmut results`), which mutmut 3.x rewrote incompatibly. The prior
        # `pip install -e ".[dev]" mutmut>=2.5` was ALSO a shell-redirect bug
        # (`>=2.5` redirected stdout to a file named `=2.5` and left mutmut
        # unpinned → 3.x resolved, breaking the CLI). Quote + pin <3.0.
        # The `[data,ui]` extras + the two Rust wheels (fno_math, trading_core)
        # mirror ci.yml's test job: `pytest tests/unit` collects the WHOLE unit
        # suite, much of which imports brutex.strategies (→ `import fno_math`)
        # and brutex.vocabulary (→ trading_core), so without them collection
        # fails before a single mutant is checked (DEC-MUTATION-GATE-RANKING-001).
        run: pip install -e ".[dev,data,ui]" "mutmut>=2.5,<3.0"
      - name: Install Rust toolchain (for the PyO3 wheels)
        uses: dtolnay/rust-toolchain@stable
      - name: Install fno_math Rust extension
        run: pip install ./rust/fno-math
      - name: Install trading_core Rust extension
        run: pip install ./rust/trading-core
      - name: Run mutmut on critical modules
        run: |
          set -e
          # Target the modules where silent regressions cause the biggest
          # damage. Two groups:
          #
          # 1. Orchestration / data plumbing (the FSM, retry classifier, audit
          #    chain, rate limiter, store, partition/parser) — broad
          #    `tests/unit` runner.
          # 2. Ranking / metrics MATH (DEC-MUTATION-GATE-RANKING-001): the
          #    Deflated-Sharpe engine. A silent regression in the DSR corrupts
          #    the Stage-3 overfit gate and therefore strategy selection, so it
          #    is now a first-class mutation target alongside the orchestrator.
          #    (compute.py [Sharpe] + ranking [composite] carry their own
          #    hardening tests this PR landed; folding them into the
          #    zero-survivor gate is the tracked next ratchet — they retain a
          #    handful of provably-equivalent mutants, see MIGRATION #590.)
          #
          # Tests on these already hit 100% line coverage; mutmut verifies that
          # the coverage is *meaningful* (the tests detect a behaviour change).
          mutmut run \
            --paths-to-mutate brutex/orchestrator/state.py,brutex/orchestrator/retry.py,brutex/orchestrator/audit.py,brutex/orchestrator/rate_limiter.py,brutex/orchestrator/store.py,brutex/data/partition.py,brutex/data/parser.py,brutex/metrics/deflated_sharpe.py \
            --runner "pytest tests/unit -x -q --no-header" \
            --simple-output
          # Fail if any mutants survived
          mutmut results | tee mutmut-results.txt
          if grep -qE "^[0-9]+" mutmut-results.txt; then
            echo "❌ Surviving mutants detected"
            mutmut show all 2>&1 | head -200
            exit 1
          fi
          echo "✅ No surviving mutants"
      - name: Upload mutmut cache
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-cache
          path: .mutmut-cache
          retention-days: 7
          if-no-files-found: ignore
      - name: Open GitHub issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `mutmut: surviving mutants on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,mutation,python',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Python mutation testing detected surviving mutants on commit ${context.sha}. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['bug', 'mutation', 'python', 'critical'],
            });

  # ─────────────────────────────────────────────────────────────────
  # Rust mutation — cargo-mutants over rust/fno-math/
  # ─────────────────────────────────────────────────────────────────
  rust-mutation:
    name: Rust mutation (cargo-mutants)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: rust/fno-math
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fno-math -> target
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run cargo-mutants
        run: |
          cargo mutants \
            --test-tool cargo \
            --no-shuffle \
            --timeout 300 \
            --output cargo-mutants.out \
            -- \
            --release
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-mutants-report
          path: rust/fno-math/cargo-mutants.out
          retention-days: 14
      - name: Open GitHub issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `cargo-mutants: surviving mutants in fno-math on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,mutation,rust',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `cargo-mutants detected surviving mutants on commit ${context.sha}. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['bug', 'mutation', 'rust', 'critical'],
            });
