# BruteX — Mutation testing (weekly)
#
# Runs two mutation-testing passes:
#
# 1. Python side: `mutmut` over brutex/ — walks the AST, perturbs one
#    literal / comparison / conditional at a time, and runs the unit
#    suite against each mutant. Any mutant that **survives** a full
#    test run means the tests don't actually cover that logic branch.
#
# 2. Rust side: `cargo-mutants` over rust/fno-math/ — same idea in the
#    Rust crate. Mirrors tickvault's mutation.yml semantics.
#
# Threshold: **zero surviving mutants on critical modules**. Failing
# this gate means tests pass but don't detect a behavior change — a
# direct hit on the NFR-REL-006 never-skip guarantee.
#
# Runs on:
#   - weekly schedule (Monday 04:00 UTC)
#   - manual dispatch via workflow_dispatch
#   - push to main (only when brutex/** or rust/fno-math/** touched)

name: Mutation testing

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "brutex/**"
      - "rust/fno-math/**"
      - "rust/trading-core/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/mutation.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.93.1"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Python mutation — mutmut over the brutex/ package
  # ─────────────────────────────────────────────────────────────────
  python-mutation:
    name: Python mutation (mutmut)
    runs-on: ubuntu-24.04
    # 120 (was 90): the added Deflated-Sharpe module + the two Rust wheel
    # builds (fno_math, trading_core) need headroom over the orchestrator-only
    # baseline (DEC-MUTATION-GATE-RANKING-001).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        # Pin mutmut to the 2.x line: this workflow drives the mutmut 2.x CLI
        # (`mutmut run --paths-to-mutate … --runner … --simple-output` +
        # `mutmut results`), which mutmut 3.x rewrote incompatibly. The prior
        # `pip install -e ".[dev]" mutmut>=2.5` was ALSO a shell-redirect bug
        # (`>=2.5` redirected stdout to a file named `=2.5` and left mutmut
        # unpinned → 3.x resolved, breaking the CLI). Quote + pin <3.0.
        # The `[data,ui]` extras + the two Rust wheels (fno_math, trading_core)
        # mirror ci.yml's test job: `pytest tests/unit` collects the WHOLE unit
        # suite, much of which imports brutex.strategies (→ `import fno_math`)
        # and brutex.vocabulary (→ trading_core), so without them collection
        # fails before a single mutant is checked (DEC-MUTATION-GATE-RANKING-001).
        run: pip install -e ".[dev,data,ui]" "mutmut>=2.5,<3.0"
      - name: Install Rust toolchain (for the PyO3 wheels)
        uses: dtolnay/rust-toolchain@stable
      - name: Install fno_math Rust extension
        run: pip install ./rust/fno-math
      - name: Install trading_core Rust extension
        run: pip install ./rust/trading-core
      - name: Run mutmut on critical modules
        run: |
          set -e
          # Target the modules where silent regressions cause the biggest
          # damage. Two groups, run as two sequential mutmut passes (shared
          # cache) — the FAST proven-zero math pass FIRST, so its verdict is
          # always reported even if the broad pass later hits the known
          # pre-existing job-timeout (see the phase-2 comment below):
          #
          # 1. Ranking / metrics MATH (DEC-MUTATION-GATE-RANKING-001 + its
          #    executed follow-up ratchet DEC-MUTATION-GATE-RANKING-002): the
          #    Deflated-Sharpe engine, the composite-ranking functions
          #    (brutex/ranking/__init__.py: gates + z-scores + composite) and
          #    the Stage-3 overfit gate (brutex/ranking/overfit.py). A silent
          #    regression in any of these corrupts strategy selection, so all
          #    three are first-class ZERO-SURVIVOR targets. Verified 0/228
          #    survivors locally (MIGRATION #611). The runner is the focused
          #    pair of dedicated test files — a strict SUBSET of tests/unit,
          #    so focused-zero implies broad-zero, and each mutant dies in
          #    seconds instead of ~1 min (the measured 2026-06-09 main run
          #    processed 123/804 mutants in ~116 min with the broad runner).
          #    Provably-equivalent mutants (annotation-only `X | None` flips,
          #    `cast(...)` type strings, z-score translation invariance) carry
          #    documented `# pragma: no mutate` markers in the modules.
          #    (compute.py [Sharpe] is the remaining ranking-math ratchet —
          #    it retains its own equivalent mutants, see MIGRATION #590.)
          #
          # Tests on these already hit 100% line coverage; mutmut verifies that
          # the coverage is *meaningful* (the tests detect a behaviour change).
          mutmut run \
            --paths-to-mutate brutex/metrics/deflated_sharpe.py,brutex/ranking/__init__.py,brutex/ranking/overfit.py \
            --runner "pytest tests/unit/test_ranking.py tests/unit/test_deflated_sharpe.py -x -q --no-header" \
            --simple-output
          mutmut results | tee mutmut-results-math.txt
          if grep -qE "^[0-9]+" mutmut-results-math.txt; then
            echo "❌ Surviving mutants detected (ranking/DSR math pass)"
            mutmut show all 2>&1 | head -200
            exit 1
          fi
          echo "✅ No surviving mutants (ranking/DSR math pass)"
          # Reset the cache between passes: mutmut caches the BASELINE test
          # time in .mutmut-cache and reuses it ("Using cached time for
          # baseline tests"), so the broad pass below would inherit the
          # focused runner's ~2 s baseline and false-TIMEOUT every mutant of
          # its ~90 s suite. The two passes mutate DISJOINT path sets, so no
          # mutant results are lost — each pass has its own survivors check.
          mv .mutmut-cache .mutmut-cache-math
          # 2. Orchestration / data plumbing (the FSM, retry classifier, audit
          #    chain, rate limiter, store, partition/parser) — broad
          #    `tests/unit` runner, semantics UNCHANGED from the original job.
          #    KNOWN PRE-EXISTING LIMIT (discovered 2026-06-10, MIGRATION
          #    #611 honest envelope): on shared runners this pass advances at
          #    ~1 min/mutant (full-suite runner), so it exceeds the job
          #    timeout before finishing (the 2026-06-09 main run was cancelled
          #    at 123/804 with 26 early survivors). Restructuring it onto
          #    per-module focused runners — after enumerating + killing those
          #    survivors — is the tracked follow-up (proposed
          #    DEC-MUTATION-RUNTIME-001); hiding the timeout by deleting the
          #    pass would silently drop the orchestrator gate (Golden Rule #10).
          mutmut run \
            --paths-to-mutate brutex/orchestrator/state.py,brutex/orchestrator/retry.py,brutex/orchestrator/audit.py,brutex/orchestrator/rate_limiter.py,brutex/orchestrator/store.py,brutex/data/partition.py,brutex/data/parser.py \
            --runner "pytest tests/unit -x -q --no-header" \
            --simple-output
          # Fail if any mutants survived (this pass only — the math pass was
          # checked above before its cache was set aside)
          mutmut results | tee mutmut-results.txt
          if grep -qE "^[0-9]+" mutmut-results.txt; then
            echo "❌ Surviving mutants detected"
            mutmut show all 2>&1 | head -200
            exit 1
          fi
          echo "✅ No surviving mutants"
      - name: Upload mutmut cache
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-cache
          path: |
            .mutmut-cache
            .mutmut-cache-math
          retention-days: 7
          if-no-files-found: ignore
      - name: Open GitHub issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `mutmut: surviving mutants on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,mutation,python',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Python mutation testing detected surviving mutants on commit ${context.sha}. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['bug', 'mutation', 'python', 'critical'],
            });

  # ─────────────────────────────────────────────────────────────────
  # Rust mutation — cargo-mutants over rust/fno-math/
  # ─────────────────────────────────────────────────────────────────
  rust-mutation:
    name: Rust mutation (cargo-mutants)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: rust/fno-math
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fno-math -> target
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run cargo-mutants
        run: |
          cargo mutants \
            --test-tool cargo \
            --no-shuffle \
            --timeout 300 \
            --output cargo-mutants.out \
            -- \
            --release
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-mutants-report
          path: rust/fno-math/cargo-mutants.out
          retention-days: 14
      - name: Open GitHub issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `cargo-mutants: surviving mutants in fno-math on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,mutation,rust',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `cargo-mutants detected surviving mutants on commit ${context.sha}. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['bug', 'mutation', 'rust', 'critical'],
            });

  # ─────────────────────────────────────────────────────────────────
  # Rust mutation — cargo-mutants over rust/trading-core/
  #
  # The SHARED 52-vocab + indicators kernel (DEC-SHARED-CORE-001) — a
  # silent regression here breaks BOTH BruteX (PyO3 wheel) and TickVault
  # (native) at once, so it gets its own mutation gate
  # (DEC-TRADING-CORE-PROPTEST-MUTANTS-001).
  #
  # Scope = `src/evaluator.rs`, the 52-condition DECISION core (the named
  # "critical module" of §12) — driven to ZERO surviving mutants by the
  # proptest + golden + boundary/degenerate suite. This mirrors fno-math's
  # scoped `examine_re` (src/math + src/compat, not the whole crate);
  # bits.rs + the pivots/fib indicators are covered by the 400-case golden
  # answer-key + the property ordering/determinism tests, and extending the
  # mutation gate to their (largely unused, e.g. r4/s4/ext_424) fields is a
  # tracked follow-up (DEC-TRADING-CORE-PROPTEST-MUTANTS-001 honest envelope).
  #
  # NOTE: `--in-place` (NOT the default copy) is required because the
  # golden integration test reads the repo-root oracle at
  # `../../tests/golden/fixtures/vocab_golden_vectors.json`, which lives
  # OUTSIDE the crate dir and so is absent from cargo-mutants' scratch
  # copy. In-place mutates the fresh CI checkout in place (reverted after
  # each mutant), so the fixture resolves. `--in-place` precludes `-j`,
  # hence the generous 120-minute budget.
  # ─────────────────────────────────────────────────────────────────
  rust-mutation-trading-core:
    name: Rust mutation (cargo-mutants, trading-core)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: rust/trading-core
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/trading-core -> target
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run cargo-mutants
        run: |
          cargo mutants \
            --in-place \
            --file src/evaluator.rs \
            --test-tool cargo \
            --no-shuffle \
            --timeout 300 \
            --output cargo-mutants.out \
            -- \
            --release
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-mutants-report-trading-core
          path: rust/trading-core/cargo-mutants.out
          retention-days: 14
      - name: Open GitHub issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `cargo-mutants: surviving mutants in trading-core on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,mutation,rust',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `cargo-mutants detected surviving mutants in trading-core on commit ${context.sha}. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['bug', 'mutation', 'rust', 'critical'],
            });
