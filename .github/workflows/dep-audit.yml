# BruteX — Dependency CVE audit (manifest-touching PRs + every push to main)
#
# Complements security-audit.yml (weekly, main-only, fno-math-only rust job):
# this workflow runs pip-audit + cargo-audit so a dependency CVE is caught at
# review time, and it audits BOTH Rust crates
# (rust/fno-math AND rust/trading-core — the weekly job covers only fno-math).
#
# DEC-CI-SCANNER-DEDUPE-001: the pull_request trigger is `paths:`-filtered to
# the dependency manifests (+ this workflow file) — a docs/engine-only PR no
# longer queues a pip-audit run whose result cannot change. Plain `paths:` is
# safe here precisely because NO job of this workflow is a branch-protection
# required context (see branch-protection-drift.yml `expected_required_checks`)
# — a skipped run never wedges a merge. Every push to main still audits
# unconditionally, so nothing merged escapes the net for long.
#
# Ignore-list policy (documented, auditable — Golden Rule #10):
# every `--ignore-vuln` below MUST carry an inline comment naming the
# advisory, why it is unfixable today, and the condition for removal.

name: Dependency audit

on:
  push:
    branches:
      - main
  pull_request:
    # Dependency manifests only (DEC-CI-SCANNER-DEDUPE-001) — the audited
    # surface. pyproject.toml governs the pip-install resolution the
    # python-pip-audit job scans; uv.lock is the committed Python lock;
    # the Cargo manifests/locks govern the cargo-audit jobs; and the
    # workflow file itself so edits here always run once at review time.
    paths:
      - pyproject.toml
      - uv.lock
      - rust/**/Cargo.toml
      - rust/**/Cargo.lock
      - .github/workflows/dep-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dep-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.93.1"

jobs:
  python-pip-audit:
    name: Python pip-audit (all extras)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project (all extras) + pip-audit
        run: |
          pip install -e ".[data,ui,optimize,groww,token-broker,dev]" "pip-audit>=2.7"
      - name: pip-audit
        # Audits the fully-resolved installed environment (base + every
        # optional extra), so transitive deps are covered too. NOTE:
        # --strict is deliberately NOT used — it escalates the intentional
        # --skip-editable skip of the local `brutex` dist into an error
        # (verified locally: "brutex: distribution marked as editable",
        # exit 1). Vulnerability findings still fail the job (exit 1).
        #
        # Documented ignores:
        # - PYSEC-2026-597 (CVE-2026-12243): nltk<=3.9.4 percent-encoded
        #   path traversal. nltk is a TRANSITIVE dep of the dev-only
        #   `safety` scanner (safety -> nltk>=3.9), never imported by
        #   brutex runtime code, and NO fixed nltk release exists as of
        #   2026-07-06 (advisory lists no fix version). Remove this ignore
        #   as soon as a patched nltk ships.
        run: |
          pip-audit --skip-editable \
            --ignore-vuln PYSEC-2026-597

  rust-cargo-audit:
    name: Rust cargo-audit (${{ matrix.crate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rust/fno-math
          - rust/trading-core
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        # --deny warnings promotes informational advisories (unsound /
        # unmaintained) to failures; --deny yanked catches yanked crates.
        run: cargo audit --deny warnings --deny yanked
