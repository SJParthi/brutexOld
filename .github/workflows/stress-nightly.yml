# BruteX — Stress / sustained-load tests (nightly)
#
# DEC-STRESS-001 (MIGRATION.md entry #208) — closes the
# `tests/stress/` ROADMAP gap from STANDARDS_100PCT.md §1 row 11.
#
# Per CLAUDE.md §2 Rule #12 ("100% standards"), one of the 7 test
# types is STRESS. This workflow runs the stress suite on a nightly
# schedule (not on every push — they'd blow the per-PR budget).
#
# Schedule
# --------
# * Nightly cron: 03:00 UTC ≈ 08:30 IST.
# * Manual ``workflow_dispatch`` for on-demand 24h soak (set
#   ``STRESS_EVENTS=10_000_000`` via input).
# * Push-trigger only when stress test code itself changes —
#   to avoid blocking unrelated PRs on a slow gate.
#
# Honest envelope (Golden Rule #10)
# ----------------------------------
# The CI nightly is "light stress" (~30s, 5K events default). The
# real 24h soak target named in CLAUDE.md §2 Rule #12 is REACHABLE
# via ``workflow_dispatch`` with ``stress_events`` set to a large
# value — but NOT run automatically because it would burn GHA hours.
# This is the same pattern dep-freshness-nightly.yml + redteam-
# nightly.yml use.

name: Stress / sustained-load tests (nightly)

on:
  schedule:
    - cron: "0 3 * * *"  # daily 03:00 UTC (~08:30 IST)
  workflow_dispatch:
    inputs:
      stress_events:
        description: "Number of stress events per test (default 5000; soak: 10_000_000)"
        required: false
        default: "5000"
  push:
    paths:
      - "tests/stress/**"
      - ".github/workflows/stress-nightly.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Cargo network resilience (CI-only flake hardening) — see ci.yml for the
  # rationale. crates.io downloads flake intermittently; CARGO_NET_RETRY
  # makes cargo retry each failed download up to 10x, GIT_FETCH_WITH_CLI
  # uses the system git for git-source fetches. Pure download-retry — changes
  # nothing about what is built or run.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  stress:
    name: Stress tests (audit chain + hot paths)
    runs-on: ubuntu-24.04
    # Nightly default ~5 min; manual soak gets the full 60 min budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev,data]"

      - name: Install Rust toolchain (for fno_math wheel)
        # `brutex.orchestrator.__init__` transitively imports
        # `brutex.orchestrator.bloom`, which depends on the Rust-backed
        # `fno_math` extension. Match the main CI test job's pattern
        # (DEC-P0-050, ci.yml test job): install Rust stable first,
        # then pip-install the maturin-built extension.
        uses: dtolnay/rust-toolchain@stable

      - name: Install fno_math Rust extension
        # Belt-and-suspenders crates.io flake guard (on top of the
        # workflow-level CARGO_NET_RETRY=10): retry the wheel build up to 3
        # times. POSIX sh; installs the same wheel.
        run: |
          n=0
          until pip install ./rust/fno-math; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install ./rust/fno-math failed after 3 attempts" >&2
              exit 1
            fi
            echo "pip install ./rust/fno-math failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Install trading_core Rust extension (DEC-SHARED-CORE-001 #441)
        # The engine package (`brutex.engine.__init__` → `brutex.vocabulary`)
        # imports the Rust-backed `trading_core` extension, so any stress test
        # that touches the engine (e.g. tests/stress/test_sweep_scheduler_resume_stress.py,
        # DEC-SWEEP-SCHEDULER-001 #487) errors at COLLECTION with
        # `ModuleNotFoundError: No module named 'trading_core'` and aborts the
        # whole stress run. Main CI's test job installs BOTH wheels (ci.yml:160-166);
        # this nightly job installed only fno-math — the gap that made the stress
        # suite red. Mirror the main CI pattern so the engine stress tests collect.
        # Belt-and-suspenders crates.io flake guard (see fno-math step).
        run: |
          n=0
          until pip install ./rust/trading-core; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install ./rust/trading-core failed after 3 attempts" >&2
              exit 1
            fi
            echo "pip install ./rust/trading-core failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Run stress suite
        env:
          STRESS_EVENTS: ${{ github.event.inputs.stress_events || '5000' }}
        run: |
          echo "Stress run with STRESS_EVENTS=$STRESS_EVENTS"
          pytest tests/stress -v -m stress --tb=short

      - name: Upload stress artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-logs
          path: |
            /tmp/pytest-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Open issue on failure
        # A silent nightly stress failure hides an audit-chain/hot-path
        # regression. Mirror safety.yml's proven alert step (COMMON, Golden
        # Rule #11): dedup-by-title (per-sha) then open a labelled issue.
        # `failure()` fires on ANY earlier step failing (incl. the stress gate);
        # scheduled runs only (an operator-watched dispatch/push needs no issue).
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `stress-nightly: failure on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,stress',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Stress nightly failed on ${context.sha}. See [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['bug', 'stress', 'critical'],
            });
