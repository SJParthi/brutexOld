# BruteX — Stress / sustained-load tests (nightly)
#
# DEC-STRESS-001 (MIGRATION.md entry #208) — closes the
# `tests/stress/` ROADMAP gap from STANDARDS_100PCT.md §1 row 11.
#
# Per CLAUDE.md §2 Rule #12 ("100% standards"), one of the 7 test
# types is STRESS. This workflow runs the stress suite on a nightly
# schedule (not on every push — they'd blow the per-PR budget).
#
# WHAT THIS JOB IS (honest reclassification — DEC-SOAK-REAL-TIER-001, MIGRATION.md #1512)
# --------------------------------------------------------------------------------------
# This GitHub-hosted ubuntu-24.04 job is a **~5-minute REGRESSION GATE**, NOT a
# soak: it proves the stress suite's invariants (audit-chain drift, per-event
# memory-leak floor at ≥100K events, hot-path determinism, the short soak driver)
# under a light load in a bounded nightly window. It is deliberately capped at
# 60 minutes.
#
# The REAL multi-hour soak lives in ``.github/workflows/soak-selfhosted.yml`` on
# the self-hosted M4-Pro, with a job timeout DERIVED from the requested duration.
# The prior claim that a 10M-event ``STRESS_EVENTS`` dispatch here was a
# "REACHABLE 24h soak" was FALSE (Golden Rule #10): a 10M run of
# test_audit_chain_sustained alone linearly extrapolates to ~16.7 h and this
# job's own 60-minute timeout hard-kills it at ~1/17th done (the honest #208
# rewrite documents the trap). This job can no longer be handed an
# un-completable event count — the guard step below REFUSES ``STRESS_EVENTS``
# above a completable ceiling and points at soak-selfhosted.yml.
#
# Schedule
# --------
# * Nightly cron: 03:00 UTC ≈ 08:30 IST.
# * Manual ``workflow_dispatch`` to scale the regression event count within the
#   completable ceiling (NOT a soak lever — use soak-selfhosted.yml for that).
# * Push-trigger only when stress test code itself changes.
#
# Same nightly-plus-manual pattern dep-freshness-nightly.yml + redteam-nightly.yml use.

name: Stress / sustained-load tests (nightly)

on:
  schedule:
    - cron: "0 3 * * *"  # daily 03:00 UTC (~08:30 IST)
  workflow_dispatch:
    inputs:
      stress_events:
        description: "Stress events per test (default 5000; MAX 200000 — larger soaks: use soak-selfhosted.yml)"
        required: false
        default: "5000"
  push:
    paths:
      - "tests/stress/**"
      - ".github/workflows/stress-nightly.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Cargo network resilience (CI-only flake hardening) — see ci.yml for the
  # rationale. crates.io downloads flake intermittently; CARGO_NET_RETRY
  # makes cargo retry each failed download up to 10x, GIT_FETCH_WITH_CLI
  # uses the system git for git-source fetches. Pure download-retry — changes
  # nothing about what is built or run.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  stress:
    name: Stress tests (audit chain + hot paths)
    runs-on: ubuntu-24.04
    # ~5-minute regression gate; hard-capped at 60 min. This is NOT a soak
    # budget — a real multi-hour soak runs on soak-selfhosted.yml with a
    # duration-derived timeout (DEC-SOAK-REAL-TIER-001).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev,data]"

      - name: Install Rust toolchain (for fno_math wheel)
        # `brutex.orchestrator.__init__` transitively imports
        # `brutex.orchestrator.bloom`, which depends on the Rust-backed
        # `fno_math` extension. Match the main CI test job's pattern
        # (DEC-P0-050, ci.yml test job): install Rust stable first,
        # then pip-install the maturin-built extension.
        uses: dtolnay/rust-toolchain@stable

      - name: Install fno_math Rust extension
        # Belt-and-suspenders crates.io flake guard (on top of the
        # workflow-level CARGO_NET_RETRY=10): retry the wheel build up to 3
        # times. POSIX sh; installs the same wheel.
        run: |
          n=0
          until pip install ./rust/fno-math; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install ./rust/fno-math failed after 3 attempts" >&2
              exit 1
            fi
            echo "pip install ./rust/fno-math failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Install trading_core Rust extension (DEC-SHARED-CORE-001 #441)
        # The engine package (`brutex.engine.__init__` → `brutex.vocabulary`)
        # imports the Rust-backed `trading_core` extension, so any stress test
        # that touches the engine (e.g. tests/stress/test_sweep_scheduler_resume_stress.py,
        # DEC-SWEEP-SCHEDULER-001 #487) errors at COLLECTION with
        # `ModuleNotFoundError: No module named 'trading_core'` and aborts the
        # whole stress run. Main CI's test job installs BOTH wheels (ci.yml:160-166);
        # this nightly job installed only fno-math — the gap that made the stress
        # suite red. Mirror the main CI pattern so the engine stress tests collect.
        # Belt-and-suspenders crates.io flake guard (see fno-math step).
        run: |
          n=0
          until pip install ./rust/trading-core; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install ./rust/trading-core failed after 3 attempts" >&2
              exit 1
            fi
            echo "pip install ./rust/trading-core failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Guard — refuse an un-completable event count (DEC-SOAK-REAL-TIER-001)
        # The ubuntu tier physically cannot finish a soak-scale event count under
        # its 60-min timeout (a 10M run ≈ 16.7 h → self-kills at ~1/17th). REFUSE
        # anything above the completable ceiling here and point at the real soak
        # tier, so the #208 "REACHABLE soak" trap can never be re-launched on the
        # tier that cannot complete it. 200000 stays comfortably inside 60 min.
        env:
          STRESS_EVENTS: ${{ github.event.inputs.stress_events || '5000' }}
        run: |
          max=200000
          # STRICT numeric validation BEFORE the comparison. `[ -gt ]` cannot
          # parse an underscore-grouped integer (the documented canonical soak
          # value `10_000_000`), so the old `2>/dev/null`-suppressed comparison
          # silently fell through to "passed" and let a 10M run launch on the
          # tier that cannot finish it. Strip underscores (Python's int() accepts
          # them, so the test would too), then REFUSE any non-numeric input
          # outright rather than error-suppressing it (DEC-SOAK-REAL-TIER-001).
          ev=${STRESS_EVENTS//_/}
          case "$ev" in
            ''|*[!0-9]*)
              echo "::error::STRESS_EVENTS='$STRESS_EVENTS' is not a non-negative integer." >&2
              echo "::error::Provide a plain integer event count (max $max); larger soaks: use soak-selfhosted.yml." >&2
              exit 1
              ;;
          esac
          # Magnitude fence BEFORE the `[ -gt ]` comparison (SEC7-1): the test
          # builtin is int64 — a digits-only value ABOVE int64 makes it ERROR
          # ("integer expression expected"), and inside an `if` condition that
          # error evaluates FALSE, silently falling through to launch the
          # un-completable run. Any value with more digits than $max already
          # exceeds it, so refuse on LENGTH without ever parsing the number.
          if [ "${#ev}" -gt "${#max}" ]; then
            echo "::error::STRESS_EVENTS=$STRESS_EVENTS exceeds the ubuntu-tier ceiling ($max)." >&2
            echo "::error::This job's 60-min timeout cannot complete a soak-scale run." >&2
            echo "::error::Run a real multi-hour soak via .github/workflows/soak-selfhosted.yml (soak_minutes input)." >&2
            exit 1
          fi
          if [ "$ev" -gt "$max" ]; then
            echo "::error::STRESS_EVENTS=$STRESS_EVENTS exceeds the ubuntu-tier ceiling ($max)." >&2
            echo "::error::This job's 60-min timeout cannot complete a soak-scale run." >&2
            echo "::error::Run a real multi-hour soak via .github/workflows/soak-selfhosted.yml (soak_minutes input)." >&2
            exit 1
          fi
          echo "STRESS_EVENTS=$STRESS_EVENTS is within the completable ceiling ($max)."

      - name: Run stress suite
        env:
          STRESS_EVENTS: ${{ github.event.inputs.stress_events || '5000' }}
        run: |
          echo "Stress run with STRESS_EVENTS=$STRESS_EVENTS"
          pytest tests/stress -v -m stress --tb=short

      - name: Upload stress artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-logs
          path: |
            /tmp/pytest-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Open issue on failure
        # A silent nightly stress failure hides an audit-chain/hot-path
        # regression. Mirror safety.yml's proven alert step (COMMON, Golden
        # Rule #11): dedup-by-title (per-sha) then open a labelled issue.
        # `failure()` fires on ANY earlier step failing (incl. the fence guard or
        # the stress gate). Fires on a scheduled run AND a manual dispatch (a
        # dispatched mini-run's failure — e.g. the fence refusing an oversized
        # event count — must not be eyeball-only, DEC-SOAK-REAL-TIER-001 G5); a
        # push is an operator-watched dev event and still needs no issue.
        # `|| cancelled()` (SOAK-R7-2 / SEC7-3): a job killed by its own
        # job-level `timeout-minutes: 60` reports CANCELLED, not FAILED, so a
        # bare `failure()` step SKIPS and a hung/deadlocked nightly stress run
        # would die silently — the exact DEC-MUTATION-ALERT-CANCELLED-001
        # pathology, mirrored from soak-selfhosted.yml's AL-SOAK-1 fix.
        if: (failure() || cancelled()) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v9
        with:
          script: |
            const title = `stress-nightly: failure on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,stress',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Stress nightly failed on ${context.sha}. See [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['bug', 'stress', 'critical'],
            });
