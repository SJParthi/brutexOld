name: release

# Auto-release workflow powered by Release Please.
#
# Reads conventional commit messages on `main`, decides the next semver
# bump, creates a Release-PR with version + CHANGELOG updates, and
# (once that PR is merged) creates the git tag + GitHub Release.
#
# Operator decision 2026-05-16: "Everything should be entirely automated.
# I can't monitor this. The process needs to be fully automated."
#
# Release automation chain: Release Please opens release PRs based on
# Conventional Commits; auto-merge.yml lands them once CI is green.

on:
  push:
    branches:
      - main

permissions:
  contents: write       # needed to push tags + create releases
  pull-requests: write  # needed to open the Release-PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          release-type: python
          # Pull the package name and version source from pyproject.toml
          package-name: brutex
          # Conventional commit prefixes that trigger version bumps:
          # - `feat:`   → MINOR bump
          # - `fix:`    → PATCH bump
          # - `feat!:`  → MAJOR bump (breaking)
          # - `day1:`   → treated as `feat:` (sprint commits)
          # - `docs:` / `chore:` / `test:` → no bump (still appear in changelog)
          changelog-types: |
            [
              {"type": "feat",     "section": "Features", "hidden": false},
              {"type": "fix",      "section": "Bug Fixes", "hidden": false},
              {"type": "perf",     "section": "Performance", "hidden": false},
              {"type": "day1",     "section": "Day 1 Sprint", "hidden": false},
              {"type": "docs",     "section": "Documentation", "hidden": false},
              {"type": "refactor", "section": "Refactoring", "hidden": true},
              {"type": "test",     "section": "Tests", "hidden": true},
              {"type": "chore",    "section": "Chores", "hidden": true}
            ]
          # CHANGELOG path
          changelog-path: CHANGELOG.md

  # Future: add Telegram notification step when the release PR is merged
  # and a new tag is created. Will hook into brutex/notifications/telegram.py
  # once that module ships (Day 7+).
