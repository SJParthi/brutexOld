# notify-rust-parity.yml — the brutex-notify crate build + flag-ON parity lane.
#
# DEC-NOTIFY-RUST-CORE-001 (MIGRATION.md #1957). The notification pure-law
# seams are DEFAULT-OFF behind BRUTEX_NOTIFY_RUST and the main CI test job
# deliberately never installs the crate (the facade degrades loudly to the
# Python oracle when it is absent), so this dedicated lane is where the
# crate has teeth (the lake-rust-parity.yml template):
#
#   1. cargo fmt / clippy -D warnings / test --release (the pure-law edge
#      matrix + the naive-reference proptest differential + the
#      source-digest twin parity) + the python-feature compile check.
#   2. maturin wheel build + install beside the repo's Python deps.
#   3. The REAL-wheel differential + FFI pins + the flag-ON byte-identity
#      A/B through the real SweepAlerter builders
#      (tests/unit/test_notify_rust.py — the wheel-gated classes engage
#      once the wheel is installed), plus the notifications family suites
#      re-run VERBATIM under BRUTEX_NOTIFY_RUST=1 (any test failing ONLY
#      under the flag is a perturbation finding — fix-or-refuse, never a
#      test edit).
#
# NOT a required gate (the lake-lane precedent): it gates the FUTURE
# default-ON flip, not every PR — a red run here blocks re-engaging the
# flag, never an unrelated merge. The future default-ON flip DEC must cite
# a fresh green run of this lane as a stated precondition.
#
# COST HONESTY: the crate is dependency-light (pyo3 + build blake3 +
# dev proptest) — a cold run compiles in minutes, not the lake lane's
# polars graph; the cargo cache makes warm runs cheap.

name: notify-rust-parity

on:
  push:
    branches:
      - main
      - "claude/**"
      - "feat/**"
      - "fix/**"
    paths:
      - "rust/brutex-notify/**"
      - "brutex/notifications/notify_rust.py"
      - "brutex/notifications/sweep_alerts.py"
      - "brutex/notifications/telegram.py"
      - "tests/unit/test_notify_rust.py"
      - ".github/workflows/notify-rust-parity.yml"
  pull_request:
    paths:
      - "rust/brutex-notify/**"
      - "brutex/notifications/notify_rust.py"
      - "brutex/notifications/sweep_alerts.py"
      - "brutex/notifications/telegram.py"
      - "tests/unit/test_notify_rust.py"
      - ".github/workflows/notify-rust-parity.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # The crate is stdlib-law-only — ci.yml's RUST_VERSION floor applies
  # (rust-version = "1.93.1" in the crate manifest, the sibling pin).
  NOTIFY_RUST_VERSION: "1.93.1"
  # Cargo network resilience — the ci.yml convention.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PYTHONHASHSEED: "0"
  HYPOTHESIS_PROFILE: "ci"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  notify-rust-parity:
    name: brutex-notify build + flag-ON parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.NOTIFY_RUST_VERSION }}
          components: rustfmt,clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/brutex-notify -> target

      - name: cargo fmt --check
        working-directory: rust/brutex-notify
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        working-directory: rust/brutex-notify
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --release (edge matrix + proptest differential + digest parity)
        working-directory: rust/brutex-notify
        run: cargo test --release

      - name: cargo check --features python (PyO3 binding compiles)
        working-directory: rust/brutex-notify
        run: cargo check --features python

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install brutex (dev extra) + the kernel wheels + brutex-notify
        # The mirror-pin test imports brutex.engine.sweep_lookahead, whose
        # package __init__ needs the fno_math/trading_core wheels — install
        # them like ci.yml's test job does (3-attempt retry loop, POSIX sh).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data,ui]"
          pip install maturin
          for crate in ./rust/fno-math ./rust/trading-core ./rust/brutex-notify; do
            n=0
            until pip install "$crate"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "pip install $crate failed after 3 attempts" >&2
                exit 1
              fi
              echo "pip install $crate failed (attempt $n) — retrying in 10s" >&2
              sleep 10
            done
          done

      - name: Facade suite (wheel INSTALLED — real-wheel classes engage) at 100%
        run: |
          pytest -rs -q \
            --cov=brutex.notifications.notify_rust --cov-branch \
            --cov-report=term-missing --cov-fail-under=100 \
            tests/unit/test_notify_rust.py

      - name: Notifications family suites with the Rust seam ENGAGED (flag-ON twin)
        # The non-perturbation leg: the full notifications suites run
        # VERBATIM (zero test-line edits) with the seam armed + the REAL
        # wheel installed. Honesty: this proves NON-PERTURBATION (a fully
        # degrading crate ≡ flag-OFF is itself a pass for that property);
        # crate-genuinely-engaged teeth live in tests/unit/test_notify_rust.py
        # — the wheel-free TestDefinitionSiteEngagement per-site
        # burn-in-budget/engaged-INFO spies (round 1: an un-wired definition
        # site fails there) + the wheel-gated differential classes + the A/B
        # class, whose ON arm asserts engagement, never byte-identity alone.
        env:
          BRUTEX_NOTIFY_RUST: "1"
        run: |
          pytest -q \
            tests/unit/test_notifications_telegram.py \
            tests/unit/test_telegram_lifecycle_dedupe.py \
            tests/unit/test_telegram_config_hygiene.py \
            tests/unit/test_notifications_wiring.py \
            tests/unit/test_notifications_sweep_alerts.py \
            tests/unit/test_notifications_sweep_alerts_conflict.py \
            tests/unit/test_notifications_sweep_alerts_runcore.py \
            tests/unit/test_notifications_sweep_alerts_greeks_backfill.py \
            tests/unit/test_notifications_sweep_alerts_backup.py \
            tests/unit/test_sweep_alerts_nightly.py \
            tests/unit/test_notifications_sweep_alerts_crossverify.py \
            tests/unit/test_markdownv2_escape_alert_bodies.py \
            tests/integration/test_telegram_wire_format.py \
            tests/integration/test_telegram_sweep_alerts_wire.py
