name: Branch protection drift detector

# Per DEC-P0-005 P1 follow-up #4: daily cron that verifies `main` branch
# protection rules still match the checked-in expected snapshot. Drift
# detection: if someone (operator or attacker with admin token) silently
# disables "Do not allow bypassing" or removes a required check, this
# workflow catches it within 24h + opens an issue.
#
# Z+ L3 RECONCILE layer for the GitHub-server-side enforcement we
# document in docs/runbooks/github-branch-protection-setup.md.

on:
  schedule:
    # 03:30 UTC daily = 09:00 IST (morning standup time for operator).
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you manually running drift detection?"
        required: false
        default: "manual verification"

permissions:
  contents: read
  issues: write  # to file drift-alert issues

jobs:
  drift-check:
    name: Verify main branch protection matches snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Fetch live branch protection rule for main
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Note: this query requires `read:repo` scope. The default
          # GITHUB_TOKEN has it. If the branch protection rule does NOT
          # exist (operator hasn't applied the runbook yet), gh exits
          # 404 — we treat that as drift "rule missing entirely".
          if ! gh api "repos/${{ github.repository }}/branches/main/protection" \
                > live-protection.json 2>fetch.err; then
            echo "::warning::Branch protection rule for main does NOT exist."
            echo "::warning::Per docs/runbooks/github-branch-protection-setup.md,"
            echo "::warning::the operator must apply the rule (one-time UI setup)."
            echo "RULE_MISSING=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "RULE_MISSING=false" >> "$GITHUB_OUTPUT"
          echo "::group::Live protection rule"
          jq '.' live-protection.json
          echo "::endgroup::"

      - name: Compare live rule against expected snapshot
        if: steps.fetch.outputs.RULE_MISSING == 'false'
        id: drift
        run: |
          # Extract the fields we care about + compare to expected.
          python3 - <<'PY'
          import json
          import sys

          live = json.load(open("live-protection.json"))

          # ── Expected snapshot (per docs/runbooks/github-branch-protection-setup.md) ──
          # Required: every gate in ci.yml's ci-ok needs: list.
          expected_required_checks = {
              "Lint (ruff)",
              "Type check (mypy + pyright)",
              "Unit tests + coverage (100% gate)",
              "Property tests (hypothesis)",
              "Benchmarks (O(1) NFR gates)",
              "Golden-master tests",
              "Security scan (bandit + pip-audit)",
              "Docstring coverage (interrogate)",
              "License compliance",
              "Rust (fno-math build + clippy + test)",
              "make run smoke (cold-start boot)",
              "Banned pattern scan",
              "Secret scan (gitleaks)",
              "CodeQL (Python SAST)",
              "Semgrep (python + owasp + security-audit)",
              "Trivy (filesystem + config scan)",
              "CycloneDX SBOM generation",
              "Vulture (dead code detection)",
              "jscpd (code duplication)",
              "Python mutation (mutmut on critical modules)",
              "Proof bundle (aggregate CI artifacts)",
              "CI OK (aggregate gate)",
          }

          drift = []

          # ── Required status checks ──
          live_checks = set()
          for ctx in live.get("required_status_checks", {}).get("contexts", []) or []:
              live_checks.add(ctx)
          missing = expected_required_checks - live_checks
          unexpected = live_checks - expected_required_checks
          if missing:
              drift.append(f"MISSING required status checks: {sorted(missing)}")
          if unexpected:
              drift.append(f"UNEXPECTED required status checks: {sorted(unexpected)}")

          # ── "Do not allow bypassing" — the killshot ──
          enforce_admins = live.get("enforce_admins", {}).get("enabled", False)
          if not enforce_admins:
              drift.append(
                  "CRITICAL: enforce_admins=false (admins can bypass branch protection). "
                  "Per docs/runbooks/github-branch-protection-setup.md §5, this MUST be on."
              )

          # ── Linear history ──
          require_linear = live.get("required_linear_history", {}).get("enabled", False)
          if not require_linear:
              drift.append("MISSING: required_linear_history=false (squash/rebase policy enforcement)")

          # ── PR review required ──
          prr = live.get("required_pull_request_reviews")
          if prr is None:
              drift.append("MISSING: required_pull_request_reviews (PRs not required)")

          # ── Strict status checks (branch up-to-date) ──
          strict = live.get("required_status_checks", {}).get("strict", False)
          if not strict:
              drift.append("MISSING: required_status_checks.strict=false (branch can be stale at merge)")

          # ── Conversation resolution ──
          conv = live.get("required_conversation_resolution", {}).get("enabled", False)
          if not conv:
              drift.append("MISSING: required_conversation_resolution=false")

          if drift:
              print("::error::Branch protection drift detected!")
              for d in drift:
                  print(f"::error::  - {d}")
              with open("drift-summary.txt", "w") as f:
                  f.write("Branch protection drift detected for main:\n\n")
                  for d in drift:
                      f.write(f"  - {d}\n")
              sys.exit(1)
          print("✅ Branch protection rule matches expected snapshot. No drift.")
          PY

      - name: Open drift-alert issue
        if: failure() && steps.drift.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Build the body in a file via printf (NOT a column-0 heredoc — a
          # heredoc body at column 0 inside a `run: |` block scalar is
          # spec-invalid YAML and startup-fails the whole run, which is why
          # this detector showed permanently red; DEC-DRIFT-YAML-FIX-001).
          summary="$(cat drift-summary.txt)"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Don't open dupes — check if an open drift-alert already exists.
          existing=$(gh issue list \
            --repo "$REPO" \
            --label "branch-protection-drift" \
            --state open \
            --json number \
            --limit 1 | jq -r '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            {
              printf '**Drift re-detected on %s**\n\n' "$ts"
              printf '```\n%s\n```\n\n' "$summary"
              printf 'Per DEC-P0-005 P1 follow-up: see `docs/runbooks/github-branch-protection-setup.md`.\n'
            } > drift-body.md
            echo "Existing drift-alert issue #$existing already open; adding comment."
            gh issue comment "$existing" --repo "$REPO" --body-file drift-body.md
          else
            {
              printf '## Drift detected\n\n'
              printf 'The branch protection rule on `main` no longer matches the expected\n'
              printf 'snapshot in `docs/runbooks/github-branch-protection-setup.md`.\n\n'
              printf '### Details\n\n'
              printf '```\n%s\n```\n\n' "$summary"
              printf '### Why this matters\n\n'
              printf 'Per DEC-P0-005 + the Z+ L4 PREVENT layer: server-side branch protection\n'
              printf 'is the ONLY mechanical lock preventing merges with red CI. If this rule\n'
              printf 'drifts (e.g., admin bypass re-enabled, required checks removed), Claude\n'
              printf 'or any contributor could silently merge red CI again — the exact\n'
              printf 'violation PR #25 caused.\n\n'
              printf '### Action required\n\n'
              printf '1. Read `docs/runbooks/github-branch-protection-setup.md`\n'
              printf '2. Re-apply the missing settings via GitHub Settings → Branches\n'
              printf '3. Document the drift cause in a follow-up DEC entry in MIGRATION.md\n'
              printf '4. Close this issue once verified\n\n'
              printf '### Audit trail\n\n'
              printf -- '- Detected by: `.github/workflows/branch-protection-drift.yml`\n'
              printf -- '- Run: %s/%s/actions/runs/%s\n' "$SERVER_URL" "$REPO" "$RUN_ID"
              printf -- '- Timestamp: %s\n' "$ts"
            } > drift-body.md
            gh issue create \
              --repo "$REPO" \
              --title "🚨 Branch protection drift detected on main ($(date -u +%Y-%m-%d))" \
              --label "branch-protection-drift" \
              --body-file drift-body.md
          fi
