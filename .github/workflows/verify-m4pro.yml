# verify-m4pro.yml — Full workspace verification on the M4 Pro (macOS) runner.
#
# WHY (DEC-M4PRO-VERIFY-001)
# -------------------------
# The shared GitHub CI (ci.yml) runs on ubuntu-24.04. The operator DEVELOPS +
# RUNS on an Apple-Silicon Mac (CLAUDE.md §8). This workflow runs the FULL
# functional verification — bootstrap + the entire pytest suite + mypy/pyright +
# brutex doctor + both Rust kernels — on the REGISTERED self-hosted M4 Pro
# runner (`Parthibans-MacBook-Pro`, labels [self-hosted, macos, m4pro]), so the
# "entire workspace works" guarantee is proven on the ACTUAL production
# hardware + OS, not just on the ubuntu shared runner. It catches any
# macOS/arm64-specific breakage the shared CI cannot.
#
# RELATIONSHIP TO bench-m4pro.yml
# -------------------------------
# `bench-m4pro.yml` runs the PERFORMANCE gates (50 M/s floor, strict 1.1×/3.0×
# O(1) tier, 33B SLA). THIS workflow runs the FUNCTIONAL verification (does the
# whole workspace build + pass on macOS). Same runner, complementary purpose.
#
# TRIGGERS (no `pull_request` — DEC-M4PRO-PR-TRIGGER-001)
# ------------------------------------------------------
# Like bench-m4pro.yml, this has NO pull_request trigger: a self-hosted runner
# that is offline (the operator's Mac asleep) would otherwise hang every PR's
# mergeable state. It runs on a daily cron + manual dispatch — where a
# perpetually-queued run is harmless. The shared ci.yml is the per-PR gate.
#
# Decision: DEC-M4PRO-VERIFY-001.

name: verify-m4pro

on:
  workflow_dispatch:
  schedule:
    # Daily 12:00 UTC = 17:30 IST (post-market, after bench-m4pro's 11:00 run).
    - cron: "0 12 * * *"

concurrency:
  group: verify-m4pro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

# Cargo network resilience (CI-only flake hardening) — see ci.yml for the
# rationale. crates.io downloads flake intermittently; CARGO_NET_RETRY makes
# cargo retry each failed download up to 10x, GIT_FETCH_WITH_CLI uses the
# system git for git-source fetches. Pure download-retry behaviour — changes
# nothing about what is built or run. Workflow-level so the bootstrap step's
# maturin-develop builds inherit it.
env:
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  m4pro-full-verification:
    # Gated to the self-hosted M4 Pro runner. If no runner with this label set
    # is online the job sits "queued" indefinitely — harmless (no PR to block).
    runs-on: [self-hosted, macos, m4pro]
    # 150 min: run 29190052122 was wall-clock CANCELLED at ~44 min with the
    # full suite at 97% (the old 45-min cap), so the -rA summary never printed.
    # Generous headroom is the house norm on this dedicated runner (it also
    # hosts multi-hour soaks via soak-selfhosted.yml's duration-derived cap;
    # this job's duration is fixed, so a plain value suffices).
    timeout-minutes: 150

    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      # DEC-TEST-APPARATUS-DEBTS-001(b): deterministic hypothesis — loads the
      # `ci` profile registered in tests/conftest.py (derandomize=True), so a
      # property failure here reproduces on every re-run. The scheduled
      # stress-nightly arm deliberately does NOT set this — the conftest then
      # loads the random default, overriding hypothesis's built-in auto-CI
      # derandomization (deliberate exploration off the PR path).
      HYPOTHESIS_PROFILE: "ci"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show runner identity (real hardware proof)
        run: |
          echo "::group::Runner info"
          uname -a
          sw_vers || true
          sysctl -n hw.model || true
          sysctl -n hw.ncpu || true
          # Report the GPU/Metal device for the record (informational — the
          # engine is CPU/rayon today per ADR-0004; this just proves what HW
          # a future Metal kernel would target).
          system_profiler SPDisplaysDataType 2>/dev/null | grep -iE "chipset|metal|cores" || true
          echo "::endgroup::"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Bootstrap (venv + deps + Rust kernels + doctor)
        run: |
          # The repo's own turnkey bootstrap is the single source of truth
          # (CLAUDE.md §11 COMMON): 3.12 venv, [dev,data,ui] + optimize extras,
          # fno_math + trading_core + brutex_identity via maturin, then
          # `brutex doctor`.
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev,data,ui,optimize]"
          pip install maturin
          # Belt-and-suspenders crates.io flake guard (on top of the
          # workflow-level CARGO_NET_RETRY=10): retry each maturin build up to
          # 3 times. POSIX sh; builds the same kernels.
          build_with_retry() {
            dir="$1"
            n=0
            until (cd "$dir" && maturin develop --release); do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then
                echo "maturin develop ($dir) failed after 3 attempts" >&2
                return 1
              fi
              echo "maturin develop ($dir) failed (attempt $n) — retrying in 10s" >&2
              sleep 10
            done
          }
          build_with_retry rust/fno-math
          build_with_retry rust/trading-core
          # brutex_identity is a HARD import of brutex.engine /
          # brutex.strategies.combo / brutex.data.window_ledger_store since
          # DEC-RUST-RUNID-STORES-001 — without this build the mypy/pyright/
          # pytest steps below die at collection with ModuleNotFoundError
          # (caught by the lane's independent refuter round; the round-1
          # "whole-workflow job census" had missed this self-hosted workflow).
          build_with_retry rust/brutex-identity

      - name: Lint + format (ruff)
        run: |
          . .venv/bin/activate
          ruff check brutex tests
          ruff format --check brutex

      - name: Type check (mypy --strict + pyright)
        run: |
          . .venv/bin/activate
          # mypy analysis pinned to linux to match the required ubuntu gate;
          # this job's value is the REAL-hardware test suite + benches, not a
          # second type-check platform (darwin narrowing flags e.g.
          # process_probe.py's sys.platform branch as unreachable).
          mypy --strict --platform linux brutex
          pyright brutex

      # This step is the M4-Pro pow-identity host census for the (b*) ranking
      # rows (DEC-RANKING-RUST-001, MIGRATION.md #1731 amendment): run
      # 29194011032 MEASURED this host non-identity (91+123/80,015,
      # coordinator-ruled 2026-07-12), so the strong legs skip loudly here by
      # design and the (b*) rows serve the Python oracle per call — this step
      # keeps the census evidence visible on every run.
      - name: "Pow-identity host probe (host census — measured non-identity, run 29194011032)"
        run: |
          . .venv/bin/activate
          pytest tests/unit/test_pow_host_probe.py tests/golden/test_ranking_rust_golden.py tests/golden/test_ranking_parity_corpus.py -v -rA -p no:cacheprovider

      - name: Full test suite (unit + integration + property + golden + bench)
        run: |
          . .venv/bin/activate
          pytest -q -rA -p no:cacheprovider

      - name: Runtime health (brutex doctor)
        run: |
          . .venv/bin/activate
          brutex doctor

      - name: Rust kernels (fno-math + trading-core)
        run: |
          . .venv/bin/activate
          (cd rust/fno-math && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --release)
          (cd rust/trading-core && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --release)

      - name: Summary
        if: always()
        run: |
          echo "::notice::Full workspace verification ran on ${{ runner.name }} (macOS / Apple Silicon)"
          echo "::notice::Functional twin of bench-m4pro.yml (which gates the absolute perf floors)"

      - name: Open issue on failure
        # A silent full-workspace verification failure hides a macOS/arm64
        # build/test/type/doctor regression. Mirror safety.yml's proven alert
        # step (COMMON, Golden Rule #11): dedup-by-title (per-sha) then open a
        # labelled issue. `failure() || cancelled()` fires on ANY earlier step
        # failing AND on a timeout-KILL (a job killed by its own timeout-minutes
        # reports CANCELLED, not FAILED — DEC-MUTATION-ALERT-CANCELLED-001,
        # live-probed run 28748795864); scheduled runs only (an operator-watched
        # dispatch needs no issue).
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = `verify-m4pro: failure on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,verify',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Verify M4Pro gate failed on ${context.sha}. See [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['bug', 'verify', 'critical'],
            });
