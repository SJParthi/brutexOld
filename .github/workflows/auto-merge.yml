# BruteX — Auto-merge for trusted PRs on green CI.
#
# ## How this works
#
# The original (tickvault-copy) version of this workflow fired on
# `pull_request_target` and called `gh pr merge --auto --squash`. That
# assumed branch protection on main had required status checks
# configured, so GitHub's own auto-merge queue would wait for CI.
# BruteX has no branch protection yet, so `--auto` merged PRs
# immediately on creation, before any CI had run.
#
# This version triggers on THREE events to cover every path to a
# merge-ready state:
#
#   1. `workflow_run` (CI completed) — the original case. When CI
#      finishes green on a non-draft PR's head commit, merge.
#   2. `pull_request: ready_for_review` — DEC-P0-056 fix. When a draft
#      PR is undrafted AFTER CI already completed, the workflow_run
#      trigger has already fired + skipped (because draft). This
#      trigger re-checks the latest CI run for the PR's head and
#      merges if green.
#   3. `workflow_dispatch` — manual escape hatch with optional PR number.
#
# In every path the chain is the same:
#   a. Resolve the PR + head SHA.
#   b. Check trusted actor (SJParthi, dependabot[bot], renovate[bot],
#      or any branch with head ref starting `claude/`).
#   c. Check that the `CI OK (aggregate gate)` check run is success.
#   d. Squash-merge + delete branch + post audit comment.
#
# If any precondition fails the workflow exits cleanly — never
# half-merges.
#
# ## Why `workflow_run` and not `check_suite`?
#
# `workflow_run` is the idiomatic way to chain workflows in GitHub
# Actions. It gives us the SHA of the head commit and the conclusion
# of the upstream workflow, both of which we need to decide whether
# to merge. `check_suite` is noisier — it fires for every individual
# check, and the aggregation logic would duplicate what `CI OK`
# already does.

name: Auto-merge

on:
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to auto-merge (manual trigger)"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto-merge on green CI
    runs-on: ubuntu-24.04
    # Run when:
    #  - workflow_dispatch (manual)
    #  - workflow_run completed with conclusion=success on a PR-triggered CI
    #  - pull_request ready_for_review (PR un-drafted; CI may already be green)
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'
      ) || (
        github.event_name == 'pull_request' &&
        github.event.action == 'ready_for_review'
      )
    timeout-minutes: 5
    steps:
      - name: Find associated PR
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The HEAD_SHA + PR_NUMBER + AUTHOR + HEAD_REF below are
          # populated from whichever trigger fired. Empty for the
          # workflow_dispatch path (resolved from MANUAL_PR instead).
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          DIRECT_PR: ${{ github.event.pull_request.number }}
          DIRECT_AUTHOR: ${{ github.event.pull_request.user.login }}
          DIRECT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DIRECT_IS_DRAFT: ${{ github.event.pull_request.draft }}
          MANUAL_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_PR}" ]]; then
            echo "Using manually-specified PR #${MANUAL_PR}"
            echo "pr_number=${MANUAL_PR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Direct path (pull_request event): PR number + metadata
          # come straight from the event payload; no API lookup needed.
          if [[ -n "${DIRECT_PR}" ]]; then
            echo "Using direct PR #${DIRECT_PR} from pull_request event"
            echo "pr_number=${DIRECT_PR}" >> "$GITHUB_OUTPUT"
            echo "author=${DIRECT_AUTHOR}" >> "$GITHUB_OUTPUT"
            echo "head_ref=${DIRECT_HEAD_REF}" >> "$GITHUB_OUTPUT"
            echo "is_draft=${DIRECT_IS_DRAFT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Look up the open PR whose head SHA matches the workflow_run.
          prs=$(gh pr list \
            --repo "${REPO}" \
            --state open \
            --search "${HEAD_SHA}" \
            --json number,headRefOid,headRefName,author,isDraft \
            --jq ".[] | select(.headRefOid == \"${HEAD_SHA}\")")
          if [[ -z "${prs}" ]]; then
            echo "::notice::No open PR found for head SHA ${HEAD_SHA}; nothing to merge"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found PR data: ${prs}"
          pr_number=$(echo "${prs}" | head -1 | jq -r .number)
          author=$(echo "${prs}" | head -1 | jq -r .author.login)
          head_ref=$(echo "${prs}" | head -1 | jq -r .headRefName)
          is_draft=$(echo "${prs}" | head -1 | jq -r .isDraft)

          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "author=${author}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${head_ref}" >> "$GITHUB_OUTPUT"
          echo "is_draft=${is_draft}" >> "$GITHUB_OUTPUT"

      - name: Check trusted actor
        id: trust-check
        if: steps.find-pr.outputs.pr_number != ''
        env:
          AUTHOR: ${{ steps.find-pr.outputs.author }}
          HEAD_REF: ${{ steps.find-pr.outputs.head_ref }}
          IS_DRAFT: ${{ steps.find-pr.outputs.is_draft }}
        run: |
          set -euo pipefail
          if [[ "${IS_DRAFT}" == "true" ]]; then
            echo "::notice::PR is draft; skipping auto-merge"
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${AUTHOR}" in
            SJParthi|dependabot\[bot\]|renovate\[bot\])
              echo "Author ${AUTHOR} is trusted"
              echo "trusted=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [[ "${HEAD_REF}" == claude/* ]]; then
            echo "Head ref ${HEAD_REF} starts with claude/ — trusted"
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::Author ${AUTHOR} on branch ${HEAD_REF} is NOT trusted; skipping"
          echo "trusted=false" >> "$GITHUB_OUTPUT"

      - name: Verify ci-ok aggregate is green
        id: ci-check
        if: steps.trust-check.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Workflow_run + pull_request events expose head SHA in
          # different places. Fall through to whichever populated it.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The ci-ok job produces a check run of the same name.
          # It must exist AND be in conclusion=success.
          conclusion=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name == "CI OK (aggregate gate)") | .conclusion' \
            | head -1)
          echo "ci-ok conclusion: ${conclusion:-<missing>}"
          if [[ "${conclusion}" != "success" ]]; then
            echo "::notice::ci-ok is not green (${conclusion:-missing}); skipping merge"
            echo "green=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "green=true" >> "$GITHUB_OUTPUT"

      - name: Squash-merge + delete branch
        if: steps.ci-check.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          echo "Merging PR #${PR_NUMBER} (ci-ok is green)"
          gh pr merge "${PR_NUMBER}" \
            --repo "${REPO}" \
            --squash \
            --delete-branch \
            --subject "$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json title --jq .title) (#${PR_NUMBER})"
          HEAD_SHA="${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}"
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body \
            "🤖 Auto-merged (CI OK aggregate was green on head commit ${HEAD_SHA})."
