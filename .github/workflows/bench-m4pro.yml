# bench-m4pro.yml — Absolute-throughput gate for the M4 Pro runner.
#
# Per CLAUDE.md §8 (hardware envelope: Apple M4 Pro 14-core / 48 GB / 8 TB SSD)
# and STANDARDS_100PCT.md §1 row 14, the operator's "100% standards" decree
# targets ≥ 50 M ops/s for the brute-force mask-AND hot path on M4 Pro.
#
# Shared GitHub Actions runners have noisy cache-cliff behaviour that
# chronic-flakes any absolute ops/s assertion (DEC-P0-020 honest envelope).
# So the absolute gate lives ONLY on the M4 Pro self-hosted runner.
#
# Activation — RUNNER IS LIVE (2026-07-07)
# ----------------------------------------
# The self-hosted M4 Pro runner (labels: self-hosted, macos, m4pro) is
# REGISTERED and jobs EXECUTE on push (proven: run 28850622113 on
# "Parthibans-MacBook-Pro"; runs succeed on main; fully-green run
# 28851211762 on this branch — sweep worker-scaling step measured 20 s
# wall, VERDICT: KEEP CAP=8). The historical safety
# design stands: the workflow is harmless on a freshly-cloned repo — it
# requires both the `m4pro` runner label AND the env var
# `BRUTEX_M4PRO_ABS=1`, and on a repo without the runner every run would
# sit "queued" while the test skips via pytest.mark.skipif in
# tests/bench/test_throughput_absolute.py. Zero impact on shared CI.
#
# Decision: DEC-M4PRO-ABSOLUTE-001 (2026-05-25, MIGRATION #236).
# Bench-surface (-s -rA) wiring: DEC-M4PRO-BENCH-SURFACE-001 (MIGRATION #979).

name: bench-m4pro

on:
  push:
    branches:
      - main
      - "claude/**"
      - "feat/**"
      - "fix/**"
    paths:
      - "tests/bench/test_throughput_absolute.py"
      - "tests/bench/test_throughput_canary.py"
      - "tests/bench/test_summary_cache_o1.py"
      - "tests/bench/test_m4pro_sweep_walltime.py"
      # DEC-TEST-APPARATUS-DEBTS-001(i): the sweep worker-scaling A/B bench
      # (ADR-0016 §5 deferred core-scaling measurement) + the module its arms
      # derive from (AUTO_SWEEP_WORKERS_CAP).
      - "tests/bench/test_sweep_worker_scaling.py"
      - "brutex/engine/sweep_parallel.py"
      # DEC-O1-BENCH-GATE-COMPLETE-001 (M2): the strict 1.1x tier now gates
      # every Golden-Rule-#5 hot path via a dedicated isolated bench; a change
      # to any of them must re-run this workflow.
      - "tests/bench/test_bar_lookup_o1.py"
      - "tests/bench/test_indicator_lookup_o1.py"
      - "tests/bench/test_bloom_o1.py"
      - "tests/bench/test_engine_sweep_cache_o1.py"
      - "tests/bench/test_engine_combo_mask_o1.py"
      - "tests/bench/test_engine_results_store_o1.py"
      - "tests/bench/test_market_structure_o1.py"
      - "tests/bench/_o1_tiers.py"
      # DEC-LAKE-STATS-MANIFEST-001 (review round 4): the stats-manifest
      # write-path A/B wall-clock gate (BRUTEX_M4PRO_ABS-gated) and the
      # /db O(page) paging ratio gate (strict tier via metadata_sweep_ceiling
      # — _o1_tiers.py METADATA_SWEEP_STRICT_CEILING = 3.0x, recalibrated off
      # run 28888100079's measured 1.53x per MIGRATION.md #1595 CALIBRATION;
      # NOT the ratio_ceiling() 1.1x tier) previously executed in NO
      # workflow — the env vars are set only here, and this workflow neither
      # listed nor invoked the files.
      - "tests/bench/test_stats_manifest_write_ab.py"
      - "tests/bench/test_db_paging_o_page.py"
      - "tests/bench/test_absolute_baseline.py"
      - "tests/bench/_abs_baseline_registry.py"
      - "tests/bench/baselines/**"
      - "brutex/observability/bench_baseline.py"
      - "brutex/config/hardware_envelope.py"
      - "scripts/ci/bench_baseline_gate.py"
      - ".github/workflows/bench-m4pro.yml"
      - "brutex/vocabulary/**"
      - "rust/fno-math/**"
  # NOTE (DEC-M4PRO-PR-TRIGGER-001): intentionally NO `pull_request` trigger.
  # This job runs on the self-hosted M4-Pro runner, which queues indefinitely
  # while offline — a PR trigger would hang every bench-touching PR's mergeable
  # state and emit a false "MERGE BLOCKED (pending)" pre-merge verdict (observed
  # on PR #284). PRs use the shared-CI robust O(1) tier (in `ci.yml`); the strict
  # 1.1× + absolute tiers run on push-to-main + nightly + manual dispatch, where
  # a perpetually-queued run is harmless (no PR to block). Re-add a paths-filtered
  # `pull_request:` here once the runner is registered if pre-merge strict checks
  # are wanted.
  workflow_dispatch:
    inputs:
      capture_candidate:
        description: "Capture a fresh baseline candidate (bless/re-bless flow)"
        type: boolean
        default: false
      decision_id:
        description: "NEW DEC id for a re-bless of EXISTING entries (blank = bootstrap additive-only)"
        required: false
        type: string
      replace_entries:
        description: "Comma-separated entry ids to REPLACE (requires decision_id)"
        required: false
        type: string
  schedule:
    # Daily 11:00 UTC = 16:30 IST (post-market). Catches CPU/OS/thermal
    # regressions even when no code changed.
    - cron: "0 11 * * *"

concurrency:
  group: bench-m4pro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

# Cargo network resilience (CI-only flake hardening) — see ci.yml for the
# rationale. crates.io downloads flake intermittently; CARGO_NET_RETRY makes
# cargo retry each failed download up to 10x, GIT_FETCH_WITH_CLI uses the
# system git for git-source fetches. Pure download-retry behaviour — changes
# nothing about what is built or run. Workflow-level so the maturin-develop
# steps below inherit it.
env:
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  m4pro-absolute-throughput:
    # Gated to the self-hosted M4 Pro runner. If no runner with this label
    # set is online the job sits in "queued" indefinitely — the operator
    # can disable the workflow if registration is delayed.
    runs-on: [self-hosted, macos, m4pro]
    # 25 min (was 10): the sweep worker-scaling A/B bench step below runs the
    # REAL run_parallel_grid at 4 worker arms (DEC-TEST-APPARATUS-DEBTS-001(i);
    # measured 20 s wall on the live runner — generous headroom kept), AND the
    # DEC-BENCH-ABS-BASELINE-001 measure + compare + one bounded
    # numeric-regression re-measure + a possible 3-run capture (main's 15-min
    # budget) both fit under 25.
    timeout-minutes: 25

    outputs:
      needs_capture: ${{ steps.abscompare.outputs.needs_capture }}
      baseline_missing: ${{ steps.abscompare.outputs.baseline_missing }}
      abstain_entries: ${{ steps.abscompare.outputs.abstain_entries }}
      hardware_key: ${{ steps.abscompare.outputs.hardware_key }}
      candidate_ready: ${{ steps.abscapture.outputs.candidate_ready }}

    env:
      # The literal "1" activates the absolute gate per
      # tests/bench/test_throughput_absolute.py _m4pro_gate_active().
      BRUTEX_M4PRO_ABS: "1"
      # Activates the strict 1.1x O(1) ratio tier (DEC-O1-STRICT-TIER-001) via
      # tests/bench/_o1_tiers.py ratio_ceiling() — only on this quiet runner.
      BRUTEX_M4PRO_STRICT: "1"
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show runner identity
        run: |
          echo "::group::Runner info"
          uname -a
          sw_vers || true
          sysctl -n hw.model || true
          sysctl -n hw.ncpu || true
          echo "::endgroup::"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install brutex with dev extras
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          # [data] (polars/duckdb/pyarrow) is REQUIRED here, not optional:
          # the sweep worker-scaling A/B bench drives the REAL
          # run_parallel_grid -> run_persisted_sweep -> ResultsStore.flush(),
          # which imports polars in the worker processes (mirrors ci.yml's
          # bench job, which installs ".[dev,data,ui,optimize]"). Without it
          # the bench fails with ModuleNotFoundError: polars (observed live,
          # run 28850622113 — DEC-TEST-APPARATUS-DEBTS-001(i) follow-up fix).
          pip install -e ".[dev,data]"

      - name: Build fno_math (Rust kernel)
        # Belt-and-suspenders crates.io flake guard (on top of the
        # workflow-level CARGO_NET_RETRY=10): retry the maturin build up to
        # 3 times. POSIX sh; builds the same kernel.
        run: |
          . .venv/bin/activate
          pip install maturin
          cd rust/fno-math
          n=0
          until maturin develop --release; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "maturin develop (fno-math) failed after 3 attempts" >&2
              exit 1
            fi
            echo "maturin develop (fno-math) failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Build trading_core (shared 52-vocab + pivot/Fib kernel)
        run: |
          . .venv/bin/activate
          # DEC-SHARED-CORE-001 Phase 2b/2d: brutex.vocabulary + brutex.indicators
          # delegate to the trading_core wheel; the throughput canary imports them
          # transitively, so this self-hosted job must build it too (maturin is
          # already installed by the fno_math step above).
          # Belt-and-suspenders crates.io flake guard (see fno_math step).
          cd rust/trading-core
          n=0
          until maturin develop --release; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "maturin develop (trading-core) failed after 3 attempts" >&2
              exit 1
            fi
            echo "maturin develop (trading-core) failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Run absolute-throughput gate
        run: |
          . .venv/bin/activate
          # -p no:cacheprovider keeps the runner's $HOME clean between runs.
          # -s disables pytest's stdout capture so the measured ops/s print()s
          # reach the CI log; -rA prints a summary line for every test outcome
          # (DEC-M4PRO-BENCH-SURFACE-001) — without these the gate passed but the
          # absolute number never surfaced for the operator.
          pytest tests/bench/test_throughput_absolute.py -q -s -rA --tb=short -p no:cacheprovider

      - name: Run 33B-trial SLA gate (resident-parallel mask-AND)
        run: |
          . .venv/bin/activate
          # DEC-SWEEP-RESIDENT-KERNEL-001 (W2-c): the 33B-trial wall-time SLA gate
          # is REAL on this M4 Pro runner (BRUTEX_M4PRO_ABS=1, set in the job env)
          # — it projects from the resident + rayon-parallel batched mask-AND
          # kernel and fails if it exceeds the 4-day M4 Pro SLA. On shared GHA the
          # same test SKIPS (no env var); CI keeps the O(1) RATIO gate instead.
          # -s -rA surface the projected trials/sec, per-trial µs and projected
          # days print()s in the CI log (DEC-M4PRO-BENCH-SURFACE-001); without
          # them the projection was computed but swallowed by pytest's capture.
          # HONEST: this projection measures the resident-parallel mask-AND +
          # blake3 kernel ONLY — it EXCLUDES the per-combo Python trade-walk
          # (count_trades), the dominant real-sweep cost the module docstring
          # itself flags — so the ≤4-day figure is the kernel envelope, not the
          # full real-sweep wall time.
          pytest tests/bench/test_full_sweep_extrapolation.py -q -s -rA --tb=short -p no:cacheprovider

      - name: Run real-trade-walk sweep wall-time bench
        run: |
          . .venv/bin/activate
          # DEC-M4PRO-WALLTIME-BENCH-001: times the REAL trade-walk
          # (ResidentSweepSim.count_trades — entry, SL/TP, 15:20 forced exit) over
          # a representative TF-mix window and projects wall time for BOTH the full
          # 33B grid AND the ~50%-conflict-pruned path. This is the DOMINANT cost
          # the 33B-SLA gate above EXCLUDES (it measures mask-AND + blake3 only).
          # -s -rA surface the measured trials/sec, per-trial µs and BOTH projected
          # wall-times in the CI log; the heavy timing is gated on BRUTEX_M4PRO_ABS=1
          # (set in the job env) and skips elsewhere. HONEST measurement, not a hard
          # perf gate (the gated body asserts only positive/finite sanity).
          pytest tests/bench/test_m4pro_sweep_walltime.py -q -s -rA --tb=short -p no:cacheprovider

      - name: Run sweep worker-scaling A/B bench (ADR-0016 §5 deferred core-scaling)
        run: |
          . .venv/bin/activate
          # DEC-SWEEP-CAP-BENCH-001: A/B wall-clock + RSS of the REAL
          # run_parallel_grid at workers ∈ {cap−1, cap, 10, 12}. Gated on
          # BRUTEX_M4PRO_ABS=1 (job env) PLUS the test's own >=14-usable-CPU
          # core guard — skips honestly elsewhere. -s -rA surface the
          # machine-readable SWEEP_WORKER_SCALING lines + the VERDICT: line
          # (DEC-M4PRO-BENCH-SURFACE-001). HONEST measurement, not a perf
          # gate — asserts only sanity + cross-arm result-digest identity;
          # the cap moves only per the runbook decision rule.
          pytest tests/bench/test_sweep_worker_scaling.py -q -s -rA --tb=short -p no:cacheprovider

      - name: Run strict 1.1x O(1) ratio tier
        run: |
          . .venv/bin/activate
          # BRUTEX_M4PRO_STRICT=1 (job env) tightens every O(1) ratio gate to the
          # decreed 1.1x ceiling (DEC-O1-STRICT-TIER-001) — meaningful only on
          # this quiet self-hosted runner; shared CI keeps the robust 3-10x tier.
          #
          # HONEST ENVELOPE (Golden Rule #10) — RUNNER LIVE (2026-07-07):
          # the self-hosted [self-hosted, macos, m4pro] runner is REGISTERED
          # and this job EXECUTES on push (see the header note + `runs-on:`
          # above; proven live on "Parthibans-MacBook-Pro"), so the strict
          # 1.1x tier now genuinely runs — the former dormancy disclosure
          # ("job sits queued, tier never executes") is superseded. The
          # shared-CI first tier still stands independently: the `bench` job
          # in ci.yml runs a bare `pytest tests/bench` (the whole dir) on the
          # shared ubuntu-24.04 runner at the robust ~5x tier
          # (BRUTEX_M4PRO_STRICT unset -> ratio_ceiling/cache_tier_ceiling
          # return their 5x default), so a real O(n) regression in any
          # Golden-Rule-#5 hot path is caught on shared CI regardless; the
          # strict 1.1x is the tighter second tier on this quiet runner.
          #
          # DEC-O1-BENCH-GATE-COMPLETE-001 (M2): the strict tier now lists EVERY
          # Golden-Rule-#5 hot path (CLAUDE.md §2 r5) as a dedicated ISOLATED
          # ratio gate — previously only LMDB/composite-dedup + the throughput
          # canary ran under BRUTEX_M4PRO_STRICT=1, so the dedicated bar-lookup,
          # indicator-lookup, u128 mask-eval, Bloom-probe, sweep-cache-digest,
          # result-append and BOS/CHoCH benches were gated at the strict 1.1x
          # ONLY implicitly (via the canary's dict/mask shapes) or not at all.
          # Listed below:
          #   (a) bar lookup             -> test_bar_lookup_o1.py
          #   (b) indicator value        -> test_indicator_lookup_o1.py
          #   (c) combo dedup (Bloom)    -> test_bloom_o1.py
          #       combo dedup (digest)   -> test_engine_sweep_cache_o1.py
          #   (d) strategy mask AND      -> test_engine_combo_mask_o1.py
          #   (e) result append/get      -> test_engine_results_store_o1.py
          #   (f) BOS/CHoCH per-bar (56-59) -> test_market_structure_o1.py
          # Cross-CPU-cache-tier paths (100K-object lookups / 10K-row inserts /
          # 10K-mask loops) route their strict ceiling through
          # cache_tier_ceiling() (the DEC-O1-CACHE-TIER-001 measured 3x
          # allowance) exactly like the canary's 1M-elem paths — the raw 1.1x is
          # physically unsatisfiable across a cache cliff; hash/compute-dominated
          # + fixed-window paths (Bloom probe, blake3 digest, BOS/CHoCH ring)
          # hold the true 1.1x.
          pytest tests/bench/test_store_o1.py tests/bench/test_option_dedup_o1.py \
            tests/bench/test_lmdb_membership_o1.py tests/bench/test_rate_limiter_o1.py \
            tests/bench/test_summary_cache_o1.py \
            tests/bench/test_bar_lookup_o1.py tests/bench/test_indicator_lookup_o1.py \
            tests/bench/test_bloom_o1.py tests/bench/test_engine_sweep_cache_o1.py \
            tests/bench/test_engine_combo_mask_o1.py \
            tests/bench/test_engine_results_store_o1.py \
            tests/bench/test_market_structure_o1.py \
            tests/bench/test_throughput_canary.py -q --tb=short -p no:cacheprovider

      - name: Run stats-manifest write A/B + /db O(page) paging gates
        run: |
          . .venv/bin/activate
          # DEC-LAKE-STATS-MANIFEST-001 (review round 4): the wall-clock A/B
          # merge-budget gate (test_stats_manifest_write_ab.py TestWallClockAB,
          # skipif-gated on BRUTEX_M4PRO_ABS=1 — set in the job env above) and
          # the strict-tier O(page) paging ratio gate (test_db_paging_o_page.py
          # — its strict ceiling routes through metadata_sweep_ceiling(8.0),
          # i.e. _o1_tiers.py METADATA_SWEEP_STRICT_CEILING = 3.0x under
          # BRUTEX_M4PRO_STRICT=1, the endgame recalibration off run
          # 28888100079's measured 1.53x [MIGRATION.md #1595 CALIBRATION]; it
          # never calls ratio_ceiling() and does NOT enforce the decreed 1.1x,
          # the feature's own documented O(D) statx sweep makes that
          # internally contradictory) previously executed in NO workflow: this
          # workflow is the ONLY one setting those env vars, and it neither
          # listed the files in `paths` nor ran them, so the 12 ms
          # merge-budget assertion was a permanently-skipped test. The
          # deterministic byte-parity / anti-storm / file-touch teeth
          # in both files also run on shared CI (ci.yml's bare
          # `pytest tests/bench`) at the robust tier. -s -rA surface the
          # measured median overhead + ratios (DEC-M4PRO-BENCH-SURFACE-001).
          pytest tests/bench/test_stats_manifest_write_ab.py \
            tests/bench/test_db_paging_o_page.py -q -s -rA --tb=short -p no:cacheprovider

      - name: Measure absolute hot-path benchmarks (DEC-BENCH-ABS-BASELINE-001)
        run: |
          . .venv/bin/activate
          rm -rf abs-bench && mkdir -p abs-bench/run1
          # House best-of-min perf_counter_ns idiom (DEC-CANARY-MINTIME-001);
          # 6 fragments + fingerprint.json land in abs-bench/run1. Gated on
          # BRUTEX_M4PRO_ABS=1 (job env) — a no-op skip anywhere else; a skip
          # here is caught by the comparator's fragment-set equality (STRUCTURAL).
          BRUTEX_ABS_BENCH_OUT="$PWD/abs-bench/run1" \
            pytest tests/bench/test_absolute_baseline.py -q -s -rA --tb=short -p no:cacheprovider

      - name: Absolute-baseline compare gate (committed per-hardware floor)
        id: abscompare
        run: |
          . .venv/bin/activate
          # Repo-owned comparator — deliberately NOT --benchmark-compare (native
          # compare warns-and-passes on missing runs, keys on machine_info, cannot
          # abstain or govern; ledgered in DEC-BENCH-ABS-BASELINE-001; precedent:
          # MIGRATION.md entry #158 DEC-P0-020 Agent-2 finding).
          # rc=1 numeric regression (ONE bounded reproduce-before-fail re-measure);
          # rc=2 structural/schema (NEVER retried); rc=0 ok or LOUD abstain.
          set +e
          python scripts/ci/bench_baseline_gate.py compare \
            --fragments-dir abs-bench/run1 \
            --baselines-dir tests/bench/baselines \
            --github-output "$GITHUB_OUTPUT"
          rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::warning::numeric regression measured — re-measuring ONCE in a fresh process to confirm (both reports archived)"
            mkdir -p abs-bench/retry
            BRUTEX_ABS_BENCH_OUT="$PWD/abs-bench/retry" \
              pytest tests/bench/test_absolute_baseline.py -q -s -rA --tb=short -p no:cacheprovider || exit 1
            python scripts/ci/bench_baseline_gate.py compare \
              --fragments-dir abs-bench/retry \
              --baselines-dir tests/bench/baselines \
              --github-output "$GITHUB_OUTPUT"
            rc=$?
          fi
          exit $rc

      - name: Capture baseline candidate (abstain bootstrap / dispatch re-bless)
        id: abscapture
        if: >
          steps.abscompare.outputs.needs_capture == '1' ||
          (github.event_name == 'workflow_dispatch' && inputs.capture_candidate)
        run: |
          . .venv/bin/activate
          # Two more PROCESS-FRESH measurement runs (run1 reused) — capture
          # REFUSES a noisy triple (spread > tolerance/2), so a thermally-
          # throttled machine can never mint a baseline.
          for i in 2 3; do
            mkdir -p "abs-bench/run$i"
            BRUTEX_ABS_BENCH_OUT="$PWD/abs-bench/run$i" \
              pytest tests/bench/test_absolute_baseline.py -q -s -rA --tb=short -p no:cacheprovider
          done
          REPLACE=""
          if [ -n "${{ inputs.replace_entries }}" ]; then
            REPLACE="--replace-entries ${{ inputs.replace_entries }}"
          fi
          # $REPLACE is deliberately word-split:
          # shellcheck disable=SC2086
          python scripts/ci/bench_baseline_gate.py capture \
            --runs abs-bench/run1 abs-bench/run2 abs-bench/run3 \
            --baselines-dir tests/bench/baselines \
            --candidate-out abs-bench/candidate.json \
            --pr-body-out abs-bench/pr-body.md \
            --decision-id "${{ inputs.decision_id || 'DEC-BENCH-ABS-BASELINE-001' }}" \
            --commit "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --runner-name "${RUNNER_NAME}" \
            $REPLACE
          echo "candidate_ready=1" >> "$GITHUB_OUTPUT"

      - name: Upload absolute-bench artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: abs-bench
          path: abs-bench/
          retention-days: 90
          if-no-files-found: ignore

      - name: Track missing baseline (scheduled abstain — distinct, non-critical)
        # S1: abstain is GREEN but never invisible. Distinct title + labels so it
        # can never be confused with a regression red; dedup by title (per key).
        if: steps.abscompare.outputs.needs_capture == '1' && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const key = '${{ steps.abscompare.outputs.hardware_key }}';
            const title = `bench-m4pro: absolute baseline missing/incomplete for ${key}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'bench', per_page: 100,
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: `Absolute gate ABSTAINED (no/partial baseline for \`${key}\`). A bless PR should open automatically from this run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. See docs/runbooks/bench-baseline.md.`,
              labels: ['bench'],
            });

      - name: Print summary
        if: always()
        run: |
          echo "::notice::M4 Pro absolute-throughput gate ran on ${{ runner.name }}"
          echo "::notice::Floor: 50 M ops/s (operator decree, STANDARDS row 14)"

      - name: Open issue on failure
        # A strict 50 M/s + 1.1x O(1)-tier gate breach must NOT fail silently.
        # Mirror safety.yml's proven alert step (COMMON, Golden Rule #11):
        # dedup-by-title (per-sha) then open a labelled issue. `failure()` fires
        # on ANY earlier step failing (incl. any perf/O(1) gate); scheduled runs
        # only (an operator-watched dispatch/push needs no issue).
        # DEC-BENCH-ABS-BASELINE-001 (mirrors DEC-MUTATION-ALERT-CANCELLED-001
        # #1511): a timeout-KILLED job reports CANCELLED, not failure — alert on
        # both so a silent timeout death is impossible.
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `bench-m4pro: failure on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,bench',
              per_page: 100,
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Bench M4Pro gate failed or was cancelled (e.g. timeout-killed) on ${context.sha}. See [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['bug', 'bench', 'critical'],
            });

  bless-baseline:
    name: Bless baseline candidate (bot PR from measured artifact)
    needs: m4pro-absolute-throughput
    # Pinned: main ref + schedule/dispatch ONLY + a candidate actually captured.
    # A push-run on a feature branch can NEVER arm this job (workflow-contract-
    # test-pinned), and a REGRESSION outcome never reaches here (needs_capture
    # is set only on abstain / explicit dispatch — a red compare fails the
    # m4pro job, so `needs` blocks this job entirely on regression).
    # The self-hosted runner never holds a contents/PR-write token (its
    # inherited workflow-level token is issues:write only, for its own alert
    # steps) — THIS GitHub-hosted job is the only contents/pull-requests write
    # holder, and its only inputs are the artifact bytes (committed verbatim)
    # and job outputs. No `pull_request` trigger exists on this workflow
    # (DEC-M4PRO-PR-TRIGGER-001), so fork code never runs near it.
    if: >
      needs.m4pro-absolute-throughput.outputs.candidate_ready == '1' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      # issues: write is REQUIRED here: a job-level permissions block zeroes
      # every unspecified scope (the workflow-level issues: write does NOT
      # apply), and the "Alert on bless failure" step calls
      # github.rest.issues.listForRepo/create — without this scope the alert
      # itself 403s, silencing the exact failure it exists to surface
      # (review round 2).
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: abs-bench
      - name: Open bless PR (candidate committed VERBATIM — numbers measured on the runner, no edit surface here)
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const key = '${{ needs.m4pro-absolute-throughput.outputs.hardware_key }}';
            const branch = `claude/bench-baseline-${key}`;
            const path = `tests/bench/baselines/${key}.json`;
            const open = await github.rest.pulls.list({owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', head: `${context.repo.owner}:${branch}`});
            if (open.data.length > 0) { core.notice(`bless PR for ${key} already open — skipping`); return; }
            const main = await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main'});
            try {
              await github.rest.git.createRef({owner: context.repo.owner, repo: context.repo.repo,
                ref: `refs/heads/${branch}`, sha: main.data.object.sha});
            } catch (e) { if (e.status !== 422) throw e; }
            // If the file already exists on the branch/main, pass its sha (update vs create).
            let sha = undefined;
            try {
              const cur = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: branch});
              sha = cur.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            // download-artifact extracts the abs-bench/ upload into the job
            // workspace root, so candidate.json / pr-body.md sit at CWD —
            // verified against actions/download-artifact@v8 flattening; the
            // workflow-contract test pins these two paths.
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path, branch, sha,
              message: `feat(bench): bless absolute benchmark baseline for ${key}\n\nDEC-BENCH-ABS-BASELINE-001 measured capture (see PR body for run provenance).`,
              content: fs.readFileSync('candidate.json').toString('base64')});
            await github.rest.pulls.create({owner: context.repo.owner, repo: context.repo.repo,
              title: `feat(bench): bless absolute benchmark baseline for ${key}`,
              head: branch, base: 'main',
              body: fs.readFileSync('pr-body.md').toString()});
      - name: Alert on bless failure (a broken bootstrap loop must not be silent)
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `bench-m4pro: bless-baseline job failed on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'bug,bench', per_page: 100});
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title,
              body: `The bless-baseline job failed or was cancelled — the absolute gate stays dormant until fixed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'bench', 'critical']});
