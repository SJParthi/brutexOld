# bench-m4pro.yml — Absolute-throughput gate for the M4 Pro runner.
#
# Per CLAUDE.md §8 (hardware envelope: Apple M4 Pro 14-core / 48 GB / 8 TB SSD)
# and STANDARDS_100PCT.md §1 row 14, the operator's "100% standards" decree
# targets ≥ 50 M ops/s for the brute-force mask-AND hot path on M4 Pro.
#
# Shared GitHub Actions runners have noisy cache-cliff behaviour that
# chronic-flakes any absolute ops/s assertion (DEC-P0-020 honest envelope).
# So the absolute gate lives ONLY on the M4 Pro self-hosted runner.
#
# Activation
# ----------
# This workflow is harmless on a freshly-cloned repo: it requires both a
# self-hosted runner labelled `m4pro` AND the env var `BRUTEX_M4PRO_ABS=1`.
# Until the operator registers the runner, every run sits in the GitHub
# "queued" state and the test would skip anyway via pytest.mark.skipif
# in tests/bench/test_throughput_absolute.py. Zero impact on shared CI.
#
# Once the operator registers the runner per:
#   GitHub → sjparthi/brutex → Settings → Actions → Runners → "New self-hosted runner"
#   → macOS → register with labels: self-hosted, macos, m4pro
# the next push triggers this workflow and the absolute gate activates.
#
# Decision: DEC-M4PRO-ABSOLUTE-001 (2026-05-25, MIGRATION #236).
# Bench-surface (-s -rA) wiring: DEC-M4PRO-BENCH-SURFACE-001 (MIGRATION #979).

name: bench-m4pro

on:
  push:
    branches:
      - main
      - "claude/**"
      - "feat/**"
      - "fix/**"
    paths:
      - "tests/bench/test_throughput_absolute.py"
      - "tests/bench/test_throughput_canary.py"
      - "tests/bench/test_summary_cache_o1.py"
      - "tests/bench/test_m4pro_sweep_walltime.py"
      # DEC-O1-BENCH-GATE-COMPLETE-001 (M2): the strict 1.1x tier now gates
      # every Golden-Rule-#5 hot path via a dedicated isolated bench; a change
      # to any of them must re-run this workflow.
      - "tests/bench/test_bar_lookup_o1.py"
      - "tests/bench/test_indicator_lookup_o1.py"
      - "tests/bench/test_bloom_o1.py"
      - "tests/bench/test_engine_sweep_cache_o1.py"
      - "tests/bench/test_engine_combo_mask_o1.py"
      - "tests/bench/test_engine_results_store_o1.py"
      - "tests/bench/test_market_structure_o1.py"
      - "tests/bench/_o1_tiers.py"
      # DEC-LAKE-STATS-MANIFEST-001 (review round 4): the stats-manifest
      # write-path A/B wall-clock gate (BRUTEX_M4PRO_ABS-gated) and the
      # /db O(page) paging ratio gate (BRUTEX_M4PRO_STRICT 1.1x tier)
      # previously executed in NO workflow — the env vars are set only
      # here, and this workflow neither listed nor invoked the files.
      - "tests/bench/test_stats_manifest_write_ab.py"
      - "tests/bench/test_db_paging_o_page.py"
      - ".github/workflows/bench-m4pro.yml"
      - "brutex/vocabulary/**"
      - "rust/fno-math/**"
  # NOTE (DEC-M4PRO-PR-TRIGGER-001): intentionally NO `pull_request` trigger.
  # This job runs on the self-hosted M4-Pro runner, which queues indefinitely
  # while offline — a PR trigger would hang every bench-touching PR's mergeable
  # state and emit a false "MERGE BLOCKED (pending)" pre-merge verdict (observed
  # on PR #284). PRs use the shared-CI robust O(1) tier (in `ci.yml`); the strict
  # 1.1× + absolute tiers run on push-to-main + nightly + manual dispatch, where
  # a perpetually-queued run is harmless (no PR to block). Re-add a paths-filtered
  # `pull_request:` here once the runner is registered if pre-merge strict checks
  # are wanted.
  workflow_dispatch:
  schedule:
    # Daily 11:00 UTC = 16:30 IST (post-market). Catches CPU/OS/thermal
    # regressions even when no code changed.
    - cron: "0 11 * * *"

concurrency:
  group: bench-m4pro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

# Cargo network resilience (CI-only flake hardening) — see ci.yml for the
# rationale. crates.io downloads flake intermittently; CARGO_NET_RETRY makes
# cargo retry each failed download up to 10x, GIT_FETCH_WITH_CLI uses the
# system git for git-source fetches. Pure download-retry behaviour — changes
# nothing about what is built or run. Workflow-level so the maturin-develop
# steps below inherit it.
env:
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  m4pro-absolute-throughput:
    # Gated to the self-hosted M4 Pro runner. If no runner with this label
    # set is online the job sits in "queued" indefinitely — the operator
    # can disable the workflow if registration is delayed.
    runs-on: [self-hosted, macos, m4pro]
    timeout-minutes: 10

    env:
      # The literal "1" activates the absolute gate per
      # tests/bench/test_throughput_absolute.py _m4pro_gate_active().
      BRUTEX_M4PRO_ABS: "1"
      # Activates the strict 1.1x O(1) ratio tier (DEC-O1-STRICT-TIER-001) via
      # tests/bench/_o1_tiers.py ratio_ceiling() — only on this quiet runner.
      BRUTEX_M4PRO_STRICT: "1"
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show runner identity
        run: |
          echo "::group::Runner info"
          uname -a
          sw_vers || true
          sysctl -n hw.model || true
          sysctl -n hw.ncpu || true
          echo "::endgroup::"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install brutex with dev extras
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev,data]"

      - name: Build fno_math (Rust kernel)
        # Belt-and-suspenders crates.io flake guard (on top of the
        # workflow-level CARGO_NET_RETRY=10): retry the maturin build up to
        # 3 times. POSIX sh; builds the same kernel.
        run: |
          . .venv/bin/activate
          pip install maturin
          cd rust/fno-math
          n=0
          until maturin develop --release; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "maturin develop (fno-math) failed after 3 attempts" >&2
              exit 1
            fi
            echo "maturin develop (fno-math) failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Build trading_core (shared 52-vocab + pivot/Fib kernel)
        run: |
          . .venv/bin/activate
          # DEC-SHARED-CORE-001 Phase 2b/2d: brutex.vocabulary + brutex.indicators
          # delegate to the trading_core wheel; the throughput canary imports them
          # transitively, so this self-hosted job must build it too (maturin is
          # already installed by the fno_math step above).
          # Belt-and-suspenders crates.io flake guard (see fno_math step).
          cd rust/trading-core
          n=0
          until maturin develop --release; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "maturin develop (trading-core) failed after 3 attempts" >&2
              exit 1
            fi
            echo "maturin develop (trading-core) failed (attempt $n) — retrying in 10s" >&2
            sleep 10
          done

      - name: Run absolute-throughput gate
        run: |
          . .venv/bin/activate
          # -p no:cacheprovider keeps the runner's $HOME clean between runs.
          # -s disables pytest's stdout capture so the measured ops/s print()s
          # reach the CI log; -rA prints a summary line for every test outcome
          # (DEC-M4PRO-BENCH-SURFACE-001) — without these the gate passed but the
          # absolute number never surfaced for the operator.
          pytest tests/bench/test_throughput_absolute.py -q -s -rA --tb=short -p no:cacheprovider

      - name: Run 33B-trial SLA gate (resident-parallel mask-AND)
        run: |
          . .venv/bin/activate
          # DEC-SWEEP-RESIDENT-KERNEL-001 (W2-c): the 33B-trial wall-time SLA gate
          # is REAL on this M4 Pro runner (BRUTEX_M4PRO_ABS=1, set in the job env)
          # — it projects from the resident + rayon-parallel batched mask-AND
          # kernel and fails if it exceeds the 4-day M4 Pro SLA. On shared GHA the
          # same test SKIPS (no env var); CI keeps the O(1) RATIO gate instead.
          # -s -rA surface the projected trials/sec, per-trial µs and projected
          # days print()s in the CI log (DEC-M4PRO-BENCH-SURFACE-001); without
          # them the projection was computed but swallowed by pytest's capture.
          # HONEST: this projection measures the resident-parallel mask-AND +
          # blake3 kernel ONLY — it EXCLUDES the per-combo Python trade-walk
          # (count_trades), the dominant real-sweep cost the module docstring
          # itself flags — so the ≤4-day figure is the kernel envelope, not the
          # full real-sweep wall time.
          pytest tests/bench/test_full_sweep_extrapolation.py -q -s -rA --tb=short -p no:cacheprovider

      - name: Run real-trade-walk sweep wall-time bench
        run: |
          . .venv/bin/activate
          # DEC-M4PRO-WALLTIME-BENCH-001: times the REAL trade-walk
          # (ResidentSweepSim.count_trades — entry, SL/TP, 15:20 forced exit) over
          # a representative TF-mix window and projects wall time for BOTH the full
          # 33B grid AND the ~50%-conflict-pruned path. This is the DOMINANT cost
          # the 33B-SLA gate above EXCLUDES (it measures mask-AND + blake3 only).
          # -s -rA surface the measured trials/sec, per-trial µs and BOTH projected
          # wall-times in the CI log; the heavy timing is gated on BRUTEX_M4PRO_ABS=1
          # (set in the job env) and skips elsewhere. HONEST measurement, not a hard
          # perf gate (the gated body asserts only positive/finite sanity).
          pytest tests/bench/test_m4pro_sweep_walltime.py -q -s -rA --tb=short -p no:cacheprovider

      - name: Run strict 1.1x O(1) ratio tier
        run: |
          . .venv/bin/activate
          # BRUTEX_M4PRO_STRICT=1 (job env) tightens every O(1) ratio gate to the
          # decreed 1.1x ceiling (DEC-O1-STRICT-TIER-001) — meaningful only on
          # this quiet self-hosted runner; shared CI keeps the robust 3-10x tier.
          #
          # HONEST ENVELOPE (Golden Rule #10) — DORMANCY DISCLOSURE:
          # THIS strict 1.1x tier is DORMANT until the operator registers the
          # self-hosted [self-hosted, macos, m4pro] runner (see the header note
          # + `runs-on:` above). Until then this whole job sits "queued" and
          # never executes, so the strict 1.1x gate does NOT run on any current
          # CI. The ACTUALLY-RUNNABLE O(1) gate for EVERY bench below is the
          # `bench` job in ci.yml, which runs a bare `pytest tests/bench` (the
          # whole dir) on the shared ubuntu-24.04 runner at the robust ~5x tier
          # (BRUTEX_M4PRO_STRICT unset -> ratio_ceiling/cache_tier_ceiling return
          # their 5x default). So a real O(n) regression in any Golden-Rule-#5
          # hot path is caught on shared CI TODAY; the strict 1.1x is the
          # tighter second tier that activates once the M4-Pro runner is online.
          #
          # DEC-O1-BENCH-GATE-COMPLETE-001 (M2): the strict tier now lists EVERY
          # Golden-Rule-#5 hot path (CLAUDE.md §2 r5) as a dedicated ISOLATED
          # ratio gate — previously only LMDB/composite-dedup + the throughput
          # canary ran under BRUTEX_M4PRO_STRICT=1, so the dedicated bar-lookup,
          # indicator-lookup, u128 mask-eval, Bloom-probe, sweep-cache-digest,
          # result-append and BOS/CHoCH benches were gated at the strict 1.1x
          # ONLY implicitly (via the canary's dict/mask shapes) or not at all.
          # Listed below:
          #   (a) bar lookup             -> test_bar_lookup_o1.py
          #   (b) indicator value        -> test_indicator_lookup_o1.py
          #   (c) combo dedup (Bloom)    -> test_bloom_o1.py
          #       combo dedup (digest)   -> test_engine_sweep_cache_o1.py
          #   (d) strategy mask AND      -> test_engine_combo_mask_o1.py
          #   (e) result append/get      -> test_engine_results_store_o1.py
          #   (f) BOS/CHoCH per-bar (56-59) -> test_market_structure_o1.py
          # Cross-CPU-cache-tier paths (100K-object lookups / 10K-row inserts /
          # 10K-mask loops) route their strict ceiling through
          # cache_tier_ceiling() (the DEC-O1-CACHE-TIER-001 measured 3x
          # allowance) exactly like the canary's 1M-elem paths — the raw 1.1x is
          # physically unsatisfiable across a cache cliff; hash/compute-dominated
          # + fixed-window paths (Bloom probe, blake3 digest, BOS/CHoCH ring)
          # hold the true 1.1x.
          pytest tests/bench/test_store_o1.py tests/bench/test_option_dedup_o1.py \
            tests/bench/test_lmdb_membership_o1.py tests/bench/test_rate_limiter_o1.py \
            tests/bench/test_summary_cache_o1.py \
            tests/bench/test_bar_lookup_o1.py tests/bench/test_indicator_lookup_o1.py \
            tests/bench/test_bloom_o1.py tests/bench/test_engine_sweep_cache_o1.py \
            tests/bench/test_engine_combo_mask_o1.py \
            tests/bench/test_engine_results_store_o1.py \
            tests/bench/test_market_structure_o1.py \
            tests/bench/test_throughput_canary.py -q --tb=short -p no:cacheprovider

      - name: Run stats-manifest write A/B + /db O(page) paging gates
        run: |
          . .venv/bin/activate
          # DEC-LAKE-STATS-MANIFEST-001 (review round 4): the wall-clock A/B
          # merge-budget gate (test_stats_manifest_write_ab.py TestWallClockAB,
          # skipif-gated on BRUTEX_M4PRO_ABS=1 — set in the job env above) and
          # the strict-tier O(page) paging ratio gate (test_db_paging_o_page.py,
          # ratio_ceiling() tightened by BRUTEX_M4PRO_STRICT=1) previously
          # executed in NO workflow: this workflow is the ONLY one setting
          # those env vars, and it neither listed the files in `paths` nor ran
          # them, so the 12 ms merge-budget assertion was a permanently-skipped
          # test. The deterministic byte-parity / anti-storm / file-touch teeth
          # in both files also run on shared CI (ci.yml's bare
          # `pytest tests/bench`) at the robust tier. -s -rA surface the
          # measured median overhead + ratios (DEC-M4PRO-BENCH-SURFACE-001).
          pytest tests/bench/test_stats_manifest_write_ab.py \
            tests/bench/test_db_paging_o_page.py -q -s -rA --tb=short -p no:cacheprovider

      - name: Print summary
        if: always()
        run: |
          echo "::notice::M4 Pro absolute-throughput gate ran on ${{ runner.name }}"
          echo "::notice::Floor: 50 M ops/s (operator decree, STANDARDS row 14)"

      - name: Open issue on failure
        # A strict 50 M/s + 1.1x O(1)-tier gate breach must NOT fail silently.
        # Mirror safety.yml's proven alert step (COMMON, Golden Rule #11):
        # dedup-by-title (per-sha) then open a labelled issue. `failure()` fires
        # on ANY earlier step failing (incl. any perf/O(1) gate); scheduled runs
        # only (an operator-watched dispatch/push needs no issue).
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `bench-m4pro: failure on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,bench',
            });
            if (existing.data.find((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Bench M4Pro gate failed on ${context.sha}. See [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['bug', 'bench', 'critical'],
            });
