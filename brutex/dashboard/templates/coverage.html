<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BruteX — Coverage Ledger</title>
<style>
  :root {
    --bg: #0A0D11; --surface: #131722; --surface-2: #1A1F2C; --surface-3: #232938;
    --border: #1E222D; --border-strong: #2B313F;
    --text: #E5E8EC; --text-bright: #FFFFFF; --muted: #787B86;
    --green: #26D9B0; --green-bright: #4FFFD0; --green-dim: #1A8870;
    --red: #FF5C5C;
    --yellow: #FFB74D; --blue: #5B8DEF; --purple: #9D7BFF; --pink: #FF6B9D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
    background:
      radial-gradient(ellipse at top, rgba(91,141,239,0.06), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(38,217,176,0.04), transparent 60%),
      var(--bg);
  }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .5; transform: scale(.9);} }

  header {
    display:flex; align-items:center; gap:14px; padding:16px 24px;
    border-bottom:1px solid var(--border); animation: fadeInDown .5s ease both;
  }
  .logo { font-weight:800; font-size:18px; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--purple),var(--blue),var(--green));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); font-size:12px; }
  .live { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  .live .dot { width:9px; height:9px; border-radius:50%; background:var(--green);
    box-shadow:0 0 12px var(--green); animation: pulse 1.6s ease-in-out infinite; }

  .band { display:flex; align-items:center; gap:16px; padding:14px 24px; flex-wrap:wrap;
    border-bottom:1px solid var(--border); animation: fadeInDown .6s .05s ease both; }
  .kpi { display:flex; flex-direction:column; gap:2px; }
  .kpi .v { font-size:22px; font-weight:800; color:var(--text-bright); }
  .kpi .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .kpi .v.ok { color:var(--green); }
  .kpi .v.warn { color:var(--yellow); }
  .kpi .v.bad { color:var(--red); }
  button {
    background:var(--surface); color:var(--text); border:1px solid var(--border-strong);
    border-radius:9px; padding:9px 14px; font-size:13px; cursor:pointer; transition:.16s;
  }
  button:hover { border-color:var(--blue); }
  button.go { border-color:var(--green); color:var(--green); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #status { margin-left:auto; font-size:12px; color:var(--muted); }

  .panelwrap { flex:1; padding:14px 24px 24px; animation: fadeInUp .5s ease both; min-height:0; display:flex; }
  #panel {
    flex:1; overflow:auto; background:var(--surface); border:1px solid var(--border);
    border-radius:14px;
  }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th { position:sticky; top:0; background:var(--surface-2); color:var(--muted);
    font-weight:700; text-align:left; padding:10px 14px; z-index:1; font-size:11px;
    text-transform:uppercase; letter-spacing:.5px; }
  tbody td { padding:9px 14px; border-top:1px solid var(--border); }
  tbody tr:hover { background:var(--surface-2); }
  .sym { font-weight:700; color:var(--text-bright); }
  .st { font-weight:700; }
  .st.complete { color:var(--green); }
  .st.expiries_only { color:var(--blue); }
  .st.failed { color:var(--red); }
  .st.pending { color:var(--yellow); }
  .st.missing { color:var(--muted); }
  .err { color:var(--red); font-family:"SF Mono",Menlo,Consolas,monospace; font-size:11.5px; }
  .empty { color:var(--muted); font-size:13px; padding:28px 16px; text-align:center; }
</style>
</head>
<body>
  <header>
    <div class="logo">BruteX</div>
    <div class="sub">Coverage — completeness ledger (expiries + contracts from 2020)</div>
    <nav class="topnav" style="margin-left:18px; display:flex; gap:14px; font-size:13px;">
      <a href="/credentials" style="color:var(--blue); text-decoration:none;">Credentials</a>
      <span style="color:var(--muted);">·</span>
      <a href="/db" style="color:var(--blue); text-decoration:none;">Database</a>
      <span style="color:var(--muted);">·</span>
      <a href="/logs" style="color:var(--blue); text-decoration:none;">Logs</a>
      <span style="color:var(--muted);">·</span>
      <a href="/coverage" style="color:var(--blue); text-decoration:none;">Coverage</a>
    </nav>
    <div class="live" id="live"><span class="dot"></span><span id="livetxt">polling</span></div>
  </header>

  <div class="band">
    <div class="kpi"><span class="v" id="headline">— / —</span><span class="l">complete</span></div>
    <div class="kpi"><span class="v" id="pct">—%</span><span class="l">coverage</span></div>
    <div class="kpi"><span class="v" id="attempted">— / —</span><span class="l">pulled so far</span></div>
    <div class="kpi"><span class="v bad" id="failed">—</span><span class="l">failed (real errors)</span></div>
    <div class="kpi"><span class="v warn" id="pending">—</span><span class="l">pending (no F&amp;O)</span></div>
    <div class="kpi"><span class="v" id="missing">—</span><span class="l">not pulled yet</span></div>
    <button id="repull" class="go">Re-pull gaps</button>
    <span id="status"></span>
  </div>

  <div class="panelwrap">
    <div id="panel"><div class="empty">loading…</div></div>
  </div>

<script>
/* ── BruteX coverage ledger viewer (DEC-COVERAGE-LEDGER-001) ──
   Polls /api/v1/coverage every 4s for the headline + per-cell rows, and
   POSTs /api/v1/coverage/repull from the "Re-pull gaps" button. Every
   interpolated string is escaped before innerHTML (error messages can
   carry attacker-influenced content — same XSS lesson as the logs page). */
const panel = document.getElementById("panel");
const headlineEl = document.getElementById("headline");
const pctEl = document.getElementById("pct");
const attemptedEl = document.getElementById("attempted");
const failedEl = document.getElementById("failed");
const pendingEl = document.getElementById("pending");
const missingEl = document.getElementById("missing");
const repullBtn = document.getElementById("repull");
const statusEl = document.getElementById("status");
const liveTxt = document.getElementById("livetxt");

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

const MARK = { complete: "✓", expiries_only: "◐", failed: "⚠", pending: "…", missing: "—" };

function shortTs(ts) {
  if (!ts) return "";
  const t = String(ts);
  const i = t.indexOf("T");
  return i >= 0 ? t.slice(0, i) + " " + t.slice(i + 1, i + 9) : t;
}

function renderRows(rows) {
  if (!rows.length) {
    panel.innerHTML = '<div class="empty">no coverage cells yet — load the instrument master, add credentials, then Re-pull gaps</div>';
    return;
  }
  const body = rows.map(r => {
    const st = String(r.status || "missing");
    return "<tr>"
      + '<td><span class="sym">' + esc(r.underlying) + "</span></td>"
      + "<td>" + esc(r.exchange) + "</td>"
      + "<td>" + esc(r.year) + "</td>"
      + '<td><span class="st ' + esc(st) + '">' + (MARK[st] || "") + " " + esc(st) + "</span></td>"
      + "<td>" + esc(r.expiries_pulled) + "</td>"
      + "<td>" + esc(r.contracts_pulled) + "</td>"
      + "<td>" + esc(shortTs(r.last_fetched_at)) + "</td>"
      + '<td class="err">' + esc(r.error || "") + "</td>"
      + "</tr>";
  }).join("");
  panel.innerHTML =
    "<table><thead><tr>"
    + "<th>Underlying</th><th>Exchange</th><th>Year</th><th>Status</th>"
    + "<th>Expiries</th><th>Contracts</th><th>Last fetched</th><th>Error</th>"
    + "</tr></thead><tbody>" + body + "</tbody></table>";
}

async function poll() {
  try {
    const r = await fetch("/api/v1/coverage");
    if (!r.ok) { liveTxt.textContent = "error " + r.status; return; }
    const body = await r.json();
    const h = body.headline || {};
    headlineEl.textContent = (h.complete ?? "—") + " / " + (h.total ?? "—");
    pctEl.textContent = (h.percent ?? "—") + "%";
    pctEl.className = "v " + (h.is_complete ? "ok" : (h.percent >= 50 ? "warn" : "bad"));
    // "pulled so far" = attempted / total: the honest in-progress signal. A
    // high "not pulled yet" early in a run is NORMAL (the pull walks the grid),
    // not an error — only "failed" is a real error (DEC-PULL-ERROR-VISIBILITY-001).
    attemptedEl.textContent = (h.attempted ?? "—") + " / " + (h.total ?? "—");
    failedEl.textContent = h.failed ?? "—";
    failedEl.className = "v " + ((h.failed ?? 0) > 0 ? "bad" : "ok");
    pendingEl.textContent = h.pending ?? "—";
    missingEl.textContent = (h.not_pulled ?? h.missing) ?? "—";
    const attempted = h.attempted ?? 0;
    const total = h.total ?? 0;
    const inProgress = total > 0 && attempted < total;
    renderRows(body.rows || []);
    liveTxt.textContent = inProgress
      ? "pulling · " + attempted + " / " + total + " cells"
      : "live · " + (body.rows || []).length + " cells";
  } catch (e) {
    liveTxt.textContent = "offline";
  }
}

repullBtn.addEventListener("click", async () => {
  repullBtn.disabled = true;
  statusEl.textContent = "starting re-pull…";
  try {
    const r = await fetch("/api/v1/coverage/repull", { method: "POST" });
    const body = await r.json();
    statusEl.textContent = body.started
      ? "re-pull started — gaps refresh as cells complete"
      : "re-pull not started (no wired store / creds)";
  } catch (e) {
    statusEl.textContent = "re-pull request failed";
  } finally {
    setTimeout(() => { repullBtn.disabled = false; }, 3000);
  }
});

poll();
setInterval(poll, 4000);
</script>
</body>
</html>
