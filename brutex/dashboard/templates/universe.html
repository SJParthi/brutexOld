<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BruteX — F&amp;O Universe Explorer</title>
<style>
  :root {
    /* v28-hybrid locked palette (TRACK1_DASHBOARD_DESIGN.md §3) */
    --bg: #0A0D11; --surface: #131722; --surface-2: #1A1F2C; --surface-3: #232938;
    --border: #1E222D; --border-strong: #2B313F;
    --text: #E5E8EC; --text-bright: #FFFFFF; --muted: #787B86;
    --green: #26D9B0; --green-bright: #4FFFD0; --green-dim: #1A8870;
    --red: #FF5C5C;
    --yellow: #FFB74D; --blue: #5B8DEF; --purple: #9D7BFF; --pink: #FF6B9D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--text); min-height: 100vh;
    background:
      radial-gradient(ellipse at top, rgba(91,141,239,0.06), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(38,217,176,0.04), transparent 60%),
      var(--bg);
  }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInScale { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .6; transform: scale(.94);} }
  @keyframes sweep { from { left: -40%; } to { left: 140%; } }
  @keyframes beam { from { transform: translateX(-100%);} to { transform: translateX(100%);} }
  @keyframes popIn { 0% { transform: scale(0); } 70% { transform: scale(1.25);} 100% { transform: scale(1);} }

  header {
    display:flex; align-items:center; gap:14px; padding:16px 24px;
    border-bottom:1px solid var(--border); animation: fadeInDown .5s ease both;
  }
  .logo { font-weight:800; font-size:18px; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--purple),var(--blue),var(--green));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); font-size:12px; }
  .badge { margin-left:auto; font-size:11px; font-weight:700; letter-spacing:1px;
    color:#1A1300; background:linear-gradient(90deg,var(--yellow),#FFD089);
    padding:4px 10px; border-radius:20px; box-shadow:0 0 18px rgba(255,183,77,.5);
    animation: pulse 2.4s ease-in-out infinite; display:none; }
  .badge.on { display:inline-block; }

  /* ── Zone 1: filter + KPI band ── */
  .band { display:flex; align-items:center; gap:10px; padding:14px 24px; flex-wrap:wrap;
    border-bottom:1px solid var(--border); animation: fadeInDown .6s .05s ease both; }
  .tab { position:relative; overflow:hidden; cursor:pointer; user-select:none;
    background:var(--surface); border:1px solid var(--border-strong); border-radius:10px;
    padding:10px 16px; transition:.18s; display:flex; gap:10px; align-items:center; }
  .tab:hover { border-color:var(--blue); transform:translateY(-1px); }
  .tab.active { border-color:var(--yellow); box-shadow:0 0 0 1px var(--yellow) inset; }
  .tab.active::after { content:""; position:absolute; top:0; height:100%; width:30%;
    background:linear-gradient(90deg,transparent,rgba(255,183,77,.25),transparent);
    animation: sweep 2.2s linear infinite; }
  .tab .n { font-size:20px; font-weight:800; color:var(--text-bright); }
  .tab .lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .dot { width:8px; height:8px; border-radius:50%; }
  .search { margin-left:auto; background:var(--surface); border:1px solid var(--border-strong);
    border-radius:10px; padding:10px 14px; color:var(--text); min-width:180px; }

  /* ── Zones 2-4: drill grid ── */
  .grid { display:grid; grid-template-columns:1.1fr 1fr 1.4fr; gap:14px; padding:16px 24px; }
  .col { background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px; min-height:440px; animation: fadeInUp .5s ease both; }
  .col h3 { margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }

  .inst { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
    cursor:pointer; border:1px solid transparent; transition:.16s; animation: fadeInUp .4s ease both; }
  .inst:hover { background:var(--surface-2); box-shadow:0 0 22px rgba(91,141,239,.18); }
  .inst.sel { background:var(--surface-3); border-color:var(--blue); }
  .chip { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; }
  .chip.index { color:var(--purple); background:rgba(157,123,255,.13); }
  .chip.stock { color:var(--blue);   background:rgba(91,141,239,.13); }
  .inst .sym { font-weight:700; }
  .inst .nm { font-size:11px; color:var(--muted); }
  .inst .cc { margin-left:auto; font-size:11px; color:var(--muted); }

  .pill { display:inline-flex; align-items:center; gap:8px; margin:4px; padding:9px 13px;
    background:var(--surface-2); border:1px solid var(--border-strong); border-radius:24px;
    cursor:pointer; transition:.16s; animation: fadeInScale .35s ease both; }
  .pill:hover { border-color:var(--green); }
  .pill.sel { border-color:var(--yellow); box-shadow:0 0 16px rgba(255,183,77,.3); }
  .pill.near { color:var(--yellow); }

  .ladder { display:grid; grid-template-columns:1fr 56px 1fr; gap:4px 8px; align-items:center; }
  .ladder .hd { font-size:10px; color:var(--muted); text-transform:uppercase; text-align:center; }
  .cell { padding:7px 10px; border-radius:8px; font-size:13px; text-align:center; animation: fadeInUp .3s ease both; }
  .ce { background:rgba(38,217,176,.10); color:var(--green); }
  .pe { background:rgba(255,92,92,.10); color:var(--red); }
  .strike { text-align:center; color:var(--muted); font-weight:700; }

  .empty { color:var(--muted); font-size:13px; padding:24px 8px; text-align:center; }

  /* ── Click-to-pull ── */
  .pullbar { display:flex; align-items:center; gap:14px; margin:0 24px 8px; padding:14px 18px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px; }
  .pullbar .lead { font-size:13px; color:var(--muted); }
  .pullbar b { color:var(--text-bright); }
  .pullbtn { margin-left:auto; cursor:pointer; border:none; border-radius:10px; padding:11px 18px;
    font-weight:800; color:#1A1300; background:linear-gradient(90deg,var(--yellow),#FFD089);
    box-shadow:0 0 18px rgba(255,183,77,.4); transition:.15s; }
  .pullbtn:hover { transform:translateY(-1px); box-shadow:0 0 26px rgba(255,183,77,.7); }
  .pullbtn:disabled { opacity:.5; cursor:default; box-shadow:none; }

  #pullpanel { margin:0 24px 28px; padding:18px; border:1px solid var(--border); border-radius:14px;
    background:var(--surface); display:none; position:relative; overflow:hidden; }
  #pullpanel.on { display:block; animation: fadeInUp .4s ease both; }
  #pullpanel .title { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  #pullpanel .beam { position:absolute; top:0; left:0; height:3px; width:40%;
    background:linear-gradient(90deg,transparent,var(--yellow),transparent); animation: beam 1.1s linear infinite; }
  .tfgrid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .tf { padding:10px 6px; border-radius:9px; text-align:center; font-size:12px;
    background:var(--surface-2); border:1px solid var(--border-strong); color:var(--muted); transition:.3s; }
  .tf.done { background:rgba(38,217,176,.14); border-color:var(--green); color:var(--green-bright); }
  .tf.failed { background:rgba(255,92,92,.14); border-color:var(--red); color:var(--red); }
  .tf.active { background:rgba(255,183,77,.16); border-color:var(--yellow); color:var(--yellow); }
  .counter { font-size:28px; font-weight:800; color:var(--green-bright); }
  .spark { display:inline-block; animation: popIn .5s ease both; }
</style>
</head>
<body>
  <header>
    <div class="logo">BruteX</div>
    <div class="sub">F&amp;O Universe Explorer</div>
    <div class="badge" id="previewBadge">● PREVIEW · synthetic data</div>
  </header>

  <div class="band" id="tabs"></div>

  <div class="pullbar">
    <div class="lead" id="pulllead">Select an instrument to pull its spot data</div>
    <button class="pullbtn" id="pullbtn" disabled>⤓ Pull spot — all timeframes</button>
  </div>

  <div id="pullpanel">
    <div class="beam"></div>
    <div class="title"><b id="pulltitle">Pulling…</b><span class="counter" id="counter">0</span><span class="sub">chunks</span></div>
    <div class="tfgrid" id="tfgrid"></div>
  </div>

  <div class="grid">
    <div class="col"><h3>Instruments</h3><div id="instruments"><div class="empty">loading…</div></div></div>
    <div class="col"><h3>Expiries</h3><div id="expiries"><div class="empty">← pick an instrument</div></div></div>
    <div class="col"><h3>Contracts (option chain)</h3><div id="contracts"><div class="empty">pick an expiry</div></div></div>
  </div>

<script>
/* ── F&O Universe Explorer — real data via /api/v1/universe/* ── */
/* Two kinds only: Index + Stock (F&O-eligible). No non-F&O cash-equity tab. */
let filter = "index";          // active tab kind
let UNIV = [];                 // [{symbol,name,kind,exchange}]
let selInst = null;            // selected symbol
let selExp = null;             // selected expiry ISO date

const TABS = [["index","Index","#9D7BFF"],["stock","Stocks","#5B8DEF"]];
const tabsEl = document.getElementById("tabs");
const search = document.createElement("input");

function buildTabs(summary) {
  tabsEl.innerHTML = "";
  const counts = {index: summary.index_count, stock: summary.stock_count};
  TABS.forEach(([k,lbl,c]) => {
    const t = document.createElement("div");
    t.className = "tab" + (k === filter ? " active" : "");
    t.dataset.k = k;
    t.innerHTML = `<span class="dot" style="background:${c}"></span>`
      + `<div><div class="n" data-target="${counts[k] || 0}">0</div>`
      + `<div class="lbl">${lbl}</div></div>`;
    t.onclick = () => {
      filter = k;
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.k === k));
      loadInstruments();
    };
    tabsEl.appendChild(t);
  });
  search.className = "search";
  search.placeholder = "Search symbol…";
  search.oninput = renderInstruments;
  tabsEl.appendChild(search);
  countUp();
}

function countUp() {
  document.querySelectorAll('.n').forEach(el => {
    const tgt = +el.dataset.target; let s = null;
    function step(ts) {
      if (!s) s = ts;
      const p = Math.min((ts - s) / 700, 1);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(tgt * e);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

async function loadSummary() {
  try {
    const r = await fetch('/api/v1/universe/summary');
    if (!r.ok) { buildTabs({index_count:0, stock_count:0}); return; }
    buildTabs(await r.json());
  } catch (e) { buildTabs({index_count:0, stock_count:0}); }
}

async function loadInstruments() {
  const el = document.getElementById("instruments");
  el.innerHTML = '<div class="empty">loading…</div>';
  try {
    const r = await fetch('/api/v1/universe/instruments?kind=' + encodeURIComponent(filter));
    const body = await r.json();
    UNIV = body.instruments || [];
  } catch (e) { UNIV = []; }
  renderInstruments();
}

function renderInstruments() {
  const q = (search.value || "").toUpperCase();
  const list = UNIV.filter(i => i.symbol.toUpperCase().includes(q)
    || (i.name || "").toUpperCase().includes(q));
  const el = document.getElementById("instruments");
  el.innerHTML = list.length ? "" : '<div class="empty">no matches</div>';
  list.forEach((i, ix) => {
    const d = document.createElement("div");
    d.className = "inst" + (selInst === i.symbol ? " sel" : "");
    d.style.animationDelay = (ix * 0.03) + "s";
    d.innerHTML = `<span class="chip ${i.kind}">${i.kind}</span>`
      + `<div><div class="sym">${i.symbol}</div><div class="nm">${i.name}</div></div>`
      + `<span class="cc">${i.exchange}</span>`;
    d.onclick = () => selectInstrument(i);
    el.appendChild(d);
  });
}

async function selectInstrument(i) {
  selInst = i.symbol; selExp = null;
  renderInstruments();
  document.getElementById("pulllead").innerHTML =
    `Ready to pull <b>${i.symbol}</b> spot — all timeframes`;
  document.getElementById("pullbtn").disabled = false;
  const ex = document.getElementById("expiries");
  ex.innerHTML = '<div class="empty">loading…</div>';
  document.getElementById("contracts").innerHTML = '<div class="empty">pick an expiry →</div>';
  try {
    const r = await fetch('/api/v1/expiries?underlying=' + encodeURIComponent(i.symbol));
    const body = await r.json();
    const expiries = (body.expiries || []);
    if (!expiries.length) { ex.innerHTML = '<div class="empty">no F&O expiries in the lake yet</div>'; return; }
    ex.innerHTML = "";
    expiries.forEach((e, ix) => {
      const p = document.createElement("span");
      p.className = "pill" + (ix === 0 ? " near" : "");
      p.style.animationDelay = (ix * 0.05) + "s";
      p.textContent = e.expiry_date;
      p.onclick = () => selectExpiry(i.symbol, e.expiry_date, p);
      ex.appendChild(p);
    });
  } catch (e) { ex.innerHTML = '<div class="empty">error loading expiries</div>'; }
}

function selectExpiry(symbol, expiry, el) {
  selExp = expiry;
  document.querySelectorAll('#expiries .pill').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  renderContracts(symbol, expiry);
}

async function renderContracts(symbol, expiry) {
  const c = document.getElementById("contracts");
  c.innerHTML = '<div class="empty">loading…</div>';
  try {
    const r = await fetch('/api/v1/contracts?underlying=' + encodeURIComponent(symbol)
      + '&expiry=' + encodeURIComponent(expiry));
    const body = await r.json();
    const contracts = body.contracts || [];
    if (!contracts.length) { c.innerHTML = '<div class="empty">no contracts in the lake for this expiry</div>'; return; }
    // Group by strike → {ce, pe}
    const byStrike = {};
    contracts.forEach(ct => {
      const s = ct.strike_price || "—";
      byStrike[s] = byStrike[s] || {};
      if (ct.instrument_type === "CE") byStrike[s].ce = ct.contract_symbol;
      else if (ct.instrument_type === "PE") byStrike[s].pe = ct.contract_symbol;
    });
    const strikes = Object.keys(byStrike).sort((a, b) => parseFloat(a) - parseFloat(b));
    let h = '<div class="ladder"><div class="hd">CALL (CE)</div><div class="hd">Strike</div><div class="hd">PUT (PE)</div>';
    strikes.forEach((s, ix) => {
      const row = byStrike[s];
      h += `<div class="cell ce" style="animation-delay:${ix * 0.02}s">${row.ce ? "CE" : "—"}</div>`
        + `<div class="strike">${s}</div>`
        + `<div class="cell pe" style="animation-delay:${ix * 0.02}s">${row.pe ? "PE" : "—"}</div>`;
    });
    h += '</div>';
    c.innerHTML = h;
  } catch (e) { c.innerHTML = '<div class="empty">error loading contracts</div>'; }
}

/* ── click-to-pull (real POST /api/v1/universe/pull) ── */
document.getElementById("pullbtn").onclick = async () => {
  if (!selInst) return;
  const btn = document.getElementById("pullbtn");
  const panel = document.getElementById("pullpanel");
  panel.classList.add("on");
  btn.disabled = true;
  document.getElementById("pulltitle").textContent = `Pulling ${selInst} spot · all timeframes`;
  const grid = document.getElementById("tfgrid");
  grid.innerHTML = "";
  document.getElementById("counter").textContent = "0";
  try {
    const r = await fetch('/api/v1/universe/pull?symbol=' + encodeURIComponent(selInst), {method: 'POST'});
    const report = await r.json();
    document.getElementById("previewBadge").classList.toggle("on", !!report.dry_run);
    const tfs = report.timeframes || [];
    grid.innerHTML = "";
    tfs.forEach(tf => {
      const d = document.createElement("div");
      d.className = "tf " + (tf.failed > 0 ? "failed" : "done");
      d.textContent = tf.interval;
      grid.appendChild(d);
    });
    document.getElementById("counter").textContent =
      (report.total_completed || 0).toLocaleString('en-IN');
    const verb = report.dry_run ? "preview-pulled (synthetic)" : "pulled";
    document.getElementById("pulltitle").innerHTML =
      `<span class="spark">✓</span> ${selInst} spot ${verb} — ${tfs.length} timeframes`;
  } catch (e) {
    document.getElementById("pulltitle").innerHTML =
      `<span style="color:var(--red)">✕</span> pull failed: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
};

loadSummary().then(loadInstruments);
</script>
</body>
</html>
