async function runRegistryQuery(gridOnly) {
  const partial = gridOnly && document.getElementById("dbgrid");
  if (partial) document.getElementById("dbgrid").classList.add("is-loading");
  else showSkeleton(dataEl);
  try {
    const r = await bxFetch(registryUrl());
    const body = await r.json();
    if (!r.ok) {
      const msg = bxErrorHtml("error " + r.status);
      if (partial) { const g = document.getElementById("dbgrid"); g.classList.remove("is-loading"); g.innerHTML = msg; }
      else dataEl.innerHTML = msg;
      return;
    }
    /* Backfill the registry nav badges from the route's counts (the cache may be
       empty until a pull populates it, so loadTables can't know the totals). */
    updateRegistryBadges(body.counts || {});
    if (partial) updateRegistryGrid(body); else renderRegistryView(body);
  } catch (e) {
    /* A mid-page network drop is an HONEST "offline", NOT a "no data" empty state
       (hostile-review MINOR-1/2) — mirror the candle path. */
    const off = bxOfflineHtml(e);
    if (partial) { const g = document.getElementById("dbgrid"); if (g) { g.classList.remove("is-loading"); g.innerHTML = off; } }
    else dataEl.innerHTML = off;
  }
}

async function selectRegistry(kind) {
  mode = "registry";
  selected = null;
  if (kind !== rstate.kind) rstate.offset = 0;   /* a fresh registry tab starts at page 1 */
  rstate.kind = kind;
  markRegistry(kind);
  runRegistryQuery(false);
}

/* Fill the registry nav badges with the live expiry/contract counts (the cache
   is empty/absent at loadTables time, so the totals arrive with the grid fetch). */
function updateRegistryBadges(counts) {
  const set = (kind, n) => {
    const row = tablesEl.querySelector('.tbl[data-registry="' + kind + '"] .badge');
    if (row) row.textContent = (Number(n) || 0).toLocaleString();
  };
  set("expiries", counts.expiries);
  set("contracts", counts.contracts);
}

/* Every column is ALWAYS visible (DEC-DB-UX-PACK-001 Feature 1): no `column=`
   projection is ever sent, so the backend returns EVERY stored column (spot
   OHLCV, the expired-option stamps, the stored F&O Greeks overlay where the
   partition holds it) plus its derived columns. The per-lake column-picker
   lists and their helper were deleted with the COLUMNS strip. */

/* Shared grid + Prev/Next pager HTML (used by both table + candle views).
   The pager buttons get ids dbprev/dbnext; every view publishes its page window
   into the ONE delegated pager via setGridPager (DEC-DASHBOARD-JS-PERF-001).
   The builder is split into pure pieces (table-open / thead / tbody rows /
   pager) so a grid-only update can swap JUST the tbody in place; concatenated,
   the pieces produce the SAME esc()'d HTML the old single-string builder did
   (plus the data-cols stamp on the <table> open tag). */
function gridTableOpen(cols) {
  /* The <table> open tag carries its rendered column list (JSON, esc()'d) so a
     grid-only update can prove "same columns" against the LIVE DOM before doing
     the narrower tbody-only patch — the DOM is the source of truth, so an error
     or empty repaint can never leave a stale match behind. */
  return '<table data-cols="' + esc(JSON.stringify(cols)) + '">';
}
function gridTheadHtml(cols) {
  return '<thead><tr>' + cols.map(c => {
    const t = colType(c);
    return '<th><span class="tchip ' + t.cls + '" title="' + t.title + '">' + t.glyph + '</span>' + esc(c) + '</th>';
  }).join("") + '</tr></thead>';
}
function gridRowsHtml(cols, rows) {
  return rows.map(row =>
    '<tr>' + row.map((cell, i) =>
      cell == null ? '<td class="nullcell">null</td>' : '<td class="' + moneynessClass(cols[i], cell).trim() + '">' + esc(fmtCell(cols[i], cell)) + '</td>'
    ).join("") + '</tr>'
  ).join("");
}
function gridRangeText(from, to, total) {
  return from.toLocaleString() + '–' + to.toLocaleString() + ' / ' + total.toLocaleString();
}
function gridPagerHtml(total, off, rowCount) {
  const from = total === 0 ? 0 : off + 1;
  const to = off + rowCount;
  const hasPrev = off > 0, hasNext = to < total;
  return '<div class="pager">'
    + '<button id="dbprev"' + (hasPrev ? "" : " disabled") + '>‹ Prev</button>'
    + '<span class="prange">' + gridRangeText(from, to, total) + '</span>'
    + '<button id="dbnext"' + (hasNext ? "" : " disabled") + '>Next ›</button></div>';
}
function gridAndPager(cols, rows, total, off, lim, note) {
  let html = "";
  if (!rows.length) {
    /* Schema-when-empty: when the table has no rows BUT the backend returned its
       column DEFINITIONS, render the column header so the operator can verify the
       columns exist, plus the honest note. With no columns at all, the plain
       "no rows" message. Never fabricates a data row (Golden Rule #1). */
    if (cols.length) {
      html += '<div class="gridwrap">' + gridTableOpen(cols) + gridTheadHtml(cols) + '</table></div>';
      html += '<div class="empty">' + esc(note || "no rows on this page") + '</div>';
    } else {
      html += '<div class="empty">no rows on this page</div>';
    }
  } else {
    html += '<div class="gridwrap">' + gridTableOpen(cols) + gridTheadHtml(cols)
      + '<tbody>' + gridRowsHtml(cols, rows) + '</tbody></table></div>';
  }
  html += gridPagerHtml(total, off, rows.length);
  return html;
}

/* In-place grid patch (DEC-DASHBOARD-JS-PERF-001): when #dbgrid already shows a
   data table whose column set matches the incoming page, swap ONLY the tbody
   rows (the SAME esc()'d row strings gridAndPager builds — narrower target) and
   patch the pager buttons' disabled state + the range text via textContent, so
   the .gridwrap scroll container (and its horizontal scroll position) survives
   the paging click. Returns false when the shapes differ — no table/tbody yet,
   an empty page, a column-set change — so the caller falls back to today's full
   grid.innerHTML rebuild; error/empty states always take the full-rebuild path. */
function patchGridRows(grid, cols, rows, total, off) {
  if (!rows.length || !cols.length || !(total > 0)) return false;
  const table = grid.querySelector(".gridwrap > table");
  if (!table || table.getAttribute("data-cols") !== JSON.stringify(cols)) return false;
  const tbody = table.querySelector("tbody");
  const prev = grid.querySelector("#dbprev"), next = grid.querySelector("#dbnext");
  const range = grid.querySelector(".pager .prange");
  if (!tbody || !prev || !next || !range) return false;
  tbody.innerHTML = gridRowsHtml(cols, rows);
  const to = off + rows.length;
  prev.disabled = !(off > 0);
  next.disabled = !(to < total);
  range.textContent = gridRangeText(off + 1, to, total);
  return true;
}

/* ONE delegated Prev/Next pager (DEC-DASHBOARD-JS-PERF-001): every grid render /
   update PUBLISHES its page window + rerun callback here instead of re-attaching
   click listeners to the freshly-built #dbprev/#dbnext (the old per-render
   wire*Pager helpers — a missed re-wire meant a silently dead pager). The
   delegated listener on #data (attached once at boot, mirroring the delegated
   copy handler) reads this state on each click. */
const pagerState = { off: 0, lim: 100, onPage: null };
function setGridPager(body, defLim, onPage) {
  pagerState.off = body ? Number(body.offset || 0) : 0;
  pagerState.lim = body ? Number(body.limit || defLim) : defLim;
  pagerState.onPage = onPage;
}

/* ── Table mode (structured query) ── */
/* Browses a DuckDB master table via the `/api/v1/db` structured-query route
   family (columns/query/grid), remembered per-table in qstate so paging /
   apply-query re-use it. */
async function selectTable(name) {
  mode = "table";
  selected = name;
  dbOffset = 0;
  markSelected(name);
  if (!qstate[name]) qstate[name] = { allCols: [], filters: [], orderBy: "", desc: false };
  if (!qstate[name].allCols.length) {
    try {
      const rc = await bxFetch(DB_API + "/columns/" + encodeURIComponent(name));
      if (rc.ok) qstate[name].allCols = (await rc.json()).columns || [];
    } catch (e) { /* offline — controls degrade to none */ }
  }
  runTableQuery(name);
}

function buildTableUrl(name) {
  const st = qstate[name];
  /* No `column=` projection is ever sent — omitting it returns EVERY column
     (DEC-DB-UX-PACK-001 Feature 1: all columns always visible). */
  let u = DB_API + "/query/" + encodeURIComponent(name)
    + "?limit=" + encodeURIComponent(limitSel.value) + "&offset=" + encodeURIComponent(dbOffset);
  st.filters.forEach(f => { if (f.c && f.op) u += "&f=" + encodeURIComponent(f.c + ":" + f.op + ":" + f.v); });
  if (st.orderBy) u += "&order_by=" + encodeURIComponent(st.orderBy) + "&desc=" + (st.desc ? "true" : "false");
  return u;
}

/* `gridOnly` mirrors runCandleQuery: page / sort / apply within the SAME table
   update only #dbgrid (the column/filter/sort control bar stays put); a fresh
   table selection (gridOnly falsy) does the full render once
   (DEC-DB-UNIVERSE-O1-LATENCY-001). */
async function runTableQuery(name, gridOnly) {
  const partial = gridOnly && document.getElementById("dbgrid");
  if (partial) document.getElementById("dbgrid").classList.add("is-loading");  /* keep the grid, just dim it */
  else showSkeleton(dataEl);
  try {
    const r = await bxFetch(buildTableUrl(name));
    const body = await r.json();
    const errMsg = r.ok ? null : (body.detail || ("error " + r.status));
    if (partial) updateTableGrid(name, r.ok ? body : null, errMsg);
    else renderTableView(name, r.ok ? body : null, errMsg);
  } catch (e) {
    if (partial) updateTableGrid(name, null, "offline");
    else dataEl.innerHTML = bxOfflineHtml(e);
  }
}

function tableControlsHtml(name) {
  const st = qstate[name];
  const cols = st.allCols;
  const filterRows = st.filters.map(f =>
    '<div class="frow">'
    + '<select class="fcol"><option value="">column…</option>'
    + cols.map(c => '<option value="' + esc(c) + '"' + (c === f.c ? " selected" : "") + '>' + esc(c) + '</option>').join("") + '</select>'
    + '<select class="fop">' + OPS.map(o => '<option value="' + o[0] + '"' + (o[0] === f.op ? " selected" : "") + '>' + esc(o[1]) + '</option>').join("") + '</select>'
    + '<input class="fval" placeholder="value" value="' + esc(f.v) + '">'
    + '<button class="rm" title="remove filter">✕</button></div>'
  ).join("");
  return '<div class="qbar">'
    + '<div class="qrow"><span class="lab">Filters</span>'
    + '<div id="filters" style="display:flex;flex-direction:column;gap:6px">' + filterRows + '</div>'
    + '<button id="addf">+ filter</button></div>'
    + '<div class="qrow"><span class="lab">Sort</span>'
    + '<select id="sortcol"><option value="">— none —</option>'
    + cols.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join("") + '</select>'
    + '<select id="sortdir"><option value="asc">asc</option><option value="desc">desc</option></select>'
    + '<button class="apply" id="applyq">Apply query</button></div>'
    + '</div>';
}

function readControlsInto(name) {
  const st = qstate[name];
  st.filters = Array.from(document.querySelectorAll("#filters .frow")).map(row => ({
    c: row.querySelector(".fcol").value,
    op: row.querySelector(".fop").value,
    v: row.querySelector(".fval").value,
  }));
  const sc = document.getElementById("sortcol");
  const sd = document.getElementById("sortdir");
  st.orderBy = sc ? sc.value : "";
  st.desc = sd ? sd.value === "desc" : false;
}

/* The table grid head ("<table> · N cols · M rows match"). */
function tableHeadHtml(name, body) {
  const sub = body ? ((body.columns || []).length + " cols · " + Number(body.total || 0).toLocaleString() + " rows match") : "";
  return '<div class="datahead"><span class="dt">' + esc(name) + '</span><span class="sub">' + esc(sub) + '</span></div>';
}
function tableGridHtml(body, err) {
  if (err) return err === "offline" ? bxOfflineHtml(null) : bxErrorHtml(err);
  return gridAndPager(body.columns || [], body.rows || [], Number(body.total || 0), Number(body.offset || 0), Number(body.limit || 50), body && body.note);
}
function setTablePager(name, body) {
  setGridPager(body, 50, (off) => { dbOffset = off; runTableQuery(name, true); });
}

/* FULL render: head + control bar + grid container. Used on a fresh table
   selection and on add/remove-filter (the control bar changes); Apply / sort /
   paging afterwards update only #dbgrid (updateTableGrid). */
function renderTableView(name, body, err) {
  const st = qstate[name];
  dataEl.innerHTML = tableHeadHtml(name, body) + tableControlsHtml(name)
    + '<div id="dbgrid">' + tableGridHtml(body, err) + '</div>';
  const sc = document.getElementById("sortcol"); if (sc) sc.value = st.orderBy || "";
  const sd = document.getElementById("sortdir"); if (sd) sd.value = st.desc ? "desc" : "asc";
  const addf = document.getElementById("addf");
  if (addf) addf.addEventListener("click", () => { readControlsInto(name); st.filters.push({ c: "", op: "eq", v: "" }); renderTableView(name, body, err); });
  document.querySelectorAll("#filters .rm").forEach((b, i) => b.addEventListener("click", () => { readControlsInto(name); st.filters.splice(i, 1); renderTableView(name, body, err); }));
  const ap = document.getElementById("applyq");
  if (ap) ap.addEventListener("click", () => { readControlsInto(name); dbOffset = 0; runTableQuery(name, true); });
  setTablePager(name, body);
}

/* GRID-ONLY update: patch the tbody in place when the column set is unchanged
   (DEC-DASHBOARD-JS-PERF-001), else replace #dbgrid; refresh the row-count sub;
   the control bar stays put (DEC-DB-UNIVERSE-O1-LATENCY-001). */
function updateTableGrid(name, body, err) {
  const grid = document.getElementById("dbgrid");
  if (!grid) { renderTableView(name, body, err); return; }  /* defensive: no container → full */
  grid.classList.remove("is-loading");
  const patched = !err && !!body && patchGridRows(grid, body.columns || [], body.rows || [],
    Number(body.total || 0), Number(body.offset || 0));
  if (!patched) grid.innerHTML = tableGridHtml(body, err);
  const sub = dataEl.querySelector(".datahead .sub");
  if (sub) sub.textContent = body ? ((body.columns || []).length + " cols · " + Number(body.total || 0).toLocaleString() + " rows match") : "";
  setTablePager(name, body);
}

/* ── Candle mode (Parquet lake via read_parquet) ── */
/* A dataset key is "kind:coords" so spot (bars/) and option (options/) sets
   never alias. Spot coords are exchange|segment|symbol|interval; option coord
   is the on-disk series segment. */
function dsKey(d) {
  if (d.kind === "option") return "option:" + d.series;
  /* F&O contract sets share the spot coords (exchange|segment=FNO|symbol|interval)
     but carry their own "fno:" prefix so the two pickers never alias a key. */
  if (d.kind === "fno") return "fno:" + [d.exchange, d.segment, d.symbol, d.interval].join("|");
  return "spot:" + [d.exchange, d.segment, d.symbol, d.interval].join("|");
}
function curDataset() { return cstate.datasets.find(d => dsKey(d) === cstate.key) || null; }
/* Friendly decoded label for an F&O contract dataset (underlying · expiry ·
   strike+CE/PE or FUT · interval), falling back to the raw groww_symbol when the
   directory name didn't decode (DEC-FNO-CANDLE-LAKE-001). Display-only — dsKey() /
   buildCandleUrl() still address the raw symbol coords. */
function fnoLabel(d) {
  if (!d.underlying) return d.symbol + " · " + d.interval;
  const leg = d.instrument_type === "FUT"
    ? "FUT"
    : (d.strike != null ? d.strike + " " : "") + (d.option_type || "");
  return d.underlying + " · " + d.expiry + " · " + leg + " · " + d.interval;
}

async function selectCandles(kind) {
  mode = "candles";
  selected = null;
  /* Switching between the spot lake and the expired-options lake resets the
     per-lake view (selected dataset / page) so the two dedicated rows never
     leak each other's pager position. */
  if (kind !== cstate.kind) { cstate.kind = kind; cstate.key = null; }
  cstate.offset = 0;
  markCandles();
  const isOpt = cstate.kind === "option";
  const isFno = cstate.kind === "fno";
  showSkeleton(dataEl);
  /* F&O uses the lazy symbol→expiry→contract cascade (DEC-DB-FNO-CASCADE-001);
     SPOT uses the symbol→interval cascade (DEC-DB-SPOT-CASCADE-001) — both O(1)
     tiny payloads, not a flat thousand/750-row dropdown. Only the expired-options
     lake keeps the flat dataset dropdown below. */
  if (isFno) { await loadFnoCascade(); return; }
  if (!isOpt) { await loadSpotCascade(); return; }
  try {
    const r = await bxFetch("/api/v1/db/candles/datasets");
    /* An HTTP error is an ERROR, never a fake "no data yet" empty (Golden Rule #1). */
    if (!r.ok) { renderCandleView(null, "error " + r.status); return; }
    const body = await r.json();
    /* Only the expired-options lake reaches here (spot + F&O returned early to their
       cascades) — tag each so buildCandleUrl() picks the option query route. */
    cstate.datasets = (body.options || []).map(d => ({ kind: "option", ...d }));
    if (!curDataset() && cstate.datasets.length) cstate.key = dsKey(cstate.datasets[0]);
    if (cstate.datasets.length) runCandleQuery(false);
    else renderCandleView(null, null, { kind: "empty",
      text: "No expired-option data yet — pull an instrument's options on /universe first." });
  } catch (e) {
    dataEl.innerHTML = bxOfflineHtml(e);
  }
}

/* ── F&O symbol→expiry→contract cascade (DEC-DB-FNO-CASCADE-001) ──
   Each level is a tiny O(1)-cached fetch; only when a CONTRACT is picked do we
   build the (interval) dataset descriptors so curDataset()/buildCandleUrl() work
   exactly as for spot — the cascade is purely the picker, the query path is shared. */
async function _fnoFetch(url) {
  try { const r = await bxFetch(url); return r.ok ? await r.json() : null; }
  catch (e) { return null; }
}
async function loadFnoCascade() {
  const body = await _fnoFetch("/api/v1/db/fno/underlyings");
  cstate.fno = { unds: (body && body.underlyings) || [],
                 und: "", exps: [], exp: "", counts: [], cons: [], con: "" };
  cstate.datasets = []; cstate.key = null;
  /* A failed fetch (500 / offline / timeout) is an ERROR card with Retry —
     never the false "No F&O candle data yet" empty (Golden Rule #1). */
  if (body === null) { renderCandleView(null, "couldn't load the F&O underlyings"); return; }
  if (!cstate.fno.unds.length) {
    renderCandleView(null, null, { kind: "empty",
      text: "No F&O candle data yet — pull an instrument's futures/options history on /universe first." });
    return;
  }
  renderCandleView(null, null, { kind: "prompt", text: "pick an underlying → expiry → contract" });
}
async function onFnoUnderlyingChange(und) {
  cstate.fno.und = und; cstate.fno.exp = ""; cstate.fno.exps = []; cstate.fno.counts = [];
  cstate.fno.con = ""; cstate.fno.cons = []; cstate.datasets = []; cstate.key = null;
  if (und) {
    const body = await _fnoFetch("/api/v1/db/fno/expiries?underlying=" + encodeURIComponent(und));
    if (body === null) { renderCandleView(null, "couldn't load the expiries"); return; }
    cstate.fno.exps = (body && body.expiries) || [];
    /* Per-expiry "listed N with data M" rows, aligned with `expiries`
       (DEC-DB-UX-PACK-001 Feature 6). */
    cstate.fno.counts = (body && body.expiry_counts) || [];
  }
  renderCandleView(null, null, { kind: "prompt", text: "pick an expiry" });
}
async function onFnoExpiryChange(exp) {
  cstate.fno.exp = exp; cstate.fno.con = ""; cstate.fno.cons = [];
  cstate.datasets = []; cstate.key = null;
  if (exp) {
    const body = await _fnoFetch("/api/v1/db/fno/contracts?underlying="
      + encodeURIComponent(cstate.fno.und) + "&expiry=" + encodeURIComponent(exp));
    if (body === null) { renderCandleView(null, "couldn't load the contracts"); return; }
    cstate.fno.cons = (body && body.contracts) || [];
  }
  renderCandleView(null, null, { kind: "prompt", text: "pick a contract" });
}
/* A contract carries its available intervals; materialise ONE fno dataset
   descriptor per interval so the shared candle query path can address it, then
   select the first interval and run the page. */
function onFnoContractChange(symbol) {
  cstate.fno.con = symbol;
  const con = cstate.fno.cons.find(c => c.symbol === symbol) || null;
  if (!con) { cstate.datasets = []; cstate.key = null; renderCandleView(null, null, { kind: "prompt", text: "pick a contract" }); return; }
  cstate.datasets = (con.intervals || []).map(iv => ({
    kind: "fno", exchange: con.exchange, segment: "FNO", symbol: con.symbol, interval: iv,
    underlying: cstate.fno.und, expiry: cstate.fno.exp,
    strike: con.strike, instrument_type: con.instrument_type, option_type: con.option_type }));
  cstate.offset = 0;
  /* Default to 1-minute (the fetched granularity an operator most wants for an F&O
     contract); fall back to the first available interval otherwise. */
  const pref = cstate.datasets.find(x => x.interval === "1minute") || cstate.datasets[0];
  cstate.key = pref ? dsKey(pref) : null;
  if (cstate.key) runCandleQuery(false); else renderCandleView(null, null, { kind: "prompt", text: "pick a contract" });
}

/* ── SPOT symbol→interval cascade (DEC-DB-SPOT-CASCADE-001) ──
   The spot twin of the F&O cascade: ONE O(1)-cached fetch of the symbols (each
   carrying its STORED intervals inline), then a symbol pick materialises the
   per-interval dataset descriptors so curDataset()/buildCandleUrl() work exactly
   as the flat dropdown did — the cascade is purely the picker, the query path is
   shared. A symbol is keyed by its "exchange|segment|symbol" composite so two
   exchanges' same-named symbols never alias. */
function _spotKey(s) { return [s.exchange, s.segment, s.symbol].join("|"); }
async function loadSpotCascade() {
  const body = await _fnoFetch("/api/v1/db/spot/symbols");
  cstate.spot = { syms: (body && body.symbols) || [], sym: "" };
  cstate.datasets = []; cstate.key = null;
  /* A failed fetch is an ERROR card with Retry — never the false "No spot
     candle data yet" empty (Golden Rule #1). */
  if (body === null) { renderCandleView(null, "couldn't load the spot symbols"); return; }
  if (!cstate.spot.syms.length) {
    renderCandleView(null, null, { kind: "empty",
      text: "No spot candle data yet — pull an instrument's timeframes on /universe first." });
    return;
  }
  renderCandleView(null, null, { kind: "prompt", text: "pick a symbol → interval" });
}
/* A symbol carries its available STORED intervals; materialise ONE spot dataset
   descriptor per interval so the shared candle query path can address it, then
   default to 1-minute and run the page. */
function onSpotSymbolChange(key) {
  cstate.spot.sym = key;
  const s = cstate.spot.syms.find(x => _spotKey(x) === key) || null;
  if (!s) { cstate.datasets = []; cstate.key = null; renderCandleView(null, null, { kind: "prompt", text: "pick a symbol" }); return; }
  cstate.datasets = (s.intervals || []).map(iv => ({
    kind: "spot", exchange: s.exchange, segment: s.segment, symbol: s.symbol, interval: iv }));
  cstate.offset = 0;
  const pref = cstate.datasets.find(x => x.interval === "1minute") || cstate.datasets[0];
  cstate.key = pref ? dsKey(pref) : null;
  if (cstate.key) runCandleQuery(false); else renderCandleView(null, null, { kind: "prompt", text: "pick a symbol" });
}

function buildCandleUrl() {
  const d = curDataset();
  if (!d) return null;
  let u;
  if (d.kind === "option") {
    u = "/api/v1/db/options?series=" + encodeURIComponent(d.series);
  } else {
    u = "/api/v1/db/candles?exchange=" + encodeURIComponent(d.exchange)
      + "&segment=" + encodeURIComponent(d.segment) + "&symbol=" + encodeURIComponent(d.symbol)
      + "&interval=" + encodeURIComponent(d.interval);
  }
  /* No `column=` projection is ever sent — omitting it returns EVERY stored
     column (DEC-DB-UX-PACK-001 Feature 1: all columns always visible). */
  u += "&limit=" + encodeURIComponent(limitSel.value) + "&offset=" + encodeURIComponent(cstate.offset)
    + "&desc=" + (cstate.desc ? "true" : "false");
  if (cstate.start) u += "&start=" + encodeURIComponent(cstate.start);
  if (cstate.end) u += "&end=" + encodeURIComponent(cstate.end);
  return u;
}

/* Run one candle page. `gridOnly` = TRUE for page / sort / apply / limit within
   the SAME dataset: only the grid (#dbgrid) is replaced — the control bar, incl.
   the date pickers, stays in the DOM untouched, so a paging click no longer tears
   down + re-wires every control AND the datepicker MutationObserver no longer
   re-scans the whole document on each click (the dominant /db "feels slow" cost —
   DEC-DB-UNIVERSE-O1-LATENCY-001). `gridOnly` = FALSE (enter mode / dataset switch)
   does the full render once, because the option-vs-spot column set can change. */
async function runCandleQuery(gridOnly) {
  const u = buildCandleUrl();
  if (!u) { renderCandleView(null, null, { kind: "prompt", text: "pick a dataset" }); return; }
  const partial = gridOnly && document.getElementById("dbgrid");
  if (partial) document.getElementById("dbgrid").classList.add("is-loading");  /* keep the grid, just dim it */
  else showSkeleton(dataEl);
  const paint = partial ? updateCandleGrid : renderCandleView;
  try {
    const r = await bxFetch(u);
    const body = await r.json();
    paint(r.ok ? body : null, r.ok ? null : (body.detail || ("error " + r.status)));
  } catch (e) {
    if (partial) updateCandleGrid(null, "offline");
    else dataEl.innerHTML = bxOfflineHtml(e);
  }
}

function candleControlsHtml() {
  const dsOpts = cstate.datasets.map(d => {
    const k = dsKey(d);
    /* Option entries show the server-decoded label (BANKNIFTY · MONTH#1
       ATM-10 CALL · 1m — DEC-DB-OPTION-DATASET-DECODE-001), falling back to
       the raw series when no label arrives (an older API). Display-only:
       dsKey()/buildCandleUrl() still address the raw `series` key. */
    const label = d.kind === "option"
      ? "[option] " + (d.label || (d.series + "·" + d.interval))
      : d.kind === "fno"
      ? "[F&O] " + fnoLabel(d)
      : "[spot] " + d.exchange + "·" + d.segment + "·" + d.symbol + "·" + d.interval;
    return '<option value="' + esc(k) + '"' + (k === cstate.key ? " selected" : "") + '>'
      + esc(label) + '</option>';
  }).join("");
  /* F&O shows the symbol→expiry→contract cascade (DEC-DB-FNO-CASCADE-001); SPOT shows
     the symbol→interval cascade (DEC-DB-SPOT-CASCADE-001); only the expired-options
     lake keeps the single flat dataset dropdown. Every control AUTO-APPLIES on
     change (DEC-DB-UX-PACK-001 Feature 2) — there is no Apply button and no
     COLUMNS strip (Feature 1: every column is always visible). */
  const picker = cstate.kind === "fno"
    ? fnoCascadeHtml()
    : cstate.kind === "spot"
    ? spotCascadeHtml()
    : '<span class="lab">Dataset</span><select id="cds">' + dsOpts + '</select>';
  return '<div class="qbar">'
    + '<div class="qrow">' + picker
    + '<span class="lab">From</span><input type="date" id="cstart" min="2020-01-01" value="' + esc(cstate.start) + '">'
    + '<span class="lab">To</span><input type="date" id="cend" min="2020-01-01" value="' + esc(cstate.end) + '"></div>'
    + '<div class="qrow"><span class="lab">Sort</span>'
    + '<select id="cdir"><option value="asc">timestamp asc</option><option value="desc">timestamp desc</option></select></div>'
    + '</div>';
}

/* Per-expiry "listed N · with data M" text (DEC-DB-UX-PACK-001 Feature 6), from
   the /api/v1/db/fno/expiries `expiry_counts` rows. `listed` is null when the
   vendor registry is absent / does not know the underlying — that renders an
   HONEST "with data M" alone, never a misleading "listed 0". `prefix` (the
   expiry itself in the dropdown, "" for the chip) keeps ONE formatter for both
   surfaces; a missing counts row degrades to the bare prefix. */
function fnoExpiryCountsText(expiry, prefix) {
  const row = (cstate.fno.counts || []).find(r => r && r.expiry === expiry);
  if (!row) return prefix;
  const m = (Number(row.with_data) || 0).toLocaleString();
  const counts = row.listed == null
    ? "with data " + m
    : "listed " + (Number(row.listed) || 0).toLocaleString() + " · with data " + m;
  return prefix ? prefix + " — " + counts : counts;
}

/* The per-expiry chip beside the expiry select — the SELECTED expiry's
   "listed N · with data M" so a young live chain (vendor lists dozens, only a
   few pulled yet) is self-explanatory at a glance (DEC-DB-UX-PACK-001 Feature 6). */
function fnoExpiryChipHtml() {
  const txt = cstate.fno.exp ? fnoExpiryCountsText(cstate.fno.exp, "") : "";
  if (!txt) return "";
  return '<span class="expchip" id="cexpchip"'
    + ' title="contracts the vendor lists for this expiry vs contracts with pulled candle data">'
    + esc(txt) + '</span>';
}

/* The F&O cascade picker markup: three dependent selects (underlying → expiry →
   contract) + an interval sub-pick when the chosen contract has more than one
   stored interval (DEC-DB-FNO-CASCADE-001). A later level is disabled until its
   parent is chosen, so the operator can never land on an impossible combination. */
function fnoCascadeHtml() {
  const f = cstate.fno;
  const opt = (v, sel, label) => '<option value="' + esc(v) + '"'
    + (v === sel ? " selected" : "") + '>' + esc(label || v) + '</option>';
  const undOpts = '<option value="">— underlying —</option>' + f.unds.map(u => opt(u, f.und)).join("");
  const expOpts = '<option value="">— expiry —</option>'
    + f.exps.map(e => opt(e, f.exp, fnoExpiryCountsText(e, e))).join("");
  const conOpts = '<option value="">— contract —</option>'
    + f.cons.map(c => opt(c.symbol, f.con, c.label)).join("");
  let h = '<span class="lab">Underlying</span><select id="cund">' + undOpts + '</select>'
    + '<span class="lab">Expiry</span><select id="cexp"' + (f.und ? "" : " disabled") + '>' + expOpts + '</select>'
    + fnoExpiryChipHtml()
    + '<span class="lab">Contract</span><select id="ccon"' + (f.exp ? "" : " disabled") + '>' + conOpts + '</select>';
  const d = curDataset();
  const intervals = cstate.datasets.map(x => x.interval);
  if (intervals.length > 1) {
    h += '<span class="lab">Interval</span><select id="cintv">'
      + intervals.map(iv => '<option value="' + esc(iv) + '"'
        + (d && iv === d.interval ? " selected" : "") + '>' + esc(iv) + '</option>').join("")
      + '</select>';
  }
  return h;
}

/* The SPOT cascade picker markup: a symbol select + an interval sub-pick when the
   chosen symbol has more than one STORED interval (DEC-DB-SPOT-CASCADE-001). The
   indices float to the top of the symbol list (server-sorted). The interval pick
   reuses the shared `cintv` handler. */
function spotCascadeHtml() {
  const sp = cstate.spot;
  const symOpts = '<option value="">— symbol —</option>'
    + sp.syms.map(s => '<option value="' + esc(_spotKey(s)) + '"'
      + (_spotKey(s) === sp.sym ? " selected" : "") + '>' + esc(s.label) + '</option>').join("");
  let h = '<span class="lab">Symbol</span><select id="csym">' + symOpts + '</select>';
  const d = curDataset();
  const intervals = cstate.datasets.map(x => x.interval);
  if (intervals.length > 1) {
    h += '<span class="lab">Interval</span><select id="cintv">'
      + intervals.map(iv => '<option value="' + esc(iv) + '"'
        + (d && iv === d.interval ? " selected" : "") + '>' + esc(iv) + '</option>').join("")
      + '</select>';
  }
  return h;
}

function readCandleControls() {
  const ds = document.getElementById("cds");
  if (ds) cstate.key = ds.value;
  const s = document.getElementById("cstart"); cstate.start = s ? s.value : "";
  const e = document.getElementById("cend"); cstate.end = e ? e.value : "";
  const dir = document.getElementById("cdir"); cstate.desc = dir ? dir.value === "desc" : false;
}

/* The honest applied-range text (DEC-DB-UX-PACK-001 Feature 2): rendered from
   the payload's server-resolved `applied_range`, NEVER from the input values —
   a BLANK input shows the dataset's true default (spot 2020-01-01 → today-IST,
   an F&O/option contract its full stored life) and an empty partition reads
   "no stored data". An empty input NEVER renders today's date as if it were a
   live one-day filter (the inert-filter illusion this closes). */
function appliedRangeText(body) {
  const r = body && body.applied_range;
  if (!r) return "";
  if (r.start == null && r.end == null) return "no stored data";
  return "showing " + (r.start || "—") + " → " + (r.end || "—");
}

/* Update the #crange chip in place via textContent (never innerHTML with data —
   CodeQL XSS guard); hidden when there is nothing to say (picker/error states). */
function setRangeChip(body) {
  const rc = document.getElementById("crange");
  if (!rc) return;
  const txt = appliedRangeText(body);
  rc.textContent = txt;
  rc.style.display = txt ? "" : "none";
}

/* The grid title + "N bars match" sub for the current dataset/page. */
function candleHeadHtml(body) {
  const d = curDataset();
  const sub = body ? (Number(body.total || 0).toLocaleString() + " bars match") : "";
  let title = "candles", icon = "📈";
  /* The grid title mirrors the picker: the decoded option label when the
     server sent one (DEC-DB-OPTION-DATASET-DECODE-001), raw series fallback. */
  if (d && d.kind === "option") { title = esc(d.label || (d.series + " · " + d.interval)); icon = "🅾"; }
  else if (d && d.kind === "fno") { title = esc(fnoLabel(d)); icon = "📊"; }
  else if (d) { title = esc(d.symbol + " · " + d.interval); }
  /* #crange is filled via setRangeChip (textContent) right after each render. */
  return '<div class="datahead"><span class="dt">' + icon + ' ' + title + '</span><span class="sub">' + esc(sub) + '</span>'
    + '<span class="rangechip" id="crange" style="display:none"></span></div>';
}

/* The grid + pager body (or the error message). HONESTY MARKER
   (DEC-MONEYNESS-REGISTRY-STEP-001): when the page's ATM±N strike-grid step was
   derived from the sparse lake-observed ladder only (strike_step_confidence ===
   "observed" — no vendor registry chain), a small muted note flags that the step —
   and so the moneyness depth — may be overestimated on a sparsely-pulled expiry;
   a registry-confident page (or a spot page, which has no such field) shows none. */
function candleGridHtml(body, err, notice) {
  if (err) return err === "offline" ? bxOfflineHtml(null) : bxErrorHtml(err);
  /* A notice is NOT an error: a "pick a …" cascade prompt renders as a plain
     neutral line; an honest "No … yet" empty renders as the .bx-state.empty
     card with a CTA to /universe — the copy strings are byte-unchanged. */
  if (notice) {
    return notice.kind === "empty"
      ? bxEmptyHtml(notice.text, "📭", "/universe", "Open /universe")
      : '<div class="empty">' + esc(notice.text) + '</div>';
  }
  const stepNote = body.strike_step_confidence === "observed"
    ? '<div class="stepnote">~ ATM±N strike grid estimated from pulled strikes only (no vendor registry chain) — the step may be overestimated on a sparsely-pulled expiry.</div>'
    : "";
  return gridAndPager(body.columns || [], body.rows || [], Number(body.total || 0), Number(body.offset || 0), Number(body.limit || 100)) + stepNote;
}

/* Publish the candle page window into the ONE delegated Prev/Next pager
   (DEC-DASHBOARD-JS-PERF-001) — no per-render listener re-attachment. */
function setCandlePager(body) {
  setGridPager(body, 100, (off) => { cstate.offset = off; runCandleQuery(true); });
}

/* FULL render: head + control bar + grid container. Used on entering candle mode
   and on a dataset switch (the option-vs-spot column set can change). The control
   listeners (auto-apply dates/sort, dataset change) are wired ONCE here;
   paging/sort/date changes afterwards update only #dbgrid via updateCandleGrid —
   leaving the controls (and their date pickers) untouched. */
function renderCandleView(body, err, notice) {
  dataEl.innerHTML = candleHeadHtml(body) + candleControlsHtml()
    + '<div id="dbgrid">' + candleGridHtml(body, err, notice) + '</div>';
  setRangeChip(body);
  const dir = document.getElementById("cdir"); if (dir) dir.value = cstate.desc ? "desc" : "asc";
  /* AUTO-APPLY (DEC-DB-UX-PACK-001 Feature 2): the date inputs + the sort select
     re-run the query the moment they change — the two-stage "pick a date, then
     ALSO click Apply query" trap is gone. The shared bx-datepicker Go-to
     dispatches exactly this `change` event on the hidden native inputs, so a
     Go-to pick queries immediately (the event finally has a consumer). */
  const autoApply = () => { readCandleControls(); cstate.offset = 0; runCandleQuery(true); };
  ["cstart", "cend", "cdir"].forEach(cid => {
    const el = document.getElementById(cid);
    if (el) el.addEventListener("change", autoApply);
  });
  const ds = document.getElementById("cds");
  if (ds) ds.addEventListener("change", () => { readCandleControls(); cstate.offset = 0; runCandleQuery(false); });
  /* F&O cascade handlers (DEC-DB-FNO-CASCADE-001): each level fetches the next; the
     contract pick materialises the dataset + runs the page; the interval sub-pick
     re-points to the chosen interval's descriptor. */
  const cund = document.getElementById("cund");
  if (cund) cund.addEventListener("change", () => onFnoUnderlyingChange(cund.value));
  const cexp = document.getElementById("cexp");
  if (cexp) cexp.addEventListener("change", () => onFnoExpiryChange(cexp.value));
  const ccon = document.getElementById("ccon");
  if (ccon) ccon.addEventListener("change", () => onFnoContractChange(ccon.value));
  /* SPOT cascade handler (DEC-DB-SPOT-CASCADE-001): the symbol pick materialises the
     per-interval descriptors + runs the page; the interval sub-pick below is shared. */
  const csym = document.getElementById("csym");
  if (csym) csym.addEventListener("change", () => onSpotSymbolChange(csym.value));
  const cintv = document.getElementById("cintv");
  if (cintv) cintv.addEventListener("change", () => {
    const pick = cstate.datasets.find(x => x.interval === cintv.value);
    if (pick) { cstate.key = dsKey(pick); cstate.offset = 0; runCandleQuery(false); }
  });
  setCandlePager(body);
}

/* GRID-ONLY update: patch the tbody in place when the column set is unchanged
   (DEC-DASHBOARD-JS-PERF-001), else replace #dbgrid; refresh the "N bars match"
   sub; the control bar (incl. the date pickers) is left in place, so no
   datepicker MutationObserver re-scan / rebuild fires on a paging click
   (DEC-DB-UNIVERSE-O1-LATENCY-001). */
function updateCandleGrid(body, err) {
  const grid = document.getElementById("dbgrid");
  if (!grid) { renderCandleView(body, err); return; }  /* defensive: no container → full */
  grid.classList.remove("is-loading");
  /* The honesty step-note (DEC-MONEYNESS-REGISTRY-STEP-001) renders OUTSIDE the
     table, so the tbody-only patch also requires its presence to be unchanged —
     a confidence flip falls back to the full rebuild, never a stale note. */
  const wantNote = !!(body && body.strike_step_confidence === "observed");
  const patched = !err && !!body && wantNote === !!grid.querySelector(".stepnote")
    && patchGridRows(grid, body.columns || [], body.rows || [],
      Number(body.total || 0), Number(body.offset || 0));
  if (!patched) grid.innerHTML = candleGridHtml(body, err);
  const sub = dataEl.querySelector(".datahead .sub");
  if (sub) sub.textContent = body ? (Number(body.total || 0).toLocaleString() + " bars match") : "";
  setRangeChip(body);
  setCandlePager(body);
}

limitSel.addEventListener("change", () => {
  if (mode === "candles") { cstate.offset = 0; runCandleQuery(true); }
  else if (mode === "registry") { rstate.offset = 0; runRegistryQuery(true); }
  else if (mode === "ledger") { lstate.offset = 0; runLedgerQuery(true); }
  /* Table mode takes the SAME grid-only path as its three siblings
     (DEC-DASHBOARD-JS-PERF-001): the control bar + qstate filters stay put —
     the old selectTable() call tore down + rebuilt the whole view. */
  else if (selected) { dbOffset = 0; runTableQuery(selected, true); }
});
refreshBtn.addEventListener("click", () => {
  loadTables();
  if (mode === "candles") selectCandles(cstate.kind);
  else if (mode === "registry") selectRegistry(rstate.kind);
  else if (mode === "ledger") selectLedger("window_ledger");
  else if (selected) selectTable(selected);
});

/* Delegated Prev/Next pager clicks (DEC-DASHBOARD-JS-PERF-001): ONE listener on
   #data attached at boot serves every view family — the buttons re-render freely
   (full rebuild OR in-place disabled-state patch) and are never re-wired. A
   disabled button never dispatches a click; the guard is defensive. */
dataEl.addEventListener("click", (ev) => {
  const b = ev.target.closest("#dbprev, #dbnext");
  if (!b || b.disabled || typeof pagerState.onPage !== "function") return;
  const off = b.id === "dbnext"
    ? pagerState.off + pagerState.lim
    : Math.max(0, pagerState.off - pagerState.lim);
  pagerState.onPage(off);
});

/* DASH-UX D2: click any data cell to copy its value (DEC-DASHBOARD-DB-UX-001).
   Delegated on #data so it survives every grid re-render; null cells are
   skipped. navigator.clipboard is feature-detected (absent on insecure/old
   contexts) — the green flash + toast still confirm the interaction. */
/* Delegated Retry for the data panel's error/offline cards (DEC-DASHBOARD-UX-
   ANIMATE-001): re-invokes the CURRENT view's runner — never re-attached across
   re-renders, mirroring the delegated pager above. */
dataEl.addEventListener("click", (ev) => {
  if (ev.target.closest(".bx-state-retry")) rerunCurrent();
});

dataEl.addEventListener("click", (ev) => {
  const td = ev.target.closest("td");
  if (!td || td.classList.contains("nullcell")) return;
  const text = td.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => {});
  }
  td.classList.remove("copied");
  void td.offsetWidth;  /* restart the flash animation on a repeat click */
  td.classList.add("copied");
  showCopyToast();
});

/* ── Candle deep-link boot handler (DEC-MOVERS-DB-PROVENANCE-VERIFY-001) ──
   /db?candles=spot|fno&exchange=…&segment=…&symbol=…&interval=…&date=…
   pre-selects the candle viewer to the exact coordinate a /movers source line
   names — the click-through of the movers provenance line. A bare /db (no
   ?candles= param) boots byte-identically to before.

   Validation: `date` + `interval` are FORMAT-gated below — an invalid value
   DROPS that param (the field falls to its default; boot never blocks).
   `exchange`/`segment`/`symbol` are DATA-only: they flow exclusively through
   encodeURIComponent (buildCandleUrl) and esc() (candleControlsHtml /
   spotCascadeHtml) — the pre-existing, verified sinks; this handler adds NO
   new innerHTML path (CodeQL XSS gate). A wrong symbol yields the honest
   empty grid / the cascade's own "pick a symbol" prompt — never fabricated
   data (Golden Rule #1). */
const DL_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const DL_INTERVAL_RE = /^\d+(minute|hour)$|^1day$/;
async function deepLinkCandles(q) {
  const kind = q.get("candles");
  const date = DL_DATE_RE.test(q.get("date") || "") ? q.get("date") : "";
  const wantIv = DL_INTERVAL_RE.test(q.get("interval") || "") ? q.get("interval") : "";
  const exchange = q.get("exchange") || "";
  const segment = q.get("segment") || "";
  const symbol = q.get("symbol") || "";
  mode = "candles";
  selected = null;
  cstate.kind = kind;
  cstate.key = null;
  cstate.offset = 0;
  cstate.start = date;
  cstate.end = date;
  markCandles();
  if (kind === "fno") {
    /* F&O: materialise ONE descriptor directly (the movers link pins
       interval=1minute — the partition the F&O movers tabs actually read).
       Documented limitation: the 3-level cascade selects show their prompt
       state — the GRID is correct. */
    if (!symbol) { await selectCandles("fno"); return; }
    cstate.datasets = [{ kind: "fno", exchange: exchange, segment: "FNO",
      symbol: symbol, interval: wantIv || "1minute" }];
    cstate.key = dsKey(cstate.datasets[0]);
    runCandleQuery(false);
    return;
  }
  /* SPOT: load the cascade, resolve the symbol, materialise its STORED
     intervals exactly as onSpotSymbolChange does (inlined so the default-
     1minute query never double-fires), then pick the requested interval iff
     stored — an unstored TF deep-links to the 1-minute base, never an empty
     grid. The cascade selects render fully synced FROM cstate
     (spotCascadeHtml marks `selected`). */
  await loadSpotCascade();
  const key = [exchange, segment, symbol].join("|");
  const s = cstate.spot.syms.find(x => _spotKey(x) === key) || null;
  if (!s) return;  /* no such symbol — the cascade's own honest prompt stays */
  cstate.spot.sym = key;
  cstate.datasets = (s.intervals || []).map(iv => ({
    kind: "spot", exchange: s.exchange, segment: s.segment, symbol: s.symbol, interval: iv }));
  cstate.offset = 0;
  const pick = cstate.datasets.find(x => x.interval === wantIv)
    || cstate.datasets.find(x => x.interval === "1minute")
    || cstate.datasets[0];
  cstate.key = pick ? dsKey(pick) : null;
  if (cstate.key) runCandleQuery(false);
}

/* Boot after DOMContentLoaded so the deferred shared helpers (bx-ui.js) are
   guaranteed loaded — every boot fetch then rides the 12 s timeout. A missing
   helper file degrades gracefully (bxFetch falls back to plain fetch). */
function boot() {
  if (window.BXUI) BXUI.initVisibilityPause();
  const tablesLoad = loadTables();
  /* Deep-link (DEC-MOVERS-DB-PROVENANCE-VERIFY-001): only when ?candles= names
     a known lake kind; runs after the sidebar load settles so markCandles()
     highlights the row. A bare /db boots byte-identically. */
  const q = new URLSearchParams(location.search);
  if (q.get("candles") === "spot" || q.get("candles") === "fno") {
    Promise.resolve(tablesLoad).catch(() => {}).then(() => deepLinkCandles(q));
  }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
