<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BruteX — Database</title>
<style>
  :root {
    /* v28-hybrid locked palette (TRACK1_DASHBOARD_DESIGN.md §3) */
    --bg: #0A0D11; --surface: #131722; --surface-2: #1A1F2C; --surface-3: #232938;
    --border: #1E222D; --border-strong: #2B313F;
    --text: #E5E8EC; --text-bright: #FFFFFF; --muted: #787B86;
    --green: #26D9B0; --green-bright: #4FFFD0; --green-dim: #1A8870;
    --red: #FF5C5C;
    --yellow: #FFB74D; --blue: #5B8DEF; --purple: #9D7BFF; --pink: #FF6B9D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
    background:
      radial-gradient(ellipse at top, rgba(91,141,239,0.06), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(38,217,176,0.04), transparent 60%),
      var(--bg);
  }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  header {
    display:flex; align-items:center; gap:14px; padding:16px 24px;
    border-bottom:1px solid var(--border); animation: fadeInDown .5s ease both;
    /* DASH-UX D2: sticky, frosted header so the nav + db-path never scroll away
       and content slides under it (DEC-DASHBOARD-DB-UX-001). */
    position:sticky; top:0; z-index:6;
    background:rgba(10,13,17,.82);
    -webkit-backdrop-filter:blur(11px); backdrop-filter:blur(11px);
  }
  .logo { font-weight:800; font-size:18px; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--purple),var(--blue),var(--green));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); font-size:12px; }
  .dbpath { margin-left:auto; font-size:11px; color:var(--muted);
    font-family:"SF Mono",Menlo,Consolas,monospace;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; }

  .band { display:flex; align-items:center; gap:12px; padding:12px 24px; flex-wrap:wrap;
    border-bottom:1px solid var(--border); animation: fadeInDown .6s .05s ease both; }
  .band label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  select, button {
    background:var(--surface); color:var(--text); border:1px solid var(--border-strong);
    border-radius:9px; padding:8px 12px; font-size:13px; cursor:pointer; transition:.16s;
  }
  select:hover, button:hover { border-color:var(--blue); }

  .wrap { flex:1; display:grid; grid-template-columns:280px 1fr; gap:14px;
    padding:14px 24px 24px; min-height:0; animation: fadeInUp .5s ease both; }

  /* ── Left: table list ── */
  #tables { background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:10px; overflow:auto; }
  #tables h3 { margin:6px 8px 10px; font-size:12px; text-transform:uppercase;
    letter-spacing:1px; color:var(--muted); }
  .tbl { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
    cursor:pointer; border:1px solid transparent; transition:.16s; }
  .tbl:hover { background:var(--surface-2); box-shadow:0 0 22px rgba(91,141,239,.18); }
  .tbl.sel { background:var(--surface-3); border-color:var(--blue); }
  .tbl .nm { font-weight:700; font-family:"SF Mono",Menlo,Consolas,monospace; font-size:13px; }
  .tbl .badge { margin-left:auto; font-size:11px; font-weight:700; padding:2px 9px;
    border-radius:20px; color:var(--green); background:rgba(38,217,176,.13);
    font-family:"SF Mono",Menlo,Consolas,monospace; }
  .tbl .badge.zero { color:var(--muted); background:rgba(120,123,134,.13); }

  /* ── Right: rows grid ── */
  #data { background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:0; overflow:auto; min-height:0; display:flex; flex-direction:column; }
  .datahead { display:flex; align-items:center; gap:12px; padding:14px 16px;
    border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .datahead .dt { font-weight:700; font-family:"SF Mono",Menlo,Consolas,monospace; font-size:14px; }
  .gridwrap { flex:1; overflow:auto; }
  table { width:100%; border-collapse:collapse;
    font-family:"SF Mono",Menlo,Consolas,monospace; font-size:12px; }
  th, td { text-align:left; padding:7px 12px; border-bottom:1px solid var(--border);
    white-space:nowrap; }
  thead th { position:sticky; top:0; background:var(--surface-2); color:var(--muted);
    font-weight:700; z-index:1; }
  /* DASH-UX D2: zebra striping + a brighter hover make dense rows readable
     (DEC-DASHBOARD-DB-UX-001). Hover wins over zebra (declared after). */
  tbody tr:nth-child(even) { background:rgba(255,255,255,.018); }
  tbody tr:hover { background:var(--surface-2); }
  td { cursor:copy; }
  td.nullcell { color:var(--muted); font-style:italic; cursor:default; }
  /* Click-to-copy cell flash — a brief green pulse on the copied cell. */
  @keyframes cellCopied { 0% { background:var(--green-dim); } 100% { background:transparent; } }
  td.copied { animation: cellCopied .6s ease both; color:var(--green-bright); }

  /* Column-type chip in each header cell: ⏱ time · # numeric · A text. */
  th .tchip { display:inline-block; min-width:15px; text-align:center; margin-right:7px;
    font-size:10px; font-weight:800; border-radius:5px; padding:1px 4px;
    font-family:"SF Mono",Menlo,Consolas,monospace; vertical-align:middle; }
  th .tchip.t-num { color:var(--green); background:rgba(38,217,176,.14); }
  th .tchip.t-time { color:var(--blue); background:rgba(91,141,239,.16); }
  th .tchip.t-txt { color:var(--purple); background:rgba(157,123,255,.15); }

  /* Empty-state art — a floating glyph instead of a bare sentence. */
  .empty .art { font-size:46px; line-height:1; margin-bottom:12px;
    animation: floatArt 3.4s ease-in-out infinite; }
  @keyframes floatArt { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }

  /* Click-to-copy toast (bottom-centre, fades out). */
  #copytoast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(14px);
    background:var(--surface-3); border:1px solid var(--green-dim); color:var(--green-bright);
    padding:9px 18px; border-radius:10px; font-size:13px; font-weight:700; opacity:0;
    pointer-events:none; transition:opacity .2s, transform .2s; z-index:20;
    box-shadow:0 8px 30px rgba(0,0,0,.4); }
  #copytoast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .empty { color:var(--muted); font-size:13px; padding:28px 16px; text-align:center; }
  .empty b { color:var(--text); }
  .pager { display:flex; align-items:center; gap:14px; padding:10px 16px;
    border-top:1px solid var(--border); }
  .pager button { background:var(--surface-2); color:var(--text);
    border:1px solid var(--border-strong); border-radius:6px; padding:6px 14px;
    font-size:13px; cursor:pointer; }
  .pager button:hover:not(:disabled) { border-color:var(--blue); }
  .pager button:disabled { opacity:.4; cursor:not-allowed; }
  .pager .prange { color:var(--muted); font-size:12px;
    font-family:"SF Mono",Menlo,Consolas,monospace; }

  /* ── Query controls (DEC-DB-QUERY-001) ── */
  .qbar { display:flex; flex-direction:column; gap:8px; padding:12px 16px;
    border-bottom:1px solid var(--border); background:var(--surface-2); }
  .qrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .qrow .lab { font-size:11px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--muted); min-width:64px; }
  .qbar input, .qbar select { background:var(--surface); color:var(--text);
    border:1px solid var(--border-strong); border-radius:7px; padding:6px 9px; font-size:12px;
    font-family:"SF Mono",Menlo,Consolas,monospace; }
  .qbar button { font-size:12px; padding:6px 12px; }
  .qbar button.apply { background:var(--green-dim); border-color:var(--green-dim);
    color:var(--text-bright); font-weight:700; }
  .qbar button.apply:hover { border-color:var(--green-bright); }
  .colbox { display:flex; flex-wrap:wrap; gap:4px 12px; max-height:74px; overflow:auto;
    padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:var(--surface);
    flex:1; }
  .colbox label { font-size:11.5px; color:var(--text); display:flex; align-items:center; gap:5px;
    font-family:"SF Mono",Menlo,Consolas,monospace; }
  .frow { display:flex; align-items:center; gap:6px; }
  .frow .rm { color:var(--red); padding:6px 10px; }
  .qerr { color:var(--red); font-size:12px; }
  /* ── Accessibility + motion polish (DEC-DASHBOARD-A11Y-POLISH-002, extends #497) ── */
  /* Keyboard focus rings (TAB-only — never on mouse click) + reduce-motion honoured,
     the same safe a11y polish shipped to /universe + /coverage in #497; additive,
     zero static-layout change. */
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important; scroll-behavior: auto !important;
    }
  }
  /* ── DASH-UX D5: mobile responsiveness (DEC-DASHBOARD-MOBILE-UX-001) ── */
  /* On phones the fixed 280px sidebar grid + dense controls overflow; stack to
     one column, let the table list cap its height, and tighten padding. Additive
     — desktop layout (≥681px) is byte-identical. */
  @media (max-width: 680px) {
    header { flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
    header .dbpath { margin-left: 0; }
    .band { padding: 10px 14px; }
    .wrap { grid-template-columns: 1fr; padding: 12px 14px 18px; }
    #tables { max-height: 38vh; }
    .qrow { flex-direction: column; align-items: stretch; }
    th, td { padding: 6px 8px; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo">BruteX</div>
    <div class="sub">Database — DuckDB instrument master (read-only)</div>
    <nav class="topnav" style="margin-left:18px; display:flex; gap:14px; font-size:13px;">
      <a href="/groww-credentials" style="color:var(--blue); text-decoration:none;">Credentials</a>
      <span style="color:var(--muted);">·</span>
      <a href="/db" style="color:var(--blue); text-decoration:none;">Database</a>
      <span style="color:var(--muted);">·</span>
      <a href="/coverage" style="color:var(--blue); text-decoration:none;">Coverage</a> <a href="/movers" style="color:var(--blue); text-decoration:none;">Movers</a>
      <span style="color:var(--border-strong);">·</span>
      <a href="/reports" style="color:var(--blue); text-decoration:none;">Reports</a>
    </nav>
    <span class="dbpath" id="dbpath">5 tables · click a table to browse</span>
  </header>

  <div class="band">
    <label>Sample rows:
      <select id="limit">
        <option value="10">10</option>
        <option value="50" selected>50</option>
        <option value="200">200</option>
      </select>
    </label>
    <button id="refresh">Refresh</button>
  </div>

  <div class="wrap">
    <div id="tables"><h3>Tables</h3><div class="empty">loading…</div></div>
    <div id="data"><div class="empty emptyart"><div class="art">🗄️</div><div>Select a table on the left to browse its <b>columns &amp; sample rows</b>.</div></div></div>
  </div>

  <div id="copytoast">✓ copied to clipboard</div>

<script>
/* ── BruteX database viewer (DEC-DB-VIEWER-001) ──
   Read-only browse of the 5 DuckDB tables. Every column name + cell is
   escaped before it touches innerHTML — values come from the
   instrument-master CSV (broker-supplied), so they are never trusted as
   markup (same XSS lesson as the logs + universe pages). */
const tablesEl = document.getElementById("tables");
const dataEl = document.getElementById("data");
const limitSel = document.getElementById("limit");
const refreshBtn = document.getElementById("refresh");

let selected = null;
let counts = {};
let dbOffset = 0;  /* current page offset for the selected table (DEC-DB-PAGINATION-001) */
let mode = "table";  /* "table" | "candles" */

/* Per-table structured-query state (DEC-DB-QUERY-001). cols=null → all. */
const qstate = {};  /* { table: {allCols:[], cols:Set|null, filters:[{c,op,v}], orderBy:"", desc:false} } */
/* Candle-viewer state. `kind` ("spot"|"option") is the active Candle-lake
   row: the spot bars (`bars/`) and the dedicated expired-options table
   (`options/`) are now SEPARATE, self-contained sidebar rows, so `datasets`
   holds ONLY the active row's datasets (never both at once). The selected
   dataset's `kind` still drives which API + column set is used
   (DEC-EXPIRED-OPTIONS-TABLE-001 / options-in-db-viewer). */
const cstate = { datasets: [], key: null, kind: null, start: "", end: "", cols: null, desc: false, offset: 0 };

/* Friendly labels for the allowlisted query operators (mirrors
   db_view.ALLOWED_OPERATORS — the backend is the source of truth + re-validates). */
const OPS = [["eq","="],["ne","≠"],["lt","<"],["le","≤"],["gt",">"],["ge","≥"],["like","LIKE"],["contains","contains"]];

/* Server-computed derived %-columns appended to every spot candle page
   (DEC-DB-CANDLE-DERIVED-001): previous-day % change + the 09:15 overnight gap.
   They are NOT real Parquet columns (never in the column picker / CANDLE_COLS);
   the backend joins them per bar from the prior trading day's LAST 1-minute
   close (the engine is 1-minute-based, so the baseline is the 1-min feed it
   sweeps, not the 1d official close — DEC-SPOT-PREVCLOSE-1MIN-001). Values
   arrive FULL PRECISION (statistical metrics, never money-rounded — CLAUDE.md
   §4); we render 2 decimals at DISPLAY only via fmtCell. */
const PCT_COLS = new Set(["change_pct", "open_gap_pct"]);

/* Display formatter: the two derived %-columns render to exactly 2 decimals
   (display-only rounding); every other cell renders verbatim. A blank (null)
   cell is handled by the caller before fmtCell is reached. */
function fmtCell(col, cell) {
  if (PCT_COLS.has(col)) {
    const n = Number(cell);
    return Number.isFinite(n) ? n.toFixed(2) : cell;
  }
  return cell;
}

/* DASH-UX D2 (DEC-DASHBOARD-DB-UX-001): column-type inference for the header
   chips. Purely presentational — the backend re-validates every column; this
   only picks a glyph (⏱ time · # numeric · A text) from the column NAME, so a
   wrong guess is cosmetic and never gates a query. */
const NUM_COLS = new Set([
  "open", "high", "low", "close", "volume", "open_interest", "oi",
  "strike", "spot", "iv", "lot_size", "tick_size", "sm_freeze_qty",
  "security_id", "row_count", "underlying_security_id",
]);
function colType(col) {
  const c = String(col).toLowerCase();
  if (c === "timestamp" || c.includes("date") || c.includes("time") ||
      c === "expiry" || c.endsWith("_at")) {
    return { cls: "t-time", glyph: "⏱", title: "timestamp" };
  }
  if (NUM_COLS.has(c) || PCT_COLS.has(col) ||
      c.endsWith("_id") || c.endsWith("_qty") || c.endsWith("_size") || c.endsWith("_count")) {
    return { cls: "t-num", glyph: "#", title: "numeric" };
  }
  return { cls: "t-txt", glyph: "A", title: "text" };
}

/* Click-to-copy toast: flash a bottom-centre "✓ copied" for ~1.1s. */
let copyToastTimer = null;
function showCopyToast() {
  const t = document.getElementById("copytoast");
  if (!t) return;
  t.classList.add("show");
  if (copyToastTimer) clearTimeout(copyToastTimer);
  copyToastTimer = setTimeout(() => t.classList.remove("show"), 1100);
}

/* Escape free text before interpolation into innerHTML (XSS sink). */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* Animated count-up from 0 → target for the row-count badges. */
function countUp(el, target) {
  target = Number(target) || 0;
  if (target <= 0) { el.textContent = "0"; return; }
  const steps = 24;
  let i = 0;
  const tick = () => {
    i++;
    const v = Math.round(target * i / steps);
    el.textContent = v.toLocaleString();
    if (i < steps) requestAnimationFrame(tick);
    else el.textContent = target.toLocaleString();
  };
  requestAnimationFrame(tick);
}

async function loadTables() {
  try {
    const r = await fetch("/api/v1/db/tables");
    if (!r.ok) { tablesEl.innerHTML = '<h3>Tables</h3><div class="empty">error ' + r.status + '</div>'; return; }
    const body = await r.json();
    const tables = body.tables || [];
    counts = {};
    tables.forEach(t => { counts[t.table] = t.row_count; });
    const tableRows = tables.map(t => {
      const zero = (t.row_count || 0) === 0 ? " zero" : "";
      return '<div class="tbl" data-table="' + esc(t.table) + '">'
        + '<span class="nm">' + esc(t.table) + '</span>'
        + '<span class="badge' + zero + '" data-count="' + (t.row_count || 0) + '">0</span>'
        + '</div>';
    }).join("");
    /* The candle/OHLCV lake lives in Parquet, not a DuckDB table — surface
       each lake as its OWN dedicated, clickable row
       (DEC-EXPIRED-OPTIONS-TABLE-001 / options-in-db-viewer): the spot bars
       (`bars/`) and the expired-options table (`options/`) are separate
       first-class entries, so the expired-options table is a row of its own
       (not hidden inside a shared picker). Each row's `data-candles` value is
       the lake `kind` it browses. */
    const candleRow = '<div class="tbl" data-candles="spot">'
      + '<span class="nm">📈 candles</span>'
      + '<span class="badge" style="color:var(--purple);background:rgba(157,123,255,.13)">spot</span>'
      + '</div>';
    const optionRow = '<div class="tbl" data-candles="option">'
      + '<span class="nm">🅾 expired options</span>'
      + '<span class="badge" style="color:var(--pink);background:rgba(255,107,157,.13)">options</span>'
      + '</div>';
    /* The unified window ledger lives in a Parquet sidecar (`window_ledger/`),
       NOT a DuckDB table — surface it as its OWN clickable read-only row
       (DEC-WINDOW-LEDGER-001) so EVERY fetch window is browsable right here on /db.
       (The Groww token-events viewer was retired in PR-J4c with the token
       lifecycle.) */
    const ledgerRow = '<div class="tbl" data-ledger="window_ledger">'
      + '<span class="nm">🪟 window ledger</span>'
      + '<span class="badge" style="color:var(--green);background:rgba(74,222,128,.13)">windows</span>'
      + '</div>';
    tablesEl.innerHTML = '<h3>Tables</h3>' + tableRows
      + '<h3 style="margin-top:14px">Candle lake</h3>' + candleRow + optionRow
      + '<h3 style="margin-top:14px">Window ledger</h3>' + ledgerRow;
    tablesEl.querySelectorAll(".badge[data-count]").forEach(b => countUp(b, b.getAttribute("data-count")));
    tablesEl.querySelectorAll(".tbl[data-table]").forEach(el => {
      el.addEventListener("click", () => selectTable(el.getAttribute("data-table")));
    });
    tablesEl.querySelectorAll(".tbl[data-candles]").forEach(el => {
      el.addEventListener("click", () => selectCandles(el.getAttribute("data-candles")));
    });
    tablesEl.querySelectorAll(".tbl[data-ledger]").forEach(el => {
      el.addEventListener("click", () => selectLedger(el.getAttribute("data-ledger")));
    });
    if (mode === "candles") markCandles();
    else if (selected && counts[selected] !== undefined) markSelected(selected);
  } catch (e) {
    tablesEl.innerHTML = '<h3>Tables</h3><div class="empty">offline</div>';
  }
}

function markSelected(name) {
  tablesEl.querySelectorAll(".tbl").forEach(el => {
    el.classList.toggle("sel", el.getAttribute("data-table") === name);
  });
}

function markCandles() {
  /* Highlight only the active lake's row (spot vs expired-options). Guard on a
     non-null kind so a data-table row (getAttribute → null) can never match a
     null kind (null === null) and mass-highlight every table — correct by
     construction, not by the caller's invariant. */
  tablesEl.querySelectorAll(".tbl").forEach(el => {
    el.classList.toggle("sel", cstate.kind !== null && el.getAttribute("data-candles") === cstate.kind);
  });
}

/* ── Window ledger (Parquet sidecar table) ── */
function markLedger(kind) {
  tablesEl.querySelectorAll(".tbl").forEach(el => {
    el.classList.toggle("sel", el.getAttribute("data-ledger") === kind);
  });
}

async function selectLedger(kind) {
  /* Render the window-ledger Parquet sidecar read-only in the grid — it returns
     the grid shape (columns/rows) directly. */
  mode = "ledger";
  selected = null;
  markLedger(kind);
  const label = "window ledger";
  dataEl.innerHTML = '<div class="empty">loading ' + label + '…</div>';
  try {
    const r = await fetch("/api/v1/db/window-ledger");
    const body = await r.json();
    if (!r.ok) { dataEl.innerHTML = '<div class="empty qerr">error ' + r.status + '</div>'; return; }
    const cols = body.columns || [];
    const rows = body.rows || [];
    const total = rows.length;
    const sub = cols.length + " cols · " + Number(total).toLocaleString() + " rows";
    const head = '<div class="datahead"><span class="dt">' + esc(label) + '</span><span class="sub">' + esc(sub) + '</span></div>';
    const grid = total === 0
      ? '<div class="empty">no ' + esc(label) + ' yet — pull a symbol on /universe, then it appears here</div>'
      : gridAndPager(cols, rows, total, 0, total);
    dataEl.innerHTML = head + grid;
  } catch (e) {
    dataEl.innerHTML = '<div class="empty">offline</div>';
  }
}

const CANDLE_COLS = ["timestamp", "open", "high", "low", "close", "volume", "open_interest"];
/* Expired-option columns: OHLCV+OI PLUS the per-bar option stamps (mirrors
   db_view.OPTION_CANDLE_COLUMNS — the backend re-validates). */
const OPTION_COLS = ["timestamp", "open", "high", "low", "close", "volume", "open_interest", "side", "strike", "spot", "iv"];

/* Shared grid + Prev/Next pager HTML (used by both table + candle views).
   The pager buttons get ids dbprev/dbnext; each view wires its own offset. */
function gridAndPager(cols, rows, total, off, lim) {
  const from = total === 0 ? 0 : off + 1;
  const to = off + rows.length;
  let html = "";
  if (!rows.length) {
    html += '<div class="empty">no rows on this page</div>';
  } else {
    const thead = '<thead><tr>' + cols.map(c => {
      const t = colType(c);
      return '<th><span class="tchip ' + t.cls + '" title="' + t.title + '">' + t.glyph + '</span>' + esc(c) + '</th>';
    }).join("") + '</tr></thead>';
    const tbody = '<tbody>' + rows.map(row =>
      '<tr>' + row.map((cell, i) =>
        cell == null ? '<td class="nullcell">null</td>' : '<td>' + esc(fmtCell(cols[i], cell)) + '</td>'
      ).join("") + '</tr>'
    ).join("") + '</tbody>';
    html += '<div class="gridwrap"><table>' + thead + tbody + '</table></div>';
  }
  const hasPrev = off > 0, hasNext = to < total;
  html += '<div class="pager">'
    + '<button id="dbprev"' + (hasPrev ? "" : " disabled") + '>‹ Prev</button>'
    + '<span class="prange">' + from.toLocaleString() + '–' + to.toLocaleString()
    + ' / ' + total.toLocaleString() + '</span>'
    + '<button id="dbnext"' + (hasNext ? "" : " disabled") + '>Next ›</button></div>';
  return html;
}

/* ── Table mode (structured query) ── */
async function selectTable(name) {
  mode = "table";
  selected = name;
  dbOffset = 0;
  markSelected(name);
  if (!qstate[name]) qstate[name] = { allCols: [], cols: null, filters: [], orderBy: "", desc: false };
  if (!qstate[name].allCols.length) {
    try {
      const rc = await fetch("/api/v1/db/columns/" + encodeURIComponent(name));
      if (rc.ok) qstate[name].allCols = (await rc.json()).columns || [];
    } catch (e) { /* offline — controls degrade to none */ }
  }
  runTableQuery(name);
}

function buildTableUrl(name) {
  const st = qstate[name];
  let u = "/api/v1/db/query/" + encodeURIComponent(name)
    + "?limit=" + encodeURIComponent(limitSel.value) + "&offset=" + encodeURIComponent(dbOffset);
  if (st.cols) st.cols.forEach(c => { u += "&column=" + encodeURIComponent(c); });
  st.filters.forEach(f => { if (f.c && f.op) u += "&f=" + encodeURIComponent(f.c + ":" + f.op + ":" + f.v); });
  if (st.orderBy) u += "&order_by=" + encodeURIComponent(st.orderBy) + "&desc=" + (st.desc ? "true" : "false");
  return u;
}

async function runTableQuery(name) {
  dataEl.innerHTML = '<div class="empty">loading ' + esc(name) + '…</div>';
  try {
    const r = await fetch(buildTableUrl(name));
    const body = await r.json();
    if (!r.ok) { renderTableView(name, null, body.detail || ("error " + r.status)); return; }
    renderTableView(name, body, null);
  } catch (e) {
    dataEl.innerHTML = '<div class="empty">offline</div>';
  }
}

function tableControlsHtml(name) {
  const st = qstate[name];
  const cols = st.allCols;
  const colChecks = cols.map(c => {
    const on = st.cols === null || st.cols.has(c);
    return '<label><input type="checkbox" class="qcol" value="' + esc(c) + '"' + (on ? " checked" : "") + '>' + esc(c) + '</label>';
  }).join("");
  const opOpts = OPS.map(o => '<option value="' + o[0] + '">' + esc(o[1]) + '</option>').join("");
  const filterRows = st.filters.map(f =>
    '<div class="frow">'
    + '<select class="fcol"><option value="">column…</option>'
    + cols.map(c => '<option value="' + esc(c) + '"' + (c === f.c ? " selected" : "") + '>' + esc(c) + '</option>').join("") + '</select>'
    + '<select class="fop">' + OPS.map(o => '<option value="' + o[0] + '"' + (o[0] === f.op ? " selected" : "") + '>' + esc(o[1]) + '</option>').join("") + '</select>'
    + '<input class="fval" placeholder="value" value="' + esc(f.v) + '">'
    + '<button class="rm" title="remove filter">✕</button></div>'
  ).join("");
  return '<div class="qbar">'
    + '<div class="qrow"><span class="lab">Columns</span><div class="colbox">' + colChecks + '</div></div>'
    + '<div class="qrow"><span class="lab">Filters</span>'
    + '<div id="filters" style="display:flex;flex-direction:column;gap:6px">' + filterRows + '</div>'
    + '<button id="addf">+ filter</button></div>'
    + '<div class="qrow"><span class="lab">Sort</span>'
    + '<select id="sortcol"><option value="">— none —</option>'
    + cols.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join("") + '</select>'
    + '<select id="sortdir"><option value="asc">asc</option><option value="desc">desc</option></select>'
    + '<button class="apply" id="applyq">Apply query</button></div>'
    + '</div>';
}

function readControlsInto(name) {
  const st = qstate[name];
  const checked = Array.from(document.querySelectorAll(".qcol:checked")).map(c => c.value);
  const all = document.querySelectorAll(".qcol").length;
  st.cols = checked.length === 0 || checked.length === all ? null : new Set(checked);
  st.filters = Array.from(document.querySelectorAll("#filters .frow")).map(row => ({
    c: row.querySelector(".fcol").value,
    op: row.querySelector(".fop").value,
    v: row.querySelector(".fval").value,
  }));
  const sc = document.getElementById("sortcol");
  const sd = document.getElementById("sortdir");
  st.orderBy = sc ? sc.value : "";
  st.desc = sd ? sd.value === "desc" : false;
}

function renderTableView(name, body, err) {
  const st = qstate[name];
  const sub = body ? ((body.columns || []).length + " cols · " + Number(body.total || 0).toLocaleString() + " rows match") : "";
  const head = '<div class="datahead"><span class="dt">' + esc(name) + '</span><span class="sub">' + sub + '</span></div>';
  const grid = err
    ? '<div class="empty qerr">' + esc(err) + '</div>'
    : gridAndPager(body.columns || [], body.rows || [], Number(body.total || 0), Number(body.offset || 0), Number(body.limit || 50));
  dataEl.innerHTML = head + tableControlsHtml(name) + grid;
  const sc = document.getElementById("sortcol"); if (sc) sc.value = st.orderBy || "";
  const sd = document.getElementById("sortdir"); if (sd) sd.value = st.desc ? "desc" : "asc";
  const off = body ? Number(body.offset || 0) : 0, lim = body ? Number(body.limit || 50) : 50;
  const addf = document.getElementById("addf");
  if (addf) addf.addEventListener("click", () => { readControlsInto(name); st.filters.push({ c: "", op: "eq", v: "" }); renderTableView(name, body, err); });
  document.querySelectorAll("#filters .rm").forEach((b, i) => b.addEventListener("click", () => { readControlsInto(name); st.filters.splice(i, 1); renderTableView(name, body, err); }));
  const ap = document.getElementById("applyq");
  if (ap) ap.addEventListener("click", () => { readControlsInto(name); dbOffset = 0; runTableQuery(name); });
  const prev = document.getElementById("dbprev"), next = document.getElementById("dbnext");
  if (prev) prev.addEventListener("click", () => { dbOffset = Math.max(0, off - lim); runTableQuery(name); });
  if (next) next.addEventListener("click", () => { dbOffset = off + lim; runTableQuery(name); });
}

/* ── Candle mode (Parquet lake via read_parquet) ── */
/* A dataset key is "kind:coords" so spot (bars/) and option (options/) sets
   never alias. Spot coords are exchange|segment|symbol|interval; option coord
   is the on-disk series segment. */
function dsKey(d) {
  if (d.kind === "option") return "option:" + d.series;
  return "spot:" + [d.exchange, d.segment, d.symbol, d.interval].join("|");
}
function curDataset() { return cstate.datasets.find(d => dsKey(d) === cstate.key) || null; }
/* Columns available for the currently-selected dataset (option vs spot). */
function curCols() { const d = curDataset(); return d && d.kind === "option" ? OPTION_COLS : CANDLE_COLS; }

async function selectCandles(kind) {
  mode = "candles";
  selected = null;
  /* Switching between the spot lake and the expired-options lake resets the
     per-lake view (selected dataset / projection / page) so the two dedicated
     rows never leak each other's columns or pager position. */
  if (kind !== cstate.kind) { cstate.kind = kind; cstate.key = null; cstate.cols = null; }
  cstate.offset = 0;
  markCandles();
  const isOpt = cstate.kind === "option";
  dataEl.innerHTML = '<div class="empty">loading ' + (isOpt ? "expired-option" : "candle") + ' datasets…</div>';
  try {
    const r = await fetch("/api/v1/db/candles/datasets");
    const body = await r.json();
    /* This row browses ONE lake — keep only the active kind's datasets,
       each tagged so curCols()/buildCandleUrl() pick the right schema. */
    cstate.datasets = isOpt
      ? (body.options || []).map(d => ({ kind: "option", ...d }))
      : (body.datasets || []).map(d => ({ kind: "spot", ...d }));
    if (!curDataset() && cstate.datasets.length) cstate.key = dsKey(cstate.datasets[0]);
    if (cstate.datasets.length) runCandleQuery();
    else renderCandleView(null, isOpt
      ? "No expired-option data yet — pull an instrument's options on /universe first."
      : "No spot candle data yet — pull an instrument's timeframes on /universe first.");
  } catch (e) {
    dataEl.innerHTML = '<div class="empty">offline</div>';
  }
}

function buildCandleUrl() {
  const d = curDataset();
  if (!d) return null;
  let u;
  if (d.kind === "option") {
    u = "/api/v1/db/options?series=" + encodeURIComponent(d.series);
  } else {
    u = "/api/v1/db/candles?exchange=" + encodeURIComponent(d.exchange)
      + "&segment=" + encodeURIComponent(d.segment) + "&symbol=" + encodeURIComponent(d.symbol)
      + "&interval=" + encodeURIComponent(d.interval);
  }
  u += "&limit=" + encodeURIComponent(limitSel.value) + "&offset=" + encodeURIComponent(cstate.offset)
    + "&desc=" + (cstate.desc ? "true" : "false");
  if (cstate.start) u += "&start=" + encodeURIComponent(cstate.start);
  if (cstate.end) u += "&end=" + encodeURIComponent(cstate.end);
  if (cstate.cols) cstate.cols.forEach(c => { u += "&column=" + encodeURIComponent(c); });
  return u;
}

async function runCandleQuery() {
  const u = buildCandleUrl();
  if (!u) { renderCandleView(null, "pick a dataset"); return; }
  dataEl.innerHTML = '<div class="empty">loading candles…</div>';
  try {
    const r = await fetch(u);
    const body = await r.json();
    if (!r.ok) { renderCandleView(null, body.detail || ("error " + r.status)); return; }
    renderCandleView(body, null);
  } catch (e) {
    dataEl.innerHTML = '<div class="empty">offline</div>';
  }
}

function candleControlsHtml() {
  const dsOpts = cstate.datasets.map(d => {
    const k = dsKey(d);
    /* Option entries show the server-decoded label (BANKNIFTY · MONTH#1
       ATM-10 CALL · 1m — DEC-DB-OPTION-DATASET-DECODE-001), falling back to
       the raw series when no label arrives (an older API). Display-only:
       dsKey()/buildCandleUrl() still address the raw `series` key. */
    const label = d.kind === "option"
      ? "[option] " + (d.label || (d.series + "·" + d.interval))
      : "[spot] " + d.exchange + "·" + d.segment + "·" + d.symbol + "·" + d.interval;
    return '<option value="' + esc(k) + '"' + (k === cstate.key ? " selected" : "") + '>'
      + esc(label) + '</option>';
  }).join("");
  const colChecks = curCols().map(c => {
    const on = cstate.cols === null || cstate.cols.has(c);
    return '<label><input type="checkbox" class="ccol" value="' + c + '"' + (on ? " checked" : "") + '>' + c + '</label>';
  }).join("");
  return '<div class="qbar">'
    + '<div class="qrow"><span class="lab">Dataset</span><select id="cds">' + dsOpts + '</select>'
    + '<span class="lab">From</span><input type="date" id="cstart" min="2020-01-01" value="' + esc(cstate.start) + '">'
    + '<span class="lab">To</span><input type="date" id="cend" min="2020-01-01" value="' + esc(cstate.end) + '"></div>'
    + '<div class="qrow"><span class="lab">Columns</span><div class="colbox">' + colChecks + '</div></div>'
    + '<div class="qrow"><span class="lab">Sort</span>'
    + '<select id="cdir"><option value="asc">timestamp asc</option><option value="desc">timestamp desc</option></select>'
    + '<button class="apply" id="capply">Apply query</button></div>'
    + '</div>';
}

function readCandleControls() {
  const ds = document.getElementById("cds");
  /* On a dataset switch the on-page column checkboxes still reflect the OLD
     dataset's columns, so reset the projection to "all" and skip reading them
     (the next render rebuilds the checkboxes for the new dataset's columns). */
  const switched = ds && ds.value !== cstate.key;
  if (ds) cstate.key = ds.value;
  const s = document.getElementById("cstart"); cstate.start = s ? s.value : "";
  const e = document.getElementById("cend"); cstate.end = e ? e.value : "";
  const dir = document.getElementById("cdir"); cstate.desc = dir ? dir.value === "desc" : false;
  if (switched) { cstate.cols = null; return; }
  const all = curCols().length;
  const checked = Array.from(document.querySelectorAll(".ccol:checked")).map(c => c.value);
  cstate.cols = checked.length === 0 || checked.length === all ? null : new Set(checked);
}

function renderCandleView(body, err) {
  const d = curDataset();
  const sub = body ? (Number(body.total || 0).toLocaleString() + " bars match") : "";
  let title = "candles", icon = "📈";
  /* The grid title mirrors the picker: the decoded option label when the
     server sent one (DEC-DB-OPTION-DATASET-DECODE-001), raw series fallback. */
  if (d && d.kind === "option") { title = esc(d.label || (d.series + " · " + d.interval)); icon = "🅾"; }
  else if (d) { title = esc(d.symbol + " · " + d.interval); }
  const head = '<div class="datahead"><span class="dt">' + icon + ' ' + title + '</span><span class="sub">' + sub + '</span></div>';
  const grid = err
    ? '<div class="empty qerr">' + esc(err) + '</div>'
    : gridAndPager(body.columns || [], body.rows || [], Number(body.total || 0), Number(body.offset || 0), Number(body.limit || 100));
  dataEl.innerHTML = head + candleControlsHtml() + grid;
  const dir = document.getElementById("cdir"); if (dir) dir.value = cstate.desc ? "desc" : "asc";
  const off = body ? Number(body.offset || 0) : 0, lim = body ? Number(body.limit || 100) : 100;
  const ap = document.getElementById("capply");
  if (ap) ap.addEventListener("click", () => { readCandleControls(); cstate.offset = 0; runCandleQuery(); });
  const ds = document.getElementById("cds");
  if (ds) ds.addEventListener("change", () => { readCandleControls(); cstate.offset = 0; runCandleQuery(); });
  const prev = document.getElementById("dbprev"), next = document.getElementById("dbnext");
  if (prev) prev.addEventListener("click", () => { cstate.offset = Math.max(0, off - lim); runCandleQuery(); });
  if (next) next.addEventListener("click", () => { cstate.offset = off + lim; runCandleQuery(); });
}

limitSel.addEventListener("change", () => {
  if (mode === "candles") { cstate.offset = 0; runCandleQuery(); }
  else if (selected) selectTable(selected);
});
refreshBtn.addEventListener("click", () => {
  loadTables();
  if (mode === "candles") selectCandles(cstate.kind);
  else if (selected) selectTable(selected);
});

/* DASH-UX D2: click any data cell to copy its value (DEC-DASHBOARD-DB-UX-001).
   Delegated on #data so it survives every grid re-render; null cells are
   skipped. navigator.clipboard is feature-detected (absent on insecure/old
   contexts) — the green flash + toast still confirm the interaction. */
dataEl.addEventListener("click", (ev) => {
  const td = ev.target.closest("td");
  if (!td || td.classList.contains("nullcell")) return;
  const text = td.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => {});
  }
  td.classList.remove("copied");
  void td.offsetWidth;  /* restart the flash animation on a repeat click */
  td.classList.add("copied");
  showCopyToast();
});

loadTables();
</script>
