<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BruteX — Database</title>
<style>
  /* Design tokens come from the SHARED sheets linked below (bx-theme.css +
     bx-design.css — one :root, one motion vocabulary; DEC-DASHBOARD-UX-ANIMATE-001).
     The page's byte-duplicate :root block was deleted (A-DB-4): every token this
     page consumes (palette, --r-*, --ease, --gutter) is declared there with
     identical values, so nothing renders differently. */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
    background:
      radial-gradient(ellipse at top, rgba(91,141,239,0.06), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(38,217,176,0.04), transparent 60%),
      var(--bg);
  }
  /* fadeInDown/fadeInUp/gradShift keyframe duplicates deleted — the shared
     bxFadeInDown/bxFadeInUp/bxGradShift set (bx-theme.css) is the one vocabulary. */
  header {
    display:flex; align-items:center; gap:14px; padding:16px var(--gutter);
    border-bottom:1px solid var(--border); animation: bxFadeInDown .5s ease both;
    /* DASH-UX D2: sticky, frosted header so the nav + db-path never scroll away
       and content slides under it (DEC-DASHBOARD-DB-UX-001). */
    position:sticky; top:0; z-index:6;
    background:rgba(10,13,17,.82);
    -webkit-backdrop-filter:blur(11px); backdrop-filter:blur(11px);
  }
  .logo { font-weight:800; font-size:18px; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--purple),var(--blue),var(--green));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); font-size:12px; }
  .dbpath { margin-left:auto; font-size:11px; color:var(--muted);
    font-family:"SF Mono",Menlo,Consolas,monospace;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; }

  /* DEC-DASHBOARD-UI-POLISH-002: animated brand mark + class-driven nav (mirror /universe) */
  .brandmark { width:30px; height:30px; border-radius:9px; flex:0 0 auto; display:grid; place-items:center;
    font-size:16px; color:#0A0D11; font-weight:900;
    background:linear-gradient(135deg,var(--purple),var(--blue) 55%,var(--green)); background-size:180% 180%;
    box-shadow:0 4px 14px rgba(91,141,239,.35); animation:bxGradShift 8s var(--ease) infinite; }
  .topnav a { color:var(--muted); text-decoration:none; padding:6px 10px;
    border-radius:var(--r-sm); transition:.16s var(--ease); line-height:1; white-space:nowrap; }
  .topnav a:hover { color:var(--text-bright); }
  .topnav a[aria-current="page"] { color:var(--text-bright); background:var(--surface-3);
    box-shadow:inset 0 0 0 1px var(--border-strong); border-radius:var(--r-sm); padding:6px 10px; }

  .band { display:flex; align-items:center; gap:12px; padding:12px var(--gutter); flex-wrap:wrap;
    border-bottom:1px solid var(--border); animation: bxFadeInDown .6s .05s ease both; }
  .band label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  select, button {
    background:var(--surface); color:var(--text); border:1px solid var(--border-strong);
    border-radius:9px; padding:8px 12px; font-size:13px; cursor:pointer; transition:.16s;
  }
  select:hover, button:hover { border-color:var(--blue); }

  /* Fluid sidebar (A-DB-6): scales with the viewport instead of a fixed 280px
     sliver on ultrawides; gutters ride the shared --gutter token (A-DB-5). */
  .wrap { flex:1; display:grid; grid-template-columns:clamp(240px,18vw,340px) 1fr; gap:14px;
    padding:14px var(--gutter) var(--gutter); min-height:0; animation: bxFadeInUp .5s ease both; }

  /* ── Left: table list ── */
  #tables { background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:10px; overflow:auto; }
  #tables h3 { margin:6px 8px 10px; font-size:12px; text-transform:uppercase;
    letter-spacing:1px; color:var(--muted); }
  .tbl { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
    cursor:pointer; border:1px solid transparent; transition:.16s; }
  .tbl:hover { background:var(--surface-2); box-shadow:0 0 22px rgba(91,141,239,.18);
    transform:translateY(-1px); }
  .tbl.sel { background:var(--surface-3); border-color:var(--blue); }
  .tbl .nm { font-weight:700; font-family:"SF Mono",Menlo,Consolas,monospace; font-size:13px; }
  .tbl .badge { margin-left:auto; font-size:11px; font-weight:700; padding:2px 9px;
    border-radius:20px; color:var(--green); background:rgba(38,217,176,.13);
    font-family:"SF Mono",Menlo,Consolas,monospace; }
  .tbl .badge.zero { color:var(--muted); background:rgba(120,123,134,.13); }
  /* Lake/registry badge tints as classes (A-DB-8) — replaces the five
     copy-pasted inline style="" strings on the sidebar rows. */
  .tbl .badge.b-purple { color:var(--purple); background:rgba(157,123,255,.13); }
  .tbl .badge.b-blue   { color:var(--blue);   background:rgba(91,141,239,.13); }
  .tbl .badge.b-green  { color:var(--green);  background:rgba(74,222,128,.13); }
  .tbl .badge.b-yellow { color:var(--yellow); background:rgba(255,183,77,.13); }

  /* ── Right: rows grid ── */
  #data { background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:0; overflow:auto; min-height:0; display:flex; flex-direction:column; }
  .datahead { display:flex; align-items:center; gap:12px; padding:14px 16px;
    border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .datahead .dt { font-weight:700; font-family:"SF Mono",Menlo,Consolas,monospace; font-size:14px; }
  .gridwrap { flex:1; overflow:auto; }
  /* #dbgrid wraps the grid+pager; while a page/sort/apply fetch is in flight it
     is dimmed in place (the control bar + datepickers stay live) instead of the
     old flash-to-"loading…" full teardown (DEC-DB-UNIVERSE-O1-LATENCY-001). */
  #dbgrid { display:flex; flex-direction:column; flex:1; min-height:0; }
  #dbgrid.is-loading { opacity:.5; transition:opacity .12s ease; pointer-events:none; }
  table { width:100%; border-collapse:collapse;
    font-family:"SF Mono",Menlo,Consolas,monospace; font-size:12px; }
  th, td { text-align:left; padding:7px 12px; border-bottom:1px solid var(--border);
    white-space:nowrap; }
  thead th { position:sticky; top:0; background:var(--surface-2); color:var(--muted);
    font-weight:700; z-index:1; }
  /* DASH-UX D2: zebra striping + a brighter hover make dense rows readable
     (DEC-DASHBOARD-DB-UX-001). Hover wins over zebra (declared after). */
  tbody tr:nth-child(even) { background:rgba(255,255,255,.018); }
  tbody tr:hover { background:var(--surface-2); }
  td { cursor:copy; }
  td.nullcell { color:var(--muted); font-style:italic; cursor:default; }
  /* Moneyness tint (DEC-FNO-MONEYNESS-001): ITM green · OTM red · UNKNOWN/NA muted. */
  td.mny-itm { color:var(--green); } td.mny-otm { color:var(--red); }
  td.mny-na { color:var(--muted); }
  /* Strike-step honesty note (DEC-MONEYNESS-REGISTRY-STEP-001): a small muted line
     under the F&O candle grid when the ATM±N grid came from the sparse lake ladder
     only (no vendor registry chain) — the step may be overestimated. */
  .stepnote { color:var(--muted); font-size:11px; padding:6px 2px 0; }
  /* Click-to-copy cell flash — a brief green pulse on the copied cell. */
  @keyframes cellCopied { 0% { background:var(--green-dim); } 100% { background:transparent; } }
  td.copied { animation: cellCopied .6s ease both; color:var(--green-bright); }

  /* Column-type chip in each header cell: ⏱ time · # numeric · A text. */
  th .tchip { display:inline-block; min-width:15px; text-align:center; margin-right:7px;
    font-size:10px; font-weight:800; border-radius:5px; padding:1px 4px;
    font-family:"SF Mono",Menlo,Consolas,monospace; vertical-align:middle; }
  th .tchip.t-num { color:var(--green); background:rgba(38,217,176,.14); }
  th .tchip.t-time { color:var(--blue); background:rgba(91,141,239,.16); }
  th .tchip.t-txt { color:var(--purple); background:rgba(157,123,255,.15); }

  /* Empty-state art — a floating glyph instead of a bare sentence. */
  .empty .art { font-size:46px; line-height:1; margin-bottom:12px;
    animation: floatArt 3.4s ease-in-out infinite; }
  @keyframes floatArt { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }

  /* Click-to-copy toast (bottom-centre, fades out). */
  #copytoast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(14px);
    background:var(--surface-3); border:1px solid var(--green-dim); color:var(--green-bright);
    padding:9px 18px; border-radius:10px; font-size:13px; font-weight:700; opacity:0;
    pointer-events:none; transition:opacity .2s, transform .2s; z-index:20;
    box-shadow:0 8px 30px rgba(0,0,0,.4); }
  #copytoast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .empty { color:var(--muted); font-size:13px; padding:28px 16px; text-align:center; }
  .empty b { color:var(--text); }
  .pager { display:flex; align-items:center; gap:14px; padding:10px 16px;
    border-top:1px solid var(--border); }
  .pager button { background:var(--surface-2); color:var(--text);
    border:1px solid var(--border-strong); border-radius:6px; padding:6px 14px;
    font-size:13px; cursor:pointer; }
  .pager button:hover:not(:disabled) { border-color:var(--blue); }
  .pager button:disabled { opacity:.4; cursor:not-allowed; }
  .pager .prange { color:var(--muted); font-size:12px;
    font-family:"SF Mono",Menlo,Consolas,monospace; }

  /* ── Query controls (DEC-DB-QUERY-001) ── */
  .qbar { display:flex; flex-direction:column; gap:8px; padding:12px 16px;
    border-bottom:1px solid var(--border); background:var(--surface-2); }
  .qrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .qrow .lab { font-size:11px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--muted); min-width:64px; }
  .qbar input, .qbar select { background:var(--surface); color:var(--text);
    border:1px solid var(--border-strong); border-radius:7px; padding:6px 9px; font-size:12px;
    font-family:"SF Mono",Menlo,Consolas,monospace; }
  .qbar button { font-size:12px; padding:6px 12px; }
  .qbar button.apply { background:var(--green-dim); border-color:var(--green-dim);
    color:var(--text-bright); font-weight:700; }
  .qbar button.apply:hover { border-color:var(--green-bright); }
  /* The honest applied-range chip (DEC-DB-UX-PACK-001 Feature 2) + the per-expiry
     "listed N · with data M" chip (Feature 6). (The COLUMNS checkbox strip and its
     .colbox styles were REMOVED — Feature 1: every column is always visible.) */
  .rangechip, .expchip { font-size:11px; font-weight:700; padding:3px 10px;
    border-radius:20px; font-family:"SF Mono",Menlo,Consolas,monospace;
    color:var(--blue); background:rgba(91,141,239,.13); white-space:nowrap; }
  .expchip { color:var(--yellow); background:rgba(255,183,77,.13); }
  .frow { display:flex; align-items:center; gap:6px; }
  .frow .rm { color:var(--red); padding:6px 10px; }
  /* ── Accessibility + motion polish (DEC-DASHBOARD-A11Y-POLISH-002, extends #497) ── */
  /* Keyboard focus rings (TAB-only — never on mouse click) + reduce-motion honoured,
     the same safe a11y polish shipped to /universe + /coverage in #497; additive,
     zero static-layout change. */
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important; scroll-behavior: auto !important;
    }
  }
  /* ── DASH-UX D5: mobile responsiveness (DEC-DASHBOARD-MOBILE-UX-001) ── */
  /* On phones the fixed 280px sidebar grid + dense controls overflow; stack to
     one column, let the table list cap its height, and tighten padding. Additive
     — desktop layout (≥681px) is byte-identical. */
  @media (max-width: 680px) {
    header { flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
    header .dbpath { margin-left: 0; }
    .band { padding: 10px 14px; }
    .wrap { grid-template-columns: 1fr; padding: 12px 14px 18px; }
    #tables { max-height: 38vh; }
    .qrow { flex-direction: column; align-items: stretch; }
    th, td { padding: 6px 8px; }
  }
</style>
<link rel="stylesheet" href="/static/bx-datepicker.css">
<link rel="stylesheet" href="/static/bx-theme.css">
<!-- Shared design system (DEC-DASHBOARD-UX-ANIMATE-001): tokens + skeleton/state
     components + the padding-only widget dock. Linked AFTER bx-theme (cascade order). -->
<link rel="stylesheet" href="/static/bx-design.css">
<script defer src="/static/bx-ui.js"></script>
<script defer src="/static/bx-datepicker.js"></script>
<!-- Live pull-rate monitor widget (DEC-LIVE-RATE-MONITOR-001): self-injecting,
     polls /api/v1/pull/rate. Idle until a pull runs; never blocks first paint. -->
<script defer src="/static/bx-rate-monitor.js"></script>
<script defer src="/static/bx-liveproof.js"></script>

<body data-accent="purple">
  <header>
    <div class="brandmark" aria-hidden="true">B</div>
    <div class="logo">BruteX</div>
    <div class="sub">Database — DuckDB instrument master (read-only)</div>
    <nav class="topnav" aria-label="Primary">
      <a href="/">Operator</a>
      <a href="/universe">Universe</a>
      <a href="/db" aria-current="page">Database</a>
      <a href="/coverage">Coverage</a>
      <a href="/movers">Movers</a>
      <a href="/results">Results</a>
      <a href="/reports">Reports</a>
    </nav>
    <span class="dbpath" id="dbpath">5 tables · click a table to browse</span>
  </header>

  <div class="band">

      <select id="limit">

        <option value="50" selected>50</option>
        <option value="200">200</option>
      </select>
    </label>
    <button id="refresh">Refresh</button>
  </div>

  <div class="wrap">
    <div id="tables"><h3>Tables</h3><div class="bx-skel-grid" aria-hidden="true"><span class="bx-skel bx-skel-row"></span><span class="bx-skel bx-skel-row"></span><span class="bx-skel bx-skel-row"></span><span class="bx-skel bx-skel-row"></span><span class="bx-skel bx-skel-row"></span><span class="bx-skel bx-skel-row"></span></div></div>
    <div id="data"><div class="empty emptyart"><div class="art">🗄️</div><div>Select a table on the left to browse its <b>columns &amp; sample rows</b>.</div></div></div>
  </div>

  <div id="copytoast">✓ copied to clipboard</div>

<!-- Shared half-up 2dp display formatter (DEC-STORED-DATA-VALIDATION-001):
     deliberately NON-defer so bxFixed2 is defined before the inline script
     below parses — the pinned ROUND_HALF_UP display law
     (preopen_report._round2 / the #1154 half-up cells). -->
<script src="/static/bx-format.js"></script>
<script>
/* ── BruteX database viewer (DEC-DB-VIEWER-001) ──
   Read-only browse of the 5 DuckDB tables. Every column name + cell is
   escaped before it touches innerHTML — values come from the
   instrument-master CSV (broker-supplied), so they are never trusted as
   markup (same XSS lesson as the logs + universe pages). */
const tablesEl = document.getElementById("tables");
const dataEl = document.getElementById("data");
const limitSel = document.getElementById("limit");
const refreshBtn = document.getElementById("refresh");

/* API route family for the structured table browser: DB_API drives the
   DuckDB master tables. */
const DB_API = "/api/v1/db";

let selected = null;
let counts = {};
let dbOffset = 0;  /* current page offset for the selected table (DEC-DB-PAGINATION-001) */
let mode = "table";  /* "table" | "candles" */

/* Per-table structured-query state (DEC-DB-QUERY-001). Every column is ALWAYS
   visible — the column-visibility picker was removed (DEC-DB-UX-PACK-001
   Feature 1); `allCols` remains only to feed the filter/sort dropdowns. */
const qstate = {};  /* { table: {allCols:[], filters:[{c,op,v}], orderBy:"", desc:false} } */
/* Candle-viewer state. `kind` ("spot"|"fno"|"option") is the active Candle-lake
   row: the spot bars (`bars/` non-FNO), the F&O candle lake (`bars/<exch>/FNO/…`,
   DEC-FNO-CANDLE-LAKE-001), and the dedicated expired-options table (`options/`)
   are SEPARATE, self-contained sidebar rows, so `datasets` holds ONLY the active
   row's datasets (never more than one at once). The selected dataset's `kind`
   drives which API + column set is used; spot AND fno share the candle API + the
   7 OHLCV columns (DEC-EXPIRED-OPTIONS-TABLE-001 / options-in-db-viewer). */
const cstate = { datasets: [], key: null, kind: null, start: "", end: "", desc: false, offset: 0,
  /* F&O cascade substate (DEC-DB-FNO-CASCADE-001): lazy symbol→expiry→contract picker.
     `unds`/`exps`/`cons` are the three level lists; `und`/`exp`/`con` the current
     selections; `counts` the per-expiry "listed N with data M" rows aligned with
     `exps` (DEC-DB-UX-PACK-001 Feature 6). Only used when kind === "fno";
     spot/option keep the flat dropdown. */
  fno: { unds: [], und: "", exps: [], exp: "", counts: [], cons: [], con: "" },
  /* SPOT cascade substate (DEC-DB-SPOT-CASCADE-001): symbol→interval picker.
     `syms` is the symbols-with-intervals list; `sym` the current selection
     (an "exchange|segment|symbol" composite). Only used when kind === "spot";
     option keeps the flat dropdown. */
  spot: { syms: [], sym: "" } };
/* F&O registry-viewer state (DEC-DERIV-REGISTRY-DB-VIEW-001). `kind` is the
   active registry row ("expiries"|"contracts"); the registry is a SEPARATE
   `registry.duckdb` cache surfaced read-only as a grid (columns/rows/total). */
const rstate = { kind: null, offset: 0 };
/* Window-ledger viewer state — paginated like the registry (DEC-DB-VIEWER-PAGINATE-ALL-001). */
const lstate = { offset: 0 };

/* Friendly labels for the allowlisted query operators (mirrors
   db_view.ALLOWED_OPERATORS — the backend is the source of truth + re-validates). */
const OPS = [["eq","="],["ne","≠"],["lt","<"],["le","≤"],["gt",">"],["ge","≥"],["like","LIKE"],["contains","contains"]];

/* Server-computed derived %-columns appended to every spot candle page
   (DEC-DB-CANDLE-DERIVED-001): previous-day % change + the 09:15 overnight gap.
   They are NOT real Parquet columns;
   the backend joins them per bar from the prior trading day's LAST 1-minute
   close (the engine is 1-minute-based, so the baseline is the 1-min feed it
   sweeps, not the 1d official close — DEC-SPOT-PREVCLOSE-1MIN-001). Values
   arrive FULL PRECISION (statistical metrics, never money-rounded — CLAUDE.md
   §4); we render 2 decimals at DISPLAY only via fmtCell. */
const PCT_COLS = new Set(["change_pct", "open_gap_pct"]);

/* Broker-style Greeks display decimals (DEC-DB-UX-PACK-001 Feature 4) —
   DISPLAY-ONLY, like PCT_COLS above: the payload arrives FULL PRECISION (stored
   iv/statistics are NEVER rounded — CLAUDE.md §4). `iv` is stored as a FRACTION
   and renders as PERCENT to 2dp (0.1523 → "15.23"); delta 3dp · gamma 5dp ·
   theta 2dp · vega 3dp · rho 2dp. The provenance columns (spot_at_bar /
   t_years_used / rate_used / greeks_provenance_id) are deliberately NOT in this
   map — they render verbatim. */
const GREEK_DP = { delta: 3, gamma: 5, theta: 2, vega: 3, rho: 2 };

/* Display formatter: the two derived %-columns render to exactly 2 decimals,
   `iv` renders as percent 2dp, and the five Greeks render broker-style fixed
   decimals (all display-only rounding); every other cell renders verbatim. A
   blank (null) cell is handled by the caller before fmtCell is reached. */
function fmtCell(col, cell) {
  const n = Number(cell);
  /* PCT_COLS render via the SHARED half-up bxFixed2 (DEC-STORED-DATA-
     VALIDATION-001): IEEE toFixed(2) diverged from the pinned ROUND_HALF_UP
     display law at exact half-boundaries ("1.005" → "1.00" vs pinned "1.01"). */
  if (PCT_COLS.has(col)) return Number.isFinite(n) ? bxFixed2(n) : cell;
  if (col === "iv") return Number.isFinite(n) ? (n * 100).toFixed(2) : cell;
  if (Object.prototype.hasOwnProperty.call(GREEK_DP, col)) {
    return Number.isFinite(n) ? n.toFixed(GREEK_DP[col]) : cell;
  }
  return cell;
}

/* Moneyness colour class for a candle cell (DEC-FNO-MONEYNESS-001) — purely a display
   tint; the cell reads "ITM -1" / "OTM +10" / "ATM" / "?" so tint by the leading bucket
   ("" for every non-moneyness column or an ATM/"?"/"—" cell). */
function moneynessClass(col, cell) {
  if (col !== "moneyness" || typeof cell !== "string") return "";
  if (cell.startsWith("ITM")) return " mny-itm";
  if (cell.startsWith("OTM")) return " mny-otm";
  if (cell === "?" || cell === "—") return " mny-na";
  return "";
}

/* DASH-UX D2 (DEC-DASHBOARD-DB-UX-001): column-type inference for the header
   chips. Purely presentational — the backend re-validates every column; this
   only picks a glyph (⏱ time · # numeric · A text) from the column NAME, so a
   wrong guess is cosmetic and never gates a query. */
const NUM_COLS = new Set([
  "open", "high", "low", "close", "volume", "open_interest", "oi",
  "strike", "spot", "iv", "lot_size", "tick_size", "sm_freeze_qty",
  "security_id", "row_count", "underlying_security_id",
  // F&O derived value columns (DEC-DB-FNO-COLUMNS-001) — numeric, NOT timestamps,
  // even though "time_value"/"days_to_expiry" contain the substrings time/expiry.
  "intrinsic", "time_value", "days_to_expiry",
  // Stored Greeks overlay columns (DEC-GREEKS-ENGINE-PR3-001) — all numeric
  // ("iv" is already above; "greeks_provenance_id" matches the _id suffix).
  "delta", "gamma", "theta", "vega", "rho", "spot_at_bar", "t_years_used", "rate_used",
]);
function colType(col) {
  const c = String(col).toLowerCase();
  // An EXPLICIT numeric column wins over the time-NAME heuristic below, so
  // "time_value"/"days_to_expiry" read as numeric (# ), not timestamps (⏱).
  if (!NUM_COLS.has(c) &&
      (c === "timestamp" || c.includes("date") || c.includes("time") ||
       c === "expiry" || c.endsWith("_at"))) {
    return { cls: "t-time", glyph: "⏱", title: "timestamp" };
  }
  if (NUM_COLS.has(c) || PCT_COLS.has(col) ||
      c.endsWith("_id") || c.endsWith("_qty") || c.endsWith("_size") || c.endsWith("_count")) {
    return { cls: "t-num", glyph: "#", title: "numeric" };
  }
  return { cls: "t-txt", glyph: "A", title: "text" };
}

/* Click-to-copy toast: flash a bottom-centre "✓ copied" for ~1.1s. */
let copyToastTimer = null;
function showCopyToast() {
  const t = document.getElementById("copytoast");
  if (!t) return;
  t.classList.add("show");
  if (copyToastTimer) clearTimeout(copyToastTimer);
  copyToastTimer = setTimeout(() => t.classList.remove("show"), 1100);
}

/* Escape free text before interpolation into innerHTML (XSS sink). */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ── Shared loading/terminal-state helpers (DEC-DASHBOARD-UX-ANIMATE-001) ──
   THE LAW: "loading…" is banned as a terminal state. Every full-view fetch
   paints a shimmer skeleton (with a 10 s honesty watchdog) and RESOLVES to
   data, an honest .bx-state empty card, or an honest .bx-state error card
   with a Retry button. Fetches ride BXUI.fetchWithTimeout (12 s deadline)
   when the shared helper is loaded, so a hung endpoint always lands in the
   catch instead of pending forever. Markup is built from STATIC strings +
   esc()'d dynamics through the page's existing render pipeline — no new
   innerHTML sink class (the skeleton/error builders REPLACE six old
   "loading…"/"error N" sinks); the Retry buttons are served by ONE delegated
   listener each on #tables/#data, so re-renders never re-attach handlers. */
const LAKE_BUSY_NOTE = "still working — the lake is busy (a pull/prebuild may be running)";
function bxFetch(url) {
  return (window.BXUI && BXUI.fetchWithTimeout) ? BXUI.fetchWithTimeout(url, 12000) : fetch(url);
}
function skelGridHtml(rows, cols) {
  let cells = "";
  for (let i = 0; i < rows * cols; i++) {
    cells += '<span class="bx-skel bx-skel-cell" style="animation-delay:' + ((i % cols) * 40) + 'ms"></span>';
  }
  return '<div class="bx-skel-grid" aria-hidden="true" style="grid-template-columns:repeat('
    + cols + ',minmax(0,1fr))">' + cells + '</div>';
}
/* Full-view pending state: shimmer ghost grid + the 10 s "lake busy" watchdog
   caption (appended ONLY while the skeleton is still attached — a resolved
   view never grows a stale caption). Grid-only updates keep the lighter
   #dbgrid.is-loading dim (DEC-DB-UNIVERSE-O1-LATENCY-001) — not this. */
function showSkeleton(panel) {
  panel.innerHTML = skelGridHtml(9, 4);
  const ghost = panel.querySelector(".bx-skel-grid");
  setTimeout(() => {
    if (!ghost || !panel.contains(ghost)) return;  /* already resolved */
    const cap = document.createElement("div");
    cap.className = "bx-skel-caption";
    const dot = document.createElement("span");
    dot.className = "bx-live-dot live-warn";
    const txt = document.createElement("span");
    txt.textContent = LAKE_BUSY_NOTE;
    cap.appendChild(dot);
    cap.appendChild(txt);
    panel.appendChild(cap);
  }, 10000);
}
/* Honest error card (status/detail esc()'d) + Retry (delegated listener). */
function bxErrorHtml(err) {
  return '<div class="bx-state error"><div class="ico">⚠</div>'
    + '<div class="headline">couldn\'t load — ' + esc(err) + '</div>'
    + '<div class="hint">the server may be busy (a pull/prebuild may be running)</div>'
    + '<button type="button" class="bx-btn bx-state-retry">↻ Retry</button></div>';
}
/* Honest offline / timed-out card — distinguished from "no data" (never a
   fake empty state on a network drop). A BXUI timeout carries its own honest
   hint ("request timed out after 12000ms — the server may be busy…"). */
function bxOfflineHtml(e) {
  const hint = (e && e.timeout && e.message) ? e.message : "check the connection, then retry";
  return '<div class="bx-state offline"><div class="ico">📡</div>'
    + '<div class="headline">offline — couldn\'t reach the server</div>'
    + '<div class="hint">' + esc(hint) + '</div>'
    + '<button type="button" class="bx-btn bx-state-retry">↻ Retry</button></div>';
}
/* Honest empty-state card: the ORIGINAL empty-copy string as the hint, plus an
   optional static CTA link (only ever the app-relative "/universe" literal). */
function bxEmptyHtml(text, icon, ctaHref, ctaText) {
  return '<div class="bx-state empty"><div class="ico">' + (icon || "📭") + '</div>'
    + '<div class="hint">' + esc(text) + '</div>'
    + (ctaHref ? '<a class="bx-btn bx-btn-primary" href="' + ctaHref + '">' + esc(ctaText || "Open") + '</a>' : "")
    + '</div>';
}
/* Re-invoke the current view's runner (the Retry button target). Grid-only
   (true) is safe for both shapes: with #dbgrid present it patches in place,
   without it the runner falls back to the full render. */
function rerunCurrent() {
  if (mode === "candles") { if (cstate.key) runCandleQuery(true); else selectCandles(cstate.kind || "spot"); }
  else if (mode === "registry") runRegistryQuery(true);
  else if (mode === "ledger") runLedgerQuery(true);
  else if (selected) runTableQuery(selected, true);
  else loadTables();
}

/* Animated count-up from 0 → target for the row-count badges. */
function countUp(el, target) {
  target = Number(target) || 0;
  if (target <= 0) { el.textContent = "0"; return; }
  const steps = 24;
  let i = 0;
  const tick = () => {
    i++;
    const v = Math.round(target * i / steps);
    el.textContent = v.toLocaleString();
    if (i < steps) requestAnimationFrame(tick);
    else el.textContent = target.toLocaleString();
  };
  requestAnimationFrame(tick);
}

async function loadTables() {
  try {
    const r = await bxFetch("/api/v1/db/tables");
    if (!r.ok) { tablesEl.innerHTML = '<h3>Tables</h3>' + bxErrorHtml("error " + r.status); return; }
    const body = await r.json();
    const tables = body.tables || [];
    counts = {};
    tables.forEach(t => { counts[t.table] = t.row_count; });
    const dbpath = document.getElementById("dbpath");
    if (dbpath) {
      const n = tables.length;
      dbpath.textContent = n + " table" + (n === 1 ? "" : "s") + " · click a table to browse";
    }
    const tableRows = tables.map(t => {
      const zero = (t.row_count || 0) === 0 ? " zero" : "";
      return '<div class="tbl" data-table="' + esc(t.table) + '">'
        + '<span class="nm">' + esc(t.table) + '</span>'
        + '<span class="badge' + zero + '" data-count="' + (t.row_count || 0) + '">0</span>'
        + '</div>';
    }).join("");
    /* The candle/OHLCV lake lives in Parquet, not a DuckDB table — surface
       each lake as its OWN dedicated, clickable row
       (DEC-EXPIRED-OPTIONS-TABLE-001 / options-in-db-viewer): the spot bars
       (`bars/`) and the expired-options table (`options/`) are separate
       first-class entries, so the expired-options table is a row of its own
       (not hidden inside a shared picker). Each row's `data-candles` value is
       the lake `kind` it browses. */
    const candleRow = '<div class="tbl" data-candles="spot">'
      + '<span class="nm">📈 candles</span>'
      + '<span class="badge b-purple">spot</span>'
      + '</div>';
    /* DEC-FNO-CANDLE-LAKE-001: the F&O (futures + options) candle lake is its OWN
       first-class, clickable row — the SAME bars/<exch>/FNO/<contract>/<interval>/
       Parquet the Groww historical pull writes, surfaced per contract (decoded
       underlying / expiry / strike / CE-PE-FUT). It is NOT spot (the honesty fix),
       and browses through the IDENTICAL segment=FNO candle query path. */
    const fnoRow = '<div class="tbl" data-candles="fno">'
      + '<span class="nm">📊 F&amp;O candles</span>'
      + '<span class="badge b-blue">FNO</span>'
      + '</div>';
    /* DEC-DASHBOARD-UX-POLISH-001: the expired-options lake is HIDDEN from the
       browsable Candle-lake list per operator request — it is a documented
       REFERENCE_ONLY surface that clutters the spot-focused list. SCOPE-SAFE:
       only the LIST entry is dropped here; the underlying `options/` lake, its
       data, the `selectCandles("option")` browse path, and the `data-candles`
       route stay fully intact (nothing is deleted, no write path changed). */
    /* The unified window ledger lives in a Parquet sidecar (`window_ledger/`),
       NOT a DuckDB table — surface it as its OWN clickable read-only row
       (DEC-WINDOW-LEDGER-001) so EVERY fetch window is browsable right here on /db.
       (The Groww token-events viewer was retired in PR-J4c with the token
       lifecycle.) */
    const ledgerRow = '<div class="tbl" data-ledger="window_ledger">'
      + '<span class="nm">🪟 window ledger</span>'
      + '<span class="badge b-green">windows</span>'
      + '</div>';
    /* The F&O expiries+contracts REGISTRY lives in a SEPARATE `registry.duckdb`
       cache (DEC-DERIV-METADATA-HISTORICAL-SPLIT-001 PR-1), a sibling of the lean
       instrument master — NOT a master DuckDB table — so it gets its OWN clickable
       read-only rows (DEC-DERIV-REGISTRY-DB-VIEW-001): a pulled chain becomes
       browsable here, structured by expiry / strike / CE-PE. EMPTY until a later
       PR populates it — the badge starts blank and fills from the route's counts. */
    const expiriesRow = '<div class="tbl" data-registry="expiries">'
      + '<span class="nm">📅 expiries</span>'
      + '<span class="badge b-blue">registry</span>'
      + '</div>';
    const contractsRow = '<div class="tbl" data-registry="contracts">'
      + '<span class="nm">🔗 contracts</span>'
      + '<span class="badge b-yellow">registry</span>'
      + '</div>';
    tablesEl.innerHTML = '<h3>Tables</h3>' + tableRows
      + '<h3 style="margin-top:14px">Candle lake</h3>' + candleRow + fnoRow
      + '<h3 style="margin-top:14px">Window ledger</h3>' + ledgerRow
      + '<h3 style="margin-top:14px">F&amp;O registry</h3>' + expiriesRow + contractsRow;
    tablesEl.querySelectorAll(".badge[data-count]").forEach(b => countUp(b, b.getAttribute("data-count")));
    /* First-render-only entrance stagger (capped): the render-signature memo
       inside BXUI.stagger means an identical rebuild never re-animates. */
    if (window.BXUI) BXUI.stagger(tablesEl, tableRows, { cap: 16 });
    if (mode === "candles") markCandles();
    else if (mode === "registry") markRegistry(rstate.kind);
    else if (mode === "ledger") markLedger("window_ledger");
    else if (selected) markSelected(selected);
  } catch (e) {
    tablesEl.innerHTML = '<h3>Tables</h3>' + bxOfflineHtml(e);
  }
}

/* Delegated Retry for the sidebar's error/offline cards (never re-attached). */
tablesEl.addEventListener("click", (ev) => {
  if (ev.target.closest(".bx-state-retry")) loadTables();
});

/* Delegated sidebar clicks (DEC-DASHBOARD-JS-PERF-001): ONE listener on #tables
   attached at boot — loadTables rebuilds the row markup freely (boot + every
   Refresh) with NO per-row listener re-attachment (the old four
   querySelectorAll/forEach loops). Mirrors the delegated copy handler on #data. */
tablesEl.addEventListener("click", (ev) => {
  const row = ev.target.closest(".tbl");
  if (!row) return;
  const table = row.getAttribute("data-table");
  if (table) { selectTable(table); return; }
  const lake = row.getAttribute("data-candles");
  if (lake) { selectCandles(lake); return; }
  const ledger = row.getAttribute("data-ledger");
  if (ledger) { selectLedger(ledger); return; }
  const registry = row.getAttribute("data-registry");
  if (registry) selectRegistry(registry);
});

function markSelected(name) {
  /* Highlight the selected DuckDB master-table row; a null name can't
     mass-match because getAttribute returns null only for the other-kind
     rows, never equals a real name. */
  tablesEl.querySelectorAll(".tbl").forEach(el => {
    el.classList.toggle("sel", el.getAttribute("data-table") === name);
  });
}

function markCandles() {
  /* Highlight only the active lake's row (spot vs expired-options). Guard on a
     non-null kind so a data-table row (getAttribute → null) can never match a
     null kind (null === null) and mass-highlight every table — correct by
     construction, not by the caller's invariant. */
  tablesEl.querySelectorAll(".tbl").forEach(el => {
    el.classList.toggle("sel", cstate.kind !== null && el.getAttribute("data-candles") === cstate.kind);
  });
}

/* ── Window ledger (Parquet sidecar table) ── */
function markLedger(kind) {
  tablesEl.querySelectorAll(".tbl").forEach(el => {
    el.classList.toggle("sel", el.getAttribute("data-ledger") === kind);
  });
}

/* The window-ledger sidecar is now SQL-page-shaped (DEC-DB-VIEWER-PAGINATE-ALL-001):
   the route returns ONE LIMIT/OFFSET page + a real `total`, so the viewer renders
   O(page) (the ledger is a small bounded sidecar — the read stays O(windows), the
   render is the operator-visible win). Paging mirrors the registry grid-split. */
const _LEDGER_LABEL = "window ledger";

function ledgerHeadHtml(body) {
  const sub = (body.columns || []).length + " cols · " + Number(body.total || 0).toLocaleString() + " rows";
  return '<div class="datahead"><span class="dt">' + esc(_LEDGER_LABEL)
    + '</span><span class="sub">' + esc(sub) + '</span></div>';
}

function ledgerGridHtml(body) {
  const total = Number(body.total || 0);
  if (total === 0) {
    return bxEmptyHtml("no " + _LEDGER_LABEL + " yet — pull a symbol on /universe, then it appears here",
      "🪟", "/universe", "Open /universe");
  }
  return gridAndPager(body.columns || [], body.rows || [], total,
    Number(body.offset || 0), Number(body.limit || 100));
}

function setLedgerPager(body) {
  setGridPager(body, 100, (off) => { lstate.offset = off; runLedgerQuery(true); });
}

function renderLedgerView(body) {
  dataEl.innerHTML = ledgerHeadHtml(body) + '<div id="dbgrid">' + ledgerGridHtml(body) + '</div>';
  setLedgerPager(body);
}

function updateLedgerGrid(body) {
  const grid = document.getElementById("dbgrid");
  if (!grid) { renderLedgerView(body); return; }  /* defensive: no container → full */
  grid.classList.remove("is-loading");
  /* tbody-only swap when the column set is unchanged (DEC-DASHBOARD-JS-PERF-001);
     any shape change falls back to the full grid rebuild. */
  if (!patchGridRows(grid, body.columns || [], body.rows || [],
      Number(body.total || 0), Number(body.offset || 0))) {
    grid.innerHTML = ledgerGridHtml(body);
  }
  const sub = dataEl.querySelector(".datahead .sub");
  if (sub) sub.textContent = (body.columns || []).length + " cols · "
    + Number(body.total || 0).toLocaleString() + " rows";

async function runLedgerQuery(gridOnly) {
  const partial = gridOnly && document.getElementById("dbgrid");
  if (partial) document.getElementById("dbgrid").classList.add("is-loading");
  else showSkeleton(dataEl);
  const url = "/api/v1/db/window-ledger?limit=" + encodeURIComponent(limitSel.value)
    + "&offset=" + encodeURIComponent(lstate.offset);
  try {
    const r = await bxFetch(url);
    const body = await r.json();
    if (!r.ok) {
      const msg = bxErrorHtml("error " + r.status);
      if (partial) { const g = document.getElementById("dbgrid"); g.classList.remove("is-loading"); g.innerHTML = msg; }
      else dataEl.innerHTML = msg;
      return;
    }
    if (partial) updateLedgerGrid(body); else renderLedgerView(body);
  } catch (e) {
    /* Honest "offline" on a mid-page network drop, not a "no data" empty state. */
    const off = bxOfflineHtml(e);
    if (partial) { const g = document.getElementById("dbgrid"); if (g) { g.classList.remove("is-loading"); g.innerHTML = off; } }
    else dataEl.innerHTML = off;
  }
}

async function selectLedger(kind) {
  mode = "ledger";
  selected = null;
  lstate.offset = 0;   /* a fresh ledger selection starts at page 1 */

  runLedgerQuery(false);
}

/* ── F&O registry (separate registry.duckdb cache) ── */
function markRegistry(kind) {
  tablesEl.querySelectorAll(".tbl").forEach(el => {
    el.classList.toggle("sel", kind !== null && el.getAttribute("data-registry") === kind);
  });
}

/* Registry tabs are now SQL-paginated (DEC-DB-VIEWER-PAGINATE-ALL-001): the route
   returns one LIMIT/OFFSET page + a FILTERED total, so a contracts chain with tens
   of thousands of legs loads O(page), not all-at-once. Paging mirrors the candle /
   table grid-split — prev/next update only #dbgrid, the head is rebuilt once. */
function registryLabel() { return rstate.kind === "expiries" ? "expiries" : "contracts"; }

function registryUrl() {
  const isExp = rstate.kind === "expiries";
  return (isExp ? "/api/v1/db/registry/expiries" : "/api/v1/db/registry/contracts")
    + "?limit=" + encodeURIComponent(limitSel.value) + "&offset=" + encodeURIComponent(rstate.offset);
}

function registryHeadHtml(body) {
  const cols = body.columns || [];
  const sub = cols.length + " cols · " + Number(body.total || 0).toLocaleString() + " rows";
  const icon = rstate.kind === "expiries" ? "📅" : "⛓";
  return '<div class="datahead"><span class="dt">' + icon + ' ' + esc(registryLabel())
    + '</span><span class="sub">' + esc(sub) + '</span></div>';
}

function registryGridHtml(body) {
  const total = Number(body.total || 0);
  if (total === 0) {
    /* An honest empty state: the note (when present) names WHY — no registry
       pulled yet — never an invented row (Golden Rule #1). */
    const emptyMsg = body.note ? body.note
      : "no " + registryLabel() + " yet — pull expiries + contracts first";
    return bxEmptyHtml(emptyMsg, "📭", "/universe", "Open /universe");
  }
  return gridAndPager(body.columns || [], body.rows || [], total,
    Number(body.offset || 0), Number(body.limit || 100));
}

function setRegistryPager(body) {
  setGridPager(body, 100, (off) => { rstate.offset = off; runRegistryQuery(true); });
}

function renderRegistryView(body) {
  dataEl.innerHTML = registryHeadHtml(body) + '<div id="dbgrid">' + registryGridHtml(body) + '</div>';
  setRegistryPager(body);
}

function updateRegistryGrid(body) {
  const grid = document.getElementById("dbgrid");
  if (!grid) { renderRegistryView(body); return; }  /* defensive: no container → full */
  grid.classList.remove("is-loading");
  /* tbody-only swap when the column set is unchanged (DEC-DASHBOARD-JS-PERF-001);
     any shape change falls back to the full grid rebuild. */
  if (!patchGridRows(grid, body.columns || [], body.rows || [],
      Number(body.total || 0), Number(body.offset || 0))) {
    grid.innerHTML = registryGridHtml(body);
  }
  const sub = dataEl.querySelector(".datahead .sub");
  if (sub) sub.textContent = (body.columns || []).length + " cols · "
    + Number(body.total || 0).toLocaleString() + " rows";
  setRegistryPager(body);
