<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BruteX — Movers</title>
<style>
  :root {
    --bg:#0A0D11; --surface:#131722; --surface-2:#1A1F2C; --surface-3:#232938;
    --border:#1E222D; --border-strong:#2B313F;
    --text:#E5E8EC; --text-bright:#FFFFFF; --muted:#787B86;
    --green:#26D9B0; --green-bright:#4FFFD0; --red:#FF5C5C;
    --yellow:#FFB74D; --blue:#5B8DEF; --purple:#9D7BFF;
    --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:18px; --r-pill:999px;
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
    --ctl-h:38px; --tap:40px; --gutter:clamp(16px,3vw,24px);
    --elev-1:0 2px 10px rgba(0,0,0,.28); --elev-2:0 10px 30px rgba(0,0,0,.45);
    --ease:cubic-bezier(.22,.61,.36,1); --line:var(--border-strong);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); height:100%; }
  body { font-family:-apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    background:radial-gradient(ellipse at top, rgba(91,141,239,0.06), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(38,217,176,0.04), transparent 60%), var(--bg); }
  header { display:flex; align-items:center; gap:14px; padding:16px 24px; border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:6; background:rgba(10,13,17,.82); backdrop-filter:blur(11px); }
  .logo { font-weight:800; font-size:18px; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--purple),var(--blue),var(--green));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); font-size:12px; }
  @keyframes gradShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
  .brandmark { width:30px; height:30px; border-radius:9px; flex:0 0 auto; display:grid; place-items:center; font-size:16px; color:#0A0D11; font-weight:900; background:linear-gradient(135deg,var(--purple),var(--blue) 55%,var(--green)); background-size:180% 180%; box-shadow:0 4px 14px rgba(91,141,239,.35); animation:gradShift 8s var(--ease) infinite; }
  .topnav a:hover { color:var(--text-bright); }
  .topnav a[aria-current="page"] { color:var(--text-bright); background:var(--surface-3); box-shadow:inset 0 0 0 1px var(--border-strong); border-radius:var(--r-sm); padding:6px 10px; }
  nav { margin-left:18px; display:flex; gap:14px; font-size:13px; }
  nav a { color:var(--blue); text-decoration:none; } nav a:hover { color:var(--green); }
  .wrap { flex:1; padding:20px 24px; max-width:1340px; width:100%; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .card > h1 { font-size:17px; margin:0 0 14px; color:var(--text-bright);
    display:flex; align-items:center; gap:10px;
    padding-bottom:10px; border-bottom:1px solid var(--border); }
  .card > h1::before { content:""; flex:0 0 auto; width:3px; height:18px; border-radius:2px;
    background:linear-gradient(180deg,var(--blue),var(--purple)); }
  .tabs { display:flex; gap:8px; border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:12px; }
  .tab { padding:8px 16px; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;
    color:var(--muted); background:transparent; border:1px solid transparent; user-select:none; }
  .tab.on { color:var(--green-bright); background:rgba(38,217,176,.10); border-color:var(--green); }
  .bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .pill { padding:6px 12px; border-radius:999px; font-size:12.5px; cursor:pointer; user-select:none;
    color:var(--muted); background:var(--surface-2); border:1px solid var(--border-strong); }
  .pill.on { color:var(--yellow); border-color:var(--yellow); background:rgba(255,183,77,.10); }
  .spacer { margin-left:auto; }
  select, input[type=date], input[type=number] { background:var(--surface-2); color:var(--text);
    border:1px solid var(--border-strong); border-radius:9px; padding:7px 10px; font-size:12.5px; }
  input[type=number]{ width:64px; }
  label.ctl { display:inline-flex; flex-direction:column; gap:3px; font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.4px; }
  button.go { background:linear-gradient(180deg, rgba(38,217,176,.12), transparent); border:1px solid var(--green);
    color:var(--green-bright); border-radius:9px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; align-self:flex-end; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  /* tabular-nums: fixed-width digits so every numeric column aligns precisely
     (the dashboard convention, e.g. /coverage + /universe) — a markets screen. */
  th, td { text-align:right; padding:10px 12px; border-bottom:1px solid var(--border);
    white-space:nowrap; font-variant-numeric:tabular-nums; }
  th:first-child, td:first-child { text-align:left; }
  thead th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:600;
    position:sticky; top:64px; background:var(--surface); cursor:pointer; user-select:none; }
  thead th:hover { color:var(--text-bright); }
  thead th.sorted { color:var(--blue); }
  td.name { color:var(--text-bright); font-weight:600; }
  td.pos { color:var(--green); } td.neg { color:var(--red); }
  tbody tr:hover { background:var(--surface-2); }
  .controls-row { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; margin-bottom:12px; }
  #asof { margin-left:auto; font-size:12px; color:var(--muted); align-self:center; }
  .note { font-size:12px; color:var(--muted); margin-top:12px; line-height:1.5; } .note b { color:var(--text); }
  .preview-badge { font-size:10px; font-weight:700; color:var(--yellow); border:1px solid var(--yellow);
    border-radius:999px; padding:2px 8px; background:rgba(255,183,77,.10); }
  .empty { color:var(--muted); text-align:center; padding:24px 0; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--blue); outline-offset:2px; border-radius:8px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; } }
</style>
<link rel="stylesheet" href="/static/bx-datepicker.css">
<script defer src="/static/bx-datepicker.js"></script>
</head>
<body>
  <header>
    <div class="brandmark" aria-hidden="true">B</div>
    <div class="logo">BruteX</div>
    <div class="sub">Markets Movers — point-in-time snapshot (reference-only lake)</div>
    <nav class="topnav" aria-label="Primary" style="margin-left:18px; display:flex; gap:14px; font-size:13px;">
      <a href="/universe">Universe</a>
      <a href="/groww-credentials">Credentials</a>
      <a href="/db">Database</a>
      <a href="/coverage">Coverage</a>
      <a href="/movers" aria-current="page">Movers</a>
      <a href="/reports">Reports</a>
    </nav>
  </header>

  <div class="wrap">
    <div class="card">
      <h1>📊 Markets Movers</h1>
      <div class="tabs" id="tabs">
        <div class="tab on" data-asset="spot">📈 Spot</div>
        <div class="tab" data-asset="futures">🔮 Futures</div>
        <div class="tab" data-asset="options">🎯 Options</div>
      </div>

      <div class="bar">
        <span id="pills"></span>
        <span class="spacer"></span>
        <select id="exchange" title="Exchange"><option>NSE</option><option>BSE</option></select>
        <select id="track" title="Expiry cadence (Options)" style="display:none;"></select>
        <select id="expiry" title="Expiry" style="display:none;"></select>
      </div>

      <div class="controls-row">
        <label class="ctl">Date<input type="date" id="date" /></label>
        <label class="ctl">Timeframe
          <select id="interval">
            <option value="1day" selected>1 day</option>
            <option value="1hour">1 hour</option>
            <option value="30minute">30 min</option>
            <option value="15minute">15 min</option>
            <option value="5minute">5 min</option>
            <option value="1minute">1 min</option>
          </select>
        </label>
        <label class="ctl">Time<select id="time"><option value="">(daily)</option></select></label>
        <label class="ctl">Top N<input type="number" id="topn" min="1" max="200" value="50" /></label>
        <button class="go" id="refresh">↻ Refresh</button>
        <span id="asof"></span>
      </div>

      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="note" id="note"></p>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

/* ── Per-asset config: ALL category sections + sortable columns ──
   Each column = [label, field, type]; every column header is click-to-sort. */
const ASSETS = {
  spot: {
    cats: [["price_gainers","Price Gainers"],["price_losers","Price Losers"],["volume","Top Volume"],["value","Top Value"]],
    cols: [["Name","name","str"],["LTP","ltp","money"],["Change","change","money"],["Change %","pct_change","num"],["Value (Cr)","value_cr","num"],["Volume","volume","int"]],
  },
  futures: {
    cats: [["price_gainers","Price Gainers"],["price_losers","Price Losers"],["premium","Premium"],["discount","Discount"],["volume","Top Volume"],["oi_gainers","OI Gainers"],["oi_losers","OI Losers"]],
    cols: [["Name","name","str"],["LTP","ltp","money"],["Spot","spot","money"],["Premium","premium","money"],["Change %","pct_change","num"],["OI","oi","int"],["OI Chg %","oi_chg_pct","num"],["Volume","volume","int"]],
  },
  options: {
    cats: [["highest_oi","Highest OI"],["oi_gainers","OI Gainers"],["oi_losers","OI Losers"],["volume","Top Volume"],["value","Top Value"],["price_gainers","Price Gainers"],["price_losers","Price Losers"]],
    cols: [["Name","name","str"],["Spot","spot","money"],["LTP","ltp","money"],["Change %","pct_change","num"],["OI","oi","int"],["OI Chg","oi_chg","int"],["OI Chg %","oi_chg_pct","num"],["Volume","volume","int"]],
  },
};
const TF_MIN = {"1minute":1,"5minute":5,"15minute":15,"30minute":30,"1hour":60,"1day":375};
const state = { asset:"spot", category:"price_gainers", interval:"1day", time:"", sort:{idx:null,dir:1} };
let rowsData = [];

/* Clearly-labelled SAMPLE rows so the page shows the layout standalone (no backend). NOT real data. */
const SAMPLE = {
  spot: [
    {name:"NIFTY 50", ltp:"₹23,622.90", change:"+461.30", pct_change:"1.99", value_cr:"12,304.50", volume:"1,23,45,678"},
    {name:"RELIANCE", ltp:"₹1,293.00", change:"+30.00", pct_change:"2.38", value_cr:"996.41", volume:"81,01,241"},
    {name:"HDFC BANK", ltp:"₹772.45", change:"-9.60", pct_change:"-1.23", value_cr:"440.82", volume:"99,46,830"},
  ],
  futures: [
    {name:"NIFTY 30 JUN FUT", ltp:"₹23,650.00", spot:"₹23,622.90", premium:"+27.10", pct_change:"1.99", oi:"1,12,500", oi_chg_pct:"3.2", volume:"45,62,940"},
    {name:"RELIANCE 30 JUN FUT", ltp:"₹1,296.50", spot:"₹1,293.00", premium:"+3.50", pct_change:"2.40", oi:"2,33,500", oi_chg_pct:"-1.1", volume:"8,200"},
  ],
  options: [
    {name:"NIFTY 30 JUN 24000 CALL", spot:"₹23,622.90", ltp:"₹164.00", pct_change:"179.62", oi:"76,10,235", oi_chg:"-3,00,440", oi_chg_pct:"-3.80", volume:"1,47,65,790"},
    {name:"BANKNIFTY 30 JUN 56000 CALL", spot:"₹56,814.80", ltp:"₹1,414.00", pct_change:"138.97", oi:"10,43,760", oi_chg:"89,640", oi_chg_pct:"9.40", volume:"59,83,260"},
    {name:"NIFTY 30 JUN 23000 PUT", spot:"₹23,622.90", ltp:"₹73.50", pct_change:"-67.50", oi:"60,92,940", oi_chg:"8,82,770", oi_chg_pct:"16.94", volume:"1,06,25,485"},
  ],
};

function fillTimes() {
  const m = TF_MIN[$("interval").value] || 375, sel = $("time");
  if (m >= 375) { sel.innerHTML = '<option value="">(daily)</option>'; sel.disabled = true; state.time=""; return; }
  sel.disabled = false; let opts = "", t = 9*60+15;
  while (t < 15*60+30) { opts += `<option>${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}</option>`; t += m; }
  sel.innerHTML = opts; state.time = sel.value;
}
function renderPills() {
  $("pills").innerHTML = ASSETS[state.asset].cats.map(([k,l]) => `<span class="pill ${k===state.category?'on':''}" data-cat="${k}">${l}</span>`).join("");
  $("pills").querySelectorAll(".pill").forEach(p => p.onclick = () => { state.category = p.dataset.cat; renderPills(); load(); });
  $("expiry").style.display = (state.asset==="spot") ? "none" : "";
  if (state.asset!=="spot" && !$("expiry").innerHTML) $("expiry").innerHTML = ["Near","Next","Far"].map(e=>`<option>${e}</option>`).join("");
  /* Options-only: the All/Monthly/Weekly cadence the Near/Next/Far tier ranks within. */
  $("track").style.display = (state.asset==="options") ? "" : "none";
  if (state.asset==="options" && !$("track").innerHTML) $("track").innerHTML = ["All","Monthly","Weekly"].map(e=>`<option>${e}</option>`).join("");
}
function renderHead() {
  const cols = ASSETS[state.asset].cols;
  $("head").innerHTML = cols.map(([label],i) => {
    const arrow = state.sort.idx===i ? (state.sort.dir>0?" ▲":" ▼") : "";
    return `<th data-i="${i}" class="${state.sort.idx===i?'sorted':''}">${label}${arrow}</th>`;
  }).join("");
  $("head").querySelectorAll("th").forEach(th => th.onclick = () => {
    const i = +th.dataset.i;
    state.sort = { idx:i, dir: (state.sort.idx===i ? -state.sort.dir : 1) };
    renderHead(); renderRows();
  });
}
function numify(v){ const n = parseFloat(String(v ?? "").replace(/[₹,%\s]/g,"").replace(/,/g,"")); return isNaN(n)?null:n; }
function renderRows() {
  const cols = ASSETS[state.asset].cols;
  let data = rowsData.slice();
  if (state.sort.idx !== null) {
    const [,field,type] = cols[state.sort.idx], d = state.sort.dir;
    data.sort((a,b) => {
      if (type === "str") return String(a[field]||"").localeCompare(String(b[field]||"")) * d;
      const x = numify(a[field]), y = numify(b[field]);
      if (x===null && y===null) return 0; if (x===null) return 1; if (y===null) return -1;
      return (x - y) * d;
    });
  }
  const tb = $("rows");
  if (!data.length) { tb.innerHTML = `<tr><td colspan="${cols.length}" class="empty">📭 no movers in this snapshot</td></tr>`; return; }
  tb.innerHTML = data.map(row => "<tr>" + cols.map(([,field],i) => {
    let v = row[field]; if (v===undefined||v===null) v = "—";
    let cls = i===0 ? "name" : "";
    if (field==="pct_change" || field==="change" || field==="premium" || field==="oi_chg" || field==="oi_chg_pct") {
      const n = numify(v); if (n!==null && n!==0) cls = n>0 ? "pos" : "neg";
      if ((field==="pct_change"||field==="oi_chg_pct") && n!==null) v = (n>0?"+":"") + n.toFixed(2) + "%";
    }
    return `<td class="${cls}">${v}</td>`;
  }).join("") + "</tr>").join("");
}
async function load() {
  $("note").innerHTML = "Loading…";
  const p = new URLSearchParams({ asset:state.asset, category:state.category, interval:$("interval").value, top_n:$("topn").value||"50" });
  if ($("date").value) p.set("date", $("date").value);
  if (state.time) p.set("time", state.time);
  if (state.asset!=="spot") p.set("expiry", $("expiry").value||"Near");
  if (state.asset==="options") p.set("track", $("track").value||"All");
  try {
    const r = await fetch("/api/v1/movers?"+p.toString());
    if (!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    rowsData = j.rows || j[state.category] || j.gainers || j.volume_movers || [];
    renderHead(); renderRows();
    $("asof").textContent = `as-of ${(j.date||"")} ${j.time||"(daily)"} · ${j.interval||""}`;
    $("note").innerHTML = "<b>Note:</b> "+(j.note||"");
  } catch (e) {
    rowsData = SAMPLE[state.asset] || SAMPLE.spot;
    renderHead(); renderRows();
    $("asof").innerHTML = `<span class="preview-badge">PREVIEW · sample layout</span>`;
    $("note").innerHTML = "<b>Note:</b> preview of the layout with sample rows — run the dashboard for live lake data (reference-only, % vs prev-day close, fresh-session volume, click any column to sort).";
  }
}
$("tabs").querySelectorAll(".tab").forEach(t => t.onclick = () => {
  $("tabs").querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
  state.asset = t.dataset.asset; state.category = ASSETS[state.asset].cats[0][0]; state.sort = {idx:null,dir:1};
  renderPills(); load();
});
$("interval").onchange = () => { fillTimes(); load(); };
$("time").onchange = () => { state.time = $("time").value; load(); };
["exchange","expiry","track","topn","date"].forEach(id => $(id).onchange = load);
$("refresh").onclick = load;
fillTimes(); renderPills(); load();
</script>
</body>
</html>
