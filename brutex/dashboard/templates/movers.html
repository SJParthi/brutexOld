<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BruteX — Movers</title>
<style>
  :root {
    --bg:#0A0D11; --surface:#131722; --surface-2:#1A1F2C; --surface-3:#232938;
    --border:#1E222D; --border-strong:#2B313F;
    --text:#E5E8EC; --text-bright:#FFFFFF; --muted:#787B86;
    --green:#26D9B0; --green-bright:#4FFFD0; --red:#FF5C5C;
    --yellow:#FFB74D; --blue:#5B8DEF; --purple:#9D7BFF;
    --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:18px; --r-pill:999px;
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
    --ctl-h:38px; --tap:40px; --gutter:clamp(16px,3vw,24px);
    --elev-1:0 2px 10px rgba(0,0,0,.28); --elev-2:0 10px 30px rgba(0,0,0,.45);
    --ease:cubic-bezier(.22,.61,.36,1); --line:var(--border-strong);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); height:100%; }
  body { font-family:-apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    background:radial-gradient(ellipse at top, rgba(91,141,239,0.06), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(38,217,176,0.04), transparent 60%), var(--bg); }
  header { display:flex; align-items:center; gap:14px; padding:16px 24px; border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:6; background:rgba(10,13,17,.82); backdrop-filter:blur(11px); }
  .logo { font-weight:800; font-size:18px; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--purple),var(--blue),var(--green));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); font-size:12px; }
  @keyframes gradShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
  .brandmark { width:30px; height:30px; border-radius:9px; flex:0 0 auto; display:grid; place-items:center; font-size:16px; color:#0A0D11; font-weight:900; background:linear-gradient(135deg,var(--purple),var(--blue) 55%,var(--green)); background-size:180% 180%; box-shadow:0 4px 14px rgba(91,141,239,.35); animation:gradShift 8s var(--ease) infinite; }
  .topnav a:hover { color:var(--text-bright); }
  .topnav a[aria-current="page"] { color:var(--text-bright); background:var(--surface-3); box-shadow:inset 0 0 0 1px var(--border-strong); border-radius:var(--r-sm); padding:6px 10px; }
  nav { margin-left:18px; display:flex; gap:14px; font-size:13px; }
  nav a { color:var(--blue); text-decoration:none; } nav a:hover { color:var(--green); }
  .wrap { flex:1; padding:20px 24px; max-width:1340px; width:100%; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .card > h1 { font-size:17px; margin:0 0 14px; color:var(--text-bright);
    display:flex; align-items:center; gap:10px;
    padding-bottom:10px; border-bottom:1px solid var(--border); }
  .card > h1::before { content:""; flex:0 0 auto; width:3px; height:18px; border-radius:2px;
    background:linear-gradient(180deg,var(--blue),var(--purple)); }
  .tabs { display:flex; gap:8px; border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:12px; }
  .tab { padding:8px 16px; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;
    color:var(--muted); background:transparent; border:1px solid transparent; user-select:none; }
  .tab.on { color:var(--green-bright); background:rgba(38,217,176,.10); border-color:var(--green); }
  .bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .pill { padding:6px 12px; border-radius:999px; font-size:12.5px; cursor:pointer; user-select:none;
    color:var(--muted); background:var(--surface-2); border:1px solid var(--border-strong); }
  .pill.on { color:var(--yellow); border-color:var(--yellow); background:rgba(255,183,77,.10); }
  .spacer { margin-left:auto; }
  select, input[type=date], input[type=number] { background:var(--surface-2); color:var(--text);
    border:1px solid var(--border-strong); border-radius:9px; padding:7px 10px; font-size:12.5px; }
  input[type=number]{ width:64px; }
  label.ctl { display:inline-flex; flex-direction:column; gap:3px; font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.4px; }
  button.go { background:linear-gradient(180deg, rgba(38,217,176,.12), transparent); border:1px solid var(--green);
    color:var(--green-bright); border-radius:9px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; align-self:flex-end; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  /* tabular-nums: fixed-width digits so every numeric column aligns precisely
     (the dashboard convention, e.g. /coverage + /universe) — a markets screen. */
  th, td { text-align:right; padding:10px 12px; border-bottom:1px solid var(--border);
    white-space:nowrap; font-variant-numeric:tabular-nums; }
  th:first-child, td:first-child { text-align:left; }
  thead th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:600;
    position:sticky; top:64px; background:var(--surface); cursor:pointer; user-select:none; }
  thead th:hover { color:var(--text-bright); }
  thead th.sorted { color:var(--blue); }
  td.name { color:var(--text-bright); font-weight:600; }
  td.pos { color:var(--green); } td.neg { color:var(--red); }
  td.muted { color:var(--muted); }
  tbody tr:hover { background:var(--surface-2); }
  .controls-row { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; margin-bottom:12px; }
  #asof { margin-left:auto; font-size:12px; color:var(--muted); align-self:center; }
  .note { font-size:12px; color:var(--muted); margin-top:12px; line-height:1.5; } .note b { color:var(--text); }
  .preview-badge { font-size:10px; font-weight:700; color:var(--yellow); border:1px solid var(--yellow);
    border-radius:999px; padding:2px 8px; background:rgba(255,183,77,.10); }
  .empty { color:var(--muted); text-align:center; padding:24px 0; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--blue); outline-offset:2px; border-radius:8px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; } }
</style>
<link rel="stylesheet" href="/static/bx-datepicker.css">
<link rel="stylesheet" href="/static/bx-theme.css">
<script defer src="/static/bx-datepicker.js"></script>
<!-- Live pull-rate monitor widget (DEC-LIVE-RATE-MONITOR-001): self-injecting,
     polls /api/v1/pull/rate. Idle until a pull runs; never blocks first paint. -->
<script defer src="/static/bx-rate-monitor.js"></script>
<script defer src="/static/bx-liveproof.js"></script>

<body>
  <header>
    <div class="brandmark" aria-hidden="true">B</div>
    <div class="logo">BruteX</div>
    <div class="sub">Markets Movers — point-in-time snapshot (reference-only lake)</div>
    <nav class="topnav" aria-label="Primary">
      <a href="/">Operator</a>
      <a href="/universe">Universe</a>
      <a href="/db">Database</a>
      <a href="/coverage">Coverage</a>
      <a href="/movers" aria-current="page">Movers</a>
      <a href="/results">Results</a>
      <a href="/reports">Reports</a>
    </nav>
  </header>

  <div class="wrap">
    <div class="card">
      <h1>📊 Markets Movers</h1>
      <div class="tabs" id="tabs">
        <div class="tab on" data-asset="spot">📈 Spot</div>
        <div class="tab" data-asset="futures">🔮 Futures</div>
        <div class="tab" data-asset="options">🎯 Options</div>
      </div>

      <div class="bar">
        <span id="pills"></span>
        <span class="spacer"></span>
        <select id="exchange" title="Exchange"><option>NSE</option><option>BSE</option></select>
        <select id="track" title="Expiry cadence (Options)" style="display:none;"></select>
        <select id="expiry" title="Expiry" style="display:none;"></select>
      </div>

      <div class="controls-row">
        <label class="ctl">Date<input type="date" id="date" /></label>
        <label class="ctl">Timeframe
          <!-- ALL 21 Track-1 timeframes (DEC-MOVERS-COMPLETENESS-001): 1m base + 19 derived
               intraday + 1d. Spot reads the pipeline-prebuilt STORED interval partition FIRST
               (DEC-PIPELINE-AUTOPREBUILD-001 chunk 2) and falls back to the on-the-fly
               resample_1m_to_tf of the stored 1-minute — so all 21 work as long as 1-minute
               spot / FNO candles are in the lake, prebuilt or not. The labels + minute map
               below mirror brutex.data.timeframes.LAKE_INTERVAL_LABELS (the single source of
               truth — CLAUDE.md §11 COMMON). -->
          <select id="interval">
            <option value="1day" selected>1 day</option>
            <option value="4hour">4 hour</option>
            <option value="3hour">3 hour</option>
            <option value="2hour">2 hour</option>
            <option value="1hour">1 hour</option>
            <option value="30minute">30 min</option>
            <option value="15minute">15 min</option>
            <option value="14minute">14 min</option>
            <option value="13minute">13 min</option>
            <option value="12minute">12 min</option>
            <option value="11minute">11 min</option>
            <option value="10minute">10 min</option>
            <option value="9minute">9 min</option>
            <option value="8minute">8 min</option>
            <option value="7minute">7 min</option>
            <option value="6minute">6 min</option>
            <option value="5minute">5 min</option>
            <option value="4minute">4 min</option>
            <option value="3minute">3 min</option>
            <option value="2minute">2 min</option>
            <option value="1minute">1 min</option>
          </select>
        </label>
        <label class="ctl">Time<select id="time"><option value="">(daily)</option></select></label>
        <label class="ctl">Top N<input type="number" id="topn" min="1" max="500" value="100" /></label>
        <!-- OPT-IN "Top Volume" floor (DEC-MOVERS-MIN-VOLUME-001): blank / 0 = no floor
             (byte-identical to today); a positive value drops thin contracts from the
             Top Volume ranking. Applied server-side at rank time, so it never re-scans. -->
        <label class="ctl">Min vol<input type="number" id="minvol" min="0" step="1" value="0" title="Minimum cumulative session volume (Top Volume ranking)" /></label>
        <button class="go" id="refresh">↻ Refresh</button>
        <span id="asof"></span>
      </div>

      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="note" id="note"><b>Note:</b> <span id="noteText"></span></p>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

/* esc(): HTML-escape any vendor-derived cell value before it touches innerHTML
   (DEC-DASHBOARD-XSS-HARDENING-001). The SAME helper db.html / universe.html /
   completeness.html ship (one source of truth, CLAUDE.md §11 COMMON) — a symbol
   name or moneyness label like `<img src=x onerror=alert(1)>` renders as inert
   text (`&lt;img …`), never a live tag. Numbers coerce to their string form
   first; a clean numeric/`₹`-formatted string passes through unchanged. */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ── Per-asset config: ALL category sections + sortable columns ──
   Each column = [label, field, type]; every column header is click-to-sort. */
const ASSETS = {
  spot: {
    cats: [["price_gainers","Price Gainers"],["price_losers","Price Losers"],["volume","Top Volume"],["value","Top Value"]],
    cols: [["Name","name","str"],["LTP","ltp","money"],["Change","change","money"],["Change %","pct_change","num"],["Value (Cr)","value_cr","num"],["Volume","volume","int"]],
  },
  futures: {
    cats: [["price_gainers","Price Gainers"],["price_losers","Price Losers"],["premium","Premium"],["discount","Discount"],["volume","Top Volume"],["value","Top Value"],["oi_gainers","OI Gainers"],["oi_losers","OI Losers"]],
    cols: [["Name","name","str"],["LTP","ltp","money"],["Spot","spot","money"],["Premium","premium","money"],["Change %","pct_change","num"],["Value (Cr)","value_cr","num"],["OI","oi","int"],["OI Chg %","oi_chg_pct","num"],["Volume","volume","int"]],
  },
  options: {
    cats: [["highest_oi","Highest OI"],["oi_gainers","OI Gainers"],["oi_losers","OI Losers"],["volume","Top Volume"],["value","Top Value"],["price_gainers","Price Gainers"],["price_losers","Price Losers"]],
    /* IV + Delta are the STORED per-bar Greeks overlay as of the snapshot (last kept
       session bar; DEC-GREEKS-ENGINE-PR3B-001 over the Phase-2b store) — full-precision
       floats in the payload, 4dp DISPLAY-only ("num4"); null (legacy pre-Greeks
       partition / stamped-NA bar) renders "—", never a fabricated Greek. */
    cols: [["Name","name","str"],["Spot","spot","money"],["LTP","ltp","money"],["Moneyness","moneyness","str"],["IV","iv","num4"],["Delta","delta","num4"],["Change %","pct_change","num"],["OI","oi","int"],["OI Chg","oi_chg","int"],["OI Chg %","oi_chg_pct","num"],["Volume","volume","int"]],
  },
};
/* Lake interval label → bar minutes for ALL 21 Track-1 timeframes — mirrors
   brutex.data.timeframes.LAKE_INTERVAL_LABELS (single source of truth, CLAUDE.md §11
   COMMON). Drives fillTimes() so each TF lists its own session bar start-times. */
const TF_MIN = {
  "1minute":1,"2minute":2,"3minute":3,"4minute":4,"5minute":5,"6minute":6,"7minute":7,
  "8minute":8,"9minute":9,"10minute":10,"11minute":11,"12minute":12,"13minute":13,
  "14minute":14,"15minute":15,"30minute":30,"1hour":60,"2hour":120,"3hour":180,
  "4hour":240,"1day":375,
};
const state = { asset:"spot", category:"price_gainers", interval:"1day", time:"", sort:{idx:null,dir:1} };
let rowsData = [];
/* Prebuild-gate auto-recovery timer (DEC-PIPELINE-AUTOPREBUILD-001 chunk 2):
   while the pull pipeline gates the movers (payload `gated: true`), re-poll
   every few seconds so the screen recovers BY ITSELF the moment the gate
   lifts — no manual refresh needed. Cleared on every non-gated load. */
let gateTimer = null;
const GATE_RETRY_MS = 5000;
/* Gated-shell paint-once guard (DEC-DASHBOARD-JS-PERF-001): while the gate holds,
   each 5 s retry used to rebuild the whole thead + empty tbody just to redisplay
   the SAME "prebuild in progress" shell. The shell is now painted ONCE per
   (asset, note) key — the asset is in the key so a tab switch mid-gate still
   repaints the new column set — and later identical retries refresh only the
   cheap #asof/#noteText textContent lines (same pixels). */
let wasGated = false;
let lastGatedKey = null;
/* The full payload from the last successful fetch — it holds EVERY category list
   for the current coordinate (date/timeframe/time/exchange/top_n/expiry/track), so
   switching the sub-filter pill is a pure client-side re-render with NO server
   round-trip (DEC-MOVERS-O1-LATENCY-001). Reset to null on a failed/preview fetch
   so a pill switch then falls back to a real fetch. */
let lastPayload = null;
/* Skip-render-when-unchanged (DEC-DASHBOARD-JS-PERF-001): "params|bodyText"
   signature of the last fully-rendered NON-gated payload. A repeat fetch that
   round-trips to the byte-identical body for the SAME coordinate (repeat
   ↻ Refresh — the server-side MoversSnapshotCache returns identical JSON per
   write-generation) skips the thead/tbody rebuild: the DOM already shows exactly
   this snapshot. CLIENT-side compare only (no backend generation field on the
   wire — the generation echo is a reported follow-up); nulled on gated/failed
   loads so recovery always repaints, and the skip is additionally gated behind
   `state.sort.idx === null` so a client-sorted view is never involved. */
let lastRenderSig = null;

/* Clearly-labelled SAMPLE rows so the page shows the layout standalone (no backend). NOT real data. */
const SAMPLE = {
  spot: [
    {name:"NIFTY 50", ltp:"₹23,622.90", change:"+461.30", pct_change:"1.99", value_cr:"12,304.50", volume:"1,23,45,678"},
    {name:"RELIANCE", ltp:"₹1,293.00", change:"+30.00", pct_change:"2.38", value_cr:"996.41", volume:"81,01,241"},
    {name:"HDFC BANK", ltp:"₹772.45", change:"-9.60", pct_change:"-1.23", value_cr:"440.82", volume:"99,46,830"},
  ],
  futures: [
    {name:"NIFTY 30 JUN FUT", ltp:"₹23,650.00", spot:"₹23,622.90", premium:"+27.10", pct_change:"1.99", value_cr:"10,790.30", oi:"1,12,500", oi_chg_pct:"3.2", volume:"45,62,940"},
    {name:"RELIANCE 30 JUN FUT", ltp:"₹1,296.50", spot:"₹1,293.00", premium:"+3.50", pct_change:"2.40", value_cr:"106.32", oi:"2,33,500", oi_chg_pct:"-1.1", volume:"8,200"},
  ],
  options: [
    {name:"NIFTY 30 JUN 24000 CALL", spot:"₹23,622.90", ltp:"₹164.00", moneyness:"OTM +8", iv:"0.1812", delta:"0.3421", pct_change:"179.62", oi:"76,10,235", oi_chg:"-3,00,440", oi_chg_pct:"-3.80", volume:"1,47,65,790"},
    {name:"BANKNIFTY 30 JUN 56000 CALL", spot:"₹56,814.80", ltp:"₹1,414.00", moneyness:"ITM -8", iv:"0.2140", delta:"0.7810", pct_change:"138.97", oi:"10,43,760", oi_chg:"89,640", oi_chg_pct:"9.40", volume:"59,83,260"},
    {name:"NIFTY 30 JUN 23000 PUT", spot:"₹23,622.90", ltp:"₹73.50", moneyness:"OTM +12", iv:"0.1975", delta:"-0.2260", pct_change:"-67.50", oi:"60,92,940", oi_chg:"8,82,770", oi_chg_pct:"16.94", volume:"1,06,25,485"},
  ],
};

function fillTimes() {
  const m = TF_MIN[$("interval").value] || 375, sel = $("time");
  if (m >= 375) { sel.innerHTML = '<option value="">(daily)</option>'; sel.disabled = true; state.time=""; return; }
  sel.disabled = false; let opts = "", t = 9*60+15;
  while (t < 15*60+30) { opts += `<option>${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}</option>`; t += m; }
  sel.innerHTML = opts; state.time = sel.value;
}
/* Sub-filter (pill) switch: re-render the already-fetched payload's other category
   list IN THE BROWSER — the server returned every category for this coordinate, so
   no round-trip is needed (DEC-MOVERS-O1-LATENCY-001). Only falls back to a fetch
   when no payload is cached yet (first paint, or after a failed/preview fetch). */
function applyCategory() {
  if (lastPayload) { rowsData = lastPayload[state.category] || lastPayload.gainers || []; renderRows(); }
  else { load(); }
}
function renderPills() {
  $("pills").innerHTML = ASSETS[state.asset].cats.map(([k,l]) => `<span class="pill ${k===state.category?'on':''}" data-cat="${k}">${l}</span>`).join("");
  /* Pill clicks are DELEGATED — one listener on #pills, attached once at init
     (onPillsClick), surviving this innerHTML swap by construction — so this
     function only rebuilds markup on asset switches; it wires no handlers and
     never recurses into itself (DEC-DASHBOARD-JS-PERF-001). */
  /* Expiry applies to futures/options only — hidden for spot. */
  const derivAsset = (state.asset==="futures" || state.asset==="options");
  $("expiry").style.display = derivAsset ? "" : "none";
  if (derivAsset && !$("expiry").innerHTML) $("expiry").innerHTML = ["Near","Next","Far"].map(e=>`<option>${e}</option>`).join("");
  /* Options-only: the All/Monthly/Weekly cadence the Near/Next/Far tier ranks within. */
  $("track").style.display = (state.asset==="options") ? "" : "none";
  if (state.asset==="options" && !$("track").innerHTML) $("track").innerHTML = ["All","Monthly","Weekly"].map(e=>`<option>${e}</option>`).join("");
}
function renderHead() {
  const cols = ASSETS[state.asset].cols;
  $("head").innerHTML = cols.map(([label],i) => {
    const arrow = state.sort.idx===i ? (state.sort.dir>0?" ▲":" ▼") : "";
    return `<th data-i="${i}" class="${state.sort.idx===i?'sorted':''}">${label}${arrow}</th>`;
  }).join("");
  /* th sort clicks are DELEGATED — one listener on the #head row, attached once
     at init (onHeadClick), surviving this innerHTML rebuild by construction —
     so no per-th handler re-wiring per render (DEC-DASHBOARD-JS-PERF-001). */
}
/* updateHeadSort(): move the ▲/▼ arrow + the `sorted` class on the EXISTING th
   nodes IN PLACE (textContent-only — the labels are static per asset from
   ASSETS[..].cols, so the result is provably identical to a full renderHead()
   rebuild: the thead content is fully derived from that static config +
   state.sort). renderHead() stays the full-rebuild fallback whenever the column
   SHAPE can change (asset-tab switch / every load()). DEC-DASHBOARD-JS-PERF-001. */
function updateHeadSort() {
  const cols = ASSETS[state.asset].cols;
  $("head").querySelectorAll("th").forEach((th, i) => {
    const arrow = state.sort.idx===i ? (state.sort.dir>0?" ▲":" ▼") : "";
    th.classList.toggle("sorted", state.sort.idx===i);
    th.textContent = (cols[i] ? cols[i][0] : "") + arrow;
  });
}
function numify(v){ const n = parseFloat(String(v ?? "").replace(/[₹,%\s]/g,"").replace(/,/g,"")); return isNaN(n)?null:n; }
/* Compact elapsed formatter for the gated status line (DEC-PREBUILD-GATE-HONEST-NOTE-001):
   seconds → "42s" / "7m 05s" / "2h 14m". Null/invalid reads "0s" (honest floor). */
function fmtElapsed(s){
  const n = Math.max(0, Math.floor(Number(s) || 0));
  const h = Math.floor(n/3600), m = Math.floor((n%3600)/60), sec = n%60;
  if (h > 0) return `${h}h ${String(m).padStart(2,"0")}m`;
  if (m > 0) return `${m}m ${String(sec).padStart(2,"0")}s`;
  return `${sec}s`;
}
function renderRows() {
  const cols = ASSETS[state.asset].cols;
  let data = rowsData.slice();
  if (state.sort.idx !== null) {
    const [,field,type] = cols[state.sort.idx], d = state.sort.dir;
    data.sort((a,b) => {
      if (type === "str") return String(a[field]||"").localeCompare(String(b[field]||"")) * d;
      const x = numify(a[field]), y = numify(b[field]);
      if (x===null && y===null) return 0; if (x===null) return 1; if (y===null) return -1;
      return (x - y) * d;
    });
  }
  const tb = $("rows");
  if (!data.length) { tb.innerHTML = `<tr><td colspan="${cols.length}" class="empty">📭 no movers in this snapshot</td></tr>`; return; }
  tb.innerHTML = data.map(row => "<tr>" + cols.map(([,field,type],i) => {
    let v = row[field]; if (v===undefined||v===null) v = "—";
    let cls = i===0 ? "name" : "";
    /* Numeric cells get display formatting: money → ₹ + Indian grouping @ 2dp,
       num → 2dp, int → grouped. Cells that already arrive as formatted strings
       (typeof !== "number") pass through unchanged. */
    if (typeof v === "number") {
      if (type === "int") v = v.toLocaleString("en-IN");
      else if (type === "money") v = "₹" + v.toLocaleString("en-IN", {minimumFractionDigits:2, maximumFractionDigits:2});
      else if (type === "num") v = v.toFixed(2);
      else if (type === "num4") v = v.toFixed(4);  /* Greeks (iv/delta) — display-only 4dp, payload stays full precision */
    }
    if (field==="pct_change" || field==="change" || field==="premium" || field==="oi_chg" || field==="oi_chg_pct") {
      const n = numify(v); if (n!==null && n!==0) cls = n>0 ? "pos" : "neg";
      if ((field==="pct_change"||field==="oi_chg_pct") && n!==null) v = (n>0?"+":"") + n.toFixed(2) + "%";
    }
    /* Moneyness chip (DEC-FNO-MONEYNESS-001): the cell reads "ITM -1" / "OTM +10" /
       "ATM" / "?" — tint by the leading bucket (ITM green, OTM red, else muted).
       Purely a display tint. HONESTY MARKER (DEC-MONEYNESS-REGISTRY-STEP-001): when
       the row's strike grid came from the sparse lake-observed ladder only
       (strike_step_confidence === "observed" — no vendor registry chain), a trailing
       " ~" flags the possibly-overestimated ATM±N step; a registry-confident row
       shows no marker. Appended AFTER the tint check (startsWith is unaffected). */
    if (field==="moneyness" && typeof v === "string") {
      if (v.startsWith("ITM")) cls = "pos"; else if (v.startsWith("OTM")) cls = "neg";
      else if (v==="?"||v==="—") cls = "muted";
      if (row.strike_step_confidence === "observed" && v!=="?" && v!=="—") v += " ~";
    }
    return `<td class="${cls}">${esc(v)}</td>`;
  }).join("") + "</tr>").join("");
}
function syncControls() {
  ["date","interval","time","exchange"].forEach(id => {
    const el = $(id).closest("label.ctl") || $(id);
    el.style.display = "";
  });
  $("topn").max = "500";  // matches the /api/v1/movers route cap (DEC-MOVERS-COMPLETENESS-001).
}
async function load() {
  /* The server note ECHOES the raw ?asset= query param (pending_asset_payload),
     so it is set via textContent on a dedicated span — the static "<b>Note:</b>"
     label stays in the DOM — never innerHTML (DEC-DASHBOARD-XSS-HARDENING-001).
     A reflected `?asset=<img …>` renders as inert text, not a live tag. */
  $("noteText").textContent = "Loading…";
  syncControls();
  const p = new URLSearchParams({ asset:state.asset, category:state.category, interval:$("interval").value, top_n:$("topn").value||"100" });
  if ($("date").value) p.set("date", $("date").value);
  if (state.time) p.set("time", state.time);
  if ($("exchange").value) p.set("exchange", $("exchange").value);
  /* OPT-IN Top Volume floor (DEC-MOVERS-MIN-VOLUME-001): only send a POSITIVE value, so
     blank / 0 stays byte-identical to the no-floor default (the route default is 0). */
  if (parseInt($("minvol").value, 10) > 0) p.set("min_volume", $("minvol").value);
  if (state.asset!=="spot") p.set("expiry", $("expiry").value||"Near");
  if (state.asset==="options") p.set("track", $("track").value||"All");
  try {
    const r = await fetch("/api/v1/movers?"+p.toString());
    if (!r.ok) throw new Error("HTTP "+r.status);
    /* Read the body as TEXT first so an identical repeat payload is detectable
       client-side (DEC-DASHBOARD-JS-PERF-001 — the backend echoes no generation
       field; that echo is a reported follow-up, NOT added here). */
    const bodyText = await r.text();
    const j = JSON.parse(bodyText);
    if (j.gated) {
      /* Prebuild gate (DEC-PIPELINE-AUTOPREBUILD-001 chunk 2 + the phase-aware
         note of DEC-PIPELINE-PHASE-UI-HONESTY-001): the pull pipeline is running
         (the server note names the ACTUAL phase — spot / metadata / historical /
         movers / prebuild) — render the honest server note PROMINENTLY
         (textContent only, never innerHTML for the dynamic string — the repo's
         XSS-guard convention) with an empty grid, and schedule an auto-retry so
         the screen recovers when the gate lifts. */
      lastPayload = null;  /* a pill switch must re-fetch, never re-render the gated shell. */
      lastRenderSig = null;  /* the gate lift must always repaint the real table. */
      rowsData = [];
      const gatedKey = state.asset + "|" + (j.phase || "") + "|" + (j.note || "");
      if (!(wasGated && gatedKey === lastGatedKey)) {
        /* Paint the empty gated shell ONCE per (asset, phase, note); each identical
           5 s retry skips the thead/tbody rebuild and only refreshes the textContent
           lines below — same pixels (DEC-DASHBOARD-JS-PERF-001). The ticking elapsed
           rides the cheap #asof textContent line, never a shell repaint. */
        renderHead(); renderRows();
      }
      wasGated = true; lastGatedKey = gatedKey;
      /* Honest live status (DEC-PREBUILD-GATE-HONEST-NOTE-001): name the running
         final stage + how long the pipeline has been at it (+ the movers-warm i/N
         when reported — SEGMENT-labelled per DEC-MOVERS-WARM-UNBLOCK-001, so a
         per-segment "6/9" reads "futures 6/9", never mistaken for 7-of-9-total),
         instead of a bare "gated". textContent only — never
         innerHTML for server strings (DEC-DASHBOARD-XSS-HARDENING-001). */
      let gatedStatus = `as-of ${(j.date||"")} — gated`;
      if (j.phase) {
        const warm = (j.warm_total != null && j.warm_done != null)
          ? ` — movers warm ${j.warm_segment ? j.warm_segment + " " : ""}${j.warm_done}/${j.warm_total}` : "";
        gatedStatus = `final stage: ${j.phase}${warm} — running ${fmtElapsed(j.elapsed_s)} (auto-refreshes)`;
      }
      $("asof").textContent = gatedStatus;
      $("noteText").textContent = j.note || "pull pipeline running — movers gated until the prebuild finishes.";
      clearTimeout(gateTimer);
      gateTimer = setTimeout(load, GATE_RETRY_MS);
      return;
    }
    clearTimeout(gateTimer);
    wasGated = false; lastGatedKey = null;
    /* Skip-render-when-unchanged (skipUnchangedRender guard): byte-identical body
       for the byte-identical coordinate — the DOM (and rowsData/lastPayload)
       already show exactly this snapshot; restore the note (set to "Loading…"
       above) and stop. Guarded to the no-client-sort state so a manually sorted
       view never takes this path (DEC-DASHBOARD-JS-PERF-001). */
    const sig = p.toString() + "|" + bodyText;
    if (state.sort.idx === null && sig === lastRenderSig) {
      $("noteText").textContent = (j.note||"");
      return;
    }
    lastRenderSig = sig;
    lastPayload = j;  /* cache: sub-filter switches now re-render from this, no refetch. */
    rowsData = j.rows || j[state.category] || j.gainers || j.volume_movers || [];
    renderHead(); renderRows();
    $("asof").textContent = `as-of ${(j.date||"")} ${j.time||"(daily)"} · ${j.interval||""}`;
    $("noteText").textContent = (j.note||"");
  } catch (e) {
    lastPayload = null;  /* preview/failed: a pill switch falls back to a real fetch. */
    lastRenderSig = null;  /* a recovered fetch must always repaint over the preview. */
    wasGated = false; lastGatedKey = null;
    rowsData = SAMPLE[state.asset] || SAMPLE.spot;
    renderHead(); renderRows();
    $("asof").innerHTML = `<span class="preview-badge">PREVIEW · sample layout</span>`;
    $("noteText").textContent = "preview of the layout with sample rows — run the dashboard for real movers data (click any column to sort).";
  }
}
/* Delegated pill clicks — ONE listener on #pills, attached once; it survives
   renderPills' innerHTML swaps by construction (DEC-DASHBOARD-JS-PERF-001).
   A metric-pill switch resets the client-side column sort to the new tab's
   server ranking (DEC-MOVERS-SORT-RESET-001) — otherwise a manual VOLUME sort
   persisted across pill switches (the asset-tab handler already resets it).
   updateHeadSort() clears the stale ▼ arrow + the `sorted` highlight IN PLACE;
   the `.on` class moves in place too (the pill SET only changes on an asset
   switch, which still rebuilds via renderPills). */
function onPillsClick(e) {
  const pl = e.target.closest(".pill");
  if (!pl) return;
  state.category = pl.dataset.cat; state.sort = {idx:null,dir:1};
  $("pills").querySelectorAll(".pill").forEach(x => x.classList.toggle("on", x === pl));
  if ($("head").firstChild) updateHeadSort(); else renderHead();
  applyCategory();
}
$("pills").addEventListener("click", onPillsClick);
/* Delegated sort clicks — ONE listener on the #head row, attached once; it
   survives renderHead's innerHTML rebuilds by construction. The arrow moves
   IN PLACE via updateHeadSort() (no thead rebuild per sort click). */
function onHeadClick(e) {
  const th = e.target.closest("th");
  if (!th || th.dataset.i === undefined) return;
  const i = +th.dataset.i;
  state.sort = { idx:i, dir: (state.sort.idx===i ? -state.sort.dir : 1) };
  updateHeadSort(); renderRows();
}
$("head").addEventListener("click", onHeadClick);
$("tabs").querySelectorAll(".tab").forEach(t => t.onclick = () => {
  $("tabs").querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
  state.asset = t.dataset.asset; state.category = ASSETS[state.asset].cats[0][0]; state.sort = {idx:null,dir:1};
  renderPills(); load();
});
$("interval").onchange = () => { fillTimes(); load(); };
$("time").onchange = () => { state.time = $("time").value; load(); };
/* ~200 ms trailing debounce for the two NUMBER inputs (DEC-DASHBOARD-JS-PERF-001):
   a spinner run fires a discrete `change` per click — debouncedLoad coalesces the
   burst into ONE fetch. The selects + date keep the immediate load (a single
   discrete user action; nothing to coalesce). This page has no free-text filter. */
const DEBOUNCE_MS = 200;
let debounceTimer = null;
function debouncedLoad() { clearTimeout(debounceTimer); debounceTimer = setTimeout(load, DEBOUNCE_MS); }
["exchange","expiry","track","date"].forEach(id => $(id).onchange = load);
["topn","minvol"].forEach(id => $(id).onchange = debouncedLoad);
$("refresh").onclick = load;
fillTimes(); renderPills(); load();
</script>
</body>
