<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BruteX — Live Logs</title>
<style>
  :root {
    /* v28-hybrid locked palette (TRACK1_DASHBOARD_DESIGN.md §3) */
    --bg: #0A0D11; --surface: #131722; --surface-2: #1A1F2C; --surface-3: #232938;
    --border: #1E222D; --border-strong: #2B313F;
    --text: #E5E8EC; --text-bright: #FFFFFF; --muted: #787B86;
    --green: #26D9B0; --green-bright: #4FFFD0; --green-dim: #1A8870;
    --red: #FF5C5C;
    --yellow: #FFB74D; --blue: #5B8DEF; --purple: #9D7BFF; --pink: #FF6B9D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
    background:
      radial-gradient(ellipse at top, rgba(91,141,239,0.06), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(38,217,176,0.04), transparent 60%),
      var(--bg);
  }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .5; transform: scale(.9);} }

  header {
    display:flex; align-items:center; gap:14px; padding:16px 24px;
    border-bottom:1px solid var(--border); animation: fadeInDown .5s ease both;
  }
  .logo { font-weight:800; font-size:18px; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--purple),var(--blue),var(--green));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); font-size:12px; }
  .live { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  .live .dot { width:9px; height:9px; border-radius:50%; background:var(--green);
    box-shadow:0 0 12px var(--green); animation: pulse 1.6s ease-in-out infinite; }
  .live.paused .dot { background:var(--yellow); box-shadow:0 0 12px var(--yellow); animation:none; }

  .band { display:flex; align-items:center; gap:12px; padding:12px 24px; flex-wrap:wrap;
    border-bottom:1px solid var(--border); animation: fadeInDown .6s .05s ease both; }
  .band label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  select, button {
    background:var(--surface); color:var(--text); border:1px solid var(--border-strong);
    border-radius:9px; padding:8px 12px; font-size:13px; cursor:pointer; transition:.16s;
  }
  select:hover, button:hover { border-color:var(--blue); }
  button.on { border-color:var(--yellow); color:var(--yellow); box-shadow:0 0 0 1px var(--yellow) inset; }
  .path { margin-left:auto; font-size:11px; color:var(--muted); font-family:"SF Mono",Menlo,Consolas,monospace;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; }

  .panelwrap { flex:1; padding:14px 24px 24px; animation: fadeInUp .5s ease both; min-height:0; display:flex; }
  #panel {
    flex:1; overflow:auto; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:10px 0; font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:12.5px; line-height:1.55;
  }
  .row { display:flex; gap:10px; padding:2px 16px; white-space:pre-wrap; word-break:break-word; }
  .row:hover { background:var(--surface-2); }
  .row .ts { color:var(--muted); flex:0 0 auto; }
  .row .lvl { flex:0 0 56px; font-weight:700; text-transform:uppercase; font-size:10.5px; }
  .row .ev { flex:1 1 auto; color:var(--text); }
  .row .kv { color:var(--muted); }
  .lvl.info, .lvl.debug { color:var(--blue); }
  .lvl.warning, .lvl.warn { color:var(--yellow); }
  .row.warning, .row.warn { background:rgba(255,183,77,.05); }
  .lvl.error, .lvl.critical, .lvl.exception { color:var(--red); }
  .row.error, .row.critical, .row.exception { background:rgba(255,92,92,.07); }
  .lvl.none { color:var(--muted); }
  .empty { color:var(--muted); font-size:13px; padding:24px 16px; text-align:center; }
</style>
</head>
<body>
  <header>
    <div class="logo">BruteX</div>
    <div class="sub">Live Logs</div>
    <nav class="topnav" style="margin-left:18px; display:flex; gap:14px; font-size:13px;">
      <a href="/credentials" style="color:var(--blue); text-decoration:none;">Credentials</a>
      <span style="color:var(--muted);">·</span>
      <a href="/db" style="color:var(--blue); text-decoration:none;">Database</a>
      <span style="color:var(--muted);">·</span>
      <a href="/logs" style="color:var(--blue); text-decoration:none;">Logs</a>
      <span style="color:var(--muted);">·</span>
      <a href="/coverage" style="color:var(--blue); text-decoration:none;">Coverage</a>
    </nav>
    <div class="live" id="live"><span class="dot"></span><span id="livetxt">polling</span></div>
  </header>

  <div class="band">
    <label>Lines:
      <select id="lines">
        <option value="100">100</option>
        <option value="200" selected>200</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
        <option value="2000">2000</option>
      </select>
    </label>
    <button id="pause">Pause</button>
    <button id="autoscroll" class="on">Auto-scroll</button>
    <span class="path" id="path">resolving log path…</span>
  </div>

  <div class="panelwrap">
    <div id="panel"><div class="empty">loading…</div></div>
  </div>

<script>
/* ── BruteX live log viewer (DEC-LOGS-VIEWER-001) ──
   Polls /api/v1/logs every 2s. Every interpolated log string is escaped
   before it touches innerHTML — log lines may contain attacker-influenced
   content (broker payloads, user input echoed into an error), so they are
   never trusted as markup (same XSS lesson as the universe page). */
const panel = document.getElementById("panel");
const pathEl = document.getElementById("path");
const linesSel = document.getElementById("lines");
const pauseBtn = document.getElementById("pause");
const autoBtn = document.getElementById("autoscroll");
const liveBox = document.getElementById("live");
const liveTxt = document.getElementById("livetxt");

let paused = false;
let autoscroll = true;

/* Escape free text before interpolation into innerHTML (XSS sink). */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* Short HH:MM:SS from an ISO timestamp; falls back to the raw value. */
function shortTs(ts) {
  if (!ts) return "";
  const t = String(ts);
  const i = t.indexOf("T");
  if (i >= 0) return t.slice(i + 1, i + 9);
  return t;
}

/* Reserved record keys rendered in dedicated columns; everything else
   is shown as key=value pairs. */
const RESERVED = new Set(["timestamp", "level", "event"]);

function renderRows(records) {
  if (!records.length) {
    panel.innerHTML = '<div class="empty">no log lines yet</div>';
    return;
  }
  panel.innerHTML = records.map(r => {
    const lvl = (r.level == null ? "none" : String(r.level)).toLowerCase();
    const ts = esc(shortTs(r.timestamp));
    const ev = esc(r.event == null ? "" : r.event);
    let kv = "";
    for (const k of Object.keys(r)) {
      if (RESERVED.has(k)) continue;
      kv += " " + esc(k) + "=" + esc(typeof r[k] === "object" ? JSON.stringify(r[k]) : r[k]);
    }
    return `<div class="row ${esc(lvl)}">`
      + `<span class="ts">${ts}</span>`
      + `<span class="lvl ${esc(lvl)}">${esc(lvl)}</span>`
      + `<span class="ev">${ev}<span class="kv">${kv}</span></span>`
      + `</div>`;
  }).join("");
  if (autoscroll) panel.scrollTop = panel.scrollHeight;
}

async function poll() {
  if (paused) return;
  const n = linesSel.value;
  try {
    const r = await fetch("/api/v1/logs?lines=" + encodeURIComponent(n));
    if (!r.ok) { liveTxt.textContent = "error " + r.status; return; }
    const body = await r.json();
    pathEl.textContent = body.path || "";
    renderRows(body.lines || []);
    liveTxt.textContent = "live · " + (body.lines || []).length + " lines";
  } catch (e) {
    liveTxt.textContent = "offline";
  }
}

pauseBtn.addEventListener("click", () => {
  paused = !paused;
  pauseBtn.textContent = paused ? "Resume" : "Pause";
  pauseBtn.classList.toggle("on", paused);
  liveBox.classList.toggle("paused", paused);
  liveTxt.textContent = paused ? "paused" : "live";
  if (!paused) poll();
});

autoBtn.addEventListener("click", () => {
  autoscroll = !autoscroll;
  autoBtn.classList.toggle("on", autoscroll);
});

linesSel.addEventListener("change", poll);

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
