# brutex-notify — the notification PURE-law kernel (Rust).
#
# DEC-NOTIFY-RUST-CORE-001: a bit-identity-first port of the PURE notification
# laws of `brutex/notifications/sweep_alerts.py` + the dedupe-window predicate
# of `brutex/notifications/telegram.py` — the MarkdownV2 escape law, the
# `_count_or_question` unknown-count law, the dedupe-window drop predicate
# (over IEEE-754 BIT PATTERNS carried as u64 — no float object ever crosses
# the FFI), and the 12-code-point id truncation. Python keeps EVERYTHING
# else: the ~30 f-string message builders (the fixed-spec float format sites
# are a Rust parity hazard — named follow-up DEC-NOTIFY-RUST-BUILDERS-002),
# the TelegramNotifier transport (network I/O), threads/queues/atexit, and
# the wiring singleton. The retained Python law bodies are the LIVE parity
# oracle behind the default-OFF `BRUTEX_NOTIFY_RUST` facade
# (`brutex/notifications/notify_rust.py`).
#
# Pure-Rust-first (rlib, dependency-free core) so `cargo test` links no
# libpython; the PyO3 surface is behind the OPTIONAL `python` feature (turned
# on by maturin for the wheel build) — the brutex-feed / trading-core shape.

[package]
name = "brutex-notify"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
description = "Notification pure-law kernel (MarkdownV2 escape + count + dedupe + truncation) for BruteX"
license = "Proprietary"
repository = "https://github.com/SJParthi/bruteX"
readme = "README.md"
# Proprietary, never published. publish = false lets cargo-deny exclude it
# from the SPDX license check (mirrors brutex-feed / fno-math / trading-core).
publish = false

[lib]
name = "brutex_notify"
path = "src/lib.rs"
# cdylib so `import brutex_notify` finds the maturin-built extension; rlib so
# `cargo test` links the pure-Rust core.
crate-type = ["cdylib", "rlib"]

[features]
# The pure-Rust core (`laws`) needs NO Python. The PyO3 module is opt-in:
# `cargo test` (default features) builds + links zero Python symbols. maturin
# turns `python` on for the wheel build (see pyproject.toml).
default = []
python = ["dep:pyo3"]

[dependencies]
# Optional — only compiled when the `python` feature is enabled. abi3-py312
# pins the stable-ABI floor to BruteX's Python 3.12 baseline (the sibling
# kernels use the identical pin).
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }

[build-dependencies]
# DEC-RUST-SOURCE-DIGEST-TWIN-001 (MIGRATION.md #1258): build.rs bakes the
# crate-source BLAKE3 digest (FRAMING v1, rust/source_digest_core.rs) into the
# artifact as BRUTEX_SOURCE_DIGEST → `SOURCE_DIGEST` / `__source_digest__`.
# Build-script-only: it does NOT enter the shipped rlib's dependency tree.
blake3 = "1.5"

[dev-dependencies]
# Property-based testing — the naive-reference differential over the pure core.
# Test-only; same major as the sibling crates so the toolchains agree.
proptest = "1.6.0"
# DEC-RUST-SOURCE-DIGEST-TWIN-001: tests/source_digest_parity.rs re-includes
# the shared framing core to pin the golden parity vector. Test-only.
blake3 = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true # Finance code — an overflow must never be silent.

[profile.bench]
inherits = "release"
debug = true
