# fno-math-py — PyO3 wrapper around fno-math.
#
# Builds a Python extension module (.so / .pyd / .dylib) that exposes
# every public function from fno-math as a Python callable. BruteX's
# brutex/math/ layer is a one-line-per-function re-export of this
# module.
#
# Built via maturin (https://maturin.rs).

[package]
name = "fno-math-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
description = "Python bindings for fno-math (shared with tickvault via PyO3)"
license = "Proprietary"

[lib]
name = "fno_math_py"
# cdylib for Python extension, rlib for Rust-native tests/benches
crate-type = ["cdylib", "rlib"]

[dependencies]
# The whole point — this crate depends on fno-math and only fno-math.
fno-math = { path = "../fno-math" }

# PyO3 itself — version pinned exactly, abi3 for forward-compat with
# any Python 3.12+ without rebuilding.
# pyo3 = { version = "0.24", features = ["extension-module", "abi3-py312"] }

# numpy crate for zero-copy ndarray ↔ np.ndarray bridge (needed for
# indicators that take large time-series slices).
# numpy = { version = "0.24" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
