# ════════════════════════════════════════════════════════════════════════════════
# NEW bits (>= 52) — DEC-VOCAB-U128-CODEGEN-001 / ADR-0012 D4.
# Grow-only territory: bits here were declared AFTER the original 52. Each
# condition carries its own `implemented` flag — most are live (R5/S5 54-55,
# BOS/CHoCH 56-59, CPR 60-63); bits 52-53 are TOMBSTONED (`reserved = true`,
# `implemented = false` — positions held forever, never renumbered) and bits
# 64-65 are LAYOUT-ONLY declarations awaiting their math. NEVER set
# `implemented = true` without real indicator math.
# ════════════════════════════════════════════════════════════════════════════════

# ─────────────────────── Group 10: VWAP Position (bits 52-53) ───────────────────
# TOMBSTONED (the VWAP/volume wipe): the engine is SPOT-ONLY
# (DEC-ENGINE-SPOT-ONLY-001) and spot indices carry no traded volume, so a
# session VWAP can never resolve on any engine instrument. The VWAP math was
# DELETED; these positions are held forever per the grow-only law
# (`reserved = true`, `implemented = false` — the evaluator emits 0 for them).
[[condition]]
bit = 52
name = "close_above_vwap"
group = "VWAP Position"
description = "TOMBSTONE (VWAP wipe — spot-only engine, no volume): was close strictly above the session-anchored intraday VWAP; position held, evaluator emits 0"
reserved = true
applies_to_1day = false
implemented = false

[[condition]]
bit = 53
name = "close_below_vwap"
group = "VWAP Position"
description = "TOMBSTONE (VWAP wipe — spot-only engine, no volume): was close strictly below the session-anchored intraday VWAP; position held, evaluator emits 0"
reserved = true
applies_to_1day = false
implemented = false

