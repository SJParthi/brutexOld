# ─────────────────────── Group 13: Central Pivot Range (bits 60-63) ─────────────
# CPR from the SAME prev-day OHLC anchor the floor-trader pivots use (Ochoa /
# PivotBoss standard): P = (PDH+PDL+PDC)/3 (the pivot P, round-half-even),
# BC = (PDH+PDL)/2 (round-half-even), TC = 2P − BC — then CANONICALIZED
# TC = max(tc_raw, bc_raw), BC = min (the raw pair inverts on roughly half of
# real days). Bits 60/61 are strict comparisons, 62 is the inclusive band
# (the three form an exact partition), 63 fires iff the relative width
# (TC−BC)/P is at or under NARROW_CPR_WIDTH_BPS (30 bps — see
# `indicators/pivots.rs`). No prev-day anchor ⇒ all four cleared upstream via
# the anchor-dependent clear (never fabricated).
[[condition]]
bit = 60
name = "above_cpr_tc"
group = "Central Pivot Range"
description = "close strictly above the CPR top central (TC) level"
applies_to_1day = true
implemented = true

[[condition]]
bit = 61
name = "below_cpr_bc"
group = "Central Pivot Range"
description = "close strictly below the CPR bottom central (BC) level"
applies_to_1day = true
implemented = true

[[condition]]
bit = 62
name = "inside_cpr"
group = "Central Pivot Range"
description = "close inside the CPR band (BC <= close <= TC, inclusive)"
applies_to_1day = true
implemented = true

[[condition]]
bit = 63
name = "narrow_cpr_day"
group = "Central Pivot Range"
description = "narrow-CPR day: (TC - BC) is at or under 30 bps of the pivot P (trending-day setup)"
applies_to_1day = true
implemented = true

# ─────────────────────── Group 14: Supertrend (bits 64-65) ──────────────────────
# IMPLEMENTED (the PR-B flip): the ATR-band trailing stop — TradingView Pine v6
# ta.supertrend(3, 10) parity, hl2 source, computed by the stateful
# `indicators::supertrend::SupertrendState` in exact x2-scaled integer paisa
# (half-paisa resolution, no floats) and threaded into the evaluator as the
# appended `supertrend_x2_paisa` FFI argument. Both bits are STRICT compares of
# close x2 vs the line (equality / warm-up None = neither fires), so the pair is
# mutually exclusive — registered as a conflict pair in
# brutex/vocabulary/conflicts.py.
[[condition]]
bit = 64
name = "close_above_supertrend"
group = "Supertrend"
description = "close strictly above the Supertrend line (ATR-10 Wilder, factor 3, hl2 source)"
applies_to_1day = true
implemented = true

[[condition]]
bit = 65
name = "close_below_supertrend"
group = "Supertrend"
description = "close strictly below the Supertrend line (ATR-10 Wilder, factor 3, hl2 source)"
applies_to_1day = true
implemented = true

# ─────────────────────── Group 15: Gap Midpoint (bits 66-68) ────────────────────
# Session-edge gap-midpoint level (DEC-GAP-MIDPOINT-CONDITIONS-001): on a nonzero
# gap day (sign of open_of_day − pdc), the level is the round-half-even midpoint
# of the prior session's LAST TF bar extreme and today's FIRST TF bar extreme —
# HIGHs on a gap-up day, LOWs on a gap-down day (the ES Trading Academy
# spreadsheet's (X1+X2)/2, generalized per-timeframe). The level is resolved
# upstream (Stage-1A per-day state + `indicators::gap_mid::compute_gap_mid`) and
# threaded into the evaluator as an OPTIONAL level (absent ⇒ the bits stay 0); no
# level (zero gap / missing X1/X2 / the session's first TF bar — the
# arm-from-bar-2 law) ⇒ all three bits stay 0. Masked on 1day (each 1day bar IS
# its session's first TF bar, so the arming ordinal keeps the bits 0 there by
# construction) — applies_to_1day=false.
[[condition]]
bit = 66
name = "close_above_gap_mid"
group = "Gap Midpoint"
description = "close strictly above the session-edge gap-midpoint level"
applies_to_1day = false
implemented = true

[[condition]]
bit = 67
name = "close_below_gap_mid"
group = "Gap Midpoint"
description = "close strictly below the session-edge gap-midpoint level"
applies_to_1day = false
implemented = true

[[condition]]
bit = 68
name = "near_gap_mid"
group = "Gap Midpoint"
description = "close within tolerance of the session-edge gap-midpoint level"
applies_to_1day = false
implemented = true
