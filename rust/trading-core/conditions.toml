# conditions.toml — the SINGLE source of truth for the shared condition vocabulary.
#
# DEC-VOCAB-U128-CODEGEN-001 (ADR-0012 D4 / D7). This manifest is the ONE place
# the condition bit LAYOUT lives. `scripts/codegen_vocab.py` reads it and emits
# BOTH the Rust bit constants (`rust/trading-core/src/bits.rs`) AND the Python
# bit constants (`brutex/vocabulary/bits.py` + the `describe.py` GROUP_RANGES),
# so BruteX (PyO3) and TickVault (native Rust) are bit-identical BY CONSTRUCTION
# (CLAUDE.md §11 COMMON / zero-duplication). The evaluator boolean branches stay
# hand-written (the actual math is not codegen-able from a TOML description); this
# manifest owns the bit LAYOUT only.
#
# Grow-only invariant (DEC-PLUGIN-001): a bit is NEVER renumbered or reused. The
# existing 52 conditions keep bits 0-51 forever; new conditions append at the
# next free bit (>= 52). A removed condition becomes `reserved = true` and keeps
# its position. The mask is a u128 (DEC-VOCAB-U128-CODEGEN-001 / ADR-0012 D4 —
# this ADR is the DEC-PLUGIN-001-mandated mask-width gate; the u64 -> u128 move
# is NOT silent).
#
# Per-condition fields:
#   bit              explicit grow-only bit position (dense over the live set)
#   name             snake_case condition name (the NAME_TO_BIT key)
#   group            indicator-family name (the GROUP_RANGES label)
#   description      one-line human description
#   reserved         true = position retired/held, not a live condition (default false)
#   applies_to_1day  per-timeframe applicability (ADR-0012 D12 — VWAP masked on 1day)
#   implemented      true = the evaluator computes a real boolean for this bit;
#                    false = LAYOUT ONLY, the evaluator emits 0 until a later PR
#                    supplies the indicator math (PR-2 for the VWAP/R5/S5/BOS/CHoCH
#                    bits). NEVER set true without real indicator math.

schema_version = 2
mask_width = 128

