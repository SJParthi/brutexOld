# cargo-fuzz harness for the shared trading-core kernel.
#
# DEC-FUZZ-HOTKERNEL-001 (docs/MIGRATION.md). Fuzzes the evaluate-time
# indicators (pivot + Fibonacci resolve) and the 52-condition u64 evaluator —
# the bit-identical core BruteX (PyO3) and TickVault (native) share. cargo-fuzz
# needs NIGHTLY Rust + libFuzzer; this is a separate, non-published package
# (NOT a workspace member), built with trading-core's DEFAULT features so it
# links the dependency-free pure-Rust core (no libpython, unlike fno-math).
[package]
name = "trading-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.93.1"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# fuzz_spec drives the untrusted-bytes JSON boundary (StrategySpec + mask_hex).
# Same version pin as the parent crate's dev-dependency.
serde_json = "1.0.146"

[dependencies.trading-core]
path = ".."
# Pure-Rust core + the OPTIONAL `serde` feature (StrategySpec (de)serialize —
# the untrusted-input parser fuzz_spec targets). Still NO `python`/pyo3
# feature, so the fuzz binary links zero Python symbols.
default-features = false
features = ["serde"]

# Overflow must panic (not wrap) so libFuzzer flags any out-of-domain magnitude
# as a crash — matching the parent crate's release profile ("a paisa overflow
# must never be silent"). The fuzzers stay inside the documented realistic
# domain, where no overflow can occur.
[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "fuzz_pivot_fib"
path = "fuzz_targets/fuzz_pivot_fib.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_evaluator"
path = "fuzz_targets/fuzz_evaluator.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_market_structure"
path = "fuzz_targets/fuzz_market_structure.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_spec"
path = "fuzz_targets/fuzz_spec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_metadata"
path = "fuzz_targets/fuzz_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_greeks"
path = "fuzz_targets/fuzz_greeks.rs"
test = false
doc = false
bench = false
