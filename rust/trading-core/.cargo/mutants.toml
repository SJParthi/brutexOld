# DEC-MUTATION-RUNTIME-003 (MIGRATION.md #1535) — the ONE cargo-mutants scope for
# trading-core, resolved by BOTH the CI matrix jobs (.github/workflows/mutation.yml)
# and any local `cargo mutants` run from this crate dir (CLAUDE.md §2 Rule 11
# COMMON; the empirically-INERT repo-root .cargo/mutants.toml was deleted —
# cargo-mutants resolves config against the examined tree root, never parent
# dirs, and its exclude_re contradicted this scope by excluding src/python.rs).
#
# Scope: evaluator.rs (60-condition decision core, gated since
# DEC-TRADING-CORE-PROPTEST-MUTANTS-001) WIDENED to the Golden-Rule-#4
# run-identity stamping surfaces: spec.rs (StrategySpec::canonical_bytes, LE
# field encoding) and python.rs (spec_canonical_bytes_impl + the *_impl/check_*
# boundary logic).
# 619 mutants measured 2026-07-07 (`cargo mutants --list | wc -l`, run from this
# dir with this config in place — the count also proves the `features` key parses
# under cargo-mutants 27.1.0).
#
# DELIBERATELY OUT (documented, not silent — Golden Rule #10; the fno-math twin
# toml sets the disclosure standard; counts measured 2026-07-07 via
# `cargo mutants --list --no-config -f <file> --features python,serde`):
#   greeks/mod.rs — 266 mutants; the Black-76 kernel behind the STORED F&O
#                   Greeks enrichment (lake REFERENCE_ONLY surface, not the
#                   Track-1 engine decision path); exercised end-to-end by the
#                   enrichment suites incl. the independent stdlib Black-76
#                   cross-check (DEC-GREEKS-CORRECTNESS-AUDIT-001, MIGRATION.md
#                   #1188); gating it is a NAMED follow-up (MIGRATION.md #1535).
#   indicators/*  — 281 mutants (ema 70 / fib 59 / pivots 49 / market_structure
#                   47 / vwap 28 / metadata 25 / mod 3); the evaluate-time math
#                   behind vocabulary bits 52-59. Covered today by the frozen
#                   400-case golden answer-key + the property ordering/
#                   determinism suites (the DEC-TRADING-CORE-PROPTEST-MUTANTS-001
#                   honest envelope — restating the disclosure the pre-#1535
#                   workflow comment carried); extending the mutation gate to
#                   their (largely unused, e.g. r4/s4/ext_424) fields rides the
#                   SAME named follow-up (MIGRATION.md #1535).
#   bits.rs       — 0 mutants (const-only; nothing cargo-mutants can perturb).
examine_globs = ["src/evaluator.rs", "src/spec.rs", "src/python.rs"]

# python.rs compiles ONLY under `python` (lib.rs:66) and spec.rs's mask_hex only
# under `serde`; without them those mutants build a byte-identical crate and
# trivially "survive" (3 mask_hex MISSED measured on default features). Features
# apply to the baseline AND every mutant build. (Pre-decided fallback if a
# future cargo-mutants rejects this key: move to the CLI as
# `--features python,serde` — flag verified present.)
features = ["python", "serde"]

