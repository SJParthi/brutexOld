# trading-core — the shared indicator + 52-condition vocabulary kernel (Rust).
#
# Phase 1 of DEC-SHARED-CORE-001 (docs/MIGRATION.md #441). A bit-for-bit Rust
# port of BruteX's Python 52-condition vocabulary (`brutex/vocabulary/evaluator.py`)
# plus its two evaluate-time indicators (`compute_pivot_levels`, `compute_fib_levels`),
# proven identical against the language-neutral golden answer-key at
# `tests/golden/fixtures/vocab_golden_vectors.json`.
#
# Pure-Rust-first (rlib, dependency-free core) so `cargo test` links no libpython;
# the PyO3 surface is behind the OPTIONAL `python` feature (turned on by maturin
# for the Phase-2 BruteX binding). TickVault will link this crate natively.

[package]
name = "trading-core"
# 0.4.0 → 0.5.0: the SuperTrend implemented-flip (vocab-66 PR-B) — bits 64-65
# go implemented=true off the NEW `indicators::supertrend::SupertrendState`
# (ATR-10 Wilder, factor 3, hl2 source, exact ×2-scaled integer paisa), the
# ONE appended defaulted `supertrend_x2_paisa` FFI arg lands on all four
# evaluate pyfunctions + the batch face, and IMPLEMENTED_MASK widens to
# bits {0..51, 54..65}. The bump moves `_indicator_version()` and re-keys
# every new run_id (the sanctioned re-key lever — the mask/ABI change MUST
# re-key).
# Earlier, 0.3.2 → 0.4.0: the 66-bit vocabulary reshape — VWAP bits 52-53 TOMBSTONED
# (the VwapState math + the vwap_paisa/batch VWAP columns DELETED — an ABI
# narrowing across all four evaluate pyfunctions), Central Pivot Range bits
# 60-63 implemented, Supertrend bits 64-65 declared layout-only. The bump
# moves `_indicator_version()` and re-keys every new run_id (the sanctioned
# one-window re-key lever).
# Earlier, 0.3.1 → 0.3.2: DEC-STAGE1A-RUST-BATCH-001 — the ADDITIVE batch Stage-1A
# bar-bits kernel (`stage1a_batch` + the `stage1a_bar_bits_batch` pyfunction).
# The bump moves `_indicator_version()` and re-keys every new run_id (the
# sanctioned #1548 precedent — bump on ANY change, even with no math delta).
version = "0.5.0"
edition = "2024"
rust-version = "1.93.1"
description = "Shared indicator + 52-condition vocabulary kernel (BruteX backtest + TickVault live)"
license = "Proprietary"
repository = "https://github.com/SJParthi/bruteX"
readme = "README.md"
# Proprietary, never published. publish = false lets cargo-deny exclude it from
# the SPDX license check (mirrors fno-math).
publish = false

[lib]
name = "trading_core"
path = "src/lib.rs"
# cdylib so a future `import trading_core` finds the maturin-built extension;
# rlib so `cargo test` + TickVault (native Rust) link the pure-Rust core.
crate-type = ["cdylib", "rlib"]

[features]
# The pure-Rust core (indicators + evaluator) needs NO Python. The PyO3 module
# is opt-in: `cargo test` (default features) builds + links zero Python symbols,
# so the bit-identity golden test runs without a Python toolchain. maturin turns
# `python` on for the wheel build (see pyproject.toml).
default = []
python = ["dep:pyo3"]
# Runtime-OPTIONAL serde derive for `StrategySpec`/`Direction` (DEC-STRATEGYSPEC-CORE-001).
# OFF by default so TickVault's native link stays dependency-free; turn on only
# when a host wants to (de)serialize a spec (the mask is a hex STRING — a u128
# JSON number loses precision past 2^53).
serde = ["dep:serde"]

[dependencies]
# Jäckel "Let's Be Rational" IV inversion + Cody-precision normal CDF/PDF for
# the shared Black-76 Greeks kernel (DEC-GREEKS-ENGINE-PR2-001; plan
# docs/GREEKS_ENGINE_PLAN.md §7 Proposed Decision #5 / §13 Open Decision #7 —
# the "re-add the pinned jaeckel crate" sourcing). EXACT pin: the solver's
# float path is part of the frozen greeks_golden.json bit-identity contract,
# so a silent version bump must never move a bit. MIT-licensed, ZERO runtime
# dependencies (pure Rust: Cody erf + LBR + rational cubic), so TickVault's
# native link stays clean — the same crate the pre-DEC-P0-025 kernel used
# (`a87bce43^:rust/fno-math/src/greeks/black_scholes.rs`).
jaeckel = "=0.2.0"
# Optional — only compiled when the `python` feature is enabled (Phase 2 binding).
# abi3-py312 pins the stable-ABI floor to BruteX's Python 3.12 baseline.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }
# Optional — only compiled when the `serde` feature is enabled. Pinned to the same
# version the dev-dependency already uses so the lockfile resolves one serde.
serde = { version = "1.0.227", features = ["derive"], optional = true }

[build-dependencies]
# DEC-RUST-SOURCE-DIGEST-TWIN-001 (MIGRATION.md #1258): build.rs bakes the
# crate-source BLAKE3 digest (FRAMING v1, rust/source_digest_core.rs) into the
# artifact as BRUTEX_SOURCE_DIGEST → `SOURCE_DIGEST` / `__source_digest__`.
# Build-script-only: it does NOT enter the shipped rlib's dependency tree, so
# TickVault's native link stays dependency-free. Same major as fno-math's
# runtime blake3 so the toolchains agree.
blake3 = "1.5"

[dev-dependencies]
# The golden integration test reads the JSON oracle. Test-only — not in the
# shipped crate's dependency tree (so TickVault's native link stays dependency-free).
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.146"
# DEC-RUST-SOURCE-DIGEST-TWIN-001: tests/source_digest_parity.rs re-includes
# the shared framing core to pin the golden parity vector. Test-only.
blake3 = "1.5"
# Property-based testing (DEC-TRADING-CORE-PROPTEST-MUTANTS-001). Test-only;
# pinned to the same major as fno-math's proptest so the workspace toolchains
# agree. Drives the invariant + independent-oracle properties in
# tests/proptests.rs against arbitrary (bounded, finance-safe) inputs.
proptest = "1.6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true  # Finance code — a paisa overflow must never be silent.

[profile.bench]
inherits = "release"
debug = true
