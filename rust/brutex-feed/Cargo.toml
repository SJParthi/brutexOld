# brutex-feed — the engine read-boundary DECISION kernel (Rust).
#
# DEC-FEED-RUST-CORE-001: a bit-identity-first port of the DECISION plane of
# `brutex/feed/replay.py::arrow_table_to_bars` + the
# `brutex/data/bad_tick.py::BadTickScreen` state machine — positivity refusal
# order, bad-tick keep/skip with IST-session grouping, warn bookkeeping. The
# kernel returns INTEGERS ONLY (row indices + counts); Python keeps ALL
# materialization (`Decimal(str(float))`, `CandleBar`, error f-strings,
# structlog WARNs) so nothing that reaches hashed/logged/raised output is ever
# re-implemented in Rust (the `bxsnap2` run-identity contract,
# DEC-BXSNAP2-PARITY-GOLDEN-001 / MIGRATION.md #1695).
#
# Pure-Rust-first (rlib, dependency-free core) so `cargo test` links no
# libpython; the PyO3 surface is behind the OPTIONAL `python` feature (turned
# on by maturin for the wheel build) — the trading-core shape.

[package]
name = "brutex-feed"
version = "0.2.0"
edition = "2024"
rust-version = "1.93.1"
description = "Engine read-boundary decision kernel (positivity + bad-tick scan) for BruteX"
license = "Proprietary"
repository = "https://github.com/SJParthi/bruteX"
readme = "README.md"
# Proprietary, never published. publish = false lets cargo-deny exclude it
# from the SPDX license check (mirrors fno-math / trading-core).
publish = false

[lib]
name = "brutex_feed"
path = "src/lib.rs"
# cdylib so `import brutex_feed` finds the maturin-built extension; rlib so
# `cargo test` + the fuzz harness link the pure-Rust core.
crate-type = ["cdylib", "rlib"]

[features]
# The pure-Rust core (`scan_bars`) needs NO Python. The PyO3 module is opt-in:
# `cargo test` (default features) builds + links zero Python symbols. maturin
# turns `python` on for the wheel build (see pyproject.toml).
default = []
python = ["dep:pyo3"]

[dependencies]
# Optional — only compiled when the `python` feature is enabled. abi3-py312
# pins the stable-ABI floor to BruteX's Python 3.12 baseline (the two sibling
# kernels use the identical pin).
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }

[build-dependencies]
# DEC-RUST-SOURCE-DIGEST-TWIN-001 (MIGRATION.md #1258): build.rs bakes the
# crate-source BLAKE3 digest (FRAMING v1, rust/source_digest_core.rs) into the
# artifact as BRUTEX_SOURCE_DIGEST → `SOURCE_DIGEST` / `__source_digest__`.
# Build-script-only: it does NOT enter the shipped rlib's dependency tree.
blake3 = "1.5"

[dev-dependencies]
# Property-based testing — invariants + determinism over the pure core.
# Test-only; same major as the sibling crates so the toolchains agree.
proptest = "1.6.0"
# DEC-RUST-SOURCE-DIGEST-TWIN-001: tests/source_digest_parity.rs re-includes
# the shared framing core to pin the golden parity vector. Test-only.
blake3 = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true # Finance code — an overflow must never be silent.

[profile.bench]
inherits = "release"
debug = true
