# brutex-pull-state — the dashboard pull-state DECISION kernel (Rust).
#
# DEC-RUST-PULL-STATE-001 (lane Phase 1): a bit-identity-first re-hosting of
# the pull-state / rate-view DECISION cores, starting with the vendor-account
# SAFETY guard `brutex/calendars/market_hours.py::pull_allowed_now`
# (DEC-GROWW-MARKET-HOURS-GUARD-001, MIGRATION.md #1692 — no Groww vendor
# pulls 08:45-15:35 IST on a trading day; the shared-TOTP protection). The
# kernel is pure + clockless and takes INTEGERS ONLY across the FFI
# (microsecond-of-day + the caller-resolved trading-day flag — the
# DEC-FEED-RUST-CORE-001 discipline); the NSE calendar itself
# (`brutex/calendars/nse.py` holiday sets) stays Python — the single source
# of truth is never re-minted in Rust.
#
# Pure-Rust-first (rlib, dependency-free core) so `cargo test` links no
# libpython; the PyO3 surface is behind the OPTIONAL `python` feature (turned
# on by maturin for the wheel build) — the brutex-feed / trading-core shape.
#
# Standalone crate — deliberately NOT in any Cargo workspace (the sibling
# kernels' convention).

[package]
name = "brutex-pull-state"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
description = "Dashboard pull-state decision kernel (market-hours guard) for BruteX"
license = "Proprietary"
repository = "https://github.com/SJParthi/bruteX"
readme = "README.md"
# Proprietary, never published. publish = false lets cargo-deny exclude it
# from the SPDX license check (mirrors brutex-feed / fno-math / trading-core).
publish = false

[lib]
name = "brutex_pull_state"
path = "src/lib.rs"
# cdylib so `import brutex_pull_state` finds the maturin-built extension;
# rlib so `cargo test` links the pure-Rust core.
crate-type = ["cdylib", "rlib"]

[features]
# The pure-Rust core needs NO Python. The PyO3 module is opt-in: `cargo test`
# (default features) builds + links zero Python symbols. maturin turns
# `python` on for the wheel build (see pyproject.toml).
default = []
python = ["dep:pyo3"]

[dependencies]
# Optional — only compiled when the `python` feature is enabled. abi3-py312
# pins the stable-ABI floor to BruteX's Python 3.12 baseline (the sibling
# kernels use the identical pin).
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }

[build-dependencies]
# DEC-RUST-SOURCE-DIGEST-TWIN-001 (MIGRATION.md #1258): build.rs bakes the
# crate-source BLAKE3 digest (FRAMING v1, rust/source_digest_core.rs) into
# the artifact as BRUTEX_SOURCE_DIGEST → `SOURCE_DIGEST` / `__source_digest__`.
# Build-script-only: it does NOT enter the shipped rlib's dependency tree.
blake3 = "1.5"

[dev-dependencies]
# Property-based testing — invariants + determinism over the pure core.
# Test-only; same major as the sibling crates so the toolchains agree.
proptest = "1.6.0"
# DEC-RUST-SOURCE-DIGEST-TWIN-001: tests/source_digest_parity.rs re-includes
# the shared framing core to pin the golden parity vector. Test-only.
blake3 = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true # Finance code — an overflow must never be silent.

[profile.bench]
inherits = "release"
debug = true
