# Maturin build config for brutex-identity (DEC-RUST-RUNID-STORES-001).
#
# Mixed Python + Rust layout (the trading-core shape): the cdylib ships as the
# private submodule `brutex_identity._brutex_identity`; `python/brutex_identity/__init__.py`
# re-exports it behind the stale-wheel handshake. `features = ["python"]`
# turns on the optional pyo3 dependency (extension-module + abi3-py312) so the
# wheel includes the binding.
#
# https://www.maturin.rs/

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "brutex-identity"
version = "0.1.0"
description = "Run-identity (BLAKE3) + results/window-ledger store kernels for BruteX."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [{ name = "SJParthi" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: Other/Proprietary License",
]

[tool.maturin]
python-source = "python"
module-name = "brutex_identity._brutex_identity"
features = ["python"]
strip = true
