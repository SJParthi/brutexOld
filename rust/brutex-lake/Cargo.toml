# brutex-lake — the data-lake Rust conversion crate (ADR-0019, PR-1).
#
# DEC-RUST-DATALAKE-IO-ROADMAP-001 (MIGRATION.md #1726). PR-1 re-hosts the
# ONE parquet render seam (`brutex/data/parquet_writer.py::_render_bytes`,
# frame → parquet bytes) on a Rust build of polars pinned to the EXACT git
# tag matching the installed Python wheel — the byte-identity-by-lockstep
# design the 2026-07-11 feasibility spike proved (all 5 corpus cases
# bit-identical at `py-1.42.1`).
#
# ## The ATOMIC pin (ADR-0019 §7 hazards 1 + 2 — read before touching)
#
# Three pins move TOGETHER or the byte gate fails loud (flag stays OFF):
#   1. Python wheel: `polars==1.42.1` (the installed wheel; the repo
#      range-pins `>=1.0,<2.0`, so the crate's version guard — not
#      pyproject — enforces the lockstep at runtime).
#   2. This manifest: every polars git dependency at `tag = "py-1.42.1"`
#      (cargo-tested against `PINNED_POLARS_PY_VERSION` in src/lib.rs).
#   3. The zstd trio, pinned by the COMMITTED Cargo.lock next to this
#      file: zstd 0.13.3 / zstd-safe 7.2.4 / zstd-sys 2.0.16 (bundled
#      libzstd 1.5.7 — cargo-tested against `PINNED_LIBZSTD_VERSION`).
#      `compression="zstd", level=3` bytes depend on the bundled libzstd;
#      a bump on either side = different compressed bytes = parity FAIL.
#
# Bump ritual: docs/runbooks/lake-rust-render-lockstep.md.
#
# Standalone crate — deliberately NOT in any Cargo workspace (the sibling
# rust/fno-math + rust/trading-core are standalone too; ci.yml's cargo jobs
# target crate dirs explicitly, so this crate is built ONLY by its own
# dedicated workflow, .github/workflows/lake-rust-parity.yml).

[package]
name = "brutex-lake"
version = "0.1.0"
edition = "2024"
# The spike measured the floor: the polars graph at py-1.42.1 resolves
# sysinfo 0.39.x whose MSRV is 1.95; built + parity-proven on stable 1.97.0.
rust-version = "1.95"
description = "BruteX data-lake Rust render seam — polars-native parquet render, byte-locked to the installed Python wheel (ADR-0019 PR-1)"
license = "Proprietary"
repository = "https://github.com/SJParthi/bruteX"
readme = "README.md"
# Proprietary, never published to crates.io (the fno-math precedent).
publish = false

[lib]
name = "brutex_lake"
path = "src/lib.rs"
# cdylib so Python's `import brutex_lake._brutex_lake` finds the built
# extension; rlib so `cargo test` links the pure-Rust render core.
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 + maturin bridge — the exact sibling-crate configuration
# (rust/fno-math): abi3-py312 per CLAUDE.md §4's Python 3.12 baseline.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }

# polars at the git tag matching the installed Python wheel (1.42.1 →
# tag py-1.42.1, workspace crate version 0.54.4, commit 0df0c25d). The
# feature set is the spike-proven minimum that COMPILES at this tag:
# `strings` is load-bearing — polars-stream references the
# strings-gated IRFunctionExpr::StringExpr under a dtype-datetime cfg
# (lower_expr.rs:1566 @ py-1.42.1), so the crate set does not build
# without it. Feature-subset drift is a real hazard class on every
# future tag bump (spike report; ADR-0019 §1).
polars = { git = "https://github.com/pola-rs/polars", tag = "py-1.42.1", features = ["lazy", "parquet", "ipc", "timezones", "streaming", "strings"] }
# SinkDestination / SinkTarget / FileWriteFormat / UnifiedSinkArgs
polars-plan = { git = "https://github.com/pola-rs/polars", tag = "py-1.42.1", features = ["parquet"] }
# ParquetWriteOptions / ParquetCompression / Writeable (the Dyn sink writer)
polars-io = { git = "https://github.com/pola-rs/polars", tag = "py-1.42.1", features = ["parquet", "ipc"] }
# StatisticsOptions / ZstdLevel
polars-parquet = { git = "https://github.com/pola-rs/polars", tag = "py-1.42.1", features = ["compression"] }
# Engine::Streaming
polars-config = { git = "https://github.com/pola-rs/polars", tag = "py-1.42.1" }

# Direct zstd dependency ONLY for `linked_zstd_version()` (the runtime
# libzstd fingerprint the version tests + the engaged log surface). The
# resolved version is pinned by the committed Cargo.lock — the same trio
# polars-parquet links (one libzstd in the binary, cargo unifies).
zstd = "0.13"

# Replicate the polars workspace [patch.crates-io] (polars Cargo.toml @
# py-1.42.1), pinned to the exact revs the wheel's Cargo.lock resolved —
# cargo patches do NOT propagate through git dependencies, so this crate
# must restate them (spike build failure #2: polars-io at the tag calls
# object_store::with_dns_resolver, which exists only on the fork).
[patch.crates-io]
object_store = { git = "https://github.com/kdn36/arrow-rs-object-store", rev = "f50a6e5c564b2b5933eca15cd20ff9b5614374a1" }
color-backtrace = { git = "https://github.com/orlp/color-backtrace", rev = "bb62ccf1e9eb1f6b7af5f16acff1fd7151a876dd" }
tikv-jemalloc-sys = { git = "https://github.com/pola-rs/jemallocator", rev = "0d683dfb157097e2075d5e0eaf25f71f514a7552" }

# Release profile: DELIBERATELY the cargo DEFAULT (two divergences from the
# fno-math profile, both reasoned):
#   * NO `panic = "abort"` — a render panic must surface across the FFI as a
#     catchable Python error (the lib.rs catch_unwind boundary) so the writer
#     facade degrades to the Python render; never a process abort mid-pull.
#   * NO `overflow-checks = true` — the wheel builds polars WITHOUT overflow
#     checks; enabling them here would give the linked polars a different
#     failure behaviour than the wheel's (panic where the wheel wraps), the
#     opposite of lockstep fidelity. This crate's own code does no arithmetic.
# Parquet bytes are opt-level/profile independent regardless (spike: debug ==
# release == wheel on all 5 corpus cases) — no profile knob is a byte contract.
