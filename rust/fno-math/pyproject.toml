# Maturin build configuration for the BruteX Rust hot kernel (DEC-P0-050 / PR-K).
#
# Pip installs this as a separate distribution alongside `brutex` so the
# Python ⇆ Rust bridge can be developed independently of the Track 1
# Python package. CI invokes `pip install -e rust/fno-math` after the
# Python side installs `brutex` itself.
#
# References:
#   - CLAUDE.md §4 (Rust hot kernel for hot paths)
#   - CLAUDE.md §5 (rust/fno-math/ scaffold)
#   - docs/MIGRATION.md #187 (DEC-P0-050 / PR-K — this PR)
#   - https://www.maturin.rs/

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fno-math"
version = "0.4.0"
description = "BruteX Rust hot kernel — PyO3 bridge for the L1 dedup + future Stage 1B AND-mask kernel."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [
    { name = "SJParthi" },
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: Other/Proprietary License",
]

[tool.maturin]
# DEC-P0-055 (PR-N+2): mixed Python + Rust layout — Python source under
# `python/`, with the cdylib registered as the `fno_math._fno_math`
# private submodule. The package's `__init__.py` re-exports the cdylib
# symbols so downstream callers continue to write `import fno_math` and
# `fno_math.popcount_bytes(...)` unchanged. The `__init__.pyi` + the
# `py.typed` marker enable pyright-strict typing for downstream callers
# (closes the PR-N revert post-mortem at MIGRATION.md #190).
python-source = "python"
module-name = "fno_math._fno_math"
features = ["pyo3/extension-module"]
strip = true
