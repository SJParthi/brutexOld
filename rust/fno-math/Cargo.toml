# fno-math — minimal Rust scaffold for BruteX Phase 2/3 hot kernels.
#
# Per CLAUDE.md §4 + §5 + docs/MIGRATION.md Decision #68. BruteX is a
# Track 1 signal-only backtest over Groww historical data for 4 Indian
# spot indices (NIFTY 50, BANKNIFTY, SENSEX, INDIA VIX). The Greeks /
# indicators / strategies / live-tick modules previously here were
# tickvault-extracted residue, removed per DEC-P0-025 (PR #47).

[package]
name = "fno-math"
version = "0.3.0"
edition = "2024"
rust-version = "1.93.1"
description = "Minimal Rust scaffold for BruteX Phase 2/3 hot kernels (Track 1 backtest)"
license = "Proprietary"
repository = "https://github.com/SJParthi/bruteX"
readme = "README.md"
# Proprietary, never published to crates.io. `publish = false` lets
# cargo-deny's `[licenses] private.ignore = true` exclude this crate from the
# SPDX license check (its "Proprietary" string is not a valid SPDX expression)
# while still license-checking every real dependency (DEC-RUST-RAYON-SUPERMASK-001).
publish = false

[lib]
name = "fno_math"
path = "src/lib.rs"
# DEC-P0-050 (PR-K): cdylib so Python's `import fno_math` finds the
# built extension; rlib so `cargo test` + downstream Rust consumers
# can link against the pure-Rust paths. Both are required.
crate-type = ["cdylib", "rlib"]

[dependencies]
# DEC-P0-050 (PR-K): PyO3 + maturin bridge for Python ⇆ Rust hot kernels.
# `extension-module` strips the host Python lib link so the .so/.dylib
# loads under any compatible CPython; `abi3-py312` pins the stable
# ABI floor to BruteX's CLAUDE.md §4 Python 3.12 baseline.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }

# DEC-P0-052 (PR-M): blake3 hash function — foundational for the deferred
# sha256 → blake3 combo_hash 9-field migration (DEC-P0-044 Q-02). Blake3
# is ~5× faster than sha256 on multi-core, single-tree mode is
# deterministic + reproducible (Golden Rule #4). The PR-M kernel exposes
# `blake3_hash(data: bytes) -> bytes` so the future combo_hash migration
# can call into it without re-deriving the byte-equality invariant.
blake3 = "1.5"

# Serialization (used by compat::types, compat::config)
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.146"
toml = "1.1.2"

# Time handling (used by compat::trading_calendar)
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.0"

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.17"

# Tracing (silent unless a subscriber is registered)
tracing = "0.1.44"

# Archival types (used by compat::types for rkyv serialization)
rkyv = { version = "0.8.13", features = ["alloc"] }

# DEC-RUST-RAYON-SUPERMASK-001 (MIGRATION.md #414): Rayon multi-core
# parallelization of the Stage-2 supermask scan. The masks-outer loop is
# embarrassingly parallel (each mask an independent integer count over the
# shared, read-only bars), so `par_iter().map().collect()` (order-preserving,
# IndexedParallelIterator) is bit-exact vs serial (Golden Rule #4) while
# scaling toward the memory-bandwidth wall. Production uses rayon's DEFAULT
# global pool; licenses for the new transitive crates (rayon-core, crossbeam-*,
# either) are pinned in deny.toml.
rayon = "1.10"

[build-dependencies]
# DEC-RUST-SOURCE-DIGEST-TWIN-001 (MIGRATION.md #1258): build.rs bakes the
# crate-source BLAKE3 digest (FRAMING v1, rust/source_digest_core.rs) into the
# artifact as BRUTEX_SOURCE_DIGEST → `SOURCE_DIGEST` / `__source_digest__`.
# Same version as the runtime dependency above (a build script cannot see
# regular [dependencies], so the pin is repeated here deliberately).
blake3 = "1.5"

[dev-dependencies]
proptest = "1.6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true  # Finance code — overflow must never be silent

[profile.bench]
inherits = "release"
debug = true
