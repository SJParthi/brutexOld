# fno-math — the single source of truth for Greeks, indicators, and
# strategies shared between tickvault (live) and BruteX (backtest).
#
# Per REQUIREMENTS.md §7A Shared Core Library Contract.
#
# **Status:** first-pass extraction from tickvault@aad528a completed
# 2026-04-14. Dependencies mirror tickvault's trading + common crates
# minus the live-infrastructure-only items (tokio, reqwest, metrics,
# notify). See EXTRACTION.md for provenance and known TODOs.

[package]
name = "fno-math"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
description = "Shared Greeks + indicators + strategies crate (tickvault <-> BruteX)"
license = "Proprietary"
repository = "https://github.com/SJParthi/bruteX"
readme = "README.md"

[lib]
name = "fno_math"
path = "src/lib.rs"

[dependencies]
# ── Core dependencies mirrored from tickvault ──────────────────────
# Pinned to the same versions tickvault uses so compiled bytecode is
# byte-identical.

# Serialization (used by compat::types and strategy config)
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.146"
toml = "0.8.19"

# Time handling (used by compat::trading_calendar and greeks calibration)
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.0"

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.17"

# Tracing (fno-math stays log-emitting; silent unless a subscriber is registered)
tracing = "0.1.44"

# Archival types (used by compat::instrument_registry for rkyv serialization)
rkyv = { version = "0.8.13", features = ["alloc"] }

# Black-Scholes implied volatility — Peter Jaeckel's "Let's Be Rational" solver
# (same crate tickvault uses — pinned to tickvault workspace version)
jaeckel = "0.2.0"

# UUID (used by compat::order_types for order correlation IDs)
uuid = { version = "1.18.2", features = ["serde", "v4"] }

# Secret redaction (used by compat::config for API token handling)
secrecy = { version = "0.10.3", features = ["serde"] }

# Figment-based config layering (used by compat::config for .toml + env
# overrides)
figment = { version = "0.10.19", features = ["toml", "env"] }

# File-watching (used by strategies::hot_reload — matches tickvault
# workspace pin)
notify = "8.2.0"

# Channel for hot-reload watcher (used by strategies::hot_reload —
# pinned to tickvault workspace version)
crossbeam-channel = "0.5.15"

[dev-dependencies]
proptest = "1.6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true  # Finance code — overflow must never be silent

[profile.bench]
inherits = "release"
debug = true
