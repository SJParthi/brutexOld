# Pre-commit hooks — fast local gates that catch issues BEFORE
# the developer pushes. These mirror a subset of the CI gates in
# .github/workflows/ci.yml so feedback is quick.
#
# Install once:
#   pip install pre-commit
#   pre-commit install
#
# Run manually on the whole tree:
#   pre-commit run --all-files
#
# Hooks auto-run on every `git commit` after install. Failing hooks
# abort the commit — fix and retry.
#
# Philosophy: fast hooks only (<10 seconds total). Slow things like
# pytest with full coverage, cargo test, bandit etc. are CI-only.

repos:
  # ── Generic file hygiene ───────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # tests/golden/fixtures/*.tsv are byte-exact GOLDEN DATA (firewall):
      # many rows carry meaningful trailing TABS (empty trailing TSV columns).
      # Stripping them would corrupt the goldens + drift them from origin/main
      # — the "raw bytes, not text" class main already excludes for fuzz seeds
      # (DEC-HOOK-HYGIENE-MAIN-001). These only enter the hook diff on a
      # far-behind merge-forward push; exclude the fixture tree from the
      # file-MODIFYING fixers to keep it byte-identical (DEC-RUST-SWEEP-OPS-001
      # merge-forward — firewall protection, not a firewall touch).
      - id: trailing-whitespace
        exclude: ^tests/golden/fixtures/
      - id: end-of-file-fixer
        # Fuzzer corpus seeds are raw INPUT BYTES, not text — "fixing" the
        # trailing newline rewrites the seed (e.g. the 2-byte \n\n
        # crash-2-byte-header-underflow seed would shrink to 1 byte and no
        # longer reproduce its crash). docs/design/sweep_core/ is design-doc
        # measurement tooling + raw transcripts, outside the production
        # gates (coordinator ruling). DEC-HOOK-HYGIENE-MAIN-001. The golden
        # fixture tree is likewise byte-exact firewall data.
        exclude: ^(rust/brutex-feed/fuzz/seeds/|docs/design/sweep_core/|tests/golden/fixtures/)
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/golden/fixtures/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-case-conflict
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # ── Python: ruff (lint + format) ────────────────────────────────
  # rev MUST track the pyproject `ruff>=0.15,<1.0` toolchain: the stale
  # v0.8.4 pin reformatted 0.15-formatted files on commit, fighting the
  # CI `ruff format --check` gate (DEC-ORCH-STRICT-GATES-001 session,
  # 2026-06-10 — the hook rewrote test_orchestrator_state.py and
  # aborted the commit).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix, --exit-non-zero-on-fix]
        # Design-doc measurement tooling (standalone one-shot scripts +
        # raw transcripts), outside the production gates — T201/S101 etc.
        # are appropriate there (coordinator ruling).
        # DEC-HOOK-HYGIENE-MAIN-001.
        exclude: ^docs/design/sweep_core/
      - id: ruff-format
        name: ruff format
        # Same design-doc measurement-tooling carve-out as ruff check
        # above (coordinator ruling). DEC-HOOK-HYGIENE-MAIN-001.
        exclude: ^docs/design/sweep_core/

  # ── Python: mypy --strict (only changed files) ──────────────────
  # rev MUST track the pyproject `mypy>=1.10,<3.0` toolchain (the same law
  # as the ruff hook above): the stale v1.13.0 pin false-flagged two
  # main-landed files (rust_stats.py / movers_snapshot.py) at the pre-push
  # stage of a merge-forward — inference bugs fixed in later mypy — while
  # the BINDING venv-faithful `mypy --strict brutex` (2.3.0) is clean on
  # both (DEC-TEST-AWS-HERMETICITY-001 session, 2026-07-17; the exact
  # stale-ruff-pin incident class documented above).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: mypy --strict
        # --follow-imports=silent: the isolated hook env lacks the native wheels
        # (blake3/polars/lmdb), so following imports into UNCHANGED modules
        # yields env-dependent phantom errors (the #575/#579 whack-a-mole class).
        # The hook checks exactly the files it is given; the BINDING full-package
        # gate stays ci.yml mypy --strict over all 214 files (venv-faithful).
        args: [--strict, --ignore-missing-imports, --follow-imports=silent]
        files: ^brutex/
        additional_dependencies:
          - pydantic>=2.7
          - types-requests
          # polars ships inline types; without it the hook env degrades every
          # polars-typed return to Any → phantom no-any-return on files like
          # movers_snapshot.py (the same wheel-less-env class the
          # --follow-imports=silent note above documents).
          - polars>=1.0,<2.0
          # blake3 ships py.typed + a .pyi; without it the hook env degrades
          # blake3.blake3(...).hexdigest() to Any → phantom no-any-return on
          # files like sweep_supervisor.py (the same class as polars above;
          # landed independently on main AND via the crossverify lane; the
          # <2.0 upper bound is carried from the runid-stores identity lane).
          - blake3>=1.0,<2.0
          # starlette: the same wheel-less-env phantom class — without it the
          # hook env degrades TrustedHostMiddleware to Any (misc subclass
          # error on trusted_host.py) at the pre-push stage of a
          # merge-forward, while the BINDING venv-faithful `mypy --strict
          # brutex` is clean (2026-07-19 incident, the crossverify lane).
          # starlette ships py.typed; without it the hook env degrades
          # TrustedHostMiddleware to Any → a phantom [misc]
          # cannot-subclass-Any on dashboard/trusted_host.py (the same
          # wheel-less-env class as polars/blake3 above; the venv-faithful
          # `mypy --strict brutex` is clean on the file).
          - starlette>=0.40

  # ── Rust: cargo fmt + clippy (fast, only if rust/ touched) ─────
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: cargo fmt (fno-math)
        args:
          - --manifest-path=rust/fno-math/Cargo.toml
          - --
      - id: clippy
        name: cargo clippy (fno-math)
        args:
          - --manifest-path=rust/fno-math/Cargo.toml
          - --all-targets
          - --
          - -D
          - warnings

  # ── Secrets: gitleaks (local scan) ─────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── Custom local hooks ─────────────────────────────────────────
  - repo: local
    hooks:
      - id: banned-patterns
        name: scan for banned patterns
        entry: bash scripts/ci/scan-banned-patterns.sh
        language: system
        pass_filenames: false

      # Validates the message BEING COMMITTED (pre-commit passes the msg file
      # at the commit-msg stage). Was `HEAD~1 HEAD`, which validated the
      # PREVIOUS commit instead — so one non-conforming squash title on main
      # (PR #588's dual-type title) blocked every later local commit
      # (DEC-WINDOW-OPTION-DECODE-001 hardening).
      - id: conventional-commit
        name: conventional commit format
        entry: bash scripts/ci/check-conventional-commits.sh --msg-file
        language: system
        stages: [commit-msg]

      # ── Pre-push gate (DEC-PRE-PUSH-HOOK-001) ──────────────────────
      # The fastest meaningful CI subset, run on `git push`: ruff
      # check/format + the tests/smoke invariants. Catches the noisy-
      # flake class in seconds, before the ~10 min CI. Fail-closed.
      - id: pre-push-gate
        name: pre-push fast gate (ruff + smoke)
        entry: bash scripts/hooks/pre-push.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
